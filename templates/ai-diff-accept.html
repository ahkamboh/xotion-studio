<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"fileName",     "type":"string","label":"File tab name",                         "default":"agents/router.ts"},
  {"id":"beforeLines",  "type":"string","label":"Removed lines (red) — pipe-separated, use ␣ for leading-indent (2 spaces each)", "default":"export function route(msg) {|␣return handlers[msg.kind](msg)|}"},
  {"id":"afterLines",   "type":"string","label":"Added lines (green) — pipe-separated, use ␣ for leading-indent (2 spaces each)",  "default":"export function route(msg: AgentMsg) {|␣const fn = handlers[msg.kind] ?? fallback|␣return fn(msg, ctx)|}"},
  {"id":"contextLines", "type":"string","label":"Unchanged context lines above the diff (pipe-separated)",                   "default":"import { handlers } from \"./registry\"|import { fallback, ctx } from \"./agent\""},
  {"id":"acceptLabel",  "type":"string","label":"Accept button label",                    "default":"Accept"},
  {"id":"pillTitle",    "type":"string","label":"AI suggestion pill title",               "default":"Xotion suggestion"},
  {"id":"stampText",    "type":"string","label":"Committed chip suffix text",             "default":"committed"},
  {"id":"addedCount",   "type":"string","label":"Added count for chip (blank = auto from afterLines)",   "default":""},
  {"id":"removedCount", "type":"string","label":"Removed count for chip (blank = auto from beforeLines)","default":""},
  {"id":"syntaxTheme",  "type":"color", "label":"Editor background",                       "default":"#0d1117"},
  {"id":"ink",          "type":"color", "label":"Code text color",                         "default":"#c9d1d9"},
  {"id":"addColor",     "type":"color", "label":"Added (green)",                           "default":"#3fb950"},
  {"id":"delColor",     "type":"color", "label":"Removed (red)",                           "default":"#f85149"},
  {"id":"accent",       "type":"color", "label":"AI accent / pill",                        "default":"#7c5cff"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      AI DIFF ACCEPT — the signature "accept-the-suggestion" beat of a coding
      assistant. Inside a dark editor card, red removed lines strike through and
      slide out to the left while green added lines slide in from the right with
      gutter "−" / "+" stamps. A floating "AI suggestion" pill hovers at the
      gutter; its Accept button self-depresses, the green lines FLASH bright then
      DESATURATE into normal editor code (the diff is now committed source), and a
      "+12 −7 committed" chip stamps in. Loop-friendly hold on the committed state.

      WHY THIS EXISTS — accept-the-suggestion clips are the calling card of
      Cursor/Copilot-era assistant marketing. Creators screen-record them because
      no generic template fakes the choreography. This is the first-party preset.

      ─────────────────────────────────────────────────────────────────────────
      PHASE TABLE  (data-duration 7.0s — committed state HOLDS to 7.0s)
      phase                     | start–end  | easing            | what moves
      ------------------------- | ---------- | ----------------- | --------------------------------
      0 open (card settle)      | 0.00–0.55  | power3.out        | editor card rises+fades in; context
                                |            |                   |   lines already present; diff rows at
                                |            |                   |   start state (red shown, green parked
                                |            |                   |   off-screen right, height 0, hidden)
      1 pill arrives            | 0.45–1.05  | back.out(1.5)     | "AI suggestion" pill drops in at the
                                |            |                   |   gutter (y-28→0, scale .82→1, blur clears)
      2 red strikes through     | 1.15–1.95  | power2.inOut      | per-removed-line: strike-through bar
                                |            |   (proxy-driven)  |   draws L→R across each red row, gutter
                                |            |                   |   "−" stamps, row dims toward 0.5
      3 red slides out          | 1.85–2.55  | power3.in         | red rows slide x:0→-90 + fade to 0,
                                |            |                   |   then collapse height so green can land
      4 green slides in         | 2.45–3.55  | power3.out        | green rows cascade in from x:+120→0,
                                |            |   (stagger .10)   |   opacity 0→1, blur 8→0; gutter "+"
                                |            |                   |   stamps pop per row (back.out)
      5 accept self-depress     | 3.65–4.05  | power2.in→back    | pill Accept button presses (scale .92,
                                |            |                   |   y+3) then releases; accent ripple
                                |            |                   |   ring expands from the button
      6 commit flash+desaturate | 4.10–5.05  | power1.inOut      | green rows FLASH bright (bg glow up),
                                |            |   (proxy-driven)  |   then color lerps green→normal ink and
                                |            |                   |   glow fades — diff becomes plain code;
                                |            |                   |   "+" gutter marks fade to line numbers
      7 chip stamps             | 4.95–5.40  | back.out(2.0)     | "+12 −7 committed" chip stamps bottom-
                                |            |                   |   right (scale 1.2→1, y+18→0), check draws,
                                |            |                   |   pill exits up+fade
      8 hold (loop-friendly)    | 5.40–7.00  | none              | committed code + chip rest; slow ambient
                                |            |                   |   breathe via the camera
      camera: gentle push 1.035→1.0 across 0.00–6.0 (whole reveal), then static.
      ─────────────────────────────────────────────────────────────────────────

      VARIABLE ENCODING
        beforeLines / afterLines / contextLines : pipe "|" separated; one list
          item == one code line. A literal "␣" (open-box U+2423) at the START of a
          line encodes a leading-indent unit (2 spaces each) so JSON/pipe parsing
          never eats indentation. Empty item == blank line. Lists may be ANY length
          — rows are BUILT AT CONSTRUCTION from the variable, the card height fits
          the content, nothing clips or overflows.
        stampText : chip suffix after the counts (default "committed").
        addedCount / removedCount : chip counts; blank → auto from afterLines /
          beforeLines item counts.

      DETERMINISM CONTRACT
        ONE paused master timeline (window.__timelines["main"] + window.__timeline).
        Per-frame continuous values (strike-through sweep width, commit color lerp,
        ambient breathe) ride proxy {…} tween onUpdate — quantized so marks/colors
        never read ahead of the visual. Discrete moves (card settle, pill drop, row
        slides, button press, chip stamp) are normal GSAP tweens on the SAME paused
        timeline. ALL DOM (every context/red/green row, gutter cells, pill, chip,
        ripple) built at construction from the variables — NEVER inside tl.call /
        onUpdate. Every animated element's frame-0 state is set via gsap.set before
        the timeline runs; render() runs once at boot so frame 0 is the correct
        opening state. No Math.random, no Date, no rAF, no setTimeout, no CSS
        transition/@keyframes, no infinite repeats. hex6() normalizes colors before
        appending alpha digits. Overlay geometry is measured lazily in the first
        onUpdate and re-measured until document.fonts is loaded, then cached.

      FONTS (local): JetBrains Mono 500 for code + gutter; Inter 600/700 for the
      editor chrome (file tab, pill, Accept button, committed chip).
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"JetBrains Mono"; font-weight:500;
        src:url("assets/fonts/jetbrains-500.ttf") format("truetype"); }
      @font-face { font-family:"Inter"; font-weight:600;
        src:url("assets/fonts/inter-600.ttf") format("truetype"); }
      @font-face { font-family:"Inter"; font-weight:700;
        src:url("assets/fonts/inter-700.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden;
              display:flex; align-items:center; justify-content:center; }

      /* camera wrapper — one transform owned by GSAP */
      .cam { position:relative; will-change:transform; }

      /* the editor card — width is MEASURED to fit the widest code line at
         construction (see fitEditor); these are only the floor/ceiling so the
         card grows with longer lines and never clips them, and shrinks to a
         sensible minimum for short lists. Hard rule: size to content, not a box. */
      .editor {
        position:relative; width:1240px; min-width:760px; max-width:1820px;
        border-radius:22px; overflow:hidden;
        box-shadow:0 44px 130px rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.42);
      }
      .titlebar {
        display:flex; align-items:center; gap:16px;
        height:66px; padding:0 28px;
        font-family:"Inter",sans-serif; font-weight:600;
        border-bottom:1px solid rgba(255,255,255,.07);
      }
      .dots { flex:0 0 auto; display:flex; gap:10px; }
      .dots i { width:14px; height:14px; border-radius:50%; display:block; }
      /* filename takes the slack and truncates with an ellipsis so a long
         fileName never clips behind the MODIFIED badge */
      .fname {
        flex:0 1 auto; min-width:0; font-size:23px; letter-spacing:.01em; opacity:.92;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      }
      .fbadge {
        flex:0 0 auto; margin-left:auto; font-size:15px; font-weight:700;
        padding:6px 14px; border-radius:999px; letter-spacing:.06em;
      }

      /* code area — sized to its content (the widest line) so the editor card
         can be measured to fit. The code font-size is set by fitEditor (a CSS
         custom property) and shrinks only if the widest line would exceed the
         card's max width, so NO line ever clips horizontally regardless of length. */
      .code { position:relative; padding:30px 0 34px 0; font-size:var(--codefs,30px); }
      .row {
        position:relative; display:flex; align-items:center; overflow:hidden;
        width:max-content; min-width:100%;
        height:54px; font-family:"JetBrains Mono",monospace; font-weight:500;
        font-size:1em; line-height:1; white-space:pre; will-change:transform,opacity;
      }
      .gutter {
        flex:0 0 auto; width:104px; position:relative; height:100%;
        font-family:"JetBrains Mono",monospace; font-weight:500; font-size:.87em;
        user-select:none;
      }
      .gnum {
        position:absolute; left:0; right:34px; top:50%; transform:translateY(-50%);
        text-align:right; opacity:.34;
      }
      .gmark {
        position:absolute; right:18px; top:50%; transform:translateY(-50%);
        font-weight:700; opacity:0;
      }
      .ln { position:relative; padding-right:64px; }
      /* strike-through bar drawn over a removed line (width animated 0→100%) */
      .strike {
        position:absolute; left:0; top:50%; height:3px; width:0;
        transform:translateY(-50%); border-radius:2px;
      }

      /* floating AI suggestion pill */
      .pill {
        position:absolute; left:0; top:0;
        display:flex; align-items:center; gap:16px;
        padding:14px 16px 14px 22px; border-radius:16px;
        font-family:"Inter",sans-serif;
        box-shadow:0 24px 64px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.4);
        will-change:transform,opacity;
      }
      .pill .spark { width:30px; height:30px; flex:0 0 auto; display:block; }
      .pill .ptitle { font-weight:700; font-size:21px; color:#fff; white-space:nowrap; }
      .accept {
        position:relative; display:flex; align-items:center; gap:9px;
        padding:11px 22px; border-radius:11px;
        font-family:"Inter",sans-serif; font-weight:700; font-size:20px;
        color:#fff; white-space:nowrap; will-change:transform;
      }
      .accept svg { width:20px; height:20px; display:block; }
      /* accept ripple ring */
      .ripple {
        position:absolute; left:50%; top:50%; width:64px; height:44px;
        border-radius:14px; transform:translate(-50%,-50%) scale(.4);
        opacity:0; pointer-events:none;
      }

      /* committed chip */
      .chip {
        position:absolute; right:0; bottom:0;
        display:flex; align-items:center; gap:13px;
        padding:13px 22px; border-radius:14px;
        font-family:"Inter",sans-serif; font-weight:700; font-size:22px;
        box-shadow:0 16px 44px rgba(0,0,0,.45);
        white-space:nowrap; will-change:transform,opacity;
      }
      .chip .cadd, .chip .cdel { font-variant-numeric:tabular-nums; }
      .chip .ctxt { opacity:.92; }
      .chip svg { width:22px; height:22px; display:block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.0" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <div class="editor" id="editor">
          <div class="titlebar" id="titlebar">
            <span class="dots"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i></span>
            <span class="fname" id="fname"></span>
            <span class="fbadge" id="fbadge">MODIFIED</span>
          </div>
          <div class="code" id="code"></div>
        </div>

        <!-- floating AI suggestion pill (positioned in JS, in cam coords) -->
        <div class="pill" id="pill">
          <svg class="spark" viewBox="0 0 24 24" id="spark">
            <path d="M12 2 L13.6 8.8 L20.5 10.2 L13.6 11.6 L12 18.4 L10.4 11.6 L3.5 10.2 L10.4 8.8 Z" fill="#fff"/>
            <circle cx="18.8" cy="4.4" r="1.7" fill="#fff" opacity=".9"/>
          </svg>
          <span class="ptitle" id="ptitle"></span>
          <span class="accept" id="accept">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12.5 L10 17.5 L19 6.5"></path>
            </svg>
            <span id="acceptLabel"></span>
            <span class="ripple" id="ripple"></span>
          </span>
        </div>

        <!-- committed chip -->
        <div class="chip" id="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
               stroke-linecap="round" stroke-linejoin="round" id="chipcheck">
            <path d="M4 12.5 L9.5 18 L20 6"></path>
          </svg>
          <span class="cadd" id="cadd"></span><span class="cdel" id="cdel"></span><span class="ctxt" id="ctxt"></span>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize a CSS hex color to 6-digit form so 2-digit alpha can be appended */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}
      function rgb(c){c=hex6(c);return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
      const clamp01 = t => Math.max(0, Math.min(1, t));
      const clamp255 = v => Math.max(0, Math.min(255, Math.round(v)));
      const lerp = (a,b,k) => a + (b - a) * k;
      const lerpRGB = (a,b,k) => `rgb(${clamp255(lerp(a[0],b[0],k))},${clamp255(lerp(a[1],b[1],k))},${clamp255(lerp(a[2],b[2],k))})`;
      const alphaHex = a => Math.round(clamp01(a) * 255).toString(16).padStart(2,"0");
      function shade(hex, amt){ const c = rgb(hex); return `rgb(${clamp255(c[0]+amt)},${clamp255(c[1]+amt)},${clamp255(c[2]+amt)})`; }

      const BG     = hex6(V.syntaxTheme);
      const INK    = hex6(V.ink);
      const ADD    = hex6(V.addColor);
      const DEL    = hex6(V.delColor);
      const ACCENT = hex6(V.accent);
      const INK_RGB = rgb(INK), ADD_RGB = rgb(ADD);

      /* ── parse line lists. "␣" (open-box) at line start = 2-space indent each ── */
      function splitLines(s){ return String(s == null ? "" : s).split("|"); }
      function indent(line){ let n = 0; while (line[n] === "␣") n++; return "  ".repeat(n) + line.slice(n); }
      const delRaw = splitLines(V.beforeLines).map(indent);
      const addRaw = splitLines(V.afterLines).map(indent);
      let ctxRaw = splitLines(V.contextLines).map(indent);
      if (ctxRaw.length === 1 && ctxRaw[0] === "") ctxRaw = [];   // empty context var
      const ctxLines = ctxRaw;

      const ADDED   = (V.addedCount   && String(V.addedCount).trim())   ? parseInt(V.addedCount,10)   : addRaw.length;
      const REMOVED = (V.removedCount && String(V.removedCount).trim())  ? parseInt(V.removedCount,10) : delRaw.length;
      const CHIP_TXT = (V.stampText && String(V.stampText).trim()) ? String(V.stampText).trim() : "committed";

      /* ── elements ───────────────────────────────────────────────────── */
      const root   = document.getElementById("root");
      const cam    = document.getElementById("cam");
      const editor = document.getElementById("editor");
      const titlebar = document.getElementById("titlebar");
      const fname  = document.getElementById("fname");
      const fbadge = document.getElementById("fbadge");
      const code   = document.getElementById("code");
      const pill   = document.getElementById("pill");
      const ptitle = document.getElementById("ptitle");
      const accept = document.getElementById("accept");
      const acceptLabel = document.getElementById("acceptLabel");
      const ripple = document.getElementById("ripple");
      const chip   = document.getElementById("chip");
      const cadd   = document.getElementById("cadd");
      const cdel   = document.getElementById("cdel");
      const ctxt   = document.getElementById("ctxt");
      const chipPath = document.getElementById("chipcheck").querySelector("path");

      /* ── static styling from variables ──────────────────────────────── */
      const PAGE_BG = "#06080d";
      document.body.style.background = PAGE_BG;
      root.style.background = PAGE_BG;
      editor.style.background = BG;
      titlebar.style.background = "rgba(255,255,255,.025)";
      titlebar.style.color = INK;
      fname.textContent = String(V.fileName);
      fname.style.color = INK;
      fbadge.textContent = "MODIFIED";
      fbadge.style.color = ACCENT;
      fbadge.style.background = ACCENT + "22";
      ptitle.textContent = String(V.pillTitle);
      acceptLabel.textContent = String(V.acceptLabel);
      pill.style.background = "linear-gradient(135deg," + ACCENT + "," + shade(ACCENT,-26) + ")";
      accept.style.background = "rgba(255,255,255,.18)";
      ripple.style.border = "3px solid #fff";
      chip.style.background = ADD;
      chip.style.color = "#06210f";
      cadd.textContent = "+" + ADDED;
      cdel.textContent = " −" + REMOVED;   // proper minus sign
      cdel.style.color = "rgba(6,33,15,.62)";
      ctxt.textContent = " " + CHIP_TXT;

      /* ── BUILD ROWS AT CONSTRUCTION TIME (from the variable-length lists) ──
         Document order: [context...] [removed... (red)] [added... (green)].
         Removed rows animate out & collapse; green rows slide in to replace them. */
      const ROW_H = 54;
      let lineNo = 0;
      const redRows = [], greenRows = [];

      function makeRow(text, kind) {
        const row = document.createElement("div");
        row.className = "row";
        const gut = document.createElement("span"); gut.className = "gutter";
        const gnum = document.createElement("span"); gnum.className = "gnum";
        const gmark = document.createElement("span"); gmark.className = "gmark";
        gut.appendChild(gnum); gut.appendChild(gmark);
        const ln = document.createElement("span"); ln.className = "ln"; ln.textContent = text;
        row.appendChild(gut); row.appendChild(ln);
        if (kind === "del") {
          const st = document.createElement("span"); st.className = "strike";
          st.style.background = DEL; ln.appendChild(st); row._strike = st;
        }
        row._gnum = gnum; row._gmark = gmark; row._ln = ln; row._kind = kind;
        code.appendChild(row);
        return row;
      }

      ctxLines.forEach(t => {
        lineNo++;
        const r = makeRow(t, "ctx");
        r._gnum.textContent = lineNo;
        r._gmark.style.display = "none";
        r._ln.style.color = INK;
      });
      delRaw.forEach((t, i) => {
        const r = makeRow(t, "del");
        r._gnum.textContent = lineNo + 1 + i;
        r._gmark.textContent = "−"; r._gmark.style.color = DEL;
        r._ln.style.color = DEL; r.style.background = DEL + "1f";
        redRows.push(r);
      });
      addRaw.forEach((t, i) => {
        const r = makeRow(t, "add");
        r._gmark.textContent = "+"; r._gmark.style.color = ADD;
        r._ln.style.color = ADD; r.style.background = ADD + "1f";
        r._gnum.textContent = lineNo + 1 + i;   // final committed number
        greenRows.push(r);
      });

      /* ── frame-0 initial states (correct opening) ───────────────────── */
      gsap.set(cam, { scale: 1.035, transformOrigin: "50% 46%" });
      gsap.set(editor, { y: 14, opacity: 1 });   // visible at frame 0 (opening state); only a gentle settle
      redRows.forEach(r => { gsap.set(r, { x: 0, opacity: 1, height: ROW_H }); r._strike.style.width = "0%"; r._gmark.style.opacity = 0; });
      greenRows.forEach(r => { gsap.set(r, { x: 120, opacity: 0, height: 0, filter: "blur(8px)" }); r._gmark.style.opacity = 0; r._gnum.style.opacity = 0; });
      gsap.set(pill, { y: -28, opacity: 0, scale: 0.82, filter: "blur(6px)" });
      gsap.set(accept, { y: 0, scale: 1 });
      gsap.set(ripple, { opacity: 0, scale: 0.4 });
      gsap.set(chip, { y: 18, opacity: 0, scale: 1.2 });
      const chipLen = chipPath.getTotalLength();
      gsap.set(chipPath, { strokeDasharray: chipLen, strokeDashoffset: chipLen });

      /* ── FIT THE EDITOR CARD TO THE WIDEST LINE (variable-length robustness) ──
         Code lines are inherently variable-length. The card width is MEASURED to
         fit the widest line (gutter + line text + the line's right padding) and
         clamped between a sensible floor and a ceiling that fits inside 1920.
         If even the widest line would exceed the ceiling, the code font-size is
         scaled down (linearly — text width is proportional to font-size) so the
         longest line fits exactly. Result: nothing ever clips horizontally, for
         any fileName / beforeLines / afterLines / contextLines length.
         Pure function of the (static) content — runs in the same lazy measure
         pass as placeOverlays, re-measured until fonts load, then cached. */
      const FIT_MIN = 760;            // editor min width (matches CSS min-width)
      const FIT_MAX = 1820;           // editor max width (fits in 1920 w/ margins, matches CSS max-width)
      const GUTTER_W = 104;           // .gutter fixed width
      const EDGE_PAD = 26;            // extra right breathing room so text never kisses the edge
      const BASE_FS  = 30;            // base code font-size (px)
      const allRows = () => Array.from(code.querySelectorAll(".row"));
      function fitEditor() {
        // reset to base font before measuring so measurement is always at BASE_FS
        editor.style.removeProperty("--codefs");
        // .ln scrollWidth already INCLUDES its 64px right padding (text + pad-right),
        // so the row content width = gutter + ln.scrollWidth. Take the widest.
        let maxRow = 0;
        allRows().forEach(r => { const w = GUTTER_W + r._ln.scrollWidth; if (w > maxRow) maxRow = w; });
        if (maxRow <= GUTTER_W) return;   // fonts/layout not ready yet — try again next pass
        const natural = maxRow + EDGE_PAD;
        if (natural > FIT_MAX) {
          // shrink the code font so the widest line fits within FIT_MAX. The shrinkable
          // part is the line text (gutter width is fixed); scale = available text width
          // ÷ current text width (linear in font-size).
          const lnW = maxRow - GUTTER_W;                       // widest .ln scrollWidth
          const avail = FIT_MAX - GUTTER_W - EDGE_PAD;         // room left for the line
          const scale = Math.max(0.4, avail / (lnW || 1));     // floor so it never vanishes
          editor.style.setProperty("--codefs", (BASE_FS * scale).toFixed(3) + "px");
          editor.style.width = FIT_MAX + "px";
        } else {
          editor.style.width = Math.max(FIT_MIN, Math.round(natural)) + "px";
        }
      }

      /* place the pill at the gutter of the FIRST diff row + chip bottom-right.
         Re-measured each render until fonts load, then cached. */
      let cached = false;
      function placeOverlays() {
        fitEditor();   // size the card to the widest line BEFORE measuring overlay anchors
        const firstDiff = redRows[0] || greenRows[0];
        if (!firstDiff) return;
        const eRect = editor.getBoundingClientRect();
        const rRect = firstDiff.getBoundingClientRect();
        const camRect = cam.getBoundingClientRect();
        const pillX = (eRect.left - camRect.left) + eRect.width - pill.offsetWidth - 36;
        const pillY = (rRect.top - camRect.top) - 10;
        pill.style.left = Math.max(120, pillX) + "px";
        pill.style.top  = pillY + "px";
        chip.style.right = "34px";
        chip.style.bottom = "30px";
        if (document.fonts && document.fonts.status === "loaded") cached = true;
      }

      /* ── timing constants ───────────────────────────────────────────── */
      const STRIKE_START = 1.15, STRIKE_DUR = 0.80;
      const COMMIT_START = 4.10, COMMIT_DUR = 0.95;
      const DUR = 7.0;

      /* ── per-frame continuous values via proxy ──────────────────────── */
      const p = { strike: 0, commit: 0, t: 0 };
      function render() {
        const sw = (p.strike * 100).toFixed(2) + "%";
        redRows.forEach(r => { r._strike.style.width = sw; });

        const k = p.commit;
        const flash = Math.sin(clamp01(k / 0.45) * Math.PI);     // 0→1→0 brightness bump
        const desat = clamp01((k - 0.30) / 0.70);                // green→ink settle
        const col = lerpRGB(ADD_RGB, INK_RGB, desat);
        const glowA = (0.12 + flash * 0.30) * (1 - desat);       // bg glow rises then fades
        greenRows.forEach(r => {
          r._ln.style.color = col;
          r.style.background = ADD + alphaHex(glowA);
          r._gmark.style.color = col;
          r._gmark.style.opacity = (1 - desat).toFixed(3);
          r._gnum.style.opacity = (0.34 * desat).toFixed(3);     // number fades in as it commits
        });

        // ambient breathe during the loop-friendly hold (editor scale). Only write
        // editor.style.transform AFTER the y-settle (>0.55s) so we never clobber
        // GSAP's translateY during PHASE 0; before then GSAP fully owns the transform.
        if (p.t > 0.55) {
          const breathe = p.t > 5.4 ? 1 + Math.sin((p.t - 5.4) * Math.PI / 1.6) * 0.004 : 1;
          editor.style.transform = "translateY(0px) scale(" + breathe.toFixed(5) + ")";
        }
      }

      /* ── master timeline (paused; HyperFrames seeks it) ─────────────── */
      const tl = gsap.timeline({ paused: true, onUpdate: () => { if (!cached) placeOverlays(); } });

      // camera push across the reveal, then settle
      tl.to(cam, { scale: 1.0, duration: 6.0, ease: "power1.out" }, 0);

      // PHASE 0 — editor card settles in (already visible at frame 0; gentle rise)
      tl.to(editor, { y: 0, duration: 0.55, ease: "power3.out" }, 0.0);

      // PHASE 1 — AI suggestion pill drops in
      tl.to(pill, { y: 0, opacity: 1, scale: 1, filter: "blur(0px)",
                    duration: 0.60, ease: "back.out(1.5)" }, 0.45);

      // PHASE 2 — red strike sweep (proxy) + gutter "−" stamps + dim
      tl.to(p, { strike: 1, duration: STRIKE_DUR, ease: "power2.inOut", onUpdate: render }, STRIKE_START);
      redRows.forEach((r, i) => {
        tl.to(r._gmark, { opacity: 1, duration: 0.18, ease: "power1.out" }, STRIKE_START + i * 0.06);
        tl.to(r, { opacity: 0.5, duration: STRIKE_DUR, ease: "power1.inOut" }, STRIKE_START);
      });

      // PHASE 3 — red rows slide out left + fade, then collapse height
      redRows.forEach((r, i) => {
        const t0 = 1.85 + i * 0.05;
        tl.to(r, { x: -90, opacity: 0, duration: 0.45, ease: "power3.in" }, t0);
        tl.to(r, { height: 0, duration: 0.30, ease: "power2.inOut" }, t0 + 0.30);
      });

      // PHASE 4 — green rows cascade in from the right; "+" gutter pops per row
      greenRows.forEach((r, i) => {
        const t0 = 2.45 + i * 0.10;
        tl.to(r, { height: ROW_H, duration: 0.28, ease: "power2.out" }, t0);
        tl.to(r, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, t0 + 0.04);
        tl.fromTo(r._gmark, { opacity: 0, scale: 0.4 },
                  { opacity: 1, scale: 1, duration: 0.30, ease: "back.out(2.2)", immediateRender: false }, t0 + 0.18);
      });

      // PHASE 5 — Accept self-depress → release; ripple ring + pill recoil
      tl.to(accept, { y: 3, scale: 0.92, duration: 0.16, ease: "power2.in" }, 3.65);
      tl.to(accept, { y: 0, scale: 1, duration: 0.24, ease: "back.out(2.4)" }, 3.81);
      tl.fromTo(ripple, { opacity: 0.6, scale: 0.4 },
                { opacity: 0, scale: 2.6, duration: 0.55, ease: "power2.out", immediateRender: false }, 3.78);
      tl.to(pill, { scale: 1.04, duration: 0.14, ease: "power2.out", overwrite: "auto" }, 3.66);
      tl.to(pill, { scale: 1.0,  duration: 0.22, ease: "power2.inOut", overwrite: "auto" }, 3.80);

      // PHASE 6 — commit flash + desaturate (proxy)
      tl.to(p, { commit: 1, duration: COMMIT_DUR, ease: "power1.inOut", onUpdate: render }, COMMIT_START);

      // PHASE 7 — committed chip stamps; check draws; pill exits
      tl.fromTo(chip, { y: 18, opacity: 0, scale: 1.2 },
                { y: 0, opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2.0)", immediateRender: false }, 4.95);
      tl.fromTo(chipPath, { strokeDashoffset: chipLen },
                { strokeDashoffset: 0, duration: 0.32, ease: "power2.out", immediateRender: false }, 5.08);
      tl.to(pill, { y: -26, opacity: 0, scale: 0.94, filter: "blur(4px)", duration: 0.45, ease: "power2.in" }, 4.95);

      // PHASE 8 — drive the proxy clock for ambient breathe across the whole clip
      tl.to(p, { t: DUR, duration: DUR, ease: "none", onUpdate: render }, 0);

      // hold the final committed frame to the end of data-duration
      tl.set({}, {}, DUR);

      render();        // frame 0 styled before any tween runs
      placeOverlays(); // initial overlay placement (re-run lazily until fonts load)

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
