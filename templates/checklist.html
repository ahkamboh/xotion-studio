<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title",  "type":"string","label":"Card title",             "default":"Launch checklist"},
  {"id":"items",  "type":"string","label":"Items (pipe-separated)", "default":"Script written|Voiceover recorded|Captions synced|Rendered in 4K"},
  {"id":"accent", "type":"color", "label":"Accent",                 "default":"#22c55e"},
  {"id":"bg",     "type":"color", "label":"Background",             "default":"#f1f5f9"},
  {"id":"cardBg", "type":"color", "label":"Card background",        "default":"#ffffff"},
  {"id":"ink",    "type":"color", "label":"Text color",             "default":"#0a0a0a"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      CHECKLIST — to-do items tick off one by one inside a centered card.
      A 760px card rises in with its title and rows; each row's circle then
      snaps to the accent color with a little pop while an SVG checkmark
      draws itself, the label dims and a strike-line sweeps across it. When
      the last item is done, an accent "All done" chip pops at the card's
      top-right corner. A slow virtual-camera push (1.0 → 1.06) keeps the
      whole clip alive.

      Slot-driven via data-composition-variables (works with `:cards` /
      scripts/render-batch.py):
        npx hyperframes render <proj> --variables '{"items":"Write|Edit|Ship"}'

      TIMING — card entrance 0–0.6s (rows fade up staggered 0.08s). Tick
      beat i lands at 1.0 + i×0.7s: circle bg+border snap to accent (0.18s)
      with a 1→1.18→1 pop, checkmark draws over 0.3s, label dims to 55%
      while the strike-line scales 0→1 (0.35s). The "All done" chip pops
      0.4s after the last tick. data-duration below (5.0) fits the 4 default
      items — bump it by ~0.7s per extra item.

      Determinism contract: ONE paused master GSAP timeline holds every
      tween; HyperFrames seeks any frame exactly. ALL DOM (rows, ticks,
      strike-lines, chip) is built at script-construction time — nothing is
      created inside tl.call/onUpdate. Every animated element gets its
      initial state via gsap.set at construction so frame 0 renders styled
      before any tween runs. Checkmark draw uses strokeDasharray =
      path.getTotalLength() (pure path geometry — no font-dependent
      measurement). No Math.random, no Date, no rAF, no CSS transitions or
      @keyframes, no infinite repeats. tl.set({},{},DUR) pads the hold so
      the final frame persists to the end of data-duration.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Inter"; font-weight:500;
        src:url("assets/fonts/inter-500.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden;
              font-family:"Inter",sans-serif; font-weight:500; }
      /* the camera: one slow push applied as a single transform on this wrapper */
      .cam {
        position:absolute; inset:0;
        display:flex; align-items:center; justify-content:center;
        will-change:transform;
      }
      .card {
        position:relative;
        width:760px;
        border-radius:28px;
        padding:48px;
        box-shadow:0 30px 70px rgba(15,23,42,.12), 0 10px 24px rgba(15,23,42,.07);
      }
      .cardTitle {
        font-size:44px;
        line-height:1.2;
        letter-spacing:-0.01em;
        margin-bottom:36px;
      }
      .rows { display:flex; flex-direction:column; gap:26px; }
      .row  { display:flex; align-items:center; gap:22px; }
      .circle {
        flex:0 0 auto;
        width:44px; height:44px;
        border:2.5px solid #d4d4d8;
        border-radius:50%;
        display:flex; align-items:center; justify-content:center;
      }
      .circle svg { width:22px; height:22px; display:block; }
      .rowText { position:relative; }
      .itemTxt { font-size:34px; line-height:1.25; white-space:nowrap; }
      .strike {
        position:absolute; left:0; right:0; top:50%;
        height:2.5px;
        opacity:.45;
        pointer-events:none;
      }
      .chip {
        position:absolute; top:-22px; right:-26px;
        display:flex; align-items:center; gap:9px;
        padding:11px 22px;
        border-radius:9999px;
        color:#ffffff;
        font-size:21px;
        letter-spacing:0.01em;
        box-shadow:0 12px 28px rgba(15,23,42,.18);
        white-space:nowrap;
      }
      .chip svg { width:16px; height:16px; display:block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.0" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <div class="card" id="card">
          <div class="cardTitle" id="cardTitle"></div>
          <div class="rows" id="rows"></div>
          <div class="chip" id="chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.4"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 12.8l5 5L19.5 6.8"></path>
            </svg>
            <span>All done</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* ── parameters ─────────────────────────────────────────────────── */
      const TITLE  = String(V.title);
      const ITEMS  = String(V.items).split("|").map(s => s.trim()).filter(Boolean);
      const ACCENT = String(V.accent);
      const N      = ITEMS.length;

      /* ── timeline phases (spec) ─────────────────────────────────────── */
      const CARD_IN     = 0.6;                       // card + title rise
      const ROWS_AT     = 0.18;                      // rows start fading up
      const TICK_START  = 1.0;                       // first tick beat
      const TICK_GAP    = 0.7;                       // per-item beat spacing
      const LAST_TICK   = TICK_START + (N - 1) * TICK_GAP;
      const CHIP_AT     = LAST_TICK + 0.4;           // "All done" chip pop
      const ANIM_END    = CHIP_AT + 0.5;

      const root = document.getElementById("root");
      const DUR  = parseFloat(root.dataset.duration) || 5.0;
      const HOLD = Math.max(DUR, ANIM_END);

      /* ── build ALL DOM at construction time (never inside tl.call) ──── */
      const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      const rowsEl = document.getElementById("rows");
      rowsEl.innerHTML = ITEMS.map(it => `
        <div class="row">
          <div class="circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4"
                 stroke-linecap="round" stroke-linejoin="round">
              <path class="tick" d="M5 12.8l4.6 4.6 9.4-10.3"></path>
            </svg>
          </div>
          <div class="rowText">
            <span class="itemTxt">${esc(it)}</span>
            <div class="strike"></div>
          </div>
        </div>`).join("");

      const cam     = document.getElementById("cam");
      const card    = document.getElementById("card");
      const chip    = document.getElementById("chip");
      const rows    = Array.from(rowsEl.querySelectorAll(".row"));
      const circles = Array.from(rowsEl.querySelectorAll(".circle"));
      const ticks   = Array.from(rowsEl.querySelectorAll(".tick"));
      const texts   = Array.from(rowsEl.querySelectorAll(".itemTxt"));
      const strikes = Array.from(rowsEl.querySelectorAll(".strike"));

      /* ── static styles from variables ───────────────────────────────── */
      document.body.style.background = V.bg;
      root.style.background = V.bg;
      card.style.background = V.cardBg;
      document.getElementById("cardTitle").textContent = TITLE;
      document.getElementById("cardTitle").style.color = V.ink;
      texts.forEach(el  => { el.style.color = V.ink; });
      strikes.forEach(el => { el.style.background = V.ink; });
      chip.style.background = ACCENT;

      /* ── initial states via gsap.set — frame 0 styled before any tween ─ */
      gsap.set(cam,  { scale: 1, transformOrigin: "50% 50%" });
      gsap.set(card, { y: 40, opacity: 0, filter: "blur(6px)" });
      gsap.set(rows, { y: 24, opacity: 0 });
      gsap.set(circles, { scale: 1, transformOrigin: "50% 50%" });
      gsap.set(strikes, { scaleX: 0, yPercent: -50, transformOrigin: "left center" });
      gsap.set(chip, { scale: 0, transformOrigin: "60% 50%" });
      ticks.forEach(p => {
        let len = 21;                       // fallback ≈ path length
        try { len = p.getTotalLength(); } catch (e) {}
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
      });

      /* ── paused master timeline; HyperFrames seeks it ───────────────── */
      const tl = gsap.timeline({ paused: true });

      // camera: slow push across the whole clip
      tl.to(cam, { scale: 1.06, duration: HOLD, ease: "none" }, 0);

      // 0–0.6s — card rises in with the title
      tl.to(card, { y: 0, opacity: 1, filter: "blur(0px)",
                    duration: CARD_IN, ease: "power3.out" }, 0);

      // rows fade up, staggered
      tl.to(rows, { y: 0, opacity: 1, duration: 0.45,
                    ease: "power3.out", stagger: 0.08 }, ROWS_AT);

      // tick beats
      ITEMS.forEach((_, i) => {
        const t = TICK_START + i * TICK_GAP;
        // circle snaps to accent with a pop
        tl.to(circles[i], { backgroundColor: ACCENT, borderColor: ACCENT,
                            duration: 0.18, ease: "power2.out" }, t);
        tl.to(circles[i], { scale: 1.18, duration: 0.09, ease: "power2.out" }, t);
        tl.to(circles[i], { scale: 1,    duration: 0.14, ease: "back.out(2.5)" }, t + 0.09);
        // checkmark draws
        tl.to(ticks[i], { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.05);
        // label dims under the sweeping strike-line
        tl.to(texts[i],   { opacity: 0.55, duration: 0.35, ease: "power3.out" }, t);
        tl.to(strikes[i], { scaleX: 1,     duration: 0.35, ease: "power3.out" }, t);
      });

      // "All done" chip pops at the card's top-right corner
      tl.to(chip, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, CHIP_AT);

      // hold the final frame to the end of data-duration
      tl.set({}, {}, HOLD);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
