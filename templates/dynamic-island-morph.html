<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"activityTitle",   "type":"string","label":"Live Activity title",                 "default":"Xotion — Render"},
  {"id":"activitySubtitle","type":"string","label":"Live Activity subtitle",              "default":"launch-video.mp4"},
  {"id":"statusLabel",     "type":"string","label":"Trailing status text",                "default":"2 min left"},
  {"id":"artworkImage",    "type":"string","label":"Leading artwork (image path; empty = designed gradient + glyph)", "default":""},
  {"id":"artworkGlyph",    "type":"string","label":"Artwork fallback glyph (emoji/char)", "default":"▶"},
  {"id":"progressValue",   "type":"string","label":"Progress fill 0-100",                 "default":"68"},
  {"id":"holdDuration",    "type":"string","label":"Seconds to hold the open card",       "default":"1.6"},
  {"id":"accentColor",     "type":"color", "label":"Accent (artwork + progress)",         "default":"#7c5cff"},
  {"id":"islandColor",     "type":"color", "label":"Island / card color",                 "default":"#0a0a0a"},
  {"id":"phoneColor",      "type":"color", "label":"Phone body color",                    "default":"#1c1c1f"},
  {"id":"screenColor",     "type":"color", "label":"Phone wallpaper color",               "default":"#101014"},
  {"id":"bg",              "type":"color", "label":"Scene background",                    "default":"#e9e4f5"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      DYNAMIC ISLAND MORPH — the iPhone status pill stretches wide with an
      elastic ease, then BLOOMS down into a live-activity card: leading artwork
      slides in, title + subtitle fade up, a progress bar sweeps to its value
      and the trailing status counts toward it. The open card HOLDS, then the
      whole thing CONTRACTS back to the bare pill — landing on exactly frame 0's
      state so the clip loops seamlessly. A believable iPhone shell (notch-free
      rounded body + wallpaper + soft shadow) frames the island so the morph
      reads as a real iOS Live Activity, not a floating box.

      ── CHOREOGRAPHY (phase table) ──────────────────────────────────────────
      phase        | start-end (s) | easing                | what moves
      -------------|---------------|-----------------------|---------------------------------
      hold-pill    | 0.00-0.55     | (none)                | bare pill sits at the top, idle
      stretch-wide | 0.55-1.15     | elastic.out(1,0.75)   | pill width pill→card-w, h unchanged
      bloom-tall   | 1.05-1.70     | power3.out            | height pill-h→card-h, radius eases,
                   |               |                       | corners settle; pill BECOMES the card
      artwork-in   | 1.55-2.05     | back.out(1.7)         | leading artwork tile slides x-28→0,
                   |               |                       | scale .6→1, fades in
      text-up      | 1.70-2.25     | power3.out (stagger)  | title then subtitle y14→0, opacity
                   |               |                       | 0→1, blur4→0; trailing status fades
      bar-sweep    | 2.05-2.95     | power2.out            | progress track fades in, fill
                   |               |                       | scaleX 0→value, status number counts
                   |               |                       | 0→value IN LOCKSTEP (same proxy)
      HOLD         | 2.95-(+hold)  | (none)                | open card holds; artwork breathes
                   |               |                       | (Rich-style idle, finite)
      contract     | H-(H+0.95)    | power3.inOut          | reverse bloom: content fades, height
                   |               |                       | collapses, width returns to pill
      settle-pill  | (H+0.95)-end  | (none)                | bare pill again == frame 0  → loop
      cam push     | 0.00-end      | sine.inOut yoyo×1     | .cam scale 1.0→1.035→1.0 (loop-clean)
      ─────────────────────────────────────────────────────────────────────────
      data-duration is FIXED at 8s (the CLI render window — --variables cannot
      rewrite an HTML attribute). holdDuration is CLAMPED to fit that window
      (max ≈ 3.55s: window 8 − 2.95s pre-hold motion − 1.5s contract+settle),
      so the card ALWAYS contracts back to the bare pill and the clip loops
      clean for ANY holdDuration. Default hold 1.6 → timeline ends ~6.05s, then
      the bare-pill frame holds to 8s. The cam push yoyos back to scale 1.0 so
      the final frame is pixel-identical to frame 0.

      VARIABLES (data-composition-variables / npx hyperframes render <proj>
      --variables '{"activityTitle":"Spotify","progressValue":"42"}'):
        activityTitle    — bold card title (wraps + ellipsis-safe, never clips)
        activitySubtitle — 70%-ink second line
        statusLabel      — trailing pill text. If it contains a number, that
                           number counts up 0→N in lockstep with the bar (e.g.
                           "2 min left", "68%"). No number → it just fades in.
        artworkImage     — leading 1:1 artwork. PATH → <img>; EMPTY (default) →
                           designed accent-gradient tile with artworkGlyph
                           centered, so the default render needs zero assets.
        artworkGlyph     — glyph for that fallback tile (default ▶).
        progressValue    — 0..100 fill; clamped. Drives bar scaleX AND, when the
                           status has a number, the counter — quantized with
                           Math.floor so text never reads ahead of the fill.
        holdDuration     — seconds the open card holds before contracting.
                           Clamped to the fixed 8s render window (max ≈ 3.55s)
                           so the clip always contracts back to the pill.
        accentColor      — artwork gradient + progress fill + glow.
        islandColor      — the pill / card body (true iOS look = near-black).
        phoneColor/screenColor/bg — phone body, wallpaper, scene background.

      DETERMINISM CONTRACT: ONE paused GSAP master timeline registered as
      window.__timelines["main"]; HyperFrames seeks any frame exactly. ALL DOM
      built at construction time. Every animated element's initial state is set
      via gsap.set before any tween, so frame 0 is the bare pill. The bar-sweep
      + counter are driven by ONE proxy {p} whose onUpdate writes BOTH the fill
      scaleX and the status text (Math.floor) — they can never drift. No
      Math.random, no Date, no rAF, no setTimeout, no CSS transitions/@keyframes,
      no infinite repeats (the breathing idle is a finite yoyo). The hold is
      padded with tl.set({},{},DUR) so the last frame renders. hex6() normalizes
      any #rgb / #rrggbbaa color before alpha digits are appended.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Manrope"; font-weight:500;
        src:url("assets/fonts/manrope-500.ttf") format("truetype"); }
      @font-face { font-family:"Manrope"; font-weight:600;
        src:url("assets/fonts/manrope-600.ttf") format("truetype"); }
      @font-face { font-family:"Manrope"; font-weight:700;
        src:url("assets/fonts/manrope-700.ttf") format("truetype"); }
      @font-face { font-family:"Manrope"; font-weight:800;
        src:url("assets/fonts/manrope-800.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden;
        font-family:"Manrope",sans-serif; }
      /* the camera: slow push applied as ONE transform on this wrapper */
      .cam { position:absolute; left:50%; top:50%; will-change:transform; }

      /* iPhone shell — a believable frame so the morph reads as real iOS */
      .phone {
        position:relative;
        border-radius:84px;
        padding:16px;                 /* the titanium rail */
      }
      .screen {
        position:relative;
        border-radius:68px;
        overflow:hidden;
      }
      /* subtle top-light + bottom-vignette on the wallpaper, for depth */
      .wallGlow { position:absolute; inset:0; pointer-events:none; }
      .homebar {
        position:absolute; left:50%; bottom:18px;
        transform:translateX(-50%);
        width:148px; height:6px; border-radius:3px;
        background:rgba(255,255,255,0.55);
      }

      /* the island lives ON the screen, anchored to the top.
         width/height/borderRadius are animated by GSAP (the morph). */
      .island {
        position:absolute; left:50%; top:54px;
        transform:translateX(-50%);
        overflow:hidden;
        will-change:width,height,border-radius;
      }
      /* card content is absolutely placed inside the island so the island can
         resize without reflowing it; opacity/transform animate per element */
      .row {
        position:absolute; left:34px; right:34px; top:34px;
        display:flex; align-items:center; gap:26px;
      }
      .art {
        flex:0 0 auto;
        width:108px; height:108px; border-radius:26px;
        position:relative; overflow:hidden;
        display:flex; align-items:center; justify-content:center;
        will-change:transform,opacity;
      }
      .art img { width:100%; height:100%; object-fit:cover; display:block; }
      .artGlyph { font-size:54px; line-height:1; color:#fff; }
      .meta { flex:1 1 auto; min-width:0; }
      .ttl {
        font-weight:800; font-size:38px; line-height:1.18;
        letter-spacing:-0.01em; color:#fff;
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
        overflow:hidden;
        will-change:transform,opacity,filter;
      }
      .sub {
        font-weight:600; font-size:28px; line-height:1.3; margin-top:6px;
        letter-spacing:-0.005em;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        will-change:transform,opacity,filter;
      }
      .status {
        /* flex:0 1 auto so a long status can SHRINK before the row overflows;
           max-width caps it to a sane share of the card and the text WRAPS
           (right-aligned, ≤2 lines, ellipsis on the 2nd) instead of forcing
           the flex row wider than the card and clipping under the island's
           overflow:hidden. Default short labels ("2 min left") stay one line. */
        flex:0 1 auto; align-self:flex-start; margin-top:4px;
        max-width:200px; min-width:0; text-align:right;
        font-weight:700; font-size:26px; line-height:1.2; letter-spacing:-0.01em;
        font-variant-numeric:tabular-nums;
        white-space:normal; overflow-wrap:break-word; word-break:break-word;
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
        overflow:hidden;
        will-change:opacity,transform;
      }
      .barWrap {
        position:absolute; left:34px; right:34px; top:172px;
        height:14px; border-radius:7px; overflow:hidden;
        will-change:opacity;
      }
      .barFill {
        position:absolute; inset:0; border-radius:7px;
        transform-origin:left center;
        will-change:transform;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <div class="phone" id="phone">
          <div class="screen" id="screen">
            <div class="wallGlow" id="wallGlow"></div>
            <div class="homebar"></div>
            <div class="island" id="island">
              <div class="row" id="row">
                <div class="art" id="art">
                  <span class="artGlyph" id="artGlyph"></span>
                </div>
                <div class="meta">
                  <div class="ttl" id="ttl"></div>
                  <div class="sub" id="sub"></div>
                </div>
                <div class="status" id="status"></div>
              </div>
              <div class="barWrap" id="barWrap">
                <div class="barFill" id="barFill"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize #rgb / #rrggbbaa → #rrggbb so alpha digits append safely */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}
      const ACCENT = hex6(V.accentColor);
      const ISLAND = hex6(V.islandColor);

      /* ── parameters ─────────────────────────────────────────────────── */
      const PROG = Math.max(0, Math.min(100, parseFloat(V.progressValue)));
      const ART_SRC = String(V.artworkImage || "").trim();

      /* DATA_DUR MUST equal the #root data-duration attribute below. It is the
         fixed render window the CLI seeks; --variables CANNOT rewrite the HTML
         attribute, so we treat it as a hard ceiling and CLAMP the hold to fit.
         Budget: motion before hold = OPEN_DONE (2.95s); after hold =
         CONTRACT_DUR + settle (0.95 + 0.55 = 1.5s). So timeline end =
         2.95 + HOLD + 1.5 = 4.45 + HOLD. Max hold that still contracts + settles
         inside the window = DATA_DUR - 4.45 (≈ 3.55s at DATA_DUR 8). Any larger
         holdDuration clamps to that ceiling so the clip ALWAYS returns to the
         bare pill and loops clean — the advertised variable never breaks. */
      const DATA_DUR  = 8.0;                 // == data-duration on #root (fixed)
      const FIXED_PRE = 2.95;                // OPEN_DONE
      const FIXED_POST = 0.95 + 0.55;        // contract + settle tail
      const HOLD_MAX  = DATA_DUR - FIXED_PRE - FIXED_POST;   // ≈ 3.55s
      const HOLD = Math.max(0, Math.min(HOLD_MAX, parseFloat(V.holdDuration) || 0));

      /* the status string may embed a number that should count up with the
         bar (e.g. "2 min left", "68%"). Find the FIRST integer, scale it to
         PROG, and rebuild the string with the live count. No number → static. */
      const statusRaw = String(V.statusLabel || "");
      const numMatch  = statusRaw.match(/\d+/);
      const STATUS_TARGET = numMatch ? parseInt(numMatch[0], 10) : null;
      const STATUS_PRE  = numMatch ? statusRaw.slice(0, numMatch.index) : statusRaw;
      const STATUS_POST = numMatch ? statusRaw.slice(numMatch.index + numMatch[0].length) : "";

      /* ── layout constants (the two morph end-states) ────────────────── */
      const PILL_W = 264, PILL_H = 72, PILL_R = 36;     // the bare Dynamic Island
      const CARD_W = 620, CARD_H = 224, CARD_R = 48;    // the bloomed live-activity
      /* the phone screen must comfortably CONTAIN the card with side margins */
      const SCREEN_W = 720, SCREEN_H = 1108;
      const PHONE_PAD = 16;                              // titanium rail thickness

      /* ── element refs ───────────────────────────────────────────────── */
      const root    = document.getElementById("root");
      const cam     = document.getElementById("cam");
      const phone   = document.getElementById("phone");
      const screen  = document.getElementById("screen");
      const wallGlow= document.getElementById("wallGlow");
      const island  = document.getElementById("island");
      const row      = document.getElementById("row");
      const art      = document.getElementById("art");
      const artGlyph = document.getElementById("artGlyph");
      const ttl      = document.getElementById("ttl");
      const sub      = document.getElementById("sub");
      const status   = document.getElementById("status");
      const barWrap  = document.getElementById("barWrap");
      const barFill   = document.getElementById("barFill");

      /* ── static styles + content (construction time) ────────────────── */
      document.body.style.background = V.bg;
      root.style.background          = V.bg;

      phone.style.background = V.phoneColor;
      phone.style.width      = (SCREEN_W + PHONE_PAD * 2) + "px";
      phone.style.height     = (SCREEN_H + PHONE_PAD * 2) + "px";
      phone.style.padding    = PHONE_PAD + "px";
      phone.style.boxShadow  =
        `0 60px 140px ${ISLAND}40, 0 24px 60px ${ISLAND}33, inset 0 0 0 3px ${hex6(V.phoneColor)}`;
      screen.style.background = V.screenColor;
      screen.style.width      = SCREEN_W + "px";
      screen.style.height     = SCREEN_H + "px";
      wallGlow.style.background =
        `radial-gradient(120% 60% at 50% -6%, ${ACCENT}33, transparent 60%),`+
        `radial-gradient(100% 50% at 50% 108%, ${ISLAND}66, transparent 64%)`;

      island.style.background = ISLAND;
      island.style.boxShadow  = `0 18px 44px ${ISLAND}59`;

      /* artwork — designed gradient + glyph fallback when no image path */
      if (ART_SRC) {
        const img = document.createElement("img");
        img.src = ART_SRC;
        art.insertBefore(img, artGlyph);
        artGlyph.style.display = "none";
      } else {
        art.style.background =
          `linear-gradient(140deg, ${ACCENT}, ${ACCENT}99 58%, ${ISLAND})`;
        artGlyph.textContent = String(V.artworkGlyph || "▶");
      }

      ttl.textContent = String(V.activityTitle);
      sub.textContent = String(V.activitySubtitle);
      sub.style.color    = "rgba(255,255,255,0.72)";
      status.style.color = ACCENT;
      /* status base text (frame 0 / pill state shows the eventual full string
         under the masking opacity:0, so measurement & ellipsis are correct) */
      status.textContent = numMatch ? (STATUS_PRE + STATUS_TARGET + STATUS_POST) : statusRaw;

      barWrap.style.background = "rgba(255,255,255,0.16)";
      barFill.style.background =
        `linear-gradient(90deg, ${ACCENT}, ${ACCENT}cc)`;
      barFill.style.boxShadow  = `0 0 18px ${ACCENT}80`;

      /* ── timing (spec) ──────────────────────────────────────────────── */
      const STRETCH_AT = 0.55, STRETCH_DUR = 0.60;
      const BLOOM_AT   = 1.05, BLOOM_DUR   = 0.65;
      const ART_AT     = 1.55, ART_DUR     = 0.50;
      const TEXT_AT    = 1.70;
      const BAR_AT     = 2.05, BAR_DUR     = 0.90;
      const OPEN_DONE  = FIXED_PRE;            // card fully presented (2.95)
      const HOLD_END   = OPEN_DONE + HOLD;     // open card holds here
      const CONTRACT_AT = HOLD_END, CONTRACT_DUR = 0.95;
      /* HOLD is clamped so CONTRACT_AT + CONTRACT_DUR + 0.55 <= DATA_DUR; the
         timeline is padded to the FIXED render window so the last rendered frame
         is the settled bare pill regardless of holdDuration. */
      const DUR        = DATA_DUR;

      /* ── initial states — frame 0 is the bare pill, no content ──────── */
      gsap.set(cam, { xPercent: -50, yPercent: -50, scale: 1.0 });
      gsap.set(island, { width: PILL_W, height: PILL_H, borderRadius: PILL_R });
      gsap.set(row,    { opacity: 0 });
      gsap.set(art,    { x: -28, scale: 0.6, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set(ttl,    { y: 14, opacity: 0, filter: "blur(4px)" });
      gsap.set(sub,    { y: 14, opacity: 0, filter: "blur(4px)" });
      gsap.set(status, { y: 8, opacity: 0 });
      gsap.set(barWrap,{ opacity: 0 });
      gsap.set(barFill,{ scaleX: 0 });

      /* ── proxy that drives BOTH the bar fill and the status counter ──── */
      const pr = { p: 0 };
      function drawProgress() {
        barFill.style.transform = `scaleX(${(pr.p / 100).toFixed(4)})`;
        if (STATUS_TARGET !== null) {
          /* counter follows the fill, quantized so text never leads visual */
          const n = Math.floor(STATUS_TARGET * (pr.p / 100) + 1e-6);
          status.textContent = STATUS_PRE + n + STATUS_POST;
        }
      }

      /* ── paused master timeline; HyperFrames seeks it ───────────────── */
      const tl = gsap.timeline({ paused: true });

      /* CAM — slow push out then back so the LAST frame matches frame 0 exactly
         (scale 1.0). A single finite yoyo cycle: push to 1.035 over the first
         half, settle back to 1.0 over the second half → pixel-identical loop. */
      tl.to(cam, { scale: 1.035, duration: DUR / 2, ease: "sine.inOut",
                   yoyo: true, repeat: 1 }, 0);

      /* STRETCH-WIDE — pill snaps wide first, elastic settle */
      tl.to(island, { width: CARD_W, duration: STRETCH_DUR,
                      ease: "elastic.out(1,0.75)" }, STRETCH_AT);

      /* BLOOM-TALL — height + radius ease open; the pill becomes the card */
      tl.to(island, { height: CARD_H, borderRadius: CARD_R, duration: BLOOM_DUR,
                      ease: "power3.out" }, BLOOM_AT);
      /* reveal the content layer once the card has body to hold it */
      tl.to(row, { opacity: 1, duration: 0.12, ease: "none" }, BLOOM_AT + 0.18);

      /* ARTWORK-IN — leading tile slides + scales in */
      tl.to(art, { x: 0, scale: 1, opacity: 1, duration: ART_DUR,
                   ease: "back.out(1.7)" }, ART_AT);

      /* TEXT-UP — title, then subtitle, then trailing status, staggered */
      tl.to(ttl,    { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.50,
                      ease: "power3.out" }, TEXT_AT);
      tl.to(sub,    { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.50,
                      ease: "power3.out" }, TEXT_AT + 0.12);
      tl.to(status, { y: 0, opacity: 1, duration: 0.45,
                      ease: "power3.out" }, TEXT_AT + 0.30);

      /* BAR-SWEEP — track fades in, fill + counter sweep to value together */
      tl.to(barWrap, { opacity: 1, duration: 0.30, ease: "power2.out" }, BAR_AT);
      tl.to(pr, { p: PROG, duration: BAR_DUR, ease: "power2.out",
                  onUpdate: drawProgress }, BAR_AT);

      /* HOLD — open card breathes (finite yoyo so the frame is never dead) */
      const breath = Math.max(1, Math.floor(HOLD / 1.0));   // whole cycles in the hold
      if (HOLD > 0.4) {
        tl.to(art, { scale: 1.035, duration: 0.5, ease: "sine.inOut",
                     yoyo: true, repeat: breath * 2 - 1 }, OPEN_DONE + 0.1);
      }

      /* CONTRACT — reverse bloom; content clears, island returns to the pill */
      tl.to([ttl, sub, status], { opacity: 0, y: 6, duration: 0.28,
                                  ease: "power2.in" }, CONTRACT_AT);
      tl.to(art,    { opacity: 0, scale: 0.6, x: -28, duration: 0.28,
                      ease: "power2.in" }, CONTRACT_AT);
      tl.to(barWrap,{ opacity: 0, duration: 0.24, ease: "power2.in" }, CONTRACT_AT);
      tl.to(barFill,{ scaleX: 0, duration: 0.30, ease: "power2.in" }, CONTRACT_AT);
      tl.to(row,    { opacity: 0, duration: 0.12, ease: "none" }, CONTRACT_AT + 0.30);
      /* collapse geometry back to the bare pill, landing on frame-0 state */
      tl.to(island, { height: PILL_H, borderRadius: PILL_R, duration: 0.45,
                      ease: "power3.inOut" }, CONTRACT_AT + 0.22);
      tl.to(island, { width: PILL_W, duration: 0.50,
                      ease: "power3.inOut" }, CONTRACT_AT + 0.42);

      /* hold the final (bare-pill) frame to the end of data-duration */
      tl.set({}, {}, DUR);

      drawProgress(); // frame 0 styled immediately (bar at 0, counter at 0)

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
