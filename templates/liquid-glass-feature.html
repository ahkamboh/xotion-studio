<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"appName",    "type":"string","label":"App / product name",        "default":"Xotion"},
  {"id":"headline",   "type":"string","label":"Panel headline",            "default":"The editor for AI agents"},
  {"id":"chips",      "type":"string","label":"Feature chips (pipe-sep)",   "default":"Caption|Animate|Score|Render 4K"},
  {"id":"highlight",  "type":"string","label":"Index of chip to highlight (0-based)","default":"1"},
  {"id":"calloutText","type":"string","label":"Highlight callout",          "default":"New · one click"},
  {"id":"barText",    "type":"string","label":"Command-bar placeholder",    "default":"Ask the agent to edit…"},
  {"id":"accent",     "type":"color", "label":"Accent",                     "default":"#7c5cff"},
  {"id":"g1",         "type":"color", "label":"Gradient color 1",           "default":"#6a3cff"},
  {"id":"g2",         "type":"color", "label":"Gradient color 2",           "default":"#13b5ff"},
  {"id":"g3",         "type":"color", "label":"Gradient color 3",           "default":"#ff4d9d"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      LIQUID GLASS FEATURE — frosted "Apple liquid-glass" UI panel over an
      animated mesh gradient, with a specular light sweep and a feature
      HIGHLIGHT (a glowing ring + glass callout draws the eye to one chip).
      For AI-site / product-demo feature highlights and UI showcases.

      Phases (data-duration 7.0): mesh gradient drifts the whole time →
      0.0-0.9 glass panel lifts + scales in → 0.9-1.8 inner UI staggers in
      (header, command bar, chips) → 1.8-2.6 diagonal specular sweep across
      the glass → 2.6-4.4 highlight: target chip lifts, a ring draws around
      it and pulses, a glass callout slides in above it → hold + slow camera
      push. Loop-friendly.

      Slot-driven (works with :cards): chips/highlight/accent/gradient are
      variables. Determinism contract: render(t) drives the gradient drift +
      ring-glow pulse + camera; all entrances/sweep/draw are finite tweens on
      the SAME paused master timeline. No random/Date/rAF. render(0) at boot.
      backdrop-filter is supported by the engine's headless Chromium.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Inter"; font-weight:400; src:url("assets/fonts/inter-400.ttf") format("truetype"); }
      @font-face { font-family:"Inter"; font-weight:500; src:url("assets/fonts/inter-500.ttf") format("truetype"); }
      @font-face { font-family:"Inter"; font-weight:600; src:url("assets/fonts/inter-600.ttf") format("truetype"); }
      @font-face { font-family:"Inter"; font-weight:700; src:url("assets/fonts/inter-700.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden;
        font-family:"Inter",-apple-system,sans-serif; background:#0a0a12; }

      /* animated mesh-gradient background (blobs drift via render(t)) */
      .bg { position:absolute; inset:-10%; filter:saturate(1.15); }
      .blob { position:absolute; width:1100px; height:1100px; border-radius:50%;
        filter:blur(120px); opacity:0.9; will-change:transform; }
      .grain { position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay;
        background-image:radial-gradient(#fff 1px, transparent 1px); background-size:4px 4px; }

      .cam { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
        will-change:transform; }

      /* the liquid-glass panel */
      .panel { width:1180px; border-radius:40px; padding:46px 50px 50px;
        position:relative; overflow:hidden;
        background:rgba(255,255,255,0.08);
        /* REAL liquid-glass: edge LENSING via SVG displacement + CLEAR blur (not heavy frost).
           url(#lgRefract) bends the wallpaper at the rim; blur stays light so content reads through. */
        -webkit-backdrop-filter:blur(8px) saturate(1.8) brightness(1.06);
        backdrop-filter:url(#lgRefract) blur(8px) saturate(1.8) brightness(1.06);
        border:1.5px solid rgba(255,255,255,0.30);
        box-shadow:0 40px 120px rgba(0,0,0,0.45),
                   inset 0 1.5px 0 rgba(255,255,255,0.55),
                   inset 0 -1px 0 rgba(255,255,255,0.10); }
      /* top specular sheen */
      .panel::before { content:""; position:absolute; left:0; right:0; top:0; height:46%;
        background:linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
        pointer-events:none; }
      /* the moving specular light sweep (clipped by panel overflow:hidden) */
      .sweep { position:absolute; top:-30%; left:-40%; width:36%; height:160%;
        transform:rotate(18deg) translateX(-200%);
        background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.45), rgba(255,255,255,0));
        pointer-events:none; }

      .head { display:flex; align-items:center; gap:18px; margin-bottom:30px; }
      .logo { width:52px; height:52px; border-radius:15px; flex:0 0 auto;
        display:flex; align-items:center; justify-content:center;
        background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.3); }
      .logo svg { width:30px; height:30px; display:block; }
      .appname { font-size:30px; font-weight:700; color:#fff; letter-spacing:-0.01em; }
      .headline { margin-left:auto; font-size:26px; font-weight:500; color:rgba(255,255,255,0.78); }

      /* glass command bar */
      .bar { display:flex; align-items:center; gap:16px; padding:20px 22px; border-radius:20px;
        background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.22);
        box-shadow:inset 0 1px 0 rgba(255,255,255,0.3); margin-bottom:92px; }
      .bardot { width:22px; height:22px; border-radius:50%; flex:0 0 auto; }
      .bartext { font-size:28px; font-weight:500; color:rgba(255,255,255,0.6); }
      .barsend { margin-left:auto; width:46px; height:46px; border-radius:50%; flex:0 0 auto;
        display:flex; align-items:center; justify-content:center; }
      .barsend svg { width:24px; height:24px; display:block; }

      /* glass feature chips */
      .chips { display:flex; gap:18px; flex-wrap:wrap; }
      .chip { padding:20px 28px; border-radius:18px; font-size:28px; font-weight:600; color:#fff;
        background:rgba(255,255,255,0.13); border:1px solid rgba(255,255,255,0.22);
        box-shadow:inset 0 1px 0 rgba(255,255,255,0.28); white-space:nowrap; position:relative; }

      /* highlight ring (SVG) drawn around the target chip */
      .ring { position:absolute; pointer-events:none; overflow:visible; }
      .ring rect { fill:none; stroke-linecap:round; }

      /* glass callout */
      .callout { position:absolute; padding:14px 22px; border-radius:16px; font-size:26px;
        font-weight:700; color:#fff; white-space:nowrap; opacity:0;
        background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.3);
        -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
        box-shadow:0 16px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.4); }
      .callout .nib { position:absolute; bottom:-9px; left:34px; width:18px; height:18px;
        transform:rotate(45deg); background:inherit; border-right:1px solid rgba(255,255,255,0.3);
        border-bottom:1px solid rgba(255,255,255,0.3); }
    </style>
  </head>
  <body>
    <!-- liquid-glass refraction filter: fractalNoise (fixed seed = deterministic) drives a
         displacement map that bends the backdrop at the glass edges — the "lensing" that
         separates real Liquid Glass from plain frosted glassmorphism. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="lgRefract" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.010" numOctaves="2" seed="7" result="n"/>
        <feGaussianBlur in="n" stdDeviation="1.1" result="nb"/>
        <feDisplacementMap id="lgDisp" in="SourceGraphic" in2="nb" scale="22"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>

    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div class="bg" id="bg"></div>
      <div class="grain"></div>

      <div class="cam" id="cam">
        <div class="panel" id="panel">
          <div class="sweep" id="sweep"></div>

          <div class="head" id="head">
            <div class="logo">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L13.7 9 L21 11 L13.7 13 L12 21 L10.3 13 L3 11 L10.3 9 Z" fill="#fff"/></svg>
            </div>
            <div class="appname" id="appname"></div>
            <div class="headline" id="headline"></div>
          </div>

          <div class="bar" id="bar">
            <div class="bardot" id="bardot"></div>
            <div class="bartext" id="bartext"></div>
            <div class="barsend" id="barsend">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
            </div>
          </div>

          <div class="chips" id="chips"></div>

          <svg class="ring" id="ring"><rect id="ringrect" rx="20" ry="20"></rect></svg>
          <div class="callout" id="callout"><span id="callouttext"></span><span class="nib"></span></div>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();
      const CHIPS = String(V.chips).split("|").map(s=>s.trim()).filter(Boolean);
      const HL = Math.max(0, Math.min(CHIPS.length-1, parseInt(V.highlight)||0));
      const AC = String(V.accent), G1=String(V.g1), G2=String(V.g2), G3=String(V.g3);

      const $ = id=>document.getElementById(id);
      const bg=$("bg"), cam=$("cam"), panel=$("panel"), sweep=$("sweep"),
            appname=$("appname"), headline=$("headline"), bardot=$("bardot"),
            bartext=$("bartext"), barsend=$("barsend"), chipsWrap=$("chips"),
            ring=$("ring"), ringrect=$("ringrect"), callout=$("callout"), callouttext=$("callouttext");

      appname.textContent=String(V.appName);
      headline.textContent=String(V.headline);
      bartext.textContent=String(V.barText);
      callouttext.textContent=String(V.calloutText);
      bardot.style.background=AC;
      barsend.style.background=AC;

      // build 3 drifting gradient blobs
      const blobColors=[G1,G2,G3];
      const blobs=[];
      const blobHome=[{x:300,y:240},{x:1500,y:760},{x:980,y:1000}];
      blobColors.forEach((c,i)=>{
        const b=document.createElement("div"); b.className="blob";
        b.style.background=`radial-gradient(circle at 50% 50%, ${c}, ${c}00 70%)`;
        bg.appendChild(b); blobs.push(b);
      });

      // build chips
      const chipEls=[];
      CHIPS.forEach((label,i)=>{
        const c=document.createElement("div"); c.className="chip"; c.textContent=label;
        if(i===HL){ c.style.background="rgba(255,255,255,0.2)"; }
        chipsWrap.appendChild(c); chipEls.push(c);
      });

      // ── timeline phases ───────────────────────────────────────────
      const TOTAL = 7.0;
      const PANEL_IN=0.9, UI_IN=0.95, SWEEP_AT=1.85, HL_AT=2.7, CALL_AT=3.1;
      const clamp01=t=>Math.max(0,Math.min(1,t));

      // initial states
      gsap.set(panel,{scale:0.92,opacity:0,y:30,transformOrigin:"50% 55%"});
      gsap.set([$("head"),$("bar")],{opacity:0,y:24});
      gsap.set(chipEls,{opacity:0,y:20});
      gsap.set(ring,{opacity:0});
      gsap.set(callout,{opacity:0,y:18,scale:0.9,transformOrigin:"30% 120%"});
      gsap.set(sweep,{x:0});

      const tl=gsap.timeline({paused:true});
      tl.to(panel,{scale:1,opacity:1,y:0,duration:PANEL_IN,ease:"expo.out"},0);
      tl.to($("head"),{opacity:1,y:0,duration:0.6,ease:"power3.out"},0.5);
      tl.to($("bar"),{opacity:1,y:0,duration:0.6,ease:"power3.out"},0.7);
      chipEls.forEach((c,i)=>tl.to(c,{opacity:1,y:0,duration:0.5,ease:"back.out(1.6)"},0.95+i*0.09));

      // specular sweep across the glass
      tl.fromTo(sweep,{x:0},{x:3400,duration:0.85,ease:"power2.inOut"},SWEEP_AT);

      // FEATURE HIGHLIGHT — position the ring over the target chip (measured lazily),
      // lift the chip, draw the ring, slide the callout in
      let placed=false;
      function placeHighlight(){
        if(placed) return; placed=true;
        const pr=panel.getBoundingClientRect(), cr=chipEls[HL].getBoundingClientRect();
        const pad=12;
        const chipTop=cr.top-pr.top, chipLeft=cr.left-pr.left;
        const x=chipLeft-pad, y=chipTop-pad, w=cr.width+pad*2, h=cr.height+pad*2;
        ring.setAttribute("width", pr.width); ring.setAttribute("height", pr.height);
        ring.style.left="0"; ring.style.top="0";
        ringrect.setAttribute("x",x); ringrect.setAttribute("y",y);
        ringrect.setAttribute("width",w); ringrect.setAttribute("height",h);
        ringrect.setAttribute("stroke",AC); ringrect.setAttribute("stroke-width","4");
        const per=2*(w+h);
        ringrect.style.strokeDasharray=per; ringrect.style.strokeDashoffset=per;
        ring.__per=per;
        // sit the callout in the gap ABOVE the chip, by its measured height, so it
        // never collides with the command bar (which now has clearance above)
        const coH=callout.offsetHeight||58;
        callout.style.left=x+"px";
        callout.style.top=(chipTop - coH - 18)+"px";
      }
      tl.add(()=>placeHighlight(), HL_AT-0.01);
      tl.to(chipEls[HL],{scale:1.06,duration:0.4,ease:"back.out(2)"},HL_AT);
      tl.set(ring,{opacity:1},HL_AT);
      tl.to({},{duration:0.5,onUpdate:function(){
        const k=clamp01(this.progress());
        if(ring.__per!=null) ringrect.style.strokeDashoffset=(ring.__per*(1-k)).toFixed(1);
      }},HL_AT);
      tl.to(callout,{opacity:1,y:0,scale:1,duration:0.45,ease:"back.out(1.8)"},CALL_AT);

      const lgDisp = document.getElementById("lgDisp");
      // per-frame: gradient drift + liquid refraction shimmer + ring glow pulse + camera push
      function render(t){
        // "liquid" — the lensing strength breathes (deterministic sin of t)
        if(lgDisp) lgDisp.setAttribute("scale", (22 + Math.sin(t*0.8)*5).toFixed(2));
        blobs.forEach((b,i)=>{
          const ph=i*2.1;
          const dx=blobHome[i].x + Math.sin(t*0.45+ph)*140;
          const dy=blobHome[i].y + Math.cos(t*0.38+ph*1.3)*120;
          b.style.transform=`translate(${(dx-550).toFixed(1)}px, ${(dy-550).toFixed(1)}px)`;
        });
        // ring soft glow pulse after it's drawn
        if(t>HL_AT+0.5){
          const g=(Math.sin((t-HL_AT)*3.2)+1)/2;
          ringrect.style.filter=`drop-shadow(0 0 ${(8+g*14).toFixed(1)}px ${AC})`;
        } else {
          ringrect.style.filter="none";
        }
        // slow camera push 1.0 -> 1.04
        const z=1.0+0.04*clamp01(t/TOTAL);
        cam.style.transform=`translate(-50%,-50%) scale(${z.toFixed(4)})`;
      }
      const p={t:0};
      tl.to(p,{t:TOTAL,duration:TOTAL,ease:"none",onUpdate:()=>render(p.t)},0);
      tl.set({},{},7);

      render(0);
      window.__timelines=window.__timelines||{};
      window.__timelines["main"]=tl;
      window.__timeline=tl;
    </script>
  </body>
</html>
