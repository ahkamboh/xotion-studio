<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      GRAPHICS OVERLAY TEMPLATE — make a plain clip graphically rich.
      Renders on a TRANSPARENT background so it can be composited over any video:
          scripts/overlay.sh base.mp4 projects/<name> out.mp4
      (overlay.sh renders this to MOV+alpha, then ffmpeg-overlays it onto base.mp4)

      Two deterministic graphics layers, both reproducible frame-for-frame:
        1. CANVAS PARTICLES  — driven by the HyperFrames `hf-seek` clock (CustomEvent
           detail.time). Pure function of time; particle params come from a SEEDED PRNG
           at init, so NO Math.random()/Date.now() at render time (required by the engine).
        2. KINETIC TEXT      — words split into spans, staggered in/out on the GSAP timeline.

      Swap in any JS graphics library using the SAME two patterns (see docs/graphics-libraries.md):
        - DOM/SVG libs (anime.js, SplitType, D3, Lottie) -> drive on the GSAP timeline.
        - Canvas/WebGL libs (three.js, Pixi.js, p5) -> draw inside the `hf-seek` handler.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Sora"; font-weight:800; src:url("assets/fonts/sora-800.ttf") format("truetype"); }
      @font-face { font-family:"Sora"; font-weight:700; src:url("assets/fonts/sora-700.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      /* TRANSPARENT — do not set a solid background; this layer sits over your video. */
      html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:transparent; }

      /* particle canvas fills the frame, behind the text */
      #fx { position:absolute; inset:0; width:1920px; height:1080px; z-index:10; }

      /* kinetic headline */
      .title { position:absolute; left:50%; bottom:140px; transform:translateX(-50%);
               z-index:20; display:flex; flex-wrap:wrap; gap:0 26px; justify-content:center;
               width:1600px; text-align:center; }
      .title .w { display:inline-block; font-family:"Sora",sans-serif; font-weight:800;
                  font-size:96px; line-height:1.0; letter-spacing:-.02em; color:#ffffff;
                  text-shadow:0 6px 40px rgba(0,0,0,.55); will-change:transform,opacity,filter; }
      .title .w em { font-style:normal;
                     background:linear-gradient(135deg,#5cffd0,#3fa9ff 60%,#7b5cff);
                     -webkit-background-clip:text; background-clip:text; color:transparent; }

      /* thin animated accent bar under the title */
      .bar { position:absolute; left:50%; bottom:110px; transform:translateX(-50%) scaleX(0);
             transform-origin:center; z-index:20; width:420px; height:5px; border-radius:3px;
             background:linear-gradient(90deg,#5cffd0,#3fa9ff,#7b5cff);
             box-shadow:0 0 20px rgba(63,169,255,.7); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <canvas id="fx" width="1920" height="1080"></canvas>

      <!-- EDIT THIS HEADLINE. Wrap an accent word in <em>…</em>. -->
      <div class="title" id="title">
        <span class="w">Make</span><span class="w">it</span><span class="w"><em>move.</em></span>
      </div>
      <div class="bar" id="bar"></div>
    </div>

    <script>
      /* ---------- deterministic seeded PRNG (init only; no randomness at render time) ---------- */
      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(20260605);          // fixed seed => identical every render

      const W = 1920, H = 1080;
      const cv = document.getElementById("fx");
      const ctx = cv.getContext("2d");

      /* pre-generate particle fields (positions, drift, size, twinkle) ONCE, deterministically */
      const N = 90;
      const P = [];
      for (let i = 0; i < N; i++) {
        P.push({
          x: rnd() * W,
          y: rnd() * H,
          vx: (rnd() - 0.5) * 26,      // px/sec drift
          vy: -(8 + rnd() * 34),       // float upward
          r:  1.4 + rnd() * 3.6,       // radius
          ph: rnd() * Math.PI * 2,     // twinkle phase
          tw: 0.6 + rnd() * 1.8,       // twinkle speed
          hue: 165 + rnd() * 95,       // teal -> blue -> violet
        });
      }

      function draw(t) {                 // t = seconds, pure function => deterministic
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = "lighter";   // additive glow
        for (const p of P) {
          // position wraps within the frame so the field stays populated
          let x = (p.x + p.vx * t) % W; if (x < 0) x += W;
          let y = (p.y + p.vy * t) % H; if (y < 0) y += H;
          const a = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(p.ph + t * p.tw));
          const grad = ctx.createRadialGradient(x, y, 0, x, y, p.r * 6);
          grad.addColorStop(0, `hsla(${p.hue},90%,70%,${a})`);
          grad.addColorStop(1, `hsla(${p.hue},90%,70%,0)`);
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(x, y, p.r * 6, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";
      }

      /* HyperFrames drives canvas/WebGL via the hf-seek clock — render at the exact frame time */
      draw(0);
      window.addEventListener("hf-seek", (e) => draw((e.detail && e.detail.time) || 0));

      /* ---------- kinetic text on the GSAP timeline ---------- */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const words = gsap.utils.toArray("#title .w");

      gsap.set(words, { yPercent: 120, opacity: 0, filter: "blur(14px)" });
      tl.to(words, {                                  // staggered punch-in
        yPercent: 0, opacity: 1, filter: "blur(0px)",
        duration: 0.6, ease: "back.out(1.7)", stagger: 0.12,
      }, 0.2)
      .to("#bar", { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.5)
      .to({}, { duration: 3.2 })                       // hold
      .to([words, "#bar"].flat ? words : words, {      // gentle drift while held (optional)
        yPercent: -4, duration: 3.0, ease: "sine.inOut",
      }, 0.9)
      .to(["#title", "#bar"], {                        // fade the whole overlay out
        opacity: 0, duration: 0.5, ease: "power2.in",
      }, 4.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
