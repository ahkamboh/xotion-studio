<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"labelOff","type":"string","label":"Label (off state)","default":"Manual editing"},
  {"id":"labelOn", "type":"string","label":"Label (on state)", "default":"Xotion agent mode"},
  {"id":"accent",  "type":"color", "label":"Accent (track on)", "default":"#22c55e"},
  {"id":"bgOff",   "type":"color", "label":"Background (off)",  "default":"#f1f5f9"},
  {"id":"bgOn",    "type":"color", "label":"Background (on)",   "default":"#0a0a0a"},
  {"id":"inkOff",  "type":"color", "label":"Label ink (off)",   "default":"#0a0a0a"},
  {"id":"inkOn",   "type":"color", "label":"Label ink (on)",    "default":"#ffffff"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      TOGGLE FLIP — a giant iOS-style switch flips on and the whole mood
      changes: knob slides right with squash-stretch, the track crossfades
      grey → accent, a full-screen dark overlay fades the scene from light
      to dark, and the label mask-swaps from labelOff to labelOn while a
      radial pulse ring expands once where the knob lands. A slow camera
      pull-back (zoom 1.25 → 1.0) runs across the whole clip.

      VARIABLES (data-composition-variables on <html>):
        labelOff  — text shown in the light/off state   ("Manual editing")
        labelOn   — text shown in the dark/on state     ("Xotion agent mode")
        accent    — track color after the flip           (#22c55e)
        bgOff     — page background, off state           (#f1f5f9)
        bgOn      — full-screen overlay color, on state  (#0a0a0a)
        inkOff    — labelOff text color                  (#0a0a0a)
        inkOn     — labelOn  text color                  (#ffffff)

      TIMING (data-duration = 3.5s, final frame holds):
        0.00–0.70  settle-in : toggle scales 0.9→1 (back.out), label block
                               rises 34px into place (power3.out)
        1.00–1.55  THE FLIP  : knob x 0→160 (power2.inOut) with squash-
                               stretch (scaleX 1→1.25 at mid →1); accent
                               track overlay 0→1; full-screen bgOn overlay
                               0→1 (power2.inOut); label mask-swap (off span
                               yPercent 0→-110, on span 110→0); pulse ring
                               fires at ~1.45 where the knob lands
        1.55–2.00  settle    : knob micro-bounce (recoil 8px, back.out)
        0.00–3.50  camera    : .cam zoom 1.25 → 1.0 linear pull-back
        2.05–3.50  hold      : nothing moves except the camera creep

      DETERMINISM — every frame is a pure function of time. ONE paused
      master timeline (window.__timelines["main"]); the renderer seeks it.
      All DOM is built statically in the markup below (both label spans,
      the accent track overlay, the pulse ring, the bgOn overlay are
      PRE-BUILT — opacity/transform animate, nothing is created at play
      time). Every animated element gets its initial state via gsap.set at
      construction so frame 0 renders correctly: light scene, knob left,
      labelOff visible. No Math.random, no Date, no rAF, no CSS
      transitions/keyframes, no infinite repeats, no measurement needed.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Inter"; font-weight:500;
        src:url("assets/fonts/inter-500.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; }

      /* full-screen mood overlay (bgOn) — fading THIS is cleaner than
         animating backgroundColor on the page */
      .moodOverlay { position:absolute; inset:0; z-index:0; }

      /* the camera: zoom applied as ONE transform on this wrapper */
      .cam {
        position:absolute; left:50%; top:50%; z-index:1;
        display:flex; flex-direction:column; align-items:center;
        will-change:transform;
      }

      /* ── the switch ─────────────────────────────────────────────── */
      .toggle { position:relative; width:360px; height:200px; }
      .track {
        position:absolute; inset:0;
        border-radius:100px; background:#d4d4d8;
      }
      .trackOn {                 /* pre-built accent fill, crossfaded in */
        position:absolute; inset:0;
        border-radius:100px; z-index:1;
      }
      .pulse {                   /* pre-built ring at the knob's LANDING spot */
        position:absolute; z-index:2;
        width:168px; height:168px;
        left:176px; top:16px;    /* final knob center (260,100) − 84 */
        border-radius:50%;
        border:6px solid #22c55e;     /* recolored to accent at boot */
      }
      .knob {
        position:absolute; z-index:3;
        width:168px; height:168px;
        left:16px; top:16px;
        border-radius:50%; background:#ffffff;
        box-shadow:0 10px 28px rgba(0,0,0,.22), 0 3px 8px rgba(0,0,0,.14);
      }

      /* ── the label: overflow-hidden mask, two pre-built stacked spans ─ */
      .labelBlock { margin-top:44px; }
      .labelMask {
        position:relative; overflow:hidden;
        width:1600px; height:84px;
      }
      .labelMask span {
        position:absolute; left:0; right:0; top:0;
        text-align:center; white-space:nowrap;
        font-family:"Inter",sans-serif; font-weight:500;
        font-size:64px; line-height:84px; letter-spacing:-0.01em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
      <div class="moodOverlay" id="moodOverlay"></div>
      <div class="cam" id="cam">
        <div class="toggle" id="toggle">
          <div class="track"></div>
          <div class="trackOn" id="trackOn"></div>
          <div class="pulse" id="pulse"></div>
          <div class="knob" id="knob"></div>
        </div>
        <div class="labelBlock" id="labelBlock">
          <div class="labelMask">
            <span id="labelOff"></span>
            <span id="labelOn"></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* ── parameters ─────────────────────────────────────────────────── */
      const DUR     = 3.5;            // matches data-duration
      const TRAVEL  = 160;            // 360 − 2×16 inset − 168 knob
      const ZOOM_IN = 1.25, ZOOM_OUT = 1.0;
      const FLIP_T  = 1.0,  FLIP_D = 0.55;      // 1.00 → 1.55

      /* ── static styles from variables (DOM is fully pre-built) ──────── */
      const root     = document.getElementById("root");
      const overlay  = document.getElementById("moodOverlay");
      const cam      = document.getElementById("cam");
      const toggle   = document.getElementById("toggle");
      const trackOn  = document.getElementById("trackOn");
      const pulse    = document.getElementById("pulse");
      const knob     = document.getElementById("knob");
      const labBlock = document.getElementById("labelBlock");
      const labOff   = document.getElementById("labelOff");
      const labOn    = document.getElementById("labelOn");

      document.body.style.background = V.bgOff;
      root.style.background    = V.bgOff;
      overlay.style.background = V.bgOn;
      trackOn.style.background = V.accent;
      pulse.style.borderColor  = V.accent;
      labOff.textContent = String(V.labelOff);
      labOn.textContent  = String(V.labelOn);
      labOff.style.color = V.inkOff;
      labOn.style.color  = V.inkOn;

      /* ── initial states (frame 0: light scene, knob left, labelOff
            visible) — set at construction so frame 0 is never unstyled ── */
      gsap.set(cam,      { xPercent:-50, yPercent:-50, scale:ZOOM_IN });
      gsap.set(toggle,   { scale:0.9, transformOrigin:"50% 50%" });
      gsap.set(labBlock, { y:34 });
      gsap.set(knob,     { x:0, scaleX:1, scaleY:1, transformOrigin:"50% 50%" });
      gsap.set(trackOn,  { opacity:0 });
      gsap.set(overlay,  { opacity:0 });
      gsap.set(labOff,   { yPercent:0 });
      gsap.set(labOn,    { yPercent:110 });
      gsap.set(pulse,    { scale:0.5, opacity:0, transformOrigin:"50% 50%" });

      /* ── paused master timeline; HyperFrames seeks it ───────────────── */
      const tl = gsap.timeline({ paused:true });

      // PHASE 1 — settle-in (0 → 0.7)
      tl.to(toggle,   { scale:1, duration:0.7, ease:"back.out(1.8)" }, 0);
      tl.to(labBlock, { y:0,     duration:0.7, ease:"power3.out"    }, 0);

      // PHASE 2 — THE FLIP (1.0 → 1.55)
      tl.to(knob, { x:TRAVEL, duration:FLIP_D, ease:"power2.inOut" }, FLIP_T);
      // squash-stretch: scaleX peaks 1.25 at mid-travel (slight scaleY
      // counter-squash so the stretch reads as real squash-stretch)
      tl.to(knob, { scaleX:1.25, scaleY:0.92, duration:FLIP_D/2, ease:"power2.in"  }, FLIP_T);
      tl.to(knob, { scaleX:1,    scaleY:1,    duration:FLIP_D/2, ease:"power2.out" }, FLIP_T + FLIP_D/2);
      // mood change: accent track + full-screen dark overlay
      tl.to(trackOn, { opacity:1, duration:FLIP_D, ease:"power2.inOut" }, FLIP_T);
      tl.to(overlay, { opacity:1, duration:FLIP_D, ease:"power2.inOut" }, FLIP_T);
      // label mask-swap
      tl.to(labOff, { yPercent:-110, duration:FLIP_D, ease:"power3.inOut" }, FLIP_T);
      tl.to(labOn,  { yPercent:0,    duration:FLIP_D, ease:"power3.inOut" }, FLIP_T);
      // radial pulse ring expands ONCE where the knob lands (~1.45 → 2.05)
      tl.to(pulse, { opacity:0.85, duration:0.10, ease:"power1.out" }, 1.45);
      tl.to(pulse, { scale:2.4,    duration:0.60, ease:"power2.out" }, 1.45);
      tl.to(pulse, { opacity:0,    duration:0.45, ease:"power1.in"  }, 1.60);

      // PHASE 3 — knob settle micro-bounce (1.55 → 2.0)
      tl.to(knob, { x:TRAVEL - 8, duration:0.14, ease:"power2.out"   }, 1.55);
      tl.to(knob, { x:TRAVEL,     duration:0.31, ease:"back.out(2.5)"}, 1.69);

      // CAMERA — slow pull-back across the whole clip
      tl.to(cam, { scale:ZOOM_OUT, duration:DUR, ease:"none" }, 0);

      // hold the final frame to the end of data-duration
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
