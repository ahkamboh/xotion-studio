<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      GRAPHICS OVERLAY (3D) — three.js layer, transparent background, for compositing over a clip:
          scripts/overlay.sh base.mp4 projects/<name> out.mp4

      Library: three.js (ESM via importmap, pinned). DETERMINISTIC integration (Pattern B):
        - renderer has alpha:true + clear alpha 0  -> transparent for overlay
        - the scene is drawn inside the `hf-seek` handler as a pure function of detail.time
        - point positions come from a SEEDED PRNG at init (no Math.random at render time)
        - a minimal GSAP timeline handles the overall fade in/out (Pattern A)
      WebGL renders via Chrome (GPU if available, else SwiftShader software).
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:transparent; }
      #gl { position:absolute; inset:0; width:1920px; height:1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <canvas id="gl" width="1920" height="1080"></canvas>
    </div>

    <script type="module">
      import * as THREE from "three";

      // ---- deterministic seeded PRNG (init only) ----
      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(20260605);

      const W = 1920, H = 1080;
      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("gl"), antialias: true, alpha: true,
      });
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x000000, 0);                 // transparent

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
      camera.position.z = 6;

      // glowing icosahedron wireframe
      const geo = new THREE.IcosahedronGeometry(2.1, 1);
      const wire = new THREE.LineSegments(
        new THREE.WireframeGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0x4fd6ff, transparent: true, opacity: 0.9 })
      );
      scene.add(wire);

      const solid = new THREE.Mesh(
        geo,
        new THREE.MeshBasicMaterial({ color: 0x1a2b6b, transparent: true, opacity: 0.25 })
      );
      scene.add(solid);

      // seeded point cloud around it
      const N = 600, pos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const r = 3 + rnd() * 4, th = rnd() * Math.PI * 2, ph = Math.acos(2 * rnd() - 1);
        pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
        pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
        pos[i*3+2] = r * Math.cos(ph);
      }
      const pgeo = new THREE.BufferGeometry();
      pgeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      const points = new THREE.Points(pgeo,
        new THREE.PointsMaterial({ color: 0x8a7bff, size: 0.05, transparent: true, opacity: 0.8 }));
      scene.add(points);

      function draw(t) {                       // pure function of time => deterministic
        wire.rotation.y = t * 0.6; wire.rotation.x = t * 0.25;
        solid.rotation.copy(wire.rotation);
        points.rotation.y = -t * 0.18;
        camera.position.z = 6 + Math.sin(t * 0.7) * 0.4;
        renderer.render(scene, camera);
      }
      draw(0);
      window.addEventListener("hf-seek", (e) => draw((e.detail && e.detail.time) || 0));

      // overall fade in/out on the GSAP timeline
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#gl", { opacity: 0 });
      tl.to("#gl", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0)
        .to({}, { duration: 3.8 })
        .to("#gl", { opacity: 0, duration: 0.6, ease: "power2.in" }, 4.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
