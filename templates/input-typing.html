<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"text",      "type":"string","label":"Typed text",          "default":"example.com"},
  {"id":"speed",     "type":"string","label":"Seconds per character","default":"0.12"},
  {"id":"fontSize",  "type":"string","label":"Font size (px)",       "default":"32"},
  {"id":"zoomStart", "type":"string","label":"Zoom: initial",        "default":"2.5"},
  {"id":"zoomMax",   "type":"string","label":"Zoom: typing",         "default":"5.5"},
  {"id":"zoomEnd",   "type":"string","label":"Zoom: final",          "default":"1.5"},
  {"id":"button",    "type":"string","label":"Enter button (show/hide)","default":"show"},
  {"id":"bg",        "type":"color", "label":"Background",           "default":"#ffffff"},
  {"id":"glow",      "type":"color", "label":"Glow",                 "default":"#60a5fa"},
  {"id":"border",    "type":"color", "label":"Field border",         "default":"#e5e7eb"},
  {"id":"ink",       "type":"color", "label":"Text color",           "default":"#0a0a0a"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      INPUT TYPING — "typing into a search field" with a virtual camera.
      A pill input types out character-by-character (blinking cursor, field
      stretching as text grows) while the camera zooms in close, pans along
      the growing text, pauses, then pulls back to reveal the whole field.

      Slot-driven via data-composition-variables (works with `:cards` /
      scripts/render-batch.py — e.g. a CSV of domains → one video each):
        npx hyperframes render <proj> --variables '{"text":"xotion.studio"}'

      TIMING — the animation completes at ≈ 2.6s + 0.12s × characters, then
      HOLDS the final frame. data-duration below (4.5) fits up to ~15 chars;
      for longer text bump data-duration to (3 + 0.15 × chars).

      Determinism contract: one render(t) drives zoom + pan + typing + field
      width in perfect sync, called from a GSAP proxy tween's onUpdate on the
      paused master timeline (Pattern A) — HyperFrames seeks any frame exactly.
      No Math.random, no Date, no rAF. render(0) runs at boot so frame 0 is
      never unstyled.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Inter"; font-weight:500;
        src:url("assets/fonts/inter-500.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; }
      /* the camera: zoom/pan applied as ONE transform on this wrapper */
      .cam {
        position:absolute; left:50%; top:50%;
        will-change: transform;
      }
      .field {
        display:flex; align-items:center;
        background:#fff;
        border-radius:9999px;
        font-family:"Inter",sans-serif; font-weight:500;
        white-space:nowrap;
        position:relative;
      }
      .txt   { display:inline-block; white-space:pre; }
      .caret { display:inline-block; }
      .btn {
        border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        flex:0 0 auto;
        margin-left:auto;
        background:#0a0a0a;
      }
      .btn svg { display:block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <div class="field" id="field">
          <span class="txt" id="txt"></span><span class="caret" id="caret">|</span>
          <span class="btn" id="btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path>
            </svg>
          </span>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* ── parameters ─────────────────────────────────────────────────── */
      const TEXT   = String(V.text);
      const SPEED  = parseFloat(V.speed)     || 0.12;
      const FS     = parseFloat(V.fontSize)  || 32;
      const Z0     = parseFloat(V.zoomStart) || 2.5;
      const Z1     = parseFloat(V.zoomMax)   || 5.5;
      const Z2     = parseFloat(V.zoomEnd)   || 1.5;
      const SHOW_BTN = String(V.button) !== "hide";

      /* ── derived layout constants (spec) ────────────────────────────── */
      const CHAR_W  = FS * 0.6;            // approximate monospace-ish advance
      const PAD     = FS * 0.8;
      const MIN_W   = FS * 15;
      const BTN     = FS * 2.5 - PAD;
      const FIELD_H = FS * 2.5;
      const N       = TEXT.length;
      const FULL_TEXT_W = N * CHAR_W;

      /* ── timeline phases (spec) ─────────────────────────────────────── */
      const ZOOM_IN_END = 1.0;
      const TYPE_START  = 1.0;
      const TYPE_DUR    = N * SPEED;
      const PAN_START   = TYPE_START + 0.5;
      const PAN_DUR     = TYPE_DUR * (N > 15 ? 1.5 : 1.2);
      const PAUSE_END   = TYPE_START + TYPE_DUR + 0.3;
      const ZOOM_OUT_DUR = 1.0;
      const TOTAL       = PAUSE_END + ZOOM_OUT_DUR;

      /* ── easing (spec) ──────────────────────────────────────────────── */
      const outExpo    = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
      const inOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
      const clamp01    = t => Math.max(0, Math.min(1, t));

      /* ── static styles from variables ───────────────────────────────── */
      const root  = document.getElementById("root");
      const cam   = document.getElementById("cam");
      const field = document.getElementById("field");
      const txt   = document.getElementById("txt");
      const caret = document.getElementById("caret");
      const btn   = document.getElementById("btn");

      document.body.style.background = V.bg;
      root.style.background = V.bg;
      field.style.border = `2px solid ${V.border}`;
      field.style.boxShadow = `0 0 30px ${V.glow}4d, 0 0 60px ${V.glow}4d`;
      field.style.fontSize = FS + "px";
      field.style.height = FIELD_H + "px";
      field.style.paddingLeft = PAD + "px";
      field.style.paddingRight = (PAD * 0.4) + "px";
      field.style.color = V.ink;
      caret.style.color = V.ink;
      btn.style.width = BTN + "px";
      btn.style.height = BTN + "px";
      btn.style.display = SHOW_BTN ? "flex" : "none";
      btn.querySelector("svg").style.width  = (BTN * 0.5) + "px";
      btn.querySelector("svg").style.height = (BTN * 0.5) + "px";

      /* ── the one render(t) that keeps everything in sync ────────────── */
      function render(t) {
        // 1. zoom
        let zoom;
        if (t < ZOOM_IN_END) {
          zoom = Z0 + (Z1 - Z0) * outExpo(clamp01(t / ZOOM_IN_END));
        } else if (t < PAUSE_END) {
          zoom = Z1;
        } else {
          zoom = Z1 + (Z2 - Z1) * outExpo(clamp01((t - PAUSE_END) / ZOOM_OUT_DUR));
        }

        // 2. typing
        const chars = clamp01((t - TYPE_START) / (TYPE_DUR || 1)) * N;
        const shown = Math.min(N, Math.max(0, Math.floor((t - TYPE_START) / SPEED)));
        txt.textContent = TEXT.slice(0, shown);

        // cursor blinks while typing, hidden otherwise
        const typing = t >= TYPE_START && t <= TYPE_START + TYPE_DUR;
        caret.style.opacity = typing ? (Math.sin(t * Math.PI * 2) + 1) / 2 : 0;

        // 3. dynamic field width — visibly stretches with the text
        const typedW = shown * CHAR_W;
        const w = Math.max(MIN_W, typedW + PAD * 2 + (SHOW_BTN ? BTN : 0));
        field.style.width = w + "px";

        // 4. pan — camera tracks the growing text, then returns to center
        let panX;
        if (t < PAUSE_END) {
          const k = inOutCubic(clamp01((t - PAN_START) / PAN_DUR));
          panX = (0.75 * w) * (1 - k) + (-(FULL_TEXT_W + PAD)) * k;
        } else {
          const k = outExpo(clamp01((t - PAUSE_END) / ZOOM_OUT_DUR));
          const kPan = inOutCubic(clamp01((PAUSE_END - PAN_START) / PAN_DUR));
          const panAtPause = (0.75 * w) * (1 - kPan) + (-(FULL_TEXT_W + PAD)) * kPan;
          panX = panAtPause * (1 - k);
        }

        cam.style.transform =
          `translate(calc(-50% + ${panX.toFixed(2)}px), -50%) scale(${zoom.toFixed(4)})`;
      }

      /* ── paused master timeline; HyperFrames seeks it ───────────────── */
      const tl = gsap.timeline({ paused: true });
      const p = { t: 0 };
      tl.to(p, { t: TOTAL, duration: TOTAL, ease: "none",
                 onUpdate: () => render(p.t) }, 0);
      // hold the final frame to the end of data-duration
      tl.set({}, {}, Math.max(TOTAL, 4.5));

      render(0); // frame 0 styled immediately

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
