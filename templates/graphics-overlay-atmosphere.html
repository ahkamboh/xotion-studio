<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      GRAPHICS OVERLAY (ATMOSPHERE) — cinematic light leaks + bokeh + film grain.
      Transparent background; composite over a flat clip for instant "expensive" texture:
          scripts/overlay.sh base.mp4 projects/<name> out.mp4

      Pure canvas, DETERMINISTIC (Pattern B): everything is a function of the hf-seek time;
      grain uses a seeded PRNG re-walked per frame from a fixed seed (no Math.random/Date.now).
      Tune INTENSITY/GRAIN/leak colors below. Great over interviews, b-roll, product shots,
      or flat motion-graphics. Keep it subtle — it's seasoning, not the meal.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:transparent; }
      #fx { position:absolute; inset:0; width:1920px; height:1080px; }
      /* CSS vignette — cheap, deterministic, always on */
      .vignette { position:absolute; inset:0; pointer-events:none;
        background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.45) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <canvas id="fx" width="1920" height="1080"></canvas>
      <div class="vignette"></div>
    </div>

    <script>
      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

      const W = 1920, H = 1080;
      const cv = document.getElementById("fx");
      const ctx = cv.getContext("2d");

      // ----- tunables -----
      const INTENSITY = 1.0;     // overall leak/bokeh strength (0..1.5)
      const GRAIN     = 0.06;    // film grain amount (0..0.15)
      const LEAKS = [            // warm cinematic leaks
        { hue: 28,  x: 0.08, y: 0.15, r: 0.55, sp: 0.10 },
        { hue: 12,  x: 0.92, y: 0.85, r: 0.60, sp: -0.07 },
        { hue: 200, x: 0.80, y: 0.10, r: 0.40, sp: 0.05 },
      ];

      // seeded bokeh dots (init once)
      const seed = mulberry32(20260605);
      const B = 26, bok = [];
      for (let i = 0; i < B; i++) bok.push({
        x: seed(), y: seed(), r: 0.02 + seed()*0.06, vx:(seed()-0.5)*0.02, vy:-(0.01+seed()*0.03),
        ph: seed()*Math.PI*2, hue: 30 + seed()*30,
      });

      // reused offscreen grain buffer (allocate once, not per frame)
      const GW = W>>1, GH = H>>1;
      const gcv = document.createElement("canvas"); gcv.width=GW; gcv.height=GH;
      const gctx = gcv.getContext("2d");
      const gimg = gctx.createImageData(GW, GH);
      const A = (GRAIN*255)|0;
      for (let i = 3; i < gimg.data.length; i += 4) gimg.data[i] = A;   // alpha constant
      function drawGrain(t) {
        // re-walk a fixed seed offset by the integer frame index -> deterministic, animated
        const f = Math.round(t * 30);
        const g = mulberry32(0x9E3779B1 ^ (f * 2654435761));
        const d = gimg.data;
        for (let i = 0; i < d.length; i += 4) { const v=(g()*255)|0; d[i]=d[i+1]=d[i+2]=v; }
        gctx.putImageData(gimg, 0, 0);
        ctx.globalCompositeOperation = "overlay";
        ctx.drawImage(gcv, 0, 0, W, H);            // half-res scaled up = softer + cheaper
      }

      function draw(t) {
        ctx.clearRect(0,0,W,H);

        // light leaks (additive, slow drift)
        ctx.globalCompositeOperation = "lighter";
        for (const L of LEAKS) {
          const cx = (L.x + Math.sin(t*L.sp)*0.04) * W;
          const cy = (L.y + Math.cos(t*L.sp*1.3)*0.04) * H;
          const rr = L.r * W * (0.9 + 0.1*Math.sin(t*0.8 + L.hue));
          const a  = 0.22 * INTENSITY * (0.8 + 0.2*Math.sin(t*0.6 + L.x*6));
          const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,rr);
          grad.addColorStop(0, `hsla(${L.hue},95%,62%,${a})`);
          grad.addColorStop(1, `hsla(${L.hue},95%,62%,0)`);
          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2); ctx.fill();
        }

        // soft bokeh
        for (const p of bok) {
          let x=((p.x+p.vx*t)%1+1)%1*W, y=((p.y+p.vy*t)%1+1)%1*H;
          const rr=p.r*W, a=0.10*INTENSITY*(0.5+0.5*Math.sin(p.ph+t*0.9));
          const grad=ctx.createRadialGradient(x,y,0,x,y,rr);
          grad.addColorStop(0,`hsla(${p.hue},90%,75%,${a})`);
          grad.addColorStop(1,`hsla(${p.hue},90%,75%,0)`);
          ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(x,y,rr,0,Math.PI*2); ctx.fill();
        }

        drawGrain(t);
        ctx.globalCompositeOperation = "source-over";
      }
      draw(0);
      window.addEventListener("hf-seek", (e) => draw((e.detail && e.detail.time) || 0));

      // overall fade in/out
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#root", { opacity: 0 });
      tl.to("#root", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0)
        .to({}, { duration: 4.0 })
        .to("#root", { opacity: 0, duration: 0.5, ease: "power2.in" }, 4.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
