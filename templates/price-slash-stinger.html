<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"productName",   "type":"string","label":"Product name",                         "default":"Xotion Pro · Lifetime"},
  {"id":"productImage",  "type":"image", "label":"Product image (path; blank = gradient placeholder)", "default":""},
  {"id":"oldPrice",      "type":"string","label":"Old price (number only)",               "default":"199"},
  {"id":"newPrice",      "type":"string","label":"New price (number only)",               "default":"79"},
  {"id":"discountLabel", "type":"string","label":"Discount badge text",                   "default":"60% OFF"},
  {"id":"currencySymbol","type":"string","label":"Currency symbol",                       "default":"$"},
  {"id":"ctaText",       "type":"string","label":"CTA pill text",                         "default":"Grab it now"},
  {"id":"badgeColor",    "type":"color", "label":"Badge / accent color",                  "default":"#ff3b30"},
  {"id":"bg",            "type":"color", "label":"Background",                            "default":"#0d0d12"},
  {"id":"ink",           "type":"color", "label":"Primary text color",                   "default":"#ffffff"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      PRICE-SLASH STINGER — the core ad-creative beat for TikTok Shop / DTC /
      dropshipping. A product card sits center-stage; the OLD price punches in,
      a diagonal SLASH draws across it as it greys and tilts, the NEW price
      STAMPS down with a screen-shake, a starburst DISCOUNT badge spins in
      behind the new price, and a CTA pill pulses on a finite loop for the hold.

      Designed defaults are Xotion-flavored ("Xotion Pro · Lifetime", $199 → $79,
      60% OFF). productImage is an IMAGE variable: if a path is given an <img>
      uses it, otherwise a designed CSS-gradient placeholder (initial of the
      product name on a brand-tinted gradient) renders — so the DEFAULT needs
      zero asset files.

      Slot-driven via data-composition-variables (CSV-batch friendly — price /
      discount / name fields make this a natural :cards template):
        npx hyperframes render <proj> --variables \
          '{"productName":"Sonic Toothbrush","oldPrice":"129","newPrice":"49","discountLabel":"62% OFF","badgeColor":"#7c3aed"}'

      ── CHOREOGRAPHY (phase table) ───────────────────────────────────────────
      data-duration 7.0 — motion runs ~5.4s, then the CTA-pulse loop fills the
      loop-friendly hold to 7.0s. The pulse is a FINITE repeat (no repeat:-1).

      phase | start–end (s) | easing             | what moves
      ------|---------------|--------------------|----------------------------------------------
       0    | 0.00–0.20     | (hold)             | anticipation: card + name visible at rest;
            |               |                    |   old price, slash, new price, badge, CTA hidden
       1    | 0.20–0.70     | back.out(2.2)      | OLD price punches in (scale 1.55→1, y-30→0)
       2a   | 0.95–1.50     | power3.inOut       | diagonal SLASH line draws across (scaleX 0→1)
       2b   | 1.05–1.55     | power2.out         | old price greys (→#7a7a86) + tilts (rot 0→-7°)
            |               |                    |   + sinks/shrinks (y0→14, scale1→0.82)
       3a   | 1.70–2.28     | back.out(2.6)      | NEW price stamps DOWN (scale 2.3→1, y-46→0)
       3b   | 1.70–2.06     | (proxy shake)      | card screen-shake on the stamp (hand-coded
            |               |                    |   decaying x/y table, settles to 0)
       4a   | 2.10–2.92     | back.out(1.7)      | starburst BADGE spins in behind new price
            |               |                    |   (scale 0→1, rotate -130°→0)
       4b   | 2.35–2.80     | power3.out         | badge label fades+rises in (opacity, y10→0)
       5    | 3.05–3.55     | power3.out         | CTA pill rises in (y40→0, opacity, scale.9→1)
       loop | 3.65–7.00     | sine.inOut ×N      | CTA pill PULSES (scale 1→1.045, finite repeat)
            |               |                    |   + arrow nudges; card has a slow idle breathe
       all  | 0.00–7.00     | none               | slow camera push-in (scale 1.0→1.035)

      Determinism contract: ONE paused master timeline. Discrete beats are GSAP
      tweens; the screen-shake is a proxy {k} whose onUpdate reads a HAND-CODED
      decaying offset table (NO Math.random, NO Date, NO rAF, NO CSS
      transitions/@keyframes, finite repeats only). The 16-ray starburst is built
      at construction time (loop runs once at build, never inside a callback).
      Every animated element gets its opening state via gsap.set before frame 0,
      and render-time text (prices) is written into the DOM at construction.
      Variable-length safe: prices/labels/CTA size their containers to content
      (max-width + wrapping, no hard-coded boxes), so longer strings never clip.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Anton — heavy condensed display for the prices + CTA (stinger energy).
         Archivo 700/800 — product name, discount label, supporting text. */
      @font-face { font-family:"Anton"; font-weight:400;
        src:url("assets/fonts/anton-400.ttf") format("truetype"); }
      @font-face { font-family:"Archivo"; font-weight:700;
        src:url("assets/fonts/archivo-700.ttf") format("truetype"); }
      @font-face { font-family:"Archivo"; font-weight:800;
        src:url("assets/fonts/archivo-800.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; }

      /* camera: ONE transform on this wrapper (gsap owns it) */
      .cam { position:absolute; left:50%; top:50%; will-change:transform; }

      /* the card that gets shaken — a column of product art + price block */
      .card {
        position:relative;
        display:flex; flex-direction:column; align-items:center;
        gap:34px; padding:8px 40px;
        font-family:"Archivo",sans-serif;
        will-change:transform;
      }

      /* product art — fixed-frame, content fits to it. Default = gradient. */
      .art {
        position:relative; width:300px; height:300px; border-radius:38px;
        overflow:hidden; display:flex; align-items:center; justify-content:center;
        box-shadow:0 30px 80px rgba(0,0,0,0.45), 0 6px 20px rgba(0,0,0,0.35);
      }
      .art img { width:100%; height:100%; object-fit:cover; display:block; }
      .artFallback {
        position:absolute; inset:0;
        display:flex; align-items:center; justify-content:center;
        font-family:"Anton",sans-serif; font-weight:400;
        font-size:150px; color:rgba(255,255,255,0.92);
        letter-spacing:0.02em;
      }

      .name {
        font-weight:800; font-size:42px; letter-spacing:-0.01em;
        text-align:center; max-width:760px; line-height:1.12;
        position:relative; z-index:3;   /* always above the badge */
      }

      /* price row — old + new sit side by side, content-sized (no fixed box) */
      .priceRow {
        position:relative;
        display:flex; align-items:flex-end; justify-content:center;
        gap:46px; min-height:170px;
      }
      .priceCol { position:relative; display:flex; align-items:flex-end; }

      /* old price + the slash that strikes it (slash anchored over this box) */
      .oldWrap { position:relative; display:inline-flex; align-items:flex-end;
        transform-origin:center center; will-change:transform; }
      .old {
        font-family:"Anton",sans-serif; font-weight:400;
        font-size:96px; line-height:0.92; letter-spacing:0.005em;
        white-space:nowrap; display:inline-flex; align-items:flex-start;
      }
      .old .cur { font-size:54px; margin-right:4px; transform:translateY(8px); }
      .slash {
        position:absolute; left:-10%; top:50%; width:120%; height:10px;
        border-radius:6px; transform-origin:left center;
        will-change:transform;
      }

      /* new price — the hero scale moment */
      .new {
        position:relative;
        font-family:"Anton",sans-serif; font-weight:400;
        font-size:208px; line-height:0.86; letter-spacing:0.005em;
        white-space:nowrap; display:inline-flex; align-items:flex-start;
        transform-origin:center center; will-change:transform;
      }
      .new .cur { font-size:108px; margin-right:8px; transform:translateY(14px); }

      /* starburst badge — sits BEHIND the new price (top-right of it) */
      .badge {
        position:absolute; left:50%; top:50%;
        width:300px; height:300px;
        pointer-events:none; will-change:transform; z-index:0;
      }
      .badge svg { display:block; width:100%; height:100%;
        filter:drop-shadow(0 14px 34px rgba(0,0,0,0.4)); }
      /* label is clipped to the white inner ring of the 300px starburst.
         The ring radius is (rIn-8)=104px → inner diameter ~208px; we keep a
         small inset so descenders/letters never touch the ring. The font-size
         is AUTO-FIT at build time (see fitBadgeLabel) so a long discount label
         shrinks + wraps to fit instead of breaking mid-word / spilling onto
         the green points. The box is a square sized to the inner circle, so
         it can never overflow the starburst. */
      .badgeLabel {
        position:absolute; left:50%; top:50%;
        transform:translate(-50%,-50%);
        width:188px; height:188px;
        display:flex; align-items:center; justify-content:center;
        overflow:hidden;
        font-family:"Archivo",sans-serif; font-weight:800;
        font-size:50px; letter-spacing:0.01em; line-height:1.02;
        text-align:center;
        color:#ffffff; will-change:transform,opacity;
      }
      .badgeLabel span {
        display:block; max-width:188px;
        overflow-wrap:break-word; word-break:normal; hyphens:none;
        text-wrap:balance;
      }
      .priceCol { z-index:1; }   /* prices paint above the badge */

      /* CTA pill — pulses for the loop hold */
      .cta {
        display:inline-flex; align-items:center; gap:18px;
        padding:30px 56px; border-radius:9999px;
        font-family:"Anton",sans-serif; font-weight:400;
        font-size:54px; letter-spacing:0.03em; white-space:nowrap;
        max-width:1100px; will-change:transform;
      }
      .cta .ctaTxt { display:inline-block; line-height:1; padding-top:6px;
        overflow:hidden; text-overflow:ellipsis; }
      .cta svg { display:block; width:42px; height:42px; flex:0 0 auto;
        will-change:transform; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.0" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <div class="card" id="card">
          <div class="art" id="art">
            <div class="artFallback" id="artFallback"></div>
          </div>
          <div class="name" id="name"></div>

          <div class="priceRow">
            <div class="priceCol">
              <div class="oldWrap" id="oldWrap">
                <span class="old" id="old"></span>
                <span class="slash" id="slash"></span>
              </div>
            </div>
            <div class="priceCol">
              <!-- badge sits behind the new price (z-index:0); built before it
                   so it paints under, anchored to the new-price column -->
              <div class="badge" id="badge">
                <svg viewBox="0 0 300 300" id="badgeSvg" aria-hidden="true"></svg>
                <div class="badgeLabel" id="badgeLabel"><span id="badgeLabelTxt"></span></div>
              </div>
              <span class="new" id="new"></span>
            </div>
          </div>

          <div class="cta" id="cta">
            <span class="ctaTxt" id="ctaTxt"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                 stroke-linecap="round" stroke-linejoin="round" id="ctaArrow">
              <path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize hex so 2-digit alpha can be appended safely */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}
      const ACCENT = hex6(V.badgeColor);
      const INK    = hex6(V.ink);

      /* ── elements ───────────────────────────────────────────────────── */
      const root        = document.getElementById("root");
      const cam         = document.getElementById("cam");
      const card        = document.getElementById("card");
      const art         = document.getElementById("art");
      const artFallback = document.getElementById("artFallback");
      const nameEl      = document.getElementById("name");
      const oldWrap     = document.getElementById("oldWrap");
      const oldEl       = document.getElementById("old");
      const slash       = document.getElementById("slash");
      const newEl       = document.getElementById("new");
      const badge       = document.getElementById("badge");
      const badgeSvg    = document.getElementById("badgeSvg");
      const badgeLabel  = document.getElementById("badgeLabel");
      const badgeLabelTxt = document.getElementById("badgeLabelTxt");
      const cta         = document.getElementById("cta");
      const ctaTxt      = document.getElementById("ctaTxt");
      const ctaArrow    = document.getElementById("ctaArrow");

      /* ── content (written at construction time) ─────────────────────── */
      const CUR   = String(V.currencySymbol || "$");
      const OLDP  = String(V.oldPrice);
      const NEWP  = String(V.newPrice);
      const PNAME = String(V.productName);

      nameEl.textContent     = PNAME;
      ctaTxt.textContent     = String(V.ctaText);
      badgeLabelTxt.textContent = String(V.discountLabel);
      oldEl.innerHTML = `<span class="cur">${CUR}</span>${OLDP}`;
      newEl.innerHTML = `<span class="cur">${CUR}</span>${NEWP}`;

      /* ── product image: <img> if a path is given, else gradient fallback ─ */
      const imgPath = String(V.productImage || "").trim();
      if (imgPath) {
        const img = document.createElement("img");
        img.src = imgPath;
        img.alt = PNAME;
        // img painted over the fallback; fallback stays as a backdrop while loading
        art.insertBefore(img, artFallback);
      } else {
        const m = PNAME.match(/[A-Za-z0-9]/);
        artFallback.textContent = (m ? m[0] : "X").toUpperCase();
      }
      // designed gradient backdrop derived from the accent (brand-tinted)
      art.style.background =
        `linear-gradient(145deg, ${ACCENT} 0%, ${ACCENT}b3 42%, #1a1a22 118%)`;

      /* ── static styles from variables ───────────────────────────────── */
      document.body.style.background = V.bg;
      root.style.background = V.bg;
      nameEl.style.color = INK;
      newEl.style.color  = INK;
      oldEl.style.color  = INK;                 // starts white, greys in phase 2
      slash.style.background = ACCENT;
      slash.style.boxShadow  = `0 4px 16px ${ACCENT}66`;
      cta.style.background = ACCENT;
      cta.style.color = "#ffffff";
      cta.style.boxShadow = `0 22px 60px ${ACCENT}59, 0 6px 18px ${ACCENT}40`;
      newEl.style.textShadow = `0 18px 50px ${ACCENT}40`;

      /* ── 16-ray starburst badge — built ONCE at construction time ────── */
      (function buildStarburst(){
        const cx = 150, cy = 150, rays = 16;
        const rOut = 148, rIn = 112;
        let d = "";
        for (let i = 0; i < rays * 2; i++) {
          const r = (i % 2 === 0) ? rOut : rIn;
          const a = (Math.PI / rays) * i - Math.PI / 2;
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r;
          d += (i === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2) + " ";
        }
        d += "Z";
        const ns = "http://www.w3.org/2000/svg";
        const star = document.createElementNS(ns, "path");
        star.setAttribute("d", d);
        star.setAttribute("fill", ACCENT);
        const ring = document.createElementNS(ns, "circle");
        ring.setAttribute("cx", cx); ring.setAttribute("cy", cy);
        ring.setAttribute("r", rIn - 8);
        ring.setAttribute("fill", "none");
        ring.setAttribute("stroke", "#ffffff");
        ring.setAttribute("stroke-width", "4");
        ring.setAttribute("stroke-opacity", "0.85");
        badgeSvg.appendChild(star);
        badgeSvg.appendChild(ring);
      })();

      /* ── hand-coded screen-shake table (decaying; no randomness) ─────── */
      /* sampled at k in [0,1]; offsets in px, alternating sign, decaying */
      const SHAKE = [
        { k:0.00, x:  0, y:  0 },
        { k:0.12, x: 26, y:-14 },
        { k:0.26, x:-22, y: 12 },
        { k:0.40, x: 16, y: -9 },
        { k:0.55, x:-11, y:  7 },
        { k:0.70, x:  7, y: -4 },
        { k:0.85, x: -3, y:  2 },
        { k:1.00, x:  0, y:  0 }
      ];
      function shakeAt(k){
        k = Math.max(0, Math.min(1, k));
        for (let i = 0; i < SHAKE.length - 1; i++){
          const a = SHAKE[i], b = SHAKE[i+1];
          if (k <= b.k){
            const f = (k - a.k) / (b.k - a.k);
            return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
          }
        }
        return { x:0, y:0 };
      }

      /* ── timing constants (phase table above) ───────────────────────── */
      const DUR = 7.0;
      const SHAKE_START = 1.70, SHAKE_DUR = 0.36;

      /* ── initial states — frame 0 is the correct opening state ───────── */
      gsap.set(cam,  { xPercent:-50, yPercent:-50, scale:1.0 });
      gsap.set(card, { x:0, y:0, scale:1, transformOrigin:"center center" });
      // phase 0: card art + name at rest, EVERYTHING else hidden
      gsap.set(oldWrap, { opacity:0, y:-30, scale:1.55, rotation:0 });
      gsap.set(slash,   { scaleX:0, opacity:1 });
      gsap.set(newEl,   { opacity:0, y:-46, scale:2.3 });
      gsap.set(badge,   { opacity:0, scale:0, rotation:-130, xPercent:-50, yPercent:-50 });
      // The badge floats clear off the TOP-RIGHT of the new price. It is
      // anchored at the price column's center (left:50%/top:50%); we offset
      // its CENTER to sit a fixed clearance to the right of the price box's
      // RIGHT EDGE — so a 3-digit (or longer) price pushes the badge further
      // out and is NEVER occluded. Computed from the MEASURED price width,
      // lazily inside the first onUpdate and cached once fonts have loaded
      // (re-measured each update until then) — never hard-coded to "$79".
      gsap.set(badgeLabel, { opacity:0, y:10 });
      gsap.set(cta, { opacity:0, y:40, scale:0.9 });

      /* ── proxy for the screen-shake ─────────────────────────────────── */
      const shake = { k:0 };
      function applyShake(){
        const o = shakeAt(shake.k);
        gsap.set(card, { x:o.x, y:o.y });
      }

      /* ── lazy geometry: auto-fit the label + anchor the badge ────────── */
      /* These read measured layout, so they're computed lazily inside the
         first onUpdate and re-run until document.fonts is loaded (then
         cached). A proxy {t} drives geom() once per frame — a pure function
         of nothing time-varying, so every seeked frame is identical once
         fonts are ready (no RNG, no Date, no rAF). */
      const BADGE_BOX = 300;          // .badge width/height in px
      const LABEL_BOX = 188;          // .badgeLabel inner square (inside the ring)
      const BADGE_GAP = 26;           // clearance from the price's right edge to badge center-left
      const BADGE_RISE = 96;          // how far the badge center floats above the price center

      // Shrink the discount label until it fits the inner circle without
      // breaking mid-word or overflowing. Pure measurement loop — no clipping.
      function fitBadgeLabel(){
        let size = 50;                 // start at the design size
        badgeLabel.style.fontSize = size + "px";
        // shrink while the wrapped text exceeds the inner square in either
        // axis. The inner span is max-width:LABEL_BOX, so scrollWidth>LABEL_BOX
        // means a single unbreakable word is too wide; offsetHeight is the
        // wrapped block height. Floor at 14px so even a very long label fits.
        let guard = 0;
        while (guard++ < 80 &&
               (badgeLabelTxt.scrollWidth  > LABEL_BOX + 0.5 ||
                badgeLabelTxt.offsetHeight  > LABEL_BOX + 0.5) &&
               size > 14){
          size -= 1;
          badgeLabel.style.fontSize = size + "px";
        }
      }

      // Anchor the badge so its CENTER sits BADGE_GAP to the right of the
      // price box's right edge (and BADGE_RISE above center). priceCol is
      // content-sized, so newEl.offsetWidth is the true price width; half of
      // it is the distance from priceCol center to the price's right edge.
      function layoutBadge(){
        const half = newEl.offsetWidth / 2;
        const ml = half + BADGE_GAP + BADGE_BOX / 2;   // priceCol-center → badge-center
        badge.style.marginLeft = ml.toFixed(1) + "px";
        badge.style.marginTop  = (-BADGE_RISE).toFixed(1) + "px";
      }

      let geomCached = false;
      function geom(){
        if (geomCached) return;
        fitBadgeLabel();
        layoutBadge();
        if (document.fonts && document.fonts.status === "loaded") geomCached = true;
      }
      const geomProxy = { t:0 };

      /* ── paused master timeline; HyperFrames seeks it ───────────────── */
      const tl = gsap.timeline({ paused:true });

      // geometry pass: runs every frame until fonts load, then caches.
      tl.to(geomProxy, { t:1, duration:DUR, ease:"none", onUpdate:geom }, 0);

      // slow camera push across the whole clip
      tl.fromTo(cam, { scale:1.0 }, { scale:1.035, duration:DUR, ease:"none" }, 0);

      // PHASE 1 — old price punches in
      tl.to(oldWrap, { opacity:1, y:0, scale:1, duration:0.5, ease:"back.out(2.2)" }, 0.20);

      // PHASE 2a — slash draws across
      tl.to(slash, { scaleX:1, duration:0.55, ease:"power3.inOut" }, 0.95);
      // PHASE 2b — old price greys, tilts, sinks + shrinks as it's struck
      tl.to(oldEl,  { color:"#7a7a86", duration:0.5, ease:"power2.out" }, 1.05);
      tl.to(oldWrap,{ rotation:-7, y:14, scale:0.82, duration:0.5, ease:"power2.out" }, 1.05);

      // PHASE 3a — new price STAMPS down
      tl.fromTo(newEl, { opacity:0, y:-46, scale:2.3 },
                       { opacity:1, y:0, scale:1, duration:0.58, ease:"back.out(2.6)",
                         immediateRender:false }, 1.70);
      // PHASE 3b — screen-shake on the stamp (proxy 0→1)
      tl.fromTo(shake, { k:0 }, { k:1, duration:SHAKE_DUR, ease:"none",
                                  onUpdate:applyShake, immediateRender:false }, SHAKE_START);

      // PHASE 4a — starburst badge spins in behind the new price
      tl.fromTo(badge, { opacity:0, scale:0, rotation:-130 },
                       { opacity:1, scale:1, rotation:0, duration:0.82, ease:"back.out(1.7)",
                         immediateRender:false }, 2.10);
      // PHASE 4b — badge label fades + rises in
      tl.fromTo(badgeLabel, { opacity:0, y:10 },
                            { opacity:1, y:0, duration:0.45, ease:"power3.out",
                              immediateRender:false }, 2.35);

      // PHASE 5 — CTA pill rises in
      tl.fromTo(cta, { opacity:0, y:40, scale:0.9 },
                     { opacity:1, y:0, scale:1, duration:0.5, ease:"power3.out",
                       immediateRender:false }, 3.05);

      // LOOP HOLD — CTA pulse (FINITE repeat) + arrow nudge + slow card breathe.
      // half-cycle 0.46s, yoyo → full cycle 0.92s; repeat:7 (8 plays) ≈ 3.3s,
      // covering 3.65→~6.97. Never repeat:-1.
      const pulseHalf = 0.46;
      tl.to(cta, { scale:1.045, duration:pulseHalf, ease:"sine.inOut",
                   yoyo:true, repeat:7 }, 3.65);
      tl.to(ctaArrow, { x:8, duration:pulseHalf, ease:"sine.inOut",
                        yoyo:true, repeat:7 }, 3.65);
      // card breathe during the hold (subtle, finite)
      tl.to(card, { scale:1.012, duration:0.9, ease:"sine.inOut",
                    yoyo:true, repeat:1 }, 3.65);

      // pad the hold to the full data-duration
      tl.set({}, {}, DUR);

      applyShake();  // frame 0 shake = 0
      geom();        // lay out badge + fit label at construction (re-runs/caches once fonts load)
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
