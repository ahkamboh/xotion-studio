<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      GRAPHICS OVERLAY (AURORA) — flowing northern-lights ribbons driven by NOISE.
      Transparent background; composite with: scripts/overlay.sh base.mp4 projects/<name> out.mp4

      Borrows the idea behind @remotion/noise: organic motion via a deterministic value-noise
      field instead of robotic linear tweens. Pattern B (hf-seek clock). Fully deterministic:
      the noise permutation is seeded once; every frame is a pure function of time. Tune RIBBONS,
      colors, and FLOW below. Beautiful over flat skies, dark scenes, intros, ambient backgrounds.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:transparent; }
      #fx { position:absolute; inset:0; width:1920px; height:1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <canvas id="fx" width="1920" height="1080"></canvas>
    </div>

    <script>
      // ---------- deterministic value noise (seeded, smooth) ----------
      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const seed = mulberry32(20260605);
      const perm = new Float32Array(512);
      for (let i = 0; i < 512; i++) perm[i] = seed();        // random gradients table
      const fade = x => x*x*x*(x*(x*6-15)+10);
      const lerp = (a,b,t) => a+(b-a)*t;
      function noise2(x, y) {                                  // smooth 2D value noise in [0,1]
        const xi = Math.floor(x)&255, yi = Math.floor(y)&255;
        const xf = x-Math.floor(x), yf = y-Math.floor(y);
        const tl = perm[(xi+perm[yi&255]*257|0)&511];
        const tr = perm[(xi+1+perm[yi&255]*257|0)&511];
        const bl = perm[(xi+perm[(yi+1)&255]*257|0)&511];
        const br = perm[(xi+1+perm[(yi+1)&255]*257|0)&511];
        const u = fade(xf), v = fade(yf);
        return lerp(lerp(tl,tr,u), lerp(bl,br,u), v);
      }

      const W = 1920, H = 1080, ctx = document.getElementById("fx").getContext("2d");

      // ---------- tunables ----------
      const FLOW = 0.16;        // horizontal scroll speed of the field
      const RIBBONS = [
        { baseY: 0.40, amp: 0.10, freq: 1.6, hue: 158, sp: 0.9, seedOff: 0  },  // teal-green
        { baseY: 0.52, amp: 0.14, freq: 1.1, hue: 196, sp: 0.7, seedOff: 30 },  // cyan-blue
        { baseY: 0.62, amp: 0.11, freq: 2.0, hue: 268, sp: 1.2, seedOff: 70 },  // violet
      ];

      function ribbonY(R, nx, t) {
        // vertical position from noise — organic, non-repeating
        const n = noise2(nx*R.freq + R.seedOff, t*R.sp*0.25 + R.seedOff);
        return (R.baseY + (n-0.5)*R.amp*2) * H;
      }

      function draw(t) {
        ctx.clearRect(0,0,W,H);
        ctx.globalCompositeOperation = "lighter";
        const STEP = 12;
        for (const R of RIBBONS) {
          // build the ribbon's top edge as a noise curve, fill a soft vertical band under it
          ctx.beginPath();
          ctx.moveTo(0, H);
          for (let px = 0; px <= W; px += STEP) {
            const nx = px / W * 3 + t * FLOW;
            ctx.lineTo(px, ribbonY(R, nx, t));
          }
          ctx.lineTo(W, H); ctx.closePath();
          const cy = R.baseY * H;
          const grad = ctx.createLinearGradient(0, cy - 0.22*H, 0, cy + 0.30*H);
          grad.addColorStop(0,   `hsla(${R.hue},90%,62%,0)`);
          grad.addColorStop(0.45,`hsla(${R.hue},90%,62%,0.20)`);
          grad.addColorStop(1,   `hsla(${R.hue},90%,55%,0)`);
          ctx.fillStyle = grad; ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";
      }
      draw(0);
      window.addEventListener("hf-seek", (e) => draw((e.detail && e.detail.time) || 0));

      // overall fade in/out
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#fx", { opacity: 0 });
      tl.to("#fx", { opacity: 1, duration: 0.7, ease: "power2.out" }, 0)
        .to({}, { duration: 3.6 })
        .to("#fx", { opacity: 0, duration: 0.7, ease: "power2.in" }, 4.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
