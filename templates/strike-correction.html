<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"originalText",     "type":"string","label":"Claim line (the word to strike must appear verbatim)","default":"AI video editing is expensive"},
  {"id":"struckWord",       "type":"string","label":"Word(s) in the line to strike through",              "default":"expensive"},
  {"id":"replacementWord",  "type":"string","label":"Marker replacement word stamped above",              "default":"effortless"},
  {"id":"struckWord2",      "type":"string","label":"2nd word to strike (only if correctionCount=2)",      "default":"effortless"},
  {"id":"replacementWord2", "type":"string","label":"2nd marker replacement (only if correctionCount=2)",  "default":"free"},
  {"id":"correctionCount",  "type":"string","label":"How many corrections (1 or 2)",                       "default":"2"},
  {"id":"strikeColor",      "type":"color", "label":"Strike line / underline marker",                      "default":"#ef4444"},
  {"id":"replacementColor", "type":"color", "label":"Replacement marker ink",                              "default":"#ef4444"},
  {"id":"markerFont",       "type":"string","label":"Marker font (caveat | bricolage | unbounded)",        "default":"caveat"},
  {"id":"bg",               "type":"color", "label":"Background",                                          "default":"#fbfaf7"},
  {"id":"ink",              "type":"color", "label":"Claim text color",                                    "default":"#14110e"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      STRIKE-THROUGH CORRECTION — the direct-response "expensive → affordable"
      reframe beat. A clean claim line sits centered; a HAND-DRAWN marker strike
      sweeps through the target word (which desaturates to gray and sinks), then
      the replacement word STAMPS in above it in marker type with a rotation snap
      and a landing squash, finished by a marker underline swipe. An optional
      SECOND correction (correctionCount=2) re-runs the beat on the freshly
      stamped word — the classic "expensive → effortless → FREE" escalation.

      Slot-driven via data-composition-variables:
        originalText     — the full claim; struckWord must appear in it verbatim.
        struckWord       — the substring to strike (matched case-insensitively).
        replacementWord  — stamped above the struck word in marker type.
        struckWord2 /
        replacementWord2 — second beat; struckWord2 defaults to the first
                           replacement so "expensive → effortless → free" chains.
        correctionCount  — "1" (single correction) or "2" (escalating double).
        strikeColor      — marker strike + underline ink.
        replacementColor — stamped replacement ink (often == strikeColor).
        markerFont       — caveat (handwritten marker) | bricolage | unbounded.

      The claim is split into <span> word tokens at construction; the target word
      gets a grid-stacked mask cell sized to MAX(original, replacement) so the
      stamped word never clips and the line never reflows when it desaturates.
      Long claims wrap (max-width 1500px, centered) — nothing hard-coded to the
      default copy's width.

      ── PHASE TABLE (DUR = 7.0s; final frame holds, loop-friendly) ──
      phase                         | start–end (s) | easing              | what moves
      0  opening hold               | 0.00–0.45     | (static)            | full claim visible at frame 0, target at full weight
      1  strike draw                | 0.45–1.10     | power2.inOut (proxy)| marker strike line draws L→R through target word
      2  target dims + sinks        | 0.85–1.30     | power1.out          | target desaturates → gray, y+10, opacity→.42
      3  replacement stamp          | 1.30–1.78     | back.out(2.4)+squash| replacement slams in above (rot -8°→0°, scaleY squash, overshoot)
      4  underline swipe            | 1.72–2.10     | power2.out          | marker underline draws under replacement, tiny settle
      5  (count=2) 2nd strike       | 2.50–3.10     | power2.inOut (proxy)| strike draws through the stamped replacement
      6  (count=2) 2nd dim + stamp  | 2.95–3.85     | power1.out / back   | replacement2 stamps above, underline2 swipes
      7  loop-friendly hold         | end→7.00      | sine idle (finite)  | corrected line breathes (subtle scale 1↔1.012)
      ·  camera re-balance        | 1.30 / 3.10   | power2.inOut        | as the stack grows upward, the camera drifts DOWN so the busy final frame stays vertically centered (frame 0 stays centered)

      DETERMINISM CONTRACT: ONE paused master timeline. The two marker strikes +
      both underlines are per-frame stroke reveals driven by proxy tweens whose
      onUpdate sets each marker path's clip-width (Pattern A); all discrete moves
      (dim, stamp, settle) are normal GSAP tweens on the SAME timeline. NO
      Math.random / Date / rAF / setTimeout / CSS transitions / @keyframes /
      infinite repeats — the idle breathe is a finite yoyo. ALL DOM (word tokens,
      both marker layers, both replacements) built at construction; every animated
      element gets its gsap.set initial state so frame 0 is the correct opening.
      The hand-drawn marker is an inline SVG with a fixed (non-random) wobble path
      revealed by an animated clip-rect width — pure function of the proxy value.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Jakarta"; font-weight:800;
        src:url("assets/fonts/plus-jakarta-sans-800.ttf") format("truetype"); }
      @font-face { font-family:"Jakarta"; font-weight:700;
        src:url("assets/fonts/plus-jakarta-sans-700.ttf") format("truetype"); }
      @font-face { font-family:"Caveat"; font-weight:700;
        src:url("assets/fonts/caveat-700.ttf") format("truetype"); }
      @font-face { font-family:"Bricolage"; font-weight:800;
        src:url("assets/fonts/bricolage-grotesque-800.ttf") format("truetype"); }
      @font-face { font-family:"Unbounded"; font-weight:800;
        src:url("assets/fonts/unbounded-800.ttf") format("truetype"); }

      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; }

      .cam { position:absolute; left:50%; top:50%; will-change:transform; }

      .stage {
        position:relative;
        width:1500px; max-width:1500px;
        display:flex; flex-wrap:wrap;
        align-items:flex-end; justify-content:center;
        gap:0 22px;
        font-family:"Jakarta",sans-serif; font-weight:800;
        font-size:112px; line-height:1.34; letter-spacing:-0.025em;
        text-align:center;
      }
      .word { display:inline-block; white-space:nowrap; }

      /* the target cell: grid-stack so the struck word and the stamped
         replacement share one footprint sized to the WIDER of the two — the
         line never reflows, the stamp never clips. */
      .target {
        position:relative; display:inline-grid;
        justify-items:center; align-items:end;
      }
      .target > * { grid-area:1 / 1; }

      .struck { display:inline-block; white-space:nowrap; will-change:transform,opacity,filter; }

      /* the hand-drawn marker strike: an SVG sized to the struck word, revealed
         by an animated clip width (set per frame). */
      .strikeWrap {
        position:absolute; left:50%; top:50%;
        transform:translate(-50%,-50%);
        pointer-events:none;
      }
      .strikeWrap svg { display:block; overflow:visible; }

      /* the stamped replacement marker word, parked ABOVE the struck word.
         NOT white-space:nowrap — a multi-word replacement ("completely free")
         must be allowed to WRAP rather than overflow the stage. max-width is set
         in measure() to the largest box that still fits inside the 1920 canvas
         from the struck word's clamped center, so the marker word never clips. */
      .replacement {
        position:absolute; left:50%;
        white-space:normal; text-align:center; word-break:normal; overflow-wrap:break-word;
        will-change:transform,opacity;
        transform-origin:50% 100%;
      }
      .replacement .underWrap { position:absolute; left:50%; transform:translateX(-50%); pointer-events:none; }
      .replacement .underWrap svg { display:block; overflow:visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.0" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <div class="stage" id="stage"></div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize hex so 2-digit alpha can be appended safely */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}

      const STRIKE_C  = hex6(V.strikeColor);
      const REPL_C    = hex6(V.replacementColor);
      const INK       = String(V.ink);
      const COUNT     = (parseInt(V.correctionCount, 10) === 1) ? 1 : 2;
      const MARKER_MAP = { caveat:"Caveat", bricolage:"Bricolage", unbounded:"Unbounded" };
      const MARKER_FONT = MARKER_MAP[String(V.markerFont).toLowerCase()] || "Caveat";
      /* Caveat is condensed/tall, so it wants a larger size to read at claim weight */
      const MARKER_SCALE = (MARKER_FONT === "Caveat") ? 1.26 : 0.92;

      const ORIGINAL = String(V.originalText);
      const STRUCK   = String(V.struckWord).trim();
      const REPL      = String(V.replacementWord).trim();
      const STRUCK2  = String(V.struckWord2).trim()      || REPL;
      const REPL2     = String(V.replacementWord2).trim() || REPL;

      const root  = document.getElementById("root");
      const cam   = document.getElementById("cam");
      const stage = document.getElementById("stage");

      document.body.style.background = V.bg;
      root.style.background = V.bg;
      stage.style.color = INK;

      /* ── tokenize the claim, locating the (first) struck word ──────────── */
      /* split on spaces but keep the struck word as a single token even if
         it contains spaces; match case-insensitively against the trimmed claim */
      function buildTokens(text, target){
        const lc = text.toLowerCase();
        const tlc = target.toLowerCase();
        const idx = tlc ? lc.indexOf(tlc) : -1;
        if (idx < 0) {
          // target not found — whole line is plain words, no correction target
          return { before:text.split(/\s+/).filter(Boolean), hit:null, after:[] };
        }
        const before = text.slice(0, idx).split(/\s+/).filter(Boolean);
        const hit    = text.substr(idx, target.length);
        const after  = text.slice(idx + target.length).split(/\s+/).filter(Boolean);
        return { before, hit, after };
      }

      const tok = buildTokens(ORIGINAL, STRUCK);

      /* build a plain word span */
      function wordSpan(w){
        const s = document.createElement("span");
        s.className = "word";
        s.textContent = w;
        return s;
      }

      /* ── hand-drawn marker stroke SVG (fixed, non-random wobble) ───────── */
      /* ALL nodes are built at construction; size() reshapes via ATTRIBUTE
         updates only (no node creation) once we can measure the word; reveal()
         drives a clip rect so the marker draws L→R as a pure fn of the proxy. */
      let strokeUID = 0;
      function makeStroke(color){
        const id = "clip" + (strokeUID++);
        const wrap = document.createElement("div");
        wrap.className = "strikeWrap";
        wrap.innerHTML =
          `<svg width="10" height="10" viewBox="0 0 10 10">
             <defs><clipPath id="${id}"><rect x="0" y="0" width="0" height="10"></rect></clipPath></defs>
             <path fill="none" stroke="${color}" stroke-width="8"
                   stroke-linecap="round" clip-path="url(#${id})"></path>
           </svg>`;
        const svg = wrap.querySelector("svg");
        const path = wrap.querySelector("path");
        const clipRect = wrap.querySelector("rect");
        let curW = 10;
        return {
          wrap,
          size(w, h, thickness){
            curW = w;
            const midY = h * 0.5;
            const d = `M ${h*0.18} ${midY+h*0.10} `
                    + `C ${w*0.28} ${midY-h*0.34}, ${w*0.46} ${midY+h*0.30}, ${w*0.62} ${midY-h*0.08} `
                    + `S ${w*0.88} ${midY+h*0.16}, ${w - h*0.18} ${midY-h*0.04}`;
            svg.setAttribute("width", w.toFixed(1));
            svg.setAttribute("height", h.toFixed(1));
            svg.setAttribute("viewBox", `0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
            path.setAttribute("d", d);
            path.setAttribute("stroke-width", thickness.toFixed(1));
            clipRect.setAttribute("height", h.toFixed(1));
          },
          reveal(k){ clipRect.setAttribute("width", (curW * Math.max(0, Math.min(1, k))).toFixed(1)); }
        };
      }

      /* ── assemble the WHOLE tree at construction time ──────────────────── */
      tok.before.forEach(w => stage.appendChild(wordSpan(w)));

      let struckEl=null, replEl=null, replEl2=null, targetCell=null;
      let strikeS=null, underS=null, strikeS2=null, underS2=null;
      let underWrap=null, underWrap2=null;

      function markerReplacement(text, sizePct){
        const el = document.createElement("span");
        el.className = "replacement";
        el.style.fontFamily = `"${MARKER_FONT}", "Caveat", cursive`;
        el.style.color = REPL_C;
        el.style.fontSize = sizePct + "%";
        el.style.fontWeight = (MARKER_FONT === "Caveat") ? 700 : 800;
        el.style.left = "50%";
        el.textContent = text;
        return el;
      }

      if (tok.hit !== null) {
        targetCell = document.createElement("span");
        targetCell.className = "word target";

        struckEl = document.createElement("span");
        struckEl.className = "struck";
        struckEl.textContent = tok.hit;
        targetCell.appendChild(struckEl);

        // strike #1 (over the struck word) — built now, sized on measure
        strikeS = makeStroke(STRIKE_C);
        targetCell.appendChild(strikeS.wrap);

        // replacement #1 (marker), parked above; carries its own underline
        replEl = markerReplacement(REPL, MARKER_SCALE * 100);
        underS = makeStroke(STRIKE_C);
        underWrap = document.createElement("div");
        underWrap.className = "underWrap";
        underWrap.appendChild(underS.wrap);
        replEl.appendChild(underWrap);
        targetCell.appendChild(replEl);

        // second correction tree — strike #2 and replacement #2 are SIBLINGS of
        // replEl inside targetCell (NOT children of replEl). Critical: when
        // phase 5 dims replEl ("effortless" becomes the old word), CSS opacity +
        // filter would inherit onto any child — so the punchline "free" and its
        // strike must live OUTSIDE replEl to stay vivid.
        if (COUNT >= 2) {
          strikeS2 = makeStroke(STRIKE_C);
          targetCell.appendChild(strikeS2.wrap);

          replEl2 = markerReplacement(REPL2, MARKER_SCALE * 116); // punchline, a hair bigger
          underS2 = makeStroke(STRIKE_C);
          underWrap2 = document.createElement("div");
          underWrap2.className = "underWrap";
          underWrap2.appendChild(underS2.wrap);
          replEl2.appendChild(underWrap2);
          targetCell.appendChild(replEl2);
        }

        stage.appendChild(targetCell);
      } else {
        // graceful: target word not present in the claim — show line as-is
        stage.appendChild(wordSpan(STRUCK || ""));
      }

      tok.after.forEach(w => stage.appendChild(wordSpan(w)));

      /* ── measure layout → SIZE the pre-built strokes & PARK replacements ─ */
      /* attribute/style updates only; no node creation. Runs each frame until
         fonts load, then caches (geometry rule).

         CRITICAL (multi-line robustness): the claim may WRAP to several lines.
         The struck word sits on whatever line it landed on, possibly with claim
         lines ABOVE it. Parking the correction stack relative to the struck
         WORD's box would stamp the replacements on top of those higher lines.
         So we park the stack relative to the TOP of the whole headline block:
         we measure the vertical distance from the struck cell's BOTTOM edge up
         to the stage's TOP edge (cellBottomToStageTop) and float replacement #1
         a gap ABOVE the entire block. Replacement #2 floats another step above
         #1. The strikes stay glued to their own glyph boxes (struck word and
         the floated replacement #1). Camera drift amounts are derived from the
         SAME measured stack height so the busy final frame stays centered no
         matter how many lines the claim wraps to. */
      // shared, set by measure(): how far the camera should drift DOWN so the
      // grown upward stack re-centers. 0 until measured.
      let camShift1 = 0, camShift2 = 0;
      // horizontal clamp (px, added to each replacement's gsap.set x): keeps a
      // replacement WIDER than the struck word from spilling past the canvas.
      let replClampX = 0, repl2ClampX = 0;
      // vertical fit: when wrapped multi-line replacements make the stack taller
      // than the canvas, scale the whole composition DOWN so the full stack fits.
      let stackFitScale = 1;

      const STAGE_CX = 960;       // canvas center X (1920/2)
      const SAFE_MARGIN = 56;     // keep replacements this far inside each edge
      const V_MARGIN   = 48;      // keep the stack this far from top/bottom edges

      /* Compute the px x-shift that re-centers an absolutely-centered, w-wide box
         (currently centered on cellCx in canvas coords) so its left/right edges
         stay within [SAFE_MARGIN, 1920-SAFE_MARGIN]. Returns 0 if it already fits. */
      function clampCenter(cellCx, w){
        const half = w * 0.5;
        const lo = SAFE_MARGIN + half;            // min allowed center
        const hi = 1920 - SAFE_MARGIN - half;     // max allowed center
        let target = cellCx;
        if (lo <= hi) target = Math.max(lo, Math.min(hi, cellCx));
        else          target = 960;               // box wider than safe area → dead-center it
        return target - cellCx;                   // px to add to the (centered) transform
      }

      function measure(){
        if (!struckEl) return;
        const sw = struckEl.offsetWidth, sh = struckEl.offsetHeight;
        // strike #1 — glued to the struck word's own glyph box
        strikeS.size(sw * 1.18, sh * 0.62, Math.max(8, sh * 0.085));

        // struck cell's center in CANVAS coords. The stage is centered in the
        // 1920 canvas (cam left:50% + translateX -50%), so stage-left sits at
        // 960 - stageW/2; the cell center is that plus its offset within stage.
        const stageW   = stage.offsetWidth;
        const cellCx   = (STAGE_CX - stageW * 0.5) + targetCell.offsetLeft + targetCell.offsetWidth * 0.5;
        // the widest a replacement may be before it MUST wrap: the symmetric room
        // available around the (post-clamp) center. We center the box, so usable
        // width = 2 * min(center - SAFE, (1920-SAFE) - center) is too tight when
        // the cell is off-center; instead allow the full safe span and let the
        // clamp re-center it. Cap the marker word's box at the safe span width.
        const safeSpan = 1920 - 2 * SAFE_MARGIN;

        // distance from the struck cell's BOTTOM edge up to the stage TOP edge.
        // offsetTop is relative to the offset parent (stage, position:relative
        // via .cam? — stage is the targetCell's offset parent). Measure against
        // the stage box directly so wrapping is accounted for.
        const cellTopInStage    = targetCell.offsetTop;          // top of cell within stage
        const cellH             = targetCell.offsetHeight;       // cell line box height
        const cellBottomToTop   = cellTopInStage + cellH;        // cell bottom edge measured from stage top
        // replEl.bottom is measured from targetCell's bottom edge. To float it
        // a gap ABOVE the stage's top, bottom = (cell bottom → stage top) + gap.
        const gap = sh * 0.34;
        const repl1Bottom = cellBottomToTop + gap;
        replEl.style.bottom = repl1Bottom + "px";
        // cap the marker word's box to the safe span so an over-long replacement
        // ("completely free") WRAPS to multiple marker lines instead of clipping.
        replEl.style.maxWidth = safeSpan + "px";
        const rw = replEl.offsetWidth, rh = replEl.offsetHeight;
        // clamp the (centered) replacement so its full box stays inside the canvas.
        // pad by the squash overshoot (scaleX peaks at 1.08) so even the bounce frame fits.
        replClampX = clampCenter(cellCx, rw * 1.08);
        // underline #1 — glued under replacement #1
        underS.size(rw * 1.04, Math.max(18, rh*0.22), Math.max(7, rh*0.05));
        underWrap.style.bottom = (-rh * 0.12) + "px";

        // camera drift: replacement #1 adds (rh + gap) of content ABOVE the
        // block top. Drift the camera DOWN by ~half of that so the new top+block
        // re-centers around the original center. Use 0.5 to split the added
        // height evenly above/below the visual center.
        camShift1 = (rh + gap) * 0.5;
        // topmost content extent above the cell bottom for the 1-correction case
        let stackTopAbove = repl1Bottom + rh;

        if (COUNT >= 2 && replEl2) {
          const repl1MidY = repl1Bottom + rh*0.5;  // vertical center of replacement #1
          // strike #2 — sized to replacement #1's glyphs, glued to its midline.
          // strikeS2 lives in targetCell now, so position with bottom (top:auto)
          // to escape the .strikeWrap base top:50% (which would center on the cell).
          const strk2H = rh * 0.58;
          strikeS2.size(rw * 1.16, strk2H, Math.max(8, rh*0.08));
          strikeS2.wrap.style.top = "auto";
          strikeS2.wrap.style.bottom = (repl1MidY - strk2H*0.5) + "px";
          // replacement #2 floats another step above replacement #1
          const gap2 = rh * 0.34;
          const repl2Bottom = repl1Bottom + rh + gap2;
          replEl2.style.bottom = repl2Bottom + "px";
          replEl2.style.maxWidth = safeSpan + "px";
          const r2w = replEl2.offsetWidth, r2h = replEl2.offsetHeight;
          // clamp replacement #2 independently (its width may differ from #1);
          // pad by its squash overshoot (scaleX peaks at 1.10).
          repl2ClampX = clampCenter(cellCx, r2w * 1.10);
          underS2.size(r2w * 1.04, Math.max(18, r2h*0.22), Math.max(7, r2h*0.05));
          underWrap2.style.bottom = (-r2h * 0.12) + "px";
          // camera drift for the full stack: replacement #2 adds (r2h + gap2)
          // more content above. Re-center around half the TOTAL added height.
          camShift2 = ((rh + gap) + (r2h + gap2)) * 0.5;
          stackTopAbove = repl2Bottom + r2h;   // top of the tallest stack frame
        }

        // ── vertical fit ────────────────────────────────────────────────────
        // Total content height at the busiest (final) frame: from the bottom of
        // the original claim block up to the top of the topmost replacement.
        // After the camera drift the stack is roughly centered, so if it exceeds
        // the safe vertical span, scale the whole composition down to fit. This is
        // a pure fn of measured geometry → identical every frame, deterministic.
        const totalContentH = stackTopAbove + cellH;       // cell bottom→top of stack + claim block below
        const safeV = 1080 - 2 * V_MARGIN;
        stackFitScale = Math.min(1, safeV / Math.max(1, totalContentH));
      }

      /* ── initial states — frame 0 is the correct opening ──────────────── */
      gsap.set(cam, { xPercent:-50, yPercent:-50, scale:1 });
      if (struckEl) {
        // strike wraps are centered via top/left:50% — GSAP overwrites transform,
        // so carry the -50%/-50% centering INSIDE the gsap transform (xPercent/yPercent)
        // nudge the strike DOWN onto the glyph mid-line (the word box includes
        // line-height leading, so its box-center sits above the visual x-height)
        gsap.set(strikeS.wrap, { xPercent:-50, yPercent:-50, y: struckEl.offsetHeight * 0.085,
                                 transformOrigin:"50% 50%", rotate:-2.5 });
        gsap.set(struckEl, { color:INK, opacity:1, y:0, filter:"grayscale(0)" });
        gsap.set(replEl,   { xPercent:-50, yPercent:18, scaleY:1, scaleX:1, rotate:-8, opacity:0 });
        if (COUNT >= 2 && replEl2) {
          // strikeS2 is anchored via bottom (top:auto), so only carry the
          // horizontal -50% centering — no yPercent shift.
          gsap.set(strikeS2.wrap, { xPercent:-50, yPercent:0, transformOrigin:"50% 50%", rotate:2.5 });
          gsap.set(replEl2, { xPercent:-50, yPercent:14, scaleY:1, scaleX:1, rotate:-9, opacity:0 });
        }
      }

      /* ── proxy values for the per-frame marker reveals ─────────────────── */
      const pStrike  = { k: 0 };
      const pUnder   = { k: 0 };
      const pStrike2 = { k: 0 };
      const pUnder2  = { k: 0 };
      // camera drift progress: 0 = centered (frame 0), 1 = one correction
      // stacked, 2 = two corrections stacked. The actual DOWNWARD px is derived
      // from the MEASURED stack height (camShift1/camShift2) each frame, so the
      // composition re-centers correctly for ANY number of wrapped claim lines.
      const pCam = { s: 0 };
      let measured = false;

      function camY(){
        const s = pCam.s;
        if (s <= 1) return camShift1 * s;                         // 0 → camShift1
        return camShift1 + (camShift2 - camShift1) * (s - 1);     // camShift1 → camShift2
      }

      function render(){
        if (!measured) {
          measure();
          if (document.fonts && document.fonts.status === "loaded") measured = true;
        }
        // camera re-balance + vertical fit, driven off measured geometry (pure
        // fn of time). transformOrigin 50% 50% = canvas center, so the fit-scale
        // shrinks the whole stack about the center while the y-drift re-centers it.
        gsap.set(cam, { y: camY(), scale: stackFitScale, transformOrigin:"50% 50%" });
        // horizontal clamp, driven off measured geometry (pure fn of time): keeps
        // an over-wide replacement (and its glued strike) inside the canvas. x is a
        // separate transform channel from the animated xPercent/scale/rotate, so
        // setting it per-frame never fights the stamp tweens.
        if (replEl)      gsap.set(replEl,        { x: replClampX });
        if (strikeS2)    gsap.set(strikeS2.wrap, { x: replClampX });  // strike #2 follows replacement #1
        if (replEl2)     gsap.set(replEl2,       { x: repl2ClampX });
        if (strikeS)  strikeS.reveal(pStrike.k);
        if (underS)   underS.reveal(pUnder.k);
        if (strikeS2) strikeS2.reveal(pStrike2.k);
        if (underS2)  underS2.reveal(pUnder2.k);
      }

      /* ── master timeline ───────────────────────────────────────────────── */
      const DUR = 7.0;
      const tl = gsap.timeline({ paused:true });

      // a single proxy tween covering the whole clip keeps render() called every
      // frame (so lazy measurement + all four marker reveals stay in sync)
      const heartbeat = { t: 0 };
      tl.to(heartbeat, { t: DUR, duration: DUR, ease:"none", onUpdate: render }, 0);

      /* camera re-balance: the correction stack grows UPWARD off the headline,
         so as each replacement lands, drift the whole composition gently DOWN to
         keep the busy stack vertically centered. The DOWNWARD px is NOT hard-
         coded to a single headline line — it is derived per-frame in render()
         from the MEASURED stack height (camShift1/camShift2), so a claim that
         wraps to many lines still re-centers correctly. Here we only tween the
         abstract progress pCam.s (0 → 1 → 2); render() maps it to px. Frame 0
         (pCam.s = 0) stays centered. */
      if (struckEl) {
        /* PHASE 1 — strike draws through the target */
        tl.to(pStrike, { k:1, duration:0.65, ease:"power2.inOut" }, 0.45);
        /* camera eases down as the first replacement settles in above */
        tl.to(pCam, { s: 1, duration:0.7, ease:"power2.inOut" }, 1.30);

        /* PHASE 2 — target desaturates, sinks, dims (overlaps the strike tail) */
        tl.to(struckEl, { color:"#9b9690", filter:"grayscale(1)", opacity:0.42, y:10,
                          duration:0.45, ease:"power1.out" }, 0.85);

        /* PHASE 3 — replacement STAMPS in above: rotation snap + landing squash */
        tl.to(replEl, { opacity:1, duration:0.14, ease:"power1.out" }, 1.30);
        tl.fromTo(replEl,
          { yPercent:18, scaleY:1.0, scaleX:1.0, rotate:-8 },
          { yPercent:0, rotate:0, duration:0.40, ease:"back.out(2.4)", immediateRender:false }, 1.30);
        // landing squash on the stamp: quick flatten then rebound
        tl.to(replEl, { scaleY:0.82, scaleX:1.08, duration:0.10, ease:"power2.out" }, 1.62);
        tl.to(replEl, { scaleY:1.0,  scaleX:1.0,  duration:0.22, ease:"elastic.out(1,0.55)" }, 1.72);

        /* PHASE 4 — underline marker swipe under the replacement */
        tl.to(pUnder, { k:1, duration:0.38, ease:"power2.out" }, 1.78);
      }

      /* ── SECOND correction (escalation) ───────────────────────────────── */
      let END;
      if (COUNT >= 2 && struckEl) {
        /* PHASE 5 — strike draws through the first replacement */
        tl.to(pStrike2, { k:1, duration:0.60, ease:"power2.inOut" }, 2.50);
        /* camera continues down as the second (top) replacement stacks above */
        tl.to(pCam, { s: 2, duration:0.7, ease:"power2.inOut" }, 3.10);
        /* the first replacement dims + sinks (it just became "old") */
        tl.to(replEl, { opacity:0.42, y:8, duration:0.42, ease:"power1.out",
                        onUpdate(){ replEl.style.filter = "grayscale(0.85)"; } }, 2.90);
        /* PHASE 6 — replacement2 stamps above */
        tl.to(replEl2, { opacity:1, duration:0.14, ease:"power1.out" }, 3.10);
        tl.fromTo(replEl2,
          { yPercent:14, scaleY:1.0, scaleX:1.0, rotate:-9 },
          { yPercent:0, rotate:0, duration:0.40, ease:"back.out(2.5)", immediateRender:false }, 3.10);
        tl.to(replEl2, { scaleY:0.80, scaleX:1.10, duration:0.10, ease:"power2.out" }, 3.42);
        tl.to(replEl2, { scaleY:1.0,  scaleX:1.0,  duration:0.24, ease:"elastic.out(1,0.5)" }, 3.52);
        tl.to(pUnder2, { k:1, duration:0.40, ease:"power2.out" }, 3.60);
        END = 4.05;
      } else {
        END = struckEl ? 2.20 : 0.5;
      }

      /* PHASE 7 — loop-friendly idle breathe on the whole stage (finite yoyo) */
      const idleStart = END + 0.10;
      const idleCycle = 1.5;
      const idleReps  = Math.max(1, Math.floor((DUR - idleStart) / idleCycle));
      tl.to(stage, { scale:1.012, transformOrigin:"50% 60%", duration:idleCycle/2,
                     ease:"sine.inOut", yoyo:true, repeat: idleReps*2 - 1 }, idleStart);

      // pad the hold to data-duration
      tl.set({}, {}, DUR);

      render(); // frame 0 styled immediately

      // once fonts finish loading, re-measure so strokes are sized to final glyphs
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { measure(); render(); });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
