name: Windows

on:
  push:
    branches: [feat/windows, main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    name: Engine tests (Windows)
    runs-on: windows-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Python test deps
        run: python -m pip install pytest
      - name: Node tests
        run: node scripts/run-node-tests.js
      - name: Pytest
        run: python -m pytest tests -q
      - name: Doctor
        run: node scripts/doctor.js
        continue-on-error: true
      - name: Engine npm ci
        run: npm ci
      - name: HyperFrames lint (if present)
        run: npx hyperframes --version

  desktop-build:
    name: Desktop NSIS build
    runs-on: windows-latest
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Xotion-Windows
          path: desktop/dist/*.exe
