# Cloud render — MANUAL ONLY (opt-in). Render a project under projects/ in GitHub Actions.
#
# How to run: GitHub -> Actions -> "render" -> Run workflow -> enter the project folder name.
#
# IMPORTANT: this only works if the project's assets are committed to the repo. By default
# assets like audio/.wav and renders are gitignored, so for a cloud render you must force-add
# what the composition needs:  git add -f projects/<name>/assets/*
# Pure-CSS motion graphics (no external media) render fine as-is.
#
# EXPERIMENTAL: HyperFrames needs headless Chrome + ffmpeg in CI; long/heavy comps may exceed
# runner limits. For anything heavy, render locally. There is NO automatic push trigger — this
# never runs on its own, so normal commits won't fail CI.
name: render

on:
  workflow_dispatch:
    inputs:
      project:
        description: "project folder under projects/ (e.g. demo-promo)"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check project exists
        id: pick
        run: |
          dir="projects/${{ github.event.inputs.project }}"
          if [ ! -f "$dir/index.html" ]; then
            echo "::error::$dir/index.html not found. Commit the project (and force-add its assets)."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Lint
        working-directory: ${{ steps.pick.outputs.dir }}
        run: npx -y hyperframes lint

      - name: Render
        working-directory: ${{ steps.pick.outputs.dir }}
        run: npx -y hyperframes render --output renders/out.mp4

      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.event.inputs.project }}-${{ github.run_number }}
          path: ${{ steps.pick.outputs.dir }}/renders/out.mp4
          retention-days: 14
