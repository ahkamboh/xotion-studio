<!DOCTYPE html>
<html lang="en">
<!--
  x-done — SCENE C "DONE" (dark success) · HyperFrames composition
  ──────────────────────────────────────────────────────────────────
  1920×1080 · 30fps · data-duration 4.0
  Part of a 3-scene set sharing one dark premium AI-app design kit.

  Beat sheet:
    0.0-0.5  finished video THUMBNAIL (warm-gradient 16:9) scales/fades in
    0.5-1.0  big GREEN CHECK badge pops on it (white check draws, back.out(2.2))
    0.8-1.6  headline "Ready" rises in under it
    1.2-2.0  mono chips cascade: 4K / 0:24 / captions / music
    1.4-2.2  deterministic CONFETTI burst from behind the check, settling
    →4.0     gentle idle (breathing thumbnail) so it never freezes dead-still

  HyperFrames determinism: one paused GSAP timeline; all DOM pre-rendered;
  every selector scoped; no clock / no runtime randomness; finite repeats.
-->
<head>
<meta charset="UTF-8" />
<meta name="hf-duration" content="4" />
<meta name="hf-fps" content="30" />
<meta name="hf-width" content="1920" />
<meta name="hf-height" content="1080" />
<style>
  /* ─── FONTS (LOCAL @font-face only) ─────────────────────────────── */
  @font-face { font-family:"Inter"; font-weight:400; font-style:normal;
    src:url("assets/fonts/inter-400.ttf") format("truetype"); }
  @font-face { font-family:"Inter"; font-weight:500; font-style:normal;
    src:url("assets/fonts/inter-500.ttf") format("truetype"); }
  @font-face { font-family:"Inter"; font-weight:600; font-style:normal;
    src:url("assets/fonts/inter-600.ttf") format("truetype"); }
  @font-face { font-family:"Inter"; font-weight:700; font-style:normal;
    src:url("assets/fonts/inter-700.ttf") format("truetype"); }
  @font-face { font-family:"JBMono"; font-weight:500; font-style:normal;
    src:url("assets/fonts/jetbrains-500.ttf") format("truetype"); }

  /* ─── SHARED DESIGN KIT TOKENS ──────────────────────────────────── */
  :root{
    --bg:#0c0d10; --bg2:#101216; --panel:#16181d; --panel2:#1b1e24;
    --border:#262a31; --border2:#30343c; --text:#f2f3f5; --sub:#9aa1ab; --faint:#6b7178;
    --accent:#e0451f; --accent2:#ff6a3d; --accentglow:rgba(224,69,31,.35);
    --green:#34c759; --rail:#23262d;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg); }

  #root{
    position:relative; width:1920px; height:1080px; overflow:hidden;
    background:var(--bg); color:var(--text); font-family:"Inter",sans-serif;
  }

  /* faint radial accent glow (top) + subtle dotted grid — never flat black */
  .bg-glow{ position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(900px 560px at 50% -6%, var(--accentglow) 0%, rgba(224,69,31,0) 60%),
      radial-gradient(1100px 700px at 50% 120%, rgba(52,199,89,.06) 0%, rgba(52,199,89,0) 60%);
  }
  .bg-grid{ position:absolute; inset:0; pointer-events:none; opacity:1;
    background-image:radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:34px 34px; background-position:center;
    -webkit-mask-image:radial-gradient(1400px 900px at 50% 46%, #000 55%, transparent 100%);
            mask-image:radial-gradient(1400px 900px at 50% 46%, #000 55%, transparent 100%);
  }
  .vignette{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 70% 64% at 50% 48%, transparent 52%, rgba(0,0,0,.46) 100%); }

  /* ─── CENTERED STAGE ────────────────────────────────────────────── */
  .stage{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:1200px; display:flex; flex-direction:column; align-items:center; }

  /* thumbnail wrap (holds thumb + check + confetti so they share an origin) */
  .thumb-wrap{ position:relative; width:760px; height:427px; }

  /* the finished video THUMBNAIL — warm gradient 16:9, rounded, bordered */
  .thumb{ position:absolute; inset:0; border-radius:16px; overflow:hidden;
    border:1px solid var(--border2);
    box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.02) inset;
    background:
      radial-gradient(140% 120% at 18% 8%, rgba(255,178,120,.55) 0%, rgba(255,178,120,0) 46%),
      radial-gradient(120% 130% at 92% 100%, rgba(120,42,18,.65) 0%, rgba(120,42,18,0) 52%),
      linear-gradient(135deg, var(--accent2) 0%, var(--accent) 48%, #8f2a10 100%);
  }
  /* warm thumbnail interior detail so it reads as a real rendered frame */
  .thumb .sheen{ position:absolute; inset:0;
    background:linear-gradient(115deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 34%); }
  .thumb .grain{ position:absolute; inset:0; opacity:.10; mix-blend-mode:overlay;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 1px, transparent 1px 3px); }
  .thumb .play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:96px; height:96px; border-radius:9999px;
    background:rgba(12,13,16,.30); border:1.5px solid rgba(255,255,255,.55);
    backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; }
  .thumb .play::after{ content:""; width:0; height:0; margin-left:7px;
    border-left:30px solid rgba(255,255,255,.92);
    border-top:18px solid transparent; border-bottom:18px solid transparent; }
  .thumb .runtime{ position:absolute; right:16px; bottom:14px;
    font-family:"JBMono",monospace; font-size:18px; font-weight:500; color:#fff;
    background:rgba(12,13,16,.55); border-radius:6px; padding:4px 9px; letter-spacing:.02em; }
  .thumb .toprow{ position:absolute; left:18px; top:16px; display:flex; gap:8px; }
  .thumb .toprow i{ width:11px; height:11px; border-radius:9999px; display:block;
    background:rgba(255,255,255,.55); }

  /* GREEN CHECK badge — sits on the thumbnail's lower-right */
  .check-badge{ position:absolute; right:-30px; bottom:-30px;
    width:128px; height:128px; border-radius:9999px;
    background:var(--green); display:flex; align-items:center; justify-content:center;
    box-shadow:0 16px 40px rgba(52,199,89,.45), 0 4px 14px rgba(52,199,89,.35),
               0 0 0 8px rgba(12,13,16,.9);
  }
  .check-badge svg{ width:74px; height:74px; display:block; }

  /* confetti layer — behind the check, centered on the badge */
  .confetti{ position:absolute; right:34px; bottom:34px; width:0; height:0;
    pointer-events:none; z-index:1; }
  .confetti .bit{ position:absolute; left:0; top:0; border-radius:2px; }

  /* headline */
  .headline{ margin-top:62px; font-family:"Inter",sans-serif; font-weight:700;
    font-size:64px; line-height:1; letter-spacing:-.02em; color:var(--text);
    text-shadow:0 2px 30px rgba(0,0,0,.4); }
  .subline{ margin-top:14px; font-family:"Inter",sans-serif; font-weight:500;
    font-size:21px; color:var(--sub); letter-spacing:.005em; }

  /* mono chip row */
  .chips{ margin-top:30px; display:flex; gap:14px; }
  .chip{ font-family:"JBMono",monospace; font-weight:500; font-size:19px;
    color:var(--sub); background:var(--panel2);
    border:1.5px solid var(--border); border-radius:9999px;
    padding:11px 22px; display:flex; align-items:center; gap:10px; white-space:nowrap;
    box-shadow:0 8px 22px rgba(0,0,0,.35); }
  .chip .dot{ width:8px; height:8px; border-radius:9999px; background:var(--green);
    box-shadow:0 0 10px rgba(52,199,89,.6); }
</style>
</head>

<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <div class="stage" id="stage">
      <div class="thumb-wrap" id="thumbWrap">
        <div class="thumb" id="thumb">
          <div class="sheen"></div>
          <div class="grain"></div>
          <div class="toprow"><i></i><i></i><i></i></div>
          <div class="play"></div>
          <div class="runtime">0:24</div>
        </div>

        <!-- confetti dots are appended here at construction time (before tl) -->
        <div class="confetti" id="confetti"></div>

        <div class="check-badge" id="checkBadge">
          <svg viewBox="0 0 90 90" fill="none" stroke="#ffffff" stroke-width="9"
               stroke-linecap="round" stroke-linejoin="round">
            <path id="checkPath" d="M24 47 L40 63 L66 31"></path>
          </svg>
        </div>
      </div>

      <div class="headline" id="headline">Ready</div>
      <div class="subline" id="subline">Your video is rendered</div>

      <div class="chips" id="chips">
        <div class="chip"><span class="dot"></span>4K</div>
        <div class="chip"><span class="dot"></span>0:24</div>
        <div class="chip"><span class="dot"></span>captions</div>
        <div class="chip"><span class="dot"></span>music</div>
      </div>
    </div>

    <div class="vignette"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    /* scope every selector to this composition */
    const Q  = s => document.querySelector('[data-composition-id="main"] ' + s);
    const QA = s => Array.from(document.querySelectorAll('[data-composition-id="main"] ' + s));

    const stage     = Q('#stage');
    const thumbWrap = Q('#thumbWrap');
    const thumb     = Q('#thumb');
    const badge     = Q('#checkBadge');
    const checkPath = Q('#checkPath');
    const headline  = Q('#headline');
    const subline   = Q('#subline');
    const chips      = QA('.chip');
    const confettiEl = Q('#confetti');

    /* ── CONFETTI: deterministic table (no randomness / no clock) ─────
       angles spread around, alternating distances + sizes, fixed delays.
       Colors cycle accent / accent2 / green / white from a fixed array.   */
    const PALETTE = ['var(--accent)','var(--accent2)','var(--green)','#ffffff'];
    const CONFETTI = [
      { a:  -8, d:210, s:16, rot: 140, dl:0.00, c:0 },
      { a:  26, d:250, s:12, rot:-120, dl:0.05, c:1 },
      { a:  62, d:188, s:18, rot: 200, dl:0.02, c:2 },
      { a:  98, d:236, s:11, rot: -90, dl:0.08, c:3 },
      { a: 132, d:268, s:15, rot: 160, dl:0.04, c:0 },
      { a: 168, d:198, s:13, rot:-180, dl:0.10, c:2 },
      { a: 204, d:248, s:17, rot: 110, dl:0.01, c:1 },
      { a: 236, d:182, s:10, rot:-150, dl:0.07, c:3 },
      { a: 268, d:262, s:14, rot: 220, dl:0.03, c:0 },
      { a: 300, d:206, s:12, rot: -70, dl:0.09, c:2 },
      { a: 330, d:244, s:16, rot: 130, dl:0.05, c:1 },
      { a: 352, d:190, s:11, rot:-200, dl:0.02, c:3 },
      { a:  44, d:300, s: 9, rot: 100, dl:0.12, c:0 },
      { a: 116, d:312, s:10, rot:-160, dl:0.14, c:1 },
      { a: 222, d:306, s: 9, rot: 180, dl:0.11, c:2 },
      { a: 288, d:318, s:10, rot:-110, dl:0.15, c:3 }
    ];
    /* build all dot nodes NOW (construction time), never inside a callback */
    const bits = CONFETTI.map(c => {
      const el = document.createElement('div');
      el.className = 'bit';
      el.style.width  = c.s + 'px';
      el.style.height = c.s + 'px';
      el.style.background = PALETTE[c.c];
      if (c.c === 3) el.style.boxShadow = '0 0 8px rgba(255,255,255,.5)';
      confettiEl.appendChild(el);
      return el;
    });

    /* ── INITIAL STATES (frame 0 seeks clean) ──────────────────────── */
    const checkLen = checkPath.getTotalLength();
    gsap.set(checkPath, { strokeDasharray: checkLen, strokeDashoffset: checkLen });
    gsap.set(thumbWrap, { scale: 0.9, opacity: 0, transformOrigin: '50% 50%' });
    gsap.set(badge,     { scale: 0, opacity: 0, transformOrigin: '50% 50%' });
    gsap.set(headline,  { y: 30, opacity: 0 });
    gsap.set(subline,   { y: 20, opacity: 0 });
    gsap.set(chips,     { y: 26, opacity: 0, scale: 0.9, transformOrigin: '50% 50%' });
    bits.forEach((el,i) => gsap.set(el, {
      x: 0, y: 0, rotation: 0, opacity: 0,
      xPercent: -50, yPercent: -50, transformOrigin: '50% 50%'
    }));

    /* ── PAUSED MASTER TIMELINE ─────────────────────────────────────── */
    const tl = gsap.timeline({ paused: true });

    // 0.0–0.5  thumbnail scales / fades in
    tl.to(thumbWrap, { scale: 1, opacity: 1, duration: 0.55, ease: 'expo.out' }, 0.0);

    // 0.5–1.0  green check badge pops + white check draws
    tl.fromTo(badge, { scale: 0, opacity: 0 },
                     { scale: 1, opacity: 1, duration: 0.42, ease: 'back.out(2.2)',
                       immediateRender: false }, 0.5);
    tl.fromTo(checkPath, { strokeDashoffset: checkLen },
                         { strokeDashoffset: 0, duration: 0.34, ease: 'power2.out',
                           immediateRender: false }, 0.66);

    // 0.8–1.6  headline "Ready" rises in under the thumbnail (+ subline)
    tl.to(headline, { y: 0, opacity: 1, duration: 0.62, ease: 'expo.out' }, 0.8);
    tl.to(subline,  { y: 0, opacity: 1, duration: 0.6,  ease: 'expo.out' }, 1.02);

    // 1.2–2.0  mono chips cascade in
    chips.forEach((chip, i) => {
      tl.to(chip, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' },
            1.2 + i * 0.13);
    });

    // 1.4–2.2  confetti burst from behind the check, settling
    CONFETTI.forEach((c, i) => {
      const rad = c.a * Math.PI / 180;
      const dx = Math.cos(rad) * c.d;
      const dy = Math.sin(rad) * c.d;
      const at = 1.4 + c.dl;
      // fly out
      tl.fromTo(bits[i],
        { x: 0, y: 0, rotation: 0, opacity: 1 },
        { x: dx, y: dy, rotation: c.rot, duration: 0.5, ease: 'power3.out',
          immediateRender: false }, at);
      // settle: drift down a touch + fade as it lands
      tl.to(bits[i],
        { x: dx + (c.a % 2 ? 14 : -14), y: dy + 60, opacity: 0,
          duration: 0.66, ease: 'power1.in' }, at + 0.5);
    });

    // gentle idle breathing on the thumbnail so it never freezes dead-still.
    // finite repeat: from ~1.9s to 4.0s ≈ 2.1s window, 1.2s cycle → repeat 2x (yoyo).
    tl.to(thumbWrap, { scale: 1.012, duration: 0.6, ease: 'sine.inOut',
                       repeat: 2, yoyo: true }, 1.9);
    // very subtle badge glow pulse to keep the success beat alive (finite)
    tl.to(badge, { scale: 1.04, duration: 0.5, ease: 'sine.inOut',
                   repeat: 2, yoyo: true }, 2.0);

    // pad to full duration
    tl.set({}, {}, 4.0);

    /* register for HyperFrames */
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    window.__timeline = tl;
  })();
  </script>
</body>
</html>
