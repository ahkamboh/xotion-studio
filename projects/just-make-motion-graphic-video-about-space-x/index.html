<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1920,height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="richness.js"></script>
<style>
 @font-face{font-family:"Archivo Black";src:url("assets/fonts/archivo-black-400.ttf") format("truetype");}
 @font-face{font-family:"Space";font-weight:700;src:url("assets/fonts/space-grotesk-700.ttf") format("truetype");}
 @font-face{font-family:"Mono";src:url("assets/fonts/jetbrains-500.ttf") format("truetype");}
 *{margin:0;padding:0;box-sizing:border-box;} html,body{width:1920px;height:1080px;overflow:hidden;font-family:"Space",sans-serif;--mono:"Mono";}
 #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0a0a0a;}
 .scene{position:absolute;inset:0;overflow:hidden;visibility:hidden;}
 .wrap{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;padding:120px 120px;text-align:center;}
 .h1{font-family:"Archivo Black",sans-serif;line-height:.92;letter-spacing:-.02em;color:#0a0a0a;text-transform:uppercase;text-shadow:7px 7px 0 #fff,14px 14px 0 #0a0a0a;}
 .h1.w{color:#F4F1E8;text-shadow:7px 7px 0 #2D6BFF,14px 14px 0 #0a0a0a;}
 .tag{font-family:"Mono",monospace;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:18px 30px;border:6px solid #0a0a0a;box-shadow:10px 10px 0 #0a0a0a;background:#fff;color:#0a0a0a;display:inline-block;}
 .card{padding:34px 50px;background:#F4F1E8;border:8px solid #0a0a0a;box-shadow:14px 14px 0 #0a0a0a;}
 .bar{height:22px;background:#2D6BFF;border:6px solid #0a0a0a;box-shadow:8px 8px 0 #0a0a0a;}
 .num{font-family:"Archivo Black";line-height:.9;letter-spacing:-.03em;}
 .furn{position:absolute;font-family:"Mono",monospace;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:30px;z-index:30;}
 .furn.tl{top:56px;left:72px;} .furn.tr{top:56px;right:72px;opacity:.75;}
 .bignum{position:absolute;font-family:"Archivo Black";font-size:760px;line-height:.66;z-index:1;bottom:-160px;right:0px;letter-spacing:-.05em;}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080"></div>
<script>
 var root=document.getElementById("root");
 var BG=["#0a0a0a","#FFD23F","#2D6BFF","#F4F1E8","#0a0a0a","#4DD9FF","#B8F84A","#2D6BFF"];
 var DARK=[true,false,true,false,true,false,false,true];
 var EB=["▶ SpaceX","▶ The mission","▶ Origin","▶ Falcon 9","▶ Starship","▶ Starlink","▶ By the numbers","▶ SpaceX"];
 var STK=[["LIFTOFF","#B8F84A",12],["MARS","#FF5DA2",-9],["EST. 2002","#FFD23F",10],["REUSABLE","#B8F84A",-8],["BIGGEST","#FF5DA2",9],["ORBIT","#FFD23F",-10],["RECORD","#B8F84A",8],["GO →","#e0451f",-7]];
 var SC=[{s:0.0,e:2.6,k:'intro'},{s:2.6,e:5.6,k:'mission'},{s:5.6,e:8.4,k:'origin'},{s:8.4,e:11.8,k:'falcon'},
  {s:11.8,e:15.2,k:'starship'},{s:15.2,e:18.4,k:'starlink'},{s:18.4,e:21.3,k:'numbers'},{s:21.3,e:24.0,k:'outro'}];
 window.__timelines=window.__timelines||{}; var tl=gsap.timeline({paused:true}); Rich.css();

 function countUp(el,tl,t,from,to,dur,suffix){
   suffix=suffix||""; var o={v:from}; el.textContent=Math.round(from)+suffix;
   tl.to(o,{v:to,duration:dur,ease:"power2.out",onUpdate:function(){el.textContent=Math.round(o.v).toLocaleString()+suffix;}},t);
 }

 SC.forEach(function(c){
   var i=SC.indexOf(c), dark=DARK[i], ink=dark?"#F4F1E8":"#0a0a0a";
   var el=document.createElement("div");el.className="scene";el.style.background=BG[i];root.appendChild(el);
   tl.set(el,{visibility:"visible"},c.s);tl.set(el,{visibility:"hidden"},c.e);
   Rich.texture(el,"dots", dark?"rgba(244,240,230,.9)":"rgba(10,10,10,.9)"); Rich.texture(el,"grain");
   var bn=document.createElement("div");bn.className="bignum";bn.textContent=String(i).padStart(2,'0');
   bn.style.color=dark?"rgba(244,240,230,.06)":"rgba(10,10,10,.06)";el.appendChild(bn);
   var eb=document.createElement("div");eb.className="furn tl";eb.textContent=EB[i];eb.style.color=ink;el.appendChild(eb);
   var ct=document.createElement("div");ct.className="furn tr";ct.textContent=String(i+1).padStart(2,'0')+" / 08";ct.style.color=ink;el.appendChild(ct);
   Rich.enter(eb,tl,c.s+.04,'rise');Rich.enter(ct,tl,c.s+.1,'rise');
   var wrap=document.createElement("div");wrap.className="wrap";el.appendChild(wrap);
   var sk=Rich.sticker(STK[i][0],STK[i][1],STK[i][2]);sk.style.position="absolute";sk.style.zIndex="40";
   sk.style.left=(i%2?"1480px":"110px");sk.style.top=(i%3?"180px":"820px");sk.style.fontSize="40px";el.appendChild(sk);
   Rich.stamp(sk,tl,c.s+.5,STK[i][2]); Rich.idle(wrap,tl,c.s,c.e);

   if(c.k==='intro'){
     wrap.innerHTML='<div class="h1 w" style="font-size:300px;text-shadow:8px 8px 0 #2D6BFF,18px 18px 0 #e0451f">SPACEX</div>'
       +'<div class="tag" style="background:#FFD23F;font-size:40px">making life multiplanetary</div>';
     Rich.enter(wrap.children[0],tl,c.s+.08,'slam');
     Rich.enter(wrap.children[1],tl,c.s+.5,'pop');
   } else if(c.k==='mission'){
     wrap.innerHTML='<div class="h1" style="font-size:150px">ONE MISSION:</div>'
       +'<div class="card" style="background:#e0451f;padding:24px 56px"><div class="h1 w" style="font-size:200px;text-shadow:6px 6px 0 #0a0a0a">GET TO MARS.</div></div>'
       +'<div class="tag" style="background:#fff;font-size:34px">reusable rockets · radically cheaper space</div>';
     Rich.cascade(wrap.children,tl,c.s+.08,{stagger:.2,from:{y:-70,opacity:0,scale:.92}});
   } else if(c.k==='origin'){
     wrap.innerHTML='<div class="h1 w" style="font-size:130px">FOUNDED IN</div>'
       +'<div class="num w" id="yr" style="font-size:340px;color:#FFD23F;text-shadow:8px 8px 0 #0a0a0a">2002</div>'
       +'<div class="tag" style="background:#FFD23F;font-size:34px">by Elon Musk · first private craft to reach orbit</div>';
     Rich.enter(wrap.children[0],tl,c.s+.08,'drop');
     Rich.enter(wrap.children[1],tl,c.s+.34,'slam');
     Rich.enter(wrap.children[2],tl,c.s+.7,'rise');
   } else if(c.k==='falcon'){
     wrap.innerHTML='<div class="h1" style="font-size:140px">FALCON 9 LANDS ITSELF.</div>'
       +'<div style="display:flex;align-items:flex-end;gap:18px"><div class="num" id="land" style="font-size:300px;color:#2D6BFF">0</div><div class="num" style="font-size:150px;color:#e0451f">+</div></div>'
       +'<div class="tag" style="background:#2D6BFF;color:#fff;font-size:34px">booster landings &amp; counting · the first reusable orbital rocket</div>';
     Rich.enter(wrap.children[0],tl,c.s+.08,'drop');
     Rich.enter(wrap.children[1],tl,c.s+.4,'pop');
     countUp(wrap.querySelector("#land"),tl,c.s+.5,0,400,1.8);
     Rich.enter(wrap.children[2],tl,c.s+.7,'rise');
   } else if(c.k==='starship'){
     wrap.innerHTML='<div class="h1 w" style="font-size:170px">STARSHIP</div>'
       +'<div style="display:flex;gap:40px">'
       +'<div class="card" style="background:#FFD23F"><div class="num" id="eng" style="font-size:130px;color:#0a0a0a">0</div><div class="tag" style="box-shadow:none;border-width:4px;background:#fff;font-size:26px;margin-top:10px">RAPTOR ENGINES</div></div>'
       +'<div class="card" style="background:#4DD9FF"><div class="num" id="ht" style="font-size:130px;color:#0a0a0a">0</div><div class="tag" style="box-shadow:none;border-width:4px;background:#fff;font-size:26px;margin-top:10px">METRES TALL</div></div>'
       +'<div class="card" style="background:#FF5DA2"><div class="num" style="font-size:130px;color:#0a0a0a">#1</div><div class="tag" style="box-shadow:none;border-width:4px;background:#fff;font-size:26px;margin-top:10px">MOST POWERFUL</div></div></div>';
     Rich.enter(wrap.children[0],tl,c.s+.08,'slam');
     el.querySelectorAll(".card").forEach(function(cd,j){Rich.enter(cd,tl,c.s+.4+j*.18,'slam');});
     countUp(el.querySelector("#eng"),tl,c.s+.6,0,33,1.4);
     countUp(el.querySelector("#ht"),tl,c.s+.7,0,121,1.4);
   } else if(c.k==='starlink'){
     wrap.innerHTML='<div class="h1" style="font-size:130px">STARLINK BLANKETS ORBIT.</div>'
       +'<div class="num" id="sat" style="font-size:300px;color:#2D6BFF;text-shadow:6px 6px 0 #0a0a0a">0</div>'
       +'<div class="tag" style="background:#fff;font-size:34px">satellites delivering internet across the planet</div>';
     Rich.enter(wrap.children[0],tl,c.s+.08,'drop');
     Rich.enter(wrap.children[1],tl,c.s+.4,'pop');
     countUp(wrap.querySelector("#sat"),tl,c.s+.5,0,7000,1.9,"+");
     Rich.enter(wrap.children[2],tl,c.s+.7,'rise');
   } else if(c.k==='numbers'){
     wrap.innerHTML='<div class="h1 w" style="font-size:120px">RECORD-BREAKING.</div>'
       +'<div style="display:flex;gap:44px;align-items:stretch">'
       +'<div class="card n3" style="background:#FFD23F"><div class="num" style="font-size:120px;color:#0a0a0a">2002</div><div class="tag" style="box-shadow:none;border-width:4px;background:#fff;font-size:26px;margin-top:12px">FOUNDED</div></div>'
       +'<div class="card n3" style="background:#FF5DA2"><div class="num" style="font-size:120px;color:#0a0a0a">400+</div><div class="tag" style="box-shadow:none;border-width:4px;background:#fff;font-size:26px;margin-top:12px">LANDINGS</div></div>'
       +'<div class="card n3" style="background:#0a0a0a"><div class="num w" style="font-size:120px;color:#F4F1E8;text-shadow:none">7K+</div><div class="tag" style="box-shadow:none;border-width:4px;background:#fff;font-size:26px;margin-top:12px">SATELLITES</div></div></div>';
     Rich.enter(wrap.children[0],tl,c.s+.08,'drop');
     el.querySelectorAll(".n3").forEach(function(b,j){Rich.enter(b,tl,c.s+.36+j*.18,'slam');});
   } else if(c.k==='outro'){
     wrap.innerHTML='<div class="h1 w" style="font-size:260px;text-shadow:8px 8px 0 #2D6BFF,18px 18px 0 #e0451f">SPACEX</div>'
       +'<div class="h1 w" style="font-size:90px;text-shadow:5px 5px 0 #e0451f">THE FUTURE IS MULTIPLANETARY.</div>'
       +'<div class="bar" style="width:520px"></div>';
     Rich.enter(wrap.children[0],tl,c.s+.06,'slam');
     Rich.enter(wrap.children[1],tl,c.s+.34,'rise');
     var ob=wrap.children[2];gsap.set(ob,{scaleX:0,transformOrigin:"left center"});tl.to(ob,{scaleX:1,duration:.4,ease:"power3.out"},c.s+.64);
   }
 });
 window.__timelines["main"]=tl;
</script></body></html>
