<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Xotion waitlist end card — real brand lockup on cream, editorial reveal. Deterministic. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"SpaceGrotesk"; font-weight:500;
        src:url("assets/fonts/space-grotesk-500.ttf") format("truetype"); }
      @font-face { font-family:"SpaceGrotesk"; font-weight:600;
        src:url("assets/fonts/space-grotesk-600.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#f4f0e6; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden;
        background:#f4f0e6; font-family:"SpaceGrotesk",sans-serif; }
      .glow { position:absolute; left:50%; top:48%; width:1200px; height:1200px;
        transform:translate(-50%,-50%);
        background:radial-gradient(circle, rgba(224,69,31,0.18), rgba(224,69,31,0) 62%);
        filter:blur(24px); opacity:0; pointer-events:none; }
      .wrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
        display:flex; flex-direction:column; align-items:center; }
      .eyebrow { font-weight:600; font-size:30px; letter-spacing:.46em; color:#0e0d0c;
        text-transform:uppercase; opacity:0; padding-left:.46em; }
      .rule { width:0; height:3px; background:#e0451f; margin:24px 0 56px; border-radius:2px; }
      .logo { width:680px; height:auto; display:block; opacity:0; }
      .sub { margin-top:60px; font-weight:500; font-size:36px; color:rgba(14,13,12,0.62);
        opacity:0; letter-spacing:.01em; }
      .sub b { color:#e0451f; font-weight:600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="glow" id="glow"></div>
      <div class="wrap">
        <div class="eyebrow" id="eyebrow">Join the waitlist</div>
        <div class="rule" id="rule"></div>
        <img class="logo" id="logo" src="assets/brand/xotion-logo-dark.png" alt="Xotion" />
        <div class="sub" id="sub">2,000 already on the list&nbsp;&nbsp;·&nbsp;&nbsp;<b>xotion.ai</b></div>
      </div>
    </div>

    <script>
      const Q = s => document.querySelector('[data-composition-id="main"] ' + s);
      const glow = Q('#glow'), eyebrow = Q('#eyebrow'), rule = Q('#rule'),
            logo = Q('#logo'), sub = Q('#sub');

      // explicit start states so frame 0 seeks clean
      gsap.set([eyebrow, sub], { opacity: 0, y: 16 });
      gsap.set(logo, { opacity: 0, scale: 0.94, y: 26 });
      gsap.set(rule, { width: 0 });
      gsap.set(glow, { opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      tl.to(eyebrow, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.15)
        .to(rule,    { width: 96, duration: 0.55, ease: "power3.inOut" }, 0.40)
        .to(glow,    { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.45)
        .to(logo,    { opacity: 1, scale: 1, y: 0, duration: 0.85, ease: "power3.out" }, 0.60)
        .to(sub,     { opacity: 1, y: 0, duration: 0.60, ease: "power3.out" }, 1.20);

      // finite idle so it never freezes dead-still
      tl.to(logo, { scale: 1.014, duration: 1.15, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.75);
      tl.to(glow, { opacity: 0.72, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.30);
      tl.set({}, {}, 6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
