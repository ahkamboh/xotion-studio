<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1080,height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="richness.js"></script>
    <style>
      @font-face{font-family:"Anton";src:url("assets/fonts/anton-400.ttf");font-weight:400;}
      @font-face{font-family:"BebasNeue";src:url("assets/fonts/bebas-neue-400.ttf");font-weight:400;}
      @font-face{font-family:"Inter";src:url("assets/fonts/inter-500.ttf");font-weight:500;}
      @font-face{font-family:"Inter";src:url("assets/fonts/inter-600.ttf");font-weight:600;}

      *{margin:0;padding:0;box-sizing:border-box;}
      :root{
        --yellow:#F5E531; --cyan:#5DD0E5; --purple:#2E1660; --cream:#FFF6C0; --ink:#0F0825;
      }
      html,body{width:1080px;height:1920px;overflow:hidden;background:var(--purple);
        font-family:"Inter",-apple-system,sans-serif;color:var(--cream);
        -webkit-font-smoothing:antialiased;}
      #root{position:relative;width:1080px;height:1920px;overflow:hidden;}

      /* ============ PERSISTENT BG — purple gradient + halftone + grain ============ */
      .bg{position:absolute;inset:0;z-index:1;
        background:radial-gradient(140% 90% at 50% 60%, #6E2DA8 0%, var(--purple) 45%, #14063A 100%);}
      .halftone{position:absolute;inset:-40px;z-index:2;pointer-events:none;
        background-image:radial-gradient(rgba(15,8,37,.85) 1.2px, transparent 1.5px);
        background-size:6px 6px;mix-blend-mode:multiply;opacity:.42;}
      .grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.15;mix-blend-mode:overlay;
        background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='320' height='320' filter='url(%23n)' opacity='0.5'/></svg>");}
      .scanlines{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.08;
        background:repeating-linear-gradient(0deg, rgba(0,0,0,.6) 0 1px, transparent 1px 4px);}

      /* ============ SUNBURST RAYS (rotates continuously) ============ */
      .rays{position:absolute;left:50%;top:50%;width:2400px;height:2400px;
        transform:translate(-50%,-50%);z-index:5;pointer-events:none;
        transform-origin:50% 50%;}
      .rays svg{width:100%;height:100%;}

      /* ============ COMMON TYPE ============ */
      .kicker{font-family:"BebasNeue",sans-serif;font-size:42px;letter-spacing:.22em;
        text-transform:uppercase;color:var(--cyan);text-shadow:0 0 2px rgba(0,0,0,.6);}
      .hero{font-family:"Anton",sans-serif;color:var(--yellow);line-height:.86;letter-spacing:-.01em;
        text-transform:uppercase;text-align:center;
        text-shadow: 4px 0 0 var(--cyan), -4px 0 0 #FF3DAE, 0 8px 60px rgba(245,229,49,.25);}
      .hero .line2{display:block;color:var(--cream);}
      .sub{font-family:"BebasNeue",sans-serif;font-size:54px;letter-spacing:.18em;text-transform:uppercase;
        color:var(--cream);text-align:center;}
      .credit{position:absolute;left:0;right:0;bottom:50px;text-align:center;
        font-family:"BebasNeue",sans-serif;font-size:26px;letter-spacing:.4em;color:var(--cream);opacity:.55;z-index:50;}

      /* ============ SCENES ============ */
      .scene{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
        align-items:center;justify-content:center;padding:120px 60px;text-align:center;
        visibility:hidden;opacity:0;}
      .scene .top{position:absolute;top:120px;left:0;right:0;text-align:center;}
      .scene .bot{position:absolute;bottom:160px;left:0;right:0;text-align:center;}

      /* per-scene hero sizes (auto-fit headlines) */
      .s1 .hero{font-size:340px;}
      .s2 .hero{font-size:280px;}
      .s3 .hero{font-size:330px;}
      .s4 .hero{font-size:240px;}
      .s5 .hero{font-size:380px;}
      .s6 .hero{font-size:330px;}

      /* format chips for S5 */
      .chips{display:flex;justify-content:center;gap:34px;margin-top:60px;}
      .chip{font-family:"BebasNeue",sans-serif;font-size:54px;letter-spacing:.12em;color:var(--purple);
        background:var(--yellow);padding:18px 32px;border:5px solid var(--ink);
        box-shadow:10px 10px 0 var(--ink);transform:rotate(-3deg);}
      .chip:nth-child(2){background:var(--cyan);transform:rotate(2deg);}
      .chip:nth-child(3){background:var(--cream);transform:rotate(-2deg);}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">

      <!-- persistent layers -->
      <div class="bg"></div>
      <div class="rays" id="rays">
        <svg viewBox="-1200 -1200 2400 2400">
          <g id="rayGroup">
            <!-- generated below in JS for determinism -->
          </g>
        </svg>
      </div>
      <div class="halftone"></div>
      <div class="grain"></div>
      <div class="scanlines"></div>
      <div class="credit">XOTION · 2026 · MOTION IS A PROMPT</div>

      <!-- SCENES -->
      <div class="scene s1" id="s1">
        <div class="top kicker">Your prompt is your</div>
        <div class="hero">SUPER<span class="line2">POWER</span></div>
      </div>

      <div class="scene s2" id="s2">
        <div class="top kicker">Forget</div>
        <div class="hero">DRAGGING<span class="line2">CLIPS</span></div>
        <div class="bot sub">no timelines · no keyframes</div>
      </div>

      <div class="scene s3" id="s3">
        <div class="top kicker">Just</div>
        <div class="hero">PROMPT<span class="line2">IT</span></div>
        <div class="bot sub">and watch it move</div>
      </div>

      <div class="scene s4" id="s4">
        <div class="top kicker">Every prompt</div>
        <div class="hero">BECOMES<span class="line2">MOTION</span></div>
      </div>

      <div class="scene s5" id="s5">
        <div class="top kicker">Any</div>
        <div class="hero">FORMAT</div>
        <div class="bot">
          <div class="chips">
            <div class="chip">MP4</div>
            <div class="chip">WEBM</div>
            <div class="chip">GIF</div>
          </div>
        </div>
      </div>

      <div class="scene s6" id="s6">
        <div class="top kicker">To make is to</div>
        <div class="hero">BEGIN<span class="line2">ANEW</span></div>
        <div class="bot sub">XOTION · START FREE</div>
      </div>
    </div>

    <script>
      Rich.css();

      /* ============ Generate sunburst rays deterministically ============ */
      const rayGroup = document.getElementById('rayGroup');
      const N_RAYS = 36;
      let raysSvg = '';
      for (let i = 0; i < N_RAYS; i++) {
        const angle = (i * 360 / N_RAYS);
        // alternate ray widths for richness
        const width = (i % 3 === 0) ? 52 : 36;
        const color = (i % 4 === 0) ? '#F5E531' : '#5DD0E5';
        const opacity = 0.42 + (i % 5) * 0.06;
        raysSvg += `<polygon points="0,0 ${width/2},-1200 -${width/2},-1200" fill="${color}" opacity="${opacity}" transform="rotate(${angle})"/>`;
      }
      rayGroup.innerHTML = raysSvg;

      /* ============ MAIN TIMELINE (paused) ============ */
      const tl = gsap.timeline({paused:true});
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      /* persistent ray rotation (deterministic — slow continuous spin) */
      const rays = document.getElementById('rays');
      tl.to(rays, {rotation: 30, duration: 30, ease: "none"}, 0);

      /* Scene helper: hard-cut visibility + element entrance + idle */
      function showScene(el, s, e) {
        gsap.set(el, {visibility:"hidden", opacity:0});
        tl.set(el, {visibility:"visible"}, s);
        tl.to(el, {opacity:1, duration:.25, ease:"power2.out"}, s);
        tl.to(el, {opacity:0, duration:.30, ease:"power2.in"}, e-0.30);
        tl.set(el, {visibility:"hidden"}, e);
      }

      /* Apply scene-by-scene entrances with screen-print slam + jitter idle */
      const SCENES = ['s1','s2','s3','s4','s5','s6'];
      SCENES.forEach((id, i) => {
        const start = i * 5.0, end = (i+1) * 5.0;
        const el = document.getElementById(id);
        showScene(el, start, end);
        const kicker = el.querySelector('.kicker');
        const hero = el.querySelector('.hero');
        const sub = el.querySelector('.bot');

        if (kicker) {
          Rich.enter(kicker, tl, start + 0.10, 'drop');
          Rich.idle(kicker, tl, start + 0.7, end - 0.4, {scale:.015, x:5, y:3, rot:.6});
        }
        if (hero) {
          /* slam — screen-print style: heavy back.out overshoot */
          gsap.set(hero, {scale:.45, opacity:0, rotation:-2});
          tl.to(hero, {scale:1, opacity:1, rotation:0, duration:.55, ease:"back.out(2.4)"}, start + 0.35);
          Rich.idle(hero, tl, start + 1.0, end - 0.4, {scale:.025, x:8, y:6, rot:1.5});
        }
        if (sub) {
          Rich.enter(sub, tl, start + 0.85, 'rise');
          Rich.idle(sub, tl, start + 1.4, end - 0.4, {scale:.02, x:6, y:4, rot:.8});
        }
      });

      /* persistent credit subtle idle */
      const credit = document.querySelector('.credit');
      Rich.idle(credit, tl, 1, 29, {scale:.02, x:4, y:3, rot:.4});
    </script>
  </body>
</html>
