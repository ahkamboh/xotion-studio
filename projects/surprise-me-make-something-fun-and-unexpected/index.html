<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:'Titan'; src:url('assets/fonts/titan-one-400.ttf') format('truetype'); font-weight:400; }
      @font-face { font-family:'Bungee'; src:url('assets/fonts/bungee-400.ttf') format('truetype'); font-weight:400; }
      @font-face { font-family:'Poppins'; src:url('assets/fonts/poppins-800.ttf') format('truetype'); font-weight:800; }
      @font-face { font-family:'Poppins'; src:url('assets/fonts/poppins-700.ttf') format('truetype'); font-weight:700; }
      @font-face { font-family:'Poppins'; src:url('assets/fonts/poppins-500.ttf') format('truetype'); font-weight:500; }
      @font-face { font-family:'Grotesk'; src:url('assets/fonts/space-grotesk-600.ttf') format('truetype'); font-weight:600; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1920px; height:1080px; overflow:hidden; background:#1c0e3f; }
      #root { position:relative; width:1920px; height:1080px; font-family:'Poppins',sans-serif; }
      .layer { position:absolute; inset:0; }
      .blob { position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; }
      .dots { position:absolute; inset:-40px; background-image:radial-gradient(rgba(255,255,255,.10) 2px, transparent 2.5px); background-size:46px 46px; opacity:.5; }
      .machine { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1080px; }
      .cabinet { position:relative; border-radius:48px; padding:34px 40px 44px;
        background:linear-gradient(160deg,#ff5d9e,#ff8a3d);
        border:10px solid #fff;
        box-shadow:0 26px 0 rgba(0,0,0,.28), 0 60px 90px rgba(0,0,0,.45), inset 0 0 0 4px rgba(255,255,255,.25); }
      .marquee { text-align:center; font-family:'Bungee'; font-size:62px; line-height:1; color:#fff;
        letter-spacing:1px; -webkit-text-stroke:3px #2a0d4d; text-shadow:0 5px 0 #2a0d4d; margin-bottom:6px; }
      .marquee .m { display:inline-block; }
      .sub { text-align:center; font-family:'Grotesk'; font-weight:600; font-size:21px; letter-spacing:4px;
        color:rgba(42,13,77,.7); margin-bottom:22px; text-transform:uppercase; }
      .winwrap { position:relative; display:flex; justify-content:center; }
      .reelwin { position:relative; width:520px; height:240px; border-radius:28px; overflow:hidden;
        background:#fff8e7;
        border:8px solid #2a0d4d; box-shadow:inset 0 14px 26px rgba(0,0,0,.22), inset 0 -14px 26px rgba(0,0,0,.18); }
      .reelfade { position:absolute; left:0; right:0; height:60px; z-index:3; pointer-events:none; }
      .reelfade.t { top:0; background:linear-gradient(#fff8e7,rgba(255,248,231,0)); }
      .reelfade.b { bottom:0; background:linear-gradient(rgba(255,248,231,0),#fff8e7); }
      .strip { position:absolute; left:0; top:0; width:100%; will-change:transform; }
      .cell { height:240px; display:flex; align-items:center; justify-content:center; }
      .token { width:170px; height:170px; border-radius:36px; display:flex; align-items:center; justify-content:center;
        font-size:104px; box-shadow:0 10px 0 rgba(0,0,0,.18); }
      .lever { position:absolute; right:-86px; top:38px; width:54px; }
      .lever .rod { width:14px; height:150px; margin:0 auto; border-radius:8px;
        background:linear-gradient(#cfd6e6,#8a93ad); box-shadow:inset -3px 0 0 rgba(0,0,0,.2); transform-origin:50% 100%; }
      .lever .knob { width:54px; height:54px; border-radius:50%; margin:0 auto -6px;
        background:radial-gradient(circle at 34% 30%,#ff7aa8,#e11d63); box-shadow:0 8px 0 #8c0f3d, 0 0 0 6px #fff; }
      .lever .base { width:42px; height:26px; margin:0 auto; border-radius:0 0 12px 12px; background:#2a0d4d; }
      .badge { position:absolute; left:-26px; top:-22px; font-family:'Bungee'; font-size:24px; color:#2a0d4d;
        background:#ffd23f; padding:12px 20px; border-radius:18px; border:5px solid #fff;
        box-shadow:0 8px 0 rgba(0,0,0,.25); transform:rotate(-7deg); }
      .factcard { position:absolute; left:50%; bottom:-150px; transform:translateX(-50%); width:1000px;
        background:#ffffff; border-radius:30px; padding:30px 44px; border:7px solid #2a0d4d;
        box-shadow:0 16px 0 rgba(0,0,0,.25); }
      .factslot { position:relative; min-height:140px; display:flex; align-items:center; justify-content:center; }
      .fact { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center;
        font-family:'Poppins'; font-weight:800; font-size:50px; line-height:1.12; color:#2a0d4d; }
      .fact .w { display:inline-block; margin:0 .12em; }
      .fact .hl { color:#e11d63; }
      .conf { position:absolute; left:0; top:0; will-change:transform; border-radius:3px; }
      .finale { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; opacity:0; }
      .finale .big { font-family:'Titan'; font-size:170px; line-height:.9; color:#ffd23f;
        -webkit-text-stroke:6px #2a0d4d; text-shadow:0 10px 0 #2a0d4d, 0 0 60px rgba(255,210,63,.6); }
      .finale .tag { margin-top:18px; font-family:'Poppins'; font-weight:700; font-size:30px; color:#fff; }
      .finale .tag em { color:#ff8ab4; font-style:normal; }
      .credit { position:absolute; left:50%; bottom:54px; transform:translateX(-50%); font-family:'Grotesk';
        font-weight:600; letter-spacing:3px; font-size:20px; color:rgba(255,255,255,.65); text-transform:uppercase; opacity:0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <audio id="sfx" data-start="0" data-duration="16" data-track-index="0" src="assets/master.wav" data-volume="1"></audio>
      <div class="layer" id="bg">
        <div class="blob" id="b1" style="width:640px;height:640px;left:-120px;top:-160px;background:#ff4d8d;"></div>
        <div class="blob" id="b2" style="width:720px;height:720px;right:-160px;bottom:-200px;background:#21d4d4;"></div>
        <div class="blob" id="b3" style="width:520px;height:520px;right:240px;top:-180px;background:#ffd23f;opacity:.4;"></div>
        <div class="dots"></div>
      </div>
      <div class="conflayer layer" id="conflayer"></div>
      <div class="machine" id="machine">
        <div class="cabinet" id="cabinet">
          <div class="badgewrap">
            <div class="badge" id="bdg1">FACT #01</div>
            <div class="badge" id="bdg2" style="opacity:0">FACT #02</div>
            <div class="badge" id="bdg3" style="opacity:0">FACT #03</div>
          </div>
          <div class="marquee" id="marquee"></div>
          <div class="sub" id="sub">★ the fun-fact machine ★</div>
          <div class="winwrap">
            <div class="reelwin" id="reelwin">
              <div class="reelfade t"></div>
              <div class="reelfade b"></div>
              <!-- strips injected -->
            </div>
            <div class="lever" id="lever">
              <div class="knob"></div>
              <div class="rod" id="rod"></div>
              <div class="base"></div>
            </div>
          </div>
        </div>
        <div class="factcard" id="factcard" style="opacity:0">
          <div class="factslot" id="factslot"></div>
        </div>
      </div>
      <div class="finale" id="finale">
        <div class="big">MIND<br/>= BLOWN</div>
        <div class="tag">you said <em>"surprise me"</em> — so I built you a machine 🤖</div>
      </div>
      <div class="credit" id="credit">xotion studio · fun-fact machine</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const root = document.querySelector('[data-composition-id="main"]');
      const $ = s => root.querySelector(s);
      const $$ = s => Array.from(root.querySelectorAll(s));

      // ---- deterministic RNG ----
      let _s = 0x2f6e2b1;
      const rnd = () => { _s = (_s*1103515245 + 12345) & 0x7fffffff; return _s/0x7fffffff; };
      const pick = a => a[Math.floor(rnd()*a.length)];

      const PALETTE = ['#ff4d8d','#ffd23f','#21d4d4','#9be564','#ff8a3d','#7a5cff','#ff6b6b'];
      const FILLER = ['🎲','🍕','🚀','🌈','🦖','🎸','🐢','🍩','⚡','🎈','🛸','🐝','🍔','🎺','🪩','🦄','🧩','🌮','🎁','🪐','🐙','🍌'];

      // ---- build emoji reel strips (one per round, last cell = target) ----
      const ITEMH = 240, VISIBLE = 14;
      const reelwin = $('#reelwin');
      const rounds = [
        { emoji:'🐙', color:'#21d4d4' },
        { emoji:'🍌', color:'#ffd23f' },
        { emoji:'🪐', color:'#7a5cff' },
      ];
      const strips = [];
      rounds.forEach((r,i)=>{
        const strip = document.createElement('div');
        strip.className = 'strip';
        strip.style.opacity = i===0 ? '1' : '0';
        for (let k=0;k<VISIBLE;k++){
          const cell = document.createElement('div'); cell.className='cell';
          const tok = document.createElement('div'); tok.className='token';
          const isLast = (k===VISIBLE-1);
          tok.style.background = isLast ? '#fff' : pick(PALETTE);
          tok.textContent = isLast ? r.emoji : (k===0 ? '❓' : pick(FILLER));
          if (isLast) tok.style.boxShadow = '0 10px 0 rgba(0,0,0,.18), 0 0 0 6px '+r.color;
          cell.appendChild(tok); strip.appendChild(cell);
        }
        reelwin.appendChild(strip); strips.push(strip);
      });

      // ---- marquee letters ----
      const mq = $('#marquee'); const MTXT='SURPRISE!';
      MTXT.split('').forEach(ch=>{ const sp=document.createElement('span'); sp.className='m';
        sp.textContent = ch===' '?' ':ch; sp.style.color = pick(['#fff','#ffd23f','#fff','#fff']); mq.appendChild(sp); });
      const mletters = $$('#marquee .m');

      // ---- fact cards ----
      const facts = [
        [['Octopuses',0],['have',0],['three',1],['hearts',1],['—',0],['and',0],['blue',1],['blood.',1]],
        [['Bananas',1],['are',0],['berries.',1],['Strawberries',1],['are',0],['not.',1]],
        [['A',0],['day',1],['on',0],['Venus',1],['is',0],['longer',1],['than',0],['its',0],['whole',1],['year.',1]],
      ];
      const slot = $('#factslot'); const factEls = [];
      facts.forEach((f,i)=>{
        const fd = document.createElement('div'); fd.className='fact'; fd.style.opacity='0';
        f.forEach(([w,hl])=>{ const sp=document.createElement('span'); sp.className='w'+(hl?' hl':''); sp.textContent=w; fd.appendChild(sp); });
        slot.appendChild(fd); factEls.push(fd);
      });

      // ---- confetti bursts ----
      const conflayer = $('#conflayer');
      const CX = 960, CY = 470;
      function makeBurst(n, spread, big){
        const pieces = [];
        for (let i=0;i<n;i++){
          const p = document.createElement('div'); p.className='conf';
          const sz = (big?10:7) + rnd()*(big?16:11);
          p.style.width = sz+'px'; p.style.height = (sz*0.6)+'px';
          p.style.background = pick(PALETTE);
          if (rnd()>0.6) p.style.borderRadius='50%';
          p.style.opacity='0';
          conflayer.appendChild(p);
          const ang = rnd()*Math.PI*2;
          const dist = spread*(0.35+rnd()*0.85);
          pieces.push({ el:p, x:Math.cos(ang)*dist, y:Math.sin(ang)*dist - spread*0.25, rot:(rnd()*720-360) });
        }
        return pieces;
      }
      function fire(tl, pieces, t, cx, cy){
        pieces.forEach(p=>{
          tl.fromTo(p.el, { x:cx, y:cy, scale:0, opacity:1, rotation:0 },
            { x:cx+p.x, y:cy+p.y, scale:1, rotation:p.rot, duration:0.9, ease:'power3.out' }, t);
          tl.to(p.el, { y:'+='+(140+rnd()*120), opacity:0, duration:0.8, ease:'power1.in' }, t+0.55);
        });
      }

      // ============ TIMELINE ============
      const tl = gsap.timeline({ paused:true });
      gsap.set('[data-composition-id="main"] #machine', { transformOrigin:'50% 50%' });

      // intro
      tl.from('[data-composition-id="main"] #cabinet', { scale:0.2, opacity:0, y:60, duration:0.9, ease:'back.out(1.6)' }, 0.15);
      tl.from(mletters, { opacity:0, y:-50, scale:0.3, rotation:-12, stagger:0.05, duration:0.5, ease:'back.out(2.4)' }, 0.5);
      tl.from('[data-composition-id="main"] #sub', { opacity:0, y:14, duration:0.5 }, 0.95);
      tl.from('[data-composition-id="main"] #lever', { opacity:0, x:-30, duration:0.5, ease:'power2.out' }, 0.9);
      tl.from('[data-composition-id="main"] #bdg1', { opacity:0, scale:0, rotation:40, duration:0.5, ease:'back.out(2)' }, 1.1);

      // ambient: floating machine + blobs (finite yoyo)
      tl.to('[data-composition-id="main"] #machine', { y:'-=16', duration:1.6, ease:'sine.inOut', yoyo:true, repeat:9 }, 0);
      tl.to('[data-composition-id="main"] #b1', { x:60, y:40, duration:3.2, ease:'sine.inOut', yoyo:true, repeat:5 }, 0);
      tl.to('[data-composition-id="main"] #b2', { x:-70, y:-30, duration:3.8, ease:'sine.inOut', yoyo:true, repeat:4 }, 0);
      tl.to('[data-composition-id="main"] #b3', { x:40, y:60, duration:2.9, ease:'sine.inOut', yoyo:true, repeat:5 }, 0);

      const rod = $('#rod');
      const ROUND = [2.2, 5.9, 9.6];
      const badges = ['#bdg1','#bdg2','#bdg3'];
      const bursts = [ makeBurst(34,360,false), makeBurst(34,360,false), makeBurst(34,380,false) ];

      rounds.forEach((r,i)=>{
        const pT = ROUND[i];
        const spinDur = 1.15;
        const lockT = pT + 0.18 + spinDur;
        const strip = strips[i];
        const land = -(VISIBLE-1)*ITEMH;

        // lever pull
        tl.to(rod, { rotation:42, duration:0.16, ease:'power2.in' }, pT);
        tl.to(rod, { rotation:0, duration:0.6, ease:'elastic.out(1,0.4)' }, pT+0.2);

        // activate strip; hide previous fact + badge
        if (i>0){
          tl.to('[data-composition-id="main"] #factcard', { y:30, opacity:0, duration:0.25, ease:'power2.in' }, pT);
          tl.to(factEls[i-1], { opacity:0, duration:0.2 }, pT);
          tl.set(strips[i-1], { opacity:0 }, pT+0.18);
          tl.set(badges[i-1], { opacity:0 }, pT+0.18);
          tl.fromTo(badges[i], { opacity:0, scale:0, rotation:40 }, { opacity:1, scale:1, rotation:0, duration:0.4, ease:'back.out(2)' }, pT+0.18);
        }
        tl.set(strip, { opacity:1, y:0 }, pT+0.18);

        // spin: fast -> decelerate -> clunk overshoot
        tl.fromTo(strip, { y:0 }, { y:land, duration:spinDur, ease:'power4.out' }, pT+0.18);
        tl.to(strip, { y:land+20, duration:0.1, ease:'sine.out' }, lockT);
        tl.to(strip, { y:land, duration:0.22, ease:'back.out(3.5)' }, lockT+0.1);

        // lock: shake + window pulse + confetti
        tl.fromTo('[data-composition-id="main"] #cabinet', { x:-9 }, { x:0, duration:0.55, ease:'elastic.out(1,0.3)' }, lockT);
        tl.fromTo(reelwin, { scale:1 }, { scale:1.07, duration:0.12, yoyo:true, repeat:1, ease:'power2.out' }, lockT);
        fire(tl, bursts[i], lockT+0.02, CX, CY);

        // reveal fact card + words
        const revT = lockT + 0.18;
        tl.fromTo('[data-composition-id="main"] #factcard', { y:40, opacity:0 }, { y:0, opacity:1, duration:0.4, ease:'back.out(1.7)' }, revT);
        tl.set(factEls[i], { opacity:1 }, revT);
        tl.fromTo(factEls[i].querySelectorAll('.w'),
          { opacity:0, y:26, filter:'blur(7px)' },
          { opacity:1, y:0, filter:'blur(0px)', stagger:0.045, duration:0.5, ease:'power3.out' }, revT+0.03);
      });

      // ============ FINALE ============
      const fT = 13.3;
      tl.to('[data-composition-id="main"] #factcard', { y:30, opacity:0, duration:0.3, ease:'power2.in' }, fT-0.1);
      tl.to('[data-composition-id="main"] #cabinet', { x:6, duration:0.05, yoyo:true, repeat:6, ease:'none' }, fT-0.4);
      tl.to('[data-composition-id="main"] #machine', { scale:0.72, y:'+=20', rotation:-3, opacity:0.0, duration:0.55, ease:'power3.in' }, fT);

      const finale = $('#finale');
      tl.set(finale, { opacity:1 }, fT+0.45);
      tl.fromTo('[data-composition-id="main"] #finale .big',
        { scale:2.4, opacity:0, rotation:8 }, { scale:1, opacity:1, rotation:0, duration:0.6, ease:'back.out(1.8)' }, fT+0.45);
      tl.fromTo('[data-composition-id="main"] #finale .big',
        { y:-10 }, { y:0, duration:0.5, ease:'elastic.out(1,0.35)' }, fT+0.7);
      tl.fromTo('[data-composition-id="main"] #finale .tag',
        { opacity:0, y:24 }, { opacity:1, y:0, duration:0.5, ease:'power3.out' }, fT+0.95);
      tl.fromTo('[data-composition-id="main"] #credit',
        { opacity:0, y:14 }, { opacity:0.65, y:0, duration:0.5 }, fT+1.3);

      fire(tl, makeBurst(70, 720, true), fT+0.5, CX, 540);
      fire(tl, makeBurst(50, 600, true), fT+1.1, CX, 540);

      tl.to('[data-composition-id="main"] #finale .big', { scale:1.04, duration:0.9, ease:'sine.inOut', yoyo:true, repeat:2 }, fT+1.2);

      // hold to full duration
      tl.set('[data-composition-id="main"] #credit', {}, 16);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
