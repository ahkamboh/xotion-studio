<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ANDHERE SE — Thumbnail (editorial)</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Playfair';src:url('assets/fonts/playfair-display-900.ttf');font-weight:900;font-display:block}
@font-face{font-family:'Oswald';src:url('assets/fonts/oswald-500.ttf');font-weight:500;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
#root{position:relative;width:1280px;height:720px;overflow:hidden;font-family:'Oswald',sans-serif;color:#f4efe6}
.fill{position:absolute;inset:0;width:1280px;height:720px}
#bg{background-image:url('assets/bg.jpg');background-size:cover;background-position:center;filter:contrast(1.12) saturate(1.05) brightness(.92)}
#grade{background:linear-gradient(180deg, rgba(8,2,2,.45) 0%, rgba(6,1,1,.12) 30%, rgba(6,1,1,.2) 62%, rgba(4,0,0,.72) 100%)}
#grain{opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:360px}
#vig{box-shadow:inset 0 0 220px 60px rgba(0,0,0,.55)}
/* big editorial serif title — spans width, sits OVER the subject */
#title{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;
  font-family:'Playfair';font-weight:900;font-size:150px;line-height:.9;letter-spacing:2px;white-space:nowrap;
  background:linear-gradient(180deg,#ffffff 0%,#fff1ee 30%,#ff3528 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 26px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(255,53,40,.25))}
/* tiny editorial caption row */
#cap{position:absolute;left:48px;right:48px;bottom:30px;display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald';font-weight:500;font-size:15px;letter-spacing:4px;color:#e7ddcd;text-transform:uppercase;opacity:.86;text-shadow:0 2px 8px rgba(0,0,0,.9)}
#cap .c{color:#ff5247}
/* small crest top-right */
#logo{position:absolute;right:40px;top:30px;width:74px;height:74px;opacity:.9;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720">
  <div id="bg" class="fill"></div>
  <div id="grade" class="fill"></div>
  <div id="vig" class="fill"></div>
  <div id="grain" class="fill"></div>

  <img id="logo" src="assets/logo.png" alt="KAMBOJH">
  <div id="title">ANDHERE SE</div>
  <div id="cap">
    <span>∞&nbsp;&nbsp;ANDHERE SE</span>
    <span class="c">INDIE HIP HOP × SAD</span>
    <span>NOT REAL, YET. ©2026</span>
  </div>
</div>
<script>const tl=gsap.timeline({paused:true});window.__timelines={main:tl};tl.to({},{duration:1});tl.pause(0);</script>
</body>
</html>
