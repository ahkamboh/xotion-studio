<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- Scene B — "WATCH IT EDIT" — dark premium video editor UI. Deterministic HyperFrames composition. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @font-face { font-family:"Inter"; font-weight:400; src:url("assets/fonts/inter-400.ttf") format("truetype"); }
  @font-face { font-family:"Inter"; font-weight:500; src:url("assets/fonts/inter-500.ttf") format("truetype"); }
  @font-face { font-family:"Inter"; font-weight:600; src:url("assets/fonts/inter-600.ttf") format("truetype"); }
  @font-face { font-family:"Inter"; font-weight:700; src:url("assets/fonts/inter-700.ttf") format("truetype"); }
  @font-face { font-family:"JBMono"; font-weight:500; src:url("assets/fonts/jetbrains-500.ttf") format("truetype"); }

  :root{
    --bg:#0c0d10; --bg2:#101216; --panel:#16181d; --panel2:#1b1e24;
    --border:#262a31; --border2:#30343c; --text:#f2f3f5; --sub:#9aa1ab; --faint:#6b7178;
    --accent:#e0451f; --accent2:#ff6a3d; --accentglow:rgba(224,69,31,.35);
    --green:#34c759; --rail:#23262d;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
  #root{ position:relative; width:1920px; height:1080px; overflow:hidden;
    background:var(--bg); font-family:"Inter",sans-serif; color:var(--text); }

  /* root atmosphere: radial accent glow + faint dotted grid (never flat black) */
  .bg-glow{ position:absolute; left:50%; top:-180px; width:1500px; height:900px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse 60% 55% at 50% 0%, var(--accentglow), rgba(224,69,31,0) 70%);
    opacity:.55; pointer-events:none; filter:blur(6px); }
  .bg-grid{ position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.03) 1.4px, transparent 1.4px);
    background-size:34px 34px; }

  .mono{ font-family:"JBMono",monospace; }

  /* ── editor shell ── */
  .editor{ position:absolute; left:60px; top:48px; width:1800px; height:984px;
    background:var(--panel); border:1.5px solid var(--border); border-radius:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.5); overflow:hidden; opacity:0; }

  /* top bar */
  .topbar{ position:absolute; left:0; top:0; width:100%; height:70px;
    border-bottom:1px solid var(--border); display:flex; align-items:center;
    padding:0 28px; }
  .tb-left{ display:flex; align-items:center; gap:12px; }
  .tb-brand{ font-family:"JBMono",monospace; font-weight:500; font-size:21px;
    color:var(--text); letter-spacing:.01em; }
  .tb-dot{ width:5px; height:5px; border-radius:50%; background:var(--faint); }
  .tb-file{ font-family:"JBMono",monospace; font-weight:500; font-size:17px; color:var(--sub); }
  .tb-right{ margin-left:auto; display:flex; align-items:center; gap:14px; }
  .render-btn{ display:flex; align-items:center; gap:9px;
    border:1.5px solid var(--accent); color:var(--accent2);
    border-radius:9999px; padding:9px 20px; font-weight:600; font-size:16px; }
  .render-btn .rb-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); }

  /* render progress track under topbar (hidden until beat 6) */
  .progress-wrap{ position:absolute; left:0; top:70px; width:100%; height:30px;
    display:flex; align-items:center; gap:16px; padding:0 28px;
    border-bottom:1px solid var(--border); background:var(--bg2); opacity:0; }
  .progress-label{ font-family:"JBMono",monospace; font-size:13px; color:var(--sub);
    white-space:nowrap; min-width:188px; }
  .progress-track{ flex:1; height:6px; border-radius:9999px; background:var(--rail); overflow:hidden; }
  .progress-fill{ width:0%; height:100%; border-radius:9999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    box-shadow:0 0 14px var(--accentglow); }

  /* preview pane */
  .preview-shell{ position:absolute; left:50%; top:108px; transform:translateX(-50%);
    width:1080px; height:608px; }
  .preview{ position:relative; width:100%; height:100%; border-radius:16px;
    border:1px solid var(--border2); overflow:hidden; background:#1a120c;
    box-shadow:0 18px 50px rgba(0,0,0,.45); transform-origin:50% 50%; }
  /* base warm gradient (neutral-ish left side reference) */
  .pv-base{ position:absolute; inset:0;
    background:linear-gradient(125deg,#e0451f 0%,#ff8a3d 46%,#ffd28a 100%); }
  /* graded layer (richer/warmer) revealed by clip-path seam, right side */
  .pv-graded{ position:absolute; inset:0;
    background:linear-gradient(125deg,#c8330f 0%,#ff6a1f 40%,#ffb84d 78%,#ffe7b0 100%);
    filter:saturate(1.5) contrast(1.12) brightness(1.04);
    clip-path:inset(0 100% 0 0); }
  /* moving soft light blob (deterministic sine motion, driven per-frame) */
  .pv-blob{ position:absolute; width:560px; height:560px; left:0; top:0;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,240,210,.9), rgba(255,200,140,0) 62%);
    mix-blend-mode:screen; filter:blur(8px); }
  /* LUT seam line */
  .pv-seam{ position:absolute; top:0; bottom:0; width:2px; left:-10px;
    background:linear-gradient(180deg, rgba(255,255,255,.0), rgba(255,255,255,.85), rgba(255,255,255,.0));
    box-shadow:0 0 16px rgba(255,255,255,.5); opacity:0; }
  /* subtle film vignette on preview */
  .pv-vig{ position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 120px rgba(0,0,0,.4); border-radius:16px; }

  /* lower-third caption bar on preview */
  .pv-caption{ position:absolute; left:50%; bottom:42px; transform:translateX(-50%);
    display:flex; align-items:center; padding:13px 26px; border-radius:12px;
    background:rgba(8,9,11,.62); backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.14); opacity:0; }
  .pv-caption .cap-text{ font-weight:600; font-size:28px; color:#ffffff; letter-spacing:.005em; }
  .pv-caption .cap-text span{ opacity:0; }

  /* timeline area */
  .timeline{ position:absolute; left:28px; right:28px; bottom:26px; height:282px;
    background:var(--panel2); border:1px solid var(--border); border-radius:14px;
    padding:14px 18px 16px; }
  .tl-ruler{ position:relative; height:24px; margin-left:74px; border-bottom:1px solid var(--border);
    display:flex; align-items:flex-end; }
  .tl-tick{ position:absolute; bottom:0; font-family:"JBMono",monospace; font-size:12px;
    color:var(--faint); transform:translateX(-50%); padding-bottom:5px; }
  .tl-tickmark{ position:absolute; bottom:0; width:1px; height:7px; background:var(--border2);
    transform:translateX(-50%); }
  .tl-row{ position:relative; height:64px; margin-top:14px; display:flex; align-items:center; }
  .tl-label{ width:62px; flex:none; font-family:"JBMono",monospace; font-size:14px;
    font-weight:500; color:var(--sub); text-align:left; }
  .tl-track{ position:relative; flex:1; height:56px; margin-left:12px;
    background:var(--rail); border-radius:8px; overflow:hidden; }
  .clip{ position:absolute; top:6px; height:44px; border-radius:7px;
    border:1px solid rgba(255,255,255,.14); opacity:0;
    box-shadow:0 4px 12px rgba(0,0,0,.35); overflow:hidden; }
  .clip .clip-grad{ position:absolute; inset:0; }
  .clip .clip-name{ position:absolute; left:9px; top:6px; font-family:"JBMono",monospace;
    font-size:11px; color:rgba(255,255,255,.92); font-weight:500; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .clip .clip-strip{ position:absolute; left:0; right:0; bottom:0; height:11px;
    background:repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 5px, rgba(255,255,255,.08) 5px 10px); }

  /* audio waveform bars in A1 */
  .wave{ position:absolute; left:10px; right:10px; top:0; bottom:0; display:flex;
    align-items:center; gap:2px; }
  .wbar{ flex:1; height:42px; border-radius:2px;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    transform:scaleY(0); transform-origin:50% 50%; opacity:.92; }

  /* playhead */
  .playhead{ position:absolute; top:8px; bottom:14px; width:2px; left:74px;
    background:var(--accent); box-shadow:0 0 10px var(--accentglow); z-index:6; }
  .playhead::before{ content:""; position:absolute; top:-2px; left:-5px; width:12px; height:12px;
    border-radius:3px; background:var(--accent); box-shadow:0 0 8px var(--accentglow); }

  /* action chips row */
  .chips{ position:absolute; left:28px; bottom:320px; display:flex; gap:12px; }
  .chip{ display:flex; align-items:center; gap:9px; padding:9px 18px; border-radius:9999px;
    background:var(--panel2); border:1px solid var(--border2);
    font-weight:500; font-size:16px; color:var(--sub); opacity:0; }
  .chip .ck{ width:18px; height:18px; border-radius:50%; flex:none;
    border:2px solid var(--faint); position:relative; display:flex; align-items:center; justify-content:center; }
  .chip .ck svg{ width:11px; height:11px; opacity:0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="editor" id="editor">
    <!-- top bar -->
    <div class="topbar">
      <div class="tb-left">
        <div class="tb-brand">xotion</div>
        <div class="tb-dot"></div>
        <div class="tb-file">launch-video.mp4</div>
      </div>
      <div class="tb-right">
        <div class="render-btn"><span class="rb-dot"></span>Render 4K</div>
      </div>
    </div>

    <!-- render progress track (hidden until beat 6) -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label mono" id="progressLabel">Rendering 4K&nbsp;&nbsp;0%</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- preview -->
    <div class="preview-shell">
      <div class="preview" id="preview">
        <div class="pv-base"></div>
        <div class="pv-graded" id="pvGraded"></div>
        <div class="pv-blob" id="pvBlob"></div>
        <div class="pv-seam" id="pvSeam"></div>
        <div class="pv-vig"></div>
        <div class="pv-caption" id="pvCaption">
          <div class="cap-text" id="capText"></div>
        </div>
      </div>
    </div>

    <!-- action chips -->
    <div class="chips" id="chips">
      <div class="chip" id="chipImport"><span class="ck" id="ckImport"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Import</div>
      <div class="chip" id="chipReframe"><span class="ck" id="ckReframe"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Auto-reframe</div>
      <div class="chip" id="chipCaptions"><span class="ck" id="ckCaptions"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Captions</div>
      <div class="chip" id="chipGrade"><span class="ck" id="ckGrade"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Color grade</div>
      <div class="chip" id="chipMusic"><span class="ck" id="ckMusic"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Music</div>
    </div>

    <!-- timeline -->
    <div class="timeline">
      <div class="tl-ruler" id="tlRuler"></div>
      <div class="tl-row">
        <div class="tl-label">V1</div>
        <div class="tl-track" id="trackV1"></div>
      </div>
      <div class="tl-row">
        <div class="tl-label">A1</div>
        <div class="tl-track" id="trackA1">
          <div class="wave" id="wave"></div>
        </div>
      </div>
      <div class="playhead" id="playhead"></div>
    </div>
  </div>
</div>

<script>
  const Q = s => document.querySelector('[data-composition-id="main"] ' + s);

  /* ---------- deterministic data (fixed arrays, no randomness) ---------- */
  // four warm clip thumbnails for V1
  const CLIPS = [
    { name:"intro",  g:"linear-gradient(135deg,#e0451f,#ff8a3d)" },
    { name:"hook",   g:"linear-gradient(135deg,#ff6a3d,#ffb04d)" },
    { name:"demo",   g:"linear-gradient(135deg,#d63a14,#ff7a2e)" },
    { name:"cta",    g:"linear-gradient(135deg,#ff8030,#ffd28a)" },
  ];
  // V1 track geometry (percent of track width)
  const CLIP_LAYOUT = [ {l:1,w:23}, {l:25.5,w:22}, {l:49,w:24}, {l:74.5,w:24} ];

  // build V1 clips
  const trackV1 = Q('#trackV1');
  CLIPS.forEach((c,i)=>{
    const el = document.createElement('div');
    el.className = 'clip';
    el.id = 'clip'+i;
    el.style.left = CLIP_LAYOUT[i].l + '%';
    el.style.width = CLIP_LAYOUT[i].w + '%';
    el.innerHTML = '<div class="clip-grad" style="background:'+c.g+'"></div>'
                 + '<div class="clip-name">'+c.name+'</div>'
                 + '<div class="clip-strip"></div>';
    trackV1.appendChild(el);
  });

  // ruler ticks
  const TICKS = ["0:00","0:08","0:16","0:24"];
  const tlRuler = Q('#tlRuler');
  TICKS.forEach((t,i)=>{
    const pct = i/(TICKS.length-1)*100;
    const mark = document.createElement('div');
    mark.className='tl-tickmark'; mark.style.left = pct+'%';
    const lab = document.createElement('div');
    lab.className='tl-tick mono'; lab.style.left = pct+'%'; lab.textContent = t;
    // keep edge labels inside
    if(i===0){ lab.style.transform='translateX(0)'; lab.style.left='0%'; }
    if(i===TICKS.length-1){ lab.style.transform='translateX(-100%)'; lab.style.left='100%'; }
    tlRuler.appendChild(mark); tlRuler.appendChild(lab);
  });

  // caption words (typed one-by-one)
  const CAP_WORDS = ["your","launch","starts","now"];
  const capText = Q('#capText');
  CAP_WORDS.forEach((w,i)=>{
    const s = document.createElement('span');
    s.textContent = (i>0?' ':'') + w;
    capText.appendChild(s);
  });
  const capSpans = capText.querySelectorAll('span');

  // waveform bars (deterministic heights via sine-ish fixed formula)
  const NBARS = 84;
  const wave = Q('#wave');
  const waveBars = [];
  for(let i=0;i<NBARS;i++){
    const b = document.createElement('div');
    b.className='wbar';
    // deterministic pseudo-amplitude: layered sines, normalized 0.22..1
    const a = 0.30
      + 0.34*Math.abs(Math.sin(i*0.55))
      + 0.22*Math.abs(Math.sin(i*0.19 + 1.3))
      + 0.14*Math.abs(Math.sin(i*1.21 + 0.4));
    b.dataset.amp = Math.min(1, a).toFixed(3);
    wave.appendChild(b);
    waveBars.push(b);
  }

  /* ---------- element refs ---------- */
  const editor = Q('#editor');
  const preview = Q('#preview');
  const pvBlob = Q('#pvBlob');
  const pvGraded = Q('#pvGraded');
  const pvSeam = Q('#pvSeam');
  const pvCaption = Q('#pvCaption');
  const playhead = Q('#playhead');
  const progressWrap = Q('#progressWrap');
  const progressFill = Q('#progressFill');
  const progressLabel = Q('#progressLabel');

  const chips = {
    Import:   { chip:Q('#chipImport'),   ck:Q('#ckImport') },
    Reframe:  { chip:Q('#chipReframe'),  ck:Q('#ckReframe') },
    Captions: { chip:Q('#chipCaptions'), ck:Q('#ckCaptions') },
    Grade:    { chip:Q('#chipGrade'),    ck:Q('#ckGrade') },
    Music:    { chip:Q('#chipMusic'),    ck:Q('#ckMusic') },
  };

  // playhead travel geometry (within timeline; track starts at label width)
  const PH_LEFT = 74;          // px, aligned to track start
  const PH_RIGHT_PCT = 0.965;  // fraction of timeline inner width reached at full sweep

  /* ---------- initial states (frame 0 clean) ---------- */
  gsap.set(editor, { opacity:0, y:18 });
  gsap.set('[data-composition-id="main"] .clip', { opacity:0, x:-28, scale:.92 });
  gsap.set(preview, { scale:1 });
  gsap.set(pvGraded, { clipPath:'inset(0 100% 0 0)' });
  gsap.set(pvSeam, { opacity:0, left:'-10px' });
  gsap.set(pvCaption, { opacity:0, y:14 });
  gsap.set(capSpans, { opacity:0, y:8 });
  gsap.set(waveBars, { scaleY:0 });
  gsap.set(progressWrap, { opacity:0 });
  gsap.set(progressFill, { width:'0%' });
  gsap.set(playhead, { left:PH_LEFT+'px' });
  Object.values(chips).forEach(c=>{
    gsap.set(c.chip, { opacity:0, y:10 });
    gsap.set(c.ck.querySelector('svg'), { opacity:0, scale:.4 });
  });

  // chip state helpers
  function chipActive(c){
    gsap.to(c.chip, { color:'var(--text)', borderColor:'var(--accent)',
      backgroundColor:'rgba(224,69,31,.10)', duration:.3, ease:'power2.out' });
    gsap.to(c.ck, { borderColor:'var(--accent)', duration:.3 });
  }
  function chipDone(c){
    gsap.to(c.chip, { color:'var(--text)', borderColor:'var(--green)',
      backgroundColor:'rgba(52,199,89,.12)', duration:.35, ease:'power2.out' });
    gsap.to(c.ck, { borderColor:'var(--green)', backgroundColor:'var(--green)', duration:.35 });
    gsap.fromTo(c.ck.querySelector('svg'), { opacity:0, scale:.4 },
      { opacity:1, scale:1, duration:.3, ease:'back.out(2.4)' });
  }

  /* ---------- per-frame deterministic light blob (sine motion) ---------- */
  // driven by a proxy tween over the whole duration; update once at boot.
  const blobProxy = { t:0 };
  function updateBlob(){
    const t = blobProxy.t; // 0..1 across 12s
    const W = 1080, H = 608, bw = 560;
    const cx = (0.5 + 0.30*Math.sin(t*Math.PI*2*1.0)) * (W-bw);
    const cy = (0.5 + 0.26*Math.sin(t*Math.PI*2*0.7 + 1.1)) * (H-bw);
    pvBlob.style.transform = 'translate('+cx.toFixed(1)+'px,'+cy.toFixed(1)+'px)';
  }
  updateBlob(); // frame 0 styled

  /* ---------- timeline ---------- */
  const tl = gsap.timeline({ paused:true });

  // continuous deterministic blob drift across the whole scene
  tl.to(blobProxy, { t:1, duration:12, ease:'none', onUpdate:updateBlob }, 0);

  // ---- BEAT 1 (0.2–2.0): editor in, 4 clips snap into V1, Import chip ----
  tl.to(editor, { opacity:1, y:0, duration:.7, ease:'expo.out' }, 0.2);
  tl.to(chips.Import.chip, { opacity:1, y:0, duration:.45, ease:'power3.out' }, 0.55);
  tl.add(()=>chipActive(chips.Import), 0.6);
  CLIPS.forEach((c,i)=>{
    const at = 0.7 + i*0.25;
    tl.to('[data-composition-id="main"] #clip'+i,
      { opacity:1, x:0, scale:1, duration:.42, ease:'back.out(2)' }, at);
  });
  tl.add(()=>chipDone(chips.Import), 1.85);

  // ---- BEAT 2 (2.0–4.0): Auto-reframe punch-in ----
  tl.to(chips.Reframe.chip, { opacity:1, y:0, duration:.45, ease:'power3.out' }, 2.0);
  tl.add(()=>chipActive(chips.Reframe), 2.15);
  tl.to(preview, { scale:1.08, duration:.9, ease:'power2.inOut' }, 2.2);
  tl.to(preview, { scale:1.045, duration:.7, ease:'power2.out' }, 3.2); // settle
  tl.add(()=>chipDone(chips.Reframe), 3.7);

  // ---- BEAT 3 (4.0–6.0): Captions type word-by-word ----
  tl.to(chips.Captions.chip, { opacity:1, y:0, duration:.45, ease:'power3.out' }, 4.0);
  tl.add(()=>chipActive(chips.Captions), 4.15);
  tl.to(pvCaption, { opacity:1, y:0, duration:.5, ease:'expo.out' }, 4.25);
  capSpans.forEach((s,i)=>{
    tl.to(s, { opacity:1, y:0, duration:.28, ease:'power2.out' }, 4.55 + i*0.32);
  });
  tl.add(()=>chipDone(chips.Captions), 5.85);

  // ---- BEAT 4 (6.0–8.0): Color grade — LUT seam sweep L→R ----
  tl.to(chips.Grade.chip, { opacity:1, y:0, duration:.45, ease:'power3.out' }, 6.0);
  tl.add(()=>chipActive(chips.Grade), 6.15);
  tl.to(pvSeam, { opacity:1, duration:.25, ease:'power2.out' }, 6.25);
  // seam line travels across the 1080px preview; graded clip-path reveals behind it
  tl.to(pvSeam, { left:'1080px', duration:1.35, ease:'power2.inOut' }, 6.4);
  tl.to(pvGraded, { clipPath:'inset(0 0% 0 0)', duration:1.35, ease:'power2.inOut' }, 6.4);
  tl.to(pvSeam, { opacity:0, duration:.3, ease:'power2.in' }, 7.7);
  tl.add(()=>chipDone(chips.Grade), 7.85);

  // ---- BEAT 5 (8.0–10.0): Music — waveform draws into A1, preview pulse ----
  tl.to(chips.Music.chip, { opacity:1, y:0, duration:.45, ease:'power3.out' }, 8.0);
  tl.add(()=>chipActive(chips.Music), 8.15);
  waveBars.forEach((b,i)=>{
    const amp = parseFloat(b.dataset.amp);
    tl.to(b, { scaleY:amp, duration:.32, ease:'power2.out' }, 8.2 + i*0.012);
  });
  // subtle 2-beat preview pulse
  tl.to(preview, { scale:1.07, duration:.18, ease:'power2.out' }, 9.15)
    .to(preview, { scale:1.045, duration:.26, ease:'power2.inOut' }, 9.33)
    .to(preview, { scale:1.07, duration:.18, ease:'power2.out' }, 9.55)
    .to(preview, { scale:1.045, duration:.26, ease:'power2.inOut' }, 9.73);
  tl.add(()=>chipDone(chips.Music), 9.85);

  // ---- BEAT 6 (10.0–12.0): Render — progress fills, playhead sweeps ----
  tl.to(progressWrap, { opacity:1, duration:.4, ease:'power2.out' }, 10.0);
  // progress proxy → label + fill, deterministic
  const prog = { v:0 };
  tl.to(prog, { v:100, duration:1.6, ease:'power1.inOut',
    onUpdate:()=>{
      const n = Math.round(prog.v);
      progressFill.style.width = n + '%';
      progressLabel.innerHTML = 'Rendering 4K&nbsp;&nbsp;' + n + '%';
    } }, 10.1);
  // playhead sweeps across full timeline (px from PH_LEFT to right edge of timeline inner)
  // timeline inner width ≈ 1800 - 28*2 = 1744 px; sweep to ~96.5%
  const tlInner = 1744;
  tl.to(playhead, { left: (PH_LEFT + (tlInner-PH_LEFT)*PH_RIGHT_PCT - PH_LEFT*0) + 'px',
    duration:1.7, ease:'power1.inOut' }, 10.1);
  // settle: brief glow pulse on render button area via progress fill brightness
  tl.to(progressLabel, { color:'var(--green)', duration:.3 }, 11.75);

  // gentle idle so nothing freezes dead-still at the hold
  tl.to(editor, { y:'+=0', duration:.01 }, 11.9);
  tl.to(pvBlob, {}, 11.99); // keep blob driving to the end (already via blobProxy)

  // anchor exact duration
  tl.set({}, {}, 12);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  window.__timeline = tl;
</script>
</body>
</html>
