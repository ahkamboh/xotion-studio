<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Stop Scrolling — Vertical Reel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Anton"; src:url("assets/fonts/anton-400.ttf") format("truetype"); font-weight:400; font-display:block; }
      @font-face { font-family:"Archivo Black"; src:url("assets/fonts/archivo-black-400.ttf") format("truetype"); font-weight:400; font-display:block; }
      @font-face { font-family:"Space Grotesk"; src:url("assets/fonts/space-grotesk-500.ttf") format("truetype"); font-weight:500; font-display:block; }
      @font-face { font-family:"Space Grotesk"; src:url("assets/fonts/space-grotesk-700.ttf") format("truetype"); font-weight:700; font-display:block; }
      @font-face { font-family:"JetBrains Mono"; src:url("assets/fonts/jetbrains-500.ttf") format("truetype"); font-weight:500; font-display:block; }

      :root{
        --bg:#0b0b0e;
        --ink:#f4f1ea;
        --accent:#ff4d2e;     /* electric vermilion */
        --accent2:#ffd23f;    /* punch yellow */
        --muted:#7c7a83;
        --mono:"JetBrains Mono", monospace;
      }
      * { box-sizing:border-box; margin:0; padding:0; }
      html, body {
        width:1920px; height:1080px; overflow:hidden;
        background:var(--bg);
        font-family:"Space Grotesk", sans-serif;
        color:var(--ink);
      }
      #root{ position:relative; width:1920px; height:1080px; }

      .scene{ position:absolute; inset:0; display:flex; flex-direction:column;
        align-items:center; justify-content:center; overflow:hidden; }

      /* persistent chrome */
      .frame{ position:absolute; inset:34px; border:3px solid rgba(244,241,234,.14);
        pointer-events:none; z-index:40; }
      .topbar{ position:absolute; top:62px; left:62px; right:62px; z-index:41;
        display:flex; justify-content:space-between; align-items:center;
        font-family:var(--mono); font-size:26px; letter-spacing:.18em;
        text-transform:uppercase; color:var(--muted); }
      .topbar .dot{ width:14px; height:14px; border-radius:50%; background:var(--accent);
        display:inline-block; margin-right:14px; vertical-align:middle; }
      .progress{ position:absolute; bottom:74px; left:62px; right:62px; height:6px;
        background:rgba(244,241,234,.10); z-index:41; }
      .progress > i{ position:absolute; left:0; top:0; bottom:0; width:0%;
        background:var(--accent); display:block; }

      .eyebrow{ font-family:var(--mono); font-weight:500; letter-spacing:.28em;
        text-transform:uppercase; font-size:30px; color:var(--accent2); }

      .hero{ font-family:"Anton", sans-serif; line-height:.92;
        text-transform:uppercase; text-align:center; letter-spacing:.005em; }
      .hero .ln{ display:block; overflow:hidden; }
      .hero .ln > span{ display:inline-block; }

      .accent{ color:var(--accent); }
      .yellow{ color:var(--accent2); }

      .tag{ font-family:var(--mono); font-size:32px; letter-spacing:.04em;
        color:var(--muted); text-align:center; max-width:840px; line-height:1.4; }

      /* numbered scene */
      .numlabel{ font-family:"Anton", sans-serif; text-transform:uppercase;
        font-size:120px; line-height:.94; text-align:center; }

      .bignum{ font-family:"Anton", sans-serif; font-size:440px; line-height:.8;
        color:transparent; -webkit-text-stroke:5px rgba(244,241,234,.16);
        position:absolute; z-index:0; }

      .sticker{ display:inline-block; font-family:var(--mono); font-weight:500;
        letter-spacing:.06em; text-transform:uppercase; font-size:30px;
        padding:16px 30px; background:var(--accent2); color:#0b0b0e;
        transform:rotate(-7deg); box-shadow:10px 10px 0 #000; }

      /* end card */
      .handle{ font-family:"Archivo Black", sans-serif; font-size:96px; letter-spacing:.01em; }
      .pill{ display:inline-flex; align-items:center; gap:18px; font-family:var(--mono);
        font-size:36px; letter-spacing:.08em; text-transform:uppercase;
        padding:26px 46px; border:3px solid var(--ink); border-radius:999px; }
      .pill .arrow{ font-family:"Anton",sans-serif; font-size:46px; color:var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15"
         data-width="1920" data-height="1080">

      <!-- SCENE 1 — HOOK -->
      <section class="scene" id="s1">
        <div class="eyebrow">// no more zombie mode</div>
        <div class="hero" style="font-size:230px; margin-top:22px;">
          <span class="ln"><span>STOP</span></span>
          <span class="ln"><span class="accent">SCROLL</span></span>
          <span class="ln"><span>-ING.</span></span>
        </div>
      </section>

      <!-- SCENE 2 — TURN -->
      <section class="scene" id="s2">
        <div class="hero" style="font-size:200px;">
          <span class="ln"><span>START</span></span>
          <span class="ln"><span class="yellow">BUILDING</span></span>
          <span class="ln"><span>SOMETHING.</span></span>
        </div>
      </section>

      <!-- SCENE 3 — STAT -->
      <section class="scene" id="s3">
        <div class="eyebrow">the average person spends</div>
        <div class="numlabel accent" id="statnum" style="font-size:280px; margin:18px 0;">0</div>
        <div class="tag">HOURS A DAY ON A SCREEN. <span class="yellow">imagine if one was yours.</span></div>
      </section>

      <!-- SCENE 4 — RULE -->
      <section class="scene" id="s4">
        <div class="bignum" id="s4num">01</div>
        <div class="numlabel" style="position:relative; z-index:1;">
          <span>CREATE</span><br />
          <span class="accent">BEFORE YOU</span><br />
          <span>CONSUME.</span>
        </div>
        <div style="position:absolute; bottom:240px; z-index:2;"><span class="sticker" id="s4sticker">daily rule</span></div>
      </section>

      <!-- SCENE 5 — PAYOFF -->
      <section class="scene" id="s5">
        <div class="hero" style="font-size:150px;">
          <span class="ln"><span>SMALL REPS.</span></span>
          <span class="ln"><span class="accent">EVERY DAY.</span></span>
          <span class="ln"><span class="yellow">COMPOUND.</span></span>
        </div>
      </section>

      <!-- SCENE 6 — END CARD / CTA -->
      <section class="scene" id="s6">
        <div class="eyebrow" style="color:var(--muted)">save this · do it tomorrow</div>
        <div class="handle" id="handle" style="margin:30px 0;">@buildmode</div>
        <div class="pill" id="cta"><span class="arrow">&rarr;</span> FOLLOW FOR MORE</div>
      </section>

      <!-- persistent chrome -->
      <div class="frame"></div>
      <div class="topbar"><span><span class="dot"></span>BUILD MODE</span><span id="clock">01 / 06</span></div>
      <div class="progress"><i id="prog"></i></div>
    </div>

    <script src="richness.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      const Q = s => '[data-composition-id="main"] ' + s;
      const $ = s => document.querySelector(Q(s));
      const $$ = s => Array.prototype.slice.call(document.querySelectorAll(Q(s)));

      Rich.css(); Rich.scale(1920);

      // ---- backgrounds / texture (never flat) ----
      const scenes = ["#s1","#s2","#s3","#s4","#s5","#s6"];
      Rich.texture($("#s1"), "glow", "rgba(255,77,46,.16)");
      Rich.texture($("#s2"), "dots", "rgba(244,241,234,.85)");
      Rich.texture($("#s3"), "grain");
      Rich.texture($("#s4"), "stripes", "rgba(255,77,46,.10)");
      Rich.texture($("#s5"), "glow", "rgba(255,210,63,.14)");
      Rich.texture($("#s6"), "dots", "rgba(255,77,46,.9)");

      // start all scenes hidden, then crossfade per beat
      gsap.set(scenes.map(Q), { opacity:0 });

      // scene windows (seconds) — 6 beats over 15s
      // boundaries kept off the QA sample seconds (1/5/9/13) so frames land mid-scene
      const W = [
        [0.0, 2.6],   // hook
        [2.6, 5.4],   // turn
        [5.4, 8.4],   // stat
        [8.4, 11.0],  // rule
        [11.0, 13.4], // payoff
        [13.4, 15.0]  // cta
      ];

      function showScene(i){
        const [s,e] = W[i]; const el = Q(scenes[i]);
        tl.to(el, {opacity:1, duration:0.28, ease:"power2.out"}, s);
        if(i < scenes.length-1) tl.to(el, {opacity:0, duration:0.30, ease:"power2.in"}, e-0.18);
        // never static — gentle breathe through the whole window
        Rich.idle(el, tl, s, e, {scale:0.012, x:6, y:6, rot:0.3});
      }
      scenes.forEach((_,i)=>showScene(i));

      // ---------- SCENE 1 : HOOK ----------
      (function(){ const s = W[0][0];
        const lines = $$("#s1 .hero .ln > span");
        gsap.set($("#s1 .eyebrow"), {y:-30, opacity:0});
        tl.to($("#s1 .eyebrow"), {y:0, opacity:1, duration:.4, ease:"back.out(2)"}, s+0.1);
        lines.forEach((el,i)=>{
          gsap.set(el, {yPercent:120, opacity:0, rotation: i%2?2:-2});
          tl.to(el, {yPercent:0, opacity:1, rotation:0, duration:.5, ease:"back.out(2.2)"}, s+0.35+i*0.16);
        });
        tl.to($("#s1 .accent"), {scale:1.06, duration:.18, yoyo:true, repeat:1, ease:"power2.inOut"}, s+1.1);
      })();

      // ---------- SCENE 2 : TURN ----------
      (function(){ const s = W[1][0];
        Rich.cascade($$("#s2 .hero .ln > span"), tl, s+0.15, {stagger:.13, dur:.5, rot:4});
        tl.to($("#s2 .yellow"), {scale:1.08, duration:.2, yoyo:true, repeat:1, ease:"power2.inOut"}, s+1.0);
      })();

      // ---------- SCENE 3 : STAT counter ----------
      (function(){ const s = W[2][0];
        gsap.set($("#s3 .eyebrow"), {opacity:0, y:24});
        tl.to($("#s3 .eyebrow"), {opacity:1, y:0, duration:.4, ease:"power3.out"}, s+0.1);
        const num = $("#statnum"); const obj = {v:0};
        gsap.set(num, {scale:.6, opacity:0});
        tl.to(num, {scale:1, opacity:1, duration:.45, ease:"back.out(2.4)"}, s+0.35);
        tl.to(obj, {v:7, duration:1.2, ease:"power2.out",
          onUpdate:()=>{ num.textContent = Math.round(obj.v); }}, s+0.45);
        tl.to(num, {scale:1.12, duration:.16, yoyo:true, repeat:1, ease:"power2.inOut"}, s+1.65);
        gsap.set($("#s3 .tag"), {opacity:0, y:30});
        tl.to($("#s3 .tag"), {opacity:1, y:0, duration:.5, ease:"power3.out"}, s+1.6);
      })();

      // ---------- SCENE 4 : RULE ----------
      (function(){ const s = W[3][0];
        const big = $("#s4num");
        gsap.set(big, {opacity:0, scale:1.4});
        tl.to(big, {opacity:1, scale:1, duration:.6, ease:"power3.out"}, s+0.05);
        Rich.cascade($$("#s4 .numlabel span"), tl, s+0.3, {stagger:.14, dur:.5, rot:3});
        Rich.stamp($("#s4sticker"), tl, s+1.1, -7);
      })();

      // ---------- SCENE 5 : PAYOFF ----------
      (function(){ const s = W[4][0];
        const lines = $$("#s5 .hero .ln > span");
        lines.forEach((el,i)=>{
          gsap.set(el, {yPercent:110, opacity:0});
          tl.to(el, {yPercent:0, opacity:1, duration:.46, ease:"back.out(2)"}, s+0.1+i*0.22);
        });
      })();

      // ---------- SCENE 6 : CTA ----------
      (function(){ const s = W[5][0];
        gsap.set($("#s6 .eyebrow"), {opacity:0, y:-20});
        tl.to($("#s6 .eyebrow"), {opacity:1, y:0, duration:.4, ease:"power2.out"}, s+0.05);
        Rich.enter($("#handle"), tl, s+0.3, "slam", {dur:.5});
        Rich.enter($("#cta"), tl, s+0.7, "rise", {dur:.45});
        tl.to($("#cta"), {scale:1.05, duration:.22, yoyo:true, repeat:3, ease:"power2.inOut"}, s+1.2);
        tl.to($("#cta .arrow"), {x:10, duration:.3, yoyo:true, repeat:3, ease:"power2.inOut"}, s+1.2);
      })();

      // ---------- persistent chrome: progress bar + scene clock ----------
      tl.to($("#prog"), {width:"100%", duration:15, ease:"none"}, 0);
      const clk = $("#clock");
      W.forEach((w,i)=>{
        tl.call(()=>{ clk.textContent = String(i+1).padStart(2,"0") + " / 06"; }, null, w[0]);
      });
      tl.fromTo($(".topbar .dot"), {opacity:.5}, {opacity:1, duration:.7, yoyo:true,
        repeat:Math.floor(15/1.4)-1, ease:"sine.inOut"}, 0);
    </script>
  </body>
</html>
