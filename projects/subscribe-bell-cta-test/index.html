  <head>
    <meta charset="UTF-8" />

    <!--
      SUBSCRIBE + BELL SMASH  ·  subscribe-bell-cta
      ────────────────────────────────────────────────────────────────────────
      The best-selling social CTA: a YouTube-style lower-third strip slides up
      with a channel avatar; the SUBSCRIBE button breathes for attention, then a
      mac cursor presses it — the button SQUASHES, a press-ripple fires, and the
      label color-FLIPS from SUBSCRIBE → "Subscribed". A bell appears and SWINGS
      like a pendulum (decaying), throwing three radiating ring waves and a
      hand-coded particle PING outward, before settling into a gentle, loop-
      friendly breathing hold. Drop it mid-video to ask for the sub.

      CHOREOGRAPHY (data-duration 7.0 — final state breathes/holds to 7.0s):
       phase  start–end (s)  easing                 what moves
       ─────  ─────────────  ─────────────────────  ───────────────────────────
        0     frame 0        —                      empty stage: strip below,
                                                     avatar/name/button hidden
        1     0.30–1.15      back.out(1.5)           strip slides UP + fades in,
                                                     drop-shadow lands
        2     0.70–1.35      back.out(2.4)           avatar pops (scale 0→1),
                                                     accent ring sweeps in
        3     0.95–1.60      power3.out              channel name + handle
                                                     blur-clear in from the left
        4     1.60–2.45      sine (3 finite pulses)  SUBSCRIBE button breathes
                                                     (attention beat)
        5     2.45–2.78      power2.in → power3.out  cursor dips, button SQUASHES
                                                     (scaleY↓), press-ripple fires
        6     2.70–3.10      power2.inOut             label morphs SUBSCRIBE →
                                                     "Subscribed", bg color-flips
                                                     red→grey, check reveal
        7     3.10–4.25      pendulum (decaying cos)  bell SWINGS, amplitude decays
        8     3.20–4.30      power2.out               3 ring waves expand+fade +
                                                     12-particle hand-coded PING
        9     4.25–7.00      sine idle (finite)       whole strip breathes gently
                                                     so the hold is never dead;
                                                     loop-friendly (returns to rest)

      DETERMINISM CONTRACT
      • ONE paused master timeline (window.__timelines["main"] + window.__timeline).
      • Discrete beats = normal GSAP tweens; per-frame motion (button breathe,
        cursor path, bell pendulum, idle breathe) = a single proxy {t} whose
        onUpdate calls renderProxy(t) — the renderer seeks any frame exactly.
      • NO Math.random / Date / rAF / setTimeout / CSS transitions / @keyframes /
        infinite repeats. The 12 particles + 3 rings are HAND-CODED constant
        tables, built at construction time. Bell pendulum = decaying cosine, a
        pure function of time. Frame 0 set via gsap.set + renderProxy(0) at boot.
      • Label swap uses a GRID-STACK mask (SUBSCRIBE & "Subscribed" share one
        cell) so a longer/shorter channel name or label can never clip — the
        button sizes to whichever label is wider. Channel name has a max-width;
        handle ellipsizes. Nothing is hard-coded to the default content widths.
      • avatarImage is IMAGE-type: if set, an <img> uses it; if empty (default),
        a designed initials-on-gradient avatar renders — zero asset files needed.
      • Encoding: handle is a plain string. bellOn = "on"/"off" toggles the
        smash (off = button flip only, no bell/rings/particles).

      Local fonts only (@font-face below). Only network resource: gsap CDN.
    -->

      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root {
        position:relative; width:1920px; height:1080px; overflow:hidden;
        font-family:"Plus Jakarta Sans",sans-serif;   /* runtime-overridden from V.fontFamily */
      }

      /* the lower-third strip — anchored bottom-center, slid up into place */
      .strip {
        position:absolute; left:50%; bottom:140px;
        transform:translateX(-50%);
        display:flex; align-items:center; gap:36px;
        padding:30px 44px;
        border-radius:28px;
        max-width:1500px;
        will-change:transform,opacity;
      }

      /* avatar block (image OR designed initials fallback) */
      .avatarWrap {
        position:relative; flex:0 0 auto;
        width:128px; height:128px;
      }
      .avatarRing {
        position:absolute; inset:-9px;
        border-radius:50%;
        will-change:transform;
      }
      .avatar {
        position:absolute; inset:0;
        width:128px; height:128px;
        border-radius:50%;
        overflow:hidden;
        display:flex; align-items:center; justify-content:center;
        font-weight:800; font-size:54px; letter-spacing:-0.02em;
        will-change:transform;
      }
      .avatar img { width:100%; height:100%; object-fit:cover; display:block; }

      /* identity column */
      .identity {
        display:flex; flex-direction:column; justify-content:center;
        min-width:0;          /* allow ellipsis on handle */
        gap:6px;
      }
      .nameRow { display:flex; align-items:center; gap:14px; }
      .name {
        font-weight:800; font-size:46px; letter-spacing:-0.02em;
        line-height:1.05; max-width:560px;
        will-change:transform,opacity,filter;
      }
      .verified { flex:0 0 auto; width:30px; height:30px; will-change:transform; }
      .verified svg { display:block; width:30px; height:30px; }
      .handle {
        font-weight:500; font-size:26px; letter-spacing:-0.005em;
        max-width:560px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        will-change:transform,opacity,filter;
      }

      /* CTA cluster: subscribe button + bell, pushed to the right */
      .cta {
        display:flex; align-items:center; gap:26px;
        margin-left:28px; flex:0 0 auto;
      }

      /* the subscribe button — grid-stack so both labels share one cell */
      .subBtn {
        position:relative;
        height:78px;
        border-radius:9999px;
        display:inline-flex; align-items:center;
        padding:0 38px;
        overflow:hidden;
        will-change:transform;
        transform-origin:50% 50%;
      }
      .labelStack {
        display:grid; align-items:center; justify-items:center;
      }
      .labelStack > * { grid-area:1 / 1; }   /* perfectly overlap */
      .lbl {
        display:flex; align-items:center; gap:14px;
        font-weight:800; font-size:30px; letter-spacing:0.01em;
        white-space:nowrap; will-change:transform,opacity;
      }
      .lbl svg { display:block; }
      .checkInBtn { width:28px; height:28px; }
      /* press-ripple inside the button */
      .pressRipple {
        position:absolute; left:50%; top:50%;
        width:40px; height:40px; border-radius:50%;
        transform:translate(-50%,-50%) scale(0);
        will-change:transform,opacity;
        pointer-events:none;
      }

      /* standalone bell + radiating rings + particle ping */
      .bellZone {
        position:relative; flex:0 0 auto;
        width:108px; height:108px;
        display:flex; align-items:center; justify-content:center;
      }
      .bellBtn {
        position:relative; z-index:3;
        width:108px; height:108px; border-radius:50%;
        display:flex; align-items:flex-start; justify-content:center;
        padding-top:24px;
      }
      .bell {
        width:54px; height:54px;
        transform-origin:50% 12%;       /* swings from the top mount */
        will-change:transform;
      }
      .bell svg { display:block; width:54px; height:54px; }
      .ring {
        position:absolute; left:50%; top:50%;
        width:108px; height:108px; border-radius:50%;
        transform:translate(-50%,-50%) scale(0.55);
        will-change:transform,opacity;
        pointer-events:none; z-index:1;
      }
      .ping {
        position:absolute; left:50%; top:50%;
        width:0; height:0; z-index:2; pointer-events:none;
      }
      .pdot {
        position:absolute; left:0; top:0; border-radius:50%;
        transform:translate(-50%,-50%);
        will-change:transform,opacity;
      }

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize a CSS hex color to 6-digit so 2-digit alpha appends safely */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}

      /* ── parameters ─────────────────────────────────────────────────── */
      const CHANNEL = String(V.channelName || "Xotion");
      const HANDLE  = String(V.handle || "");
      const AVATAR  = String(V.avatarImage || "").trim();
      const FONT    = String(V.fontFamily || "Plus Jakarta Sans").trim() || "Plus Jakarta Sans";
      const BTN_COL = hex6(V.buttonColor);
      const SUB_COL = hex6(V.subscribedColor);
      const ACCENT  = hex6(V.accent);
      const BG      = V.bg;
      const INK     = V.ink;
      const BELL_ON = String(V.bellOn || "on").toLowerCase() !== "off";

      /* ── elements ───────────────────────────────────────────────────── */
      const root      = document.getElementById("root");
      const strip     = document.getElementById("strip");
      const avatarRing= document.getElementById("avatarRing");
      const avatar    = document.getElementById("avatar");
      const nameEl    = document.getElementById("name");
      const verified  = document.getElementById("verified");
      const handleEl  = document.getElementById("handle");
      const subBtn    = document.getElementById("subBtn");
      const pressRip  = document.getElementById("pressRipple");
      const lblSub    = document.getElementById("lblSub");
      const lblDone   = document.getElementById("lblDone");
      const bellZone  = document.getElementById("bellZone");
      const bellBtn   = document.getElementById("bellBtn");
      const bell      = document.getElementById("bell");
      const ring0     = document.getElementById("ring0");
      const ring1     = document.getElementById("ring1");
      const ring2     = document.getElementById("ring2");
      const rings     = [ring0, ring1, ring2];
      const pingWrap  = document.getElementById("ping");
      const pointer   = document.getElementById("pointer");

      /* ── designed-fallback avatar (initials on a brand gradient) ─────── */
      function initials(s){
        const parts = s.trim().split(/\s+/).filter(Boolean);
        if(!parts.length) return "X";
        if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
        return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
      }
      if (AVATAR) {
        const img = document.createElement("img");
        img.src = AVATAR; img.alt = CHANNEL;
        avatar.appendChild(img);
      } else {
        avatar.textContent = initials(CHANNEL);
        avatar.style.color = "#ffffff";
        avatar.style.background =
          `linear-gradient(135deg, ${ACCENT} 0%, ${SUB_COL} 100%)`;
      }

      /* ── static styling from variables ──────────────────────────────── */
      document.body.style.background = BG;
      root.style.background = BG;
      // apply the chosen font family (spec-required `fontFamily` control).
      // falls back through the registry to sans-serif if the family lacks faces.
      root.style.fontFamily = FONT + ', "Plus Jakarta Sans", sans-serif';

      // strip: soft elevated panel that reads on any background
      strip.style.background  = "rgba(255,255,255,0.06)";
      strip.style.border      = "1px solid rgba(255,255,255,0.10)";
      strip.style.boxShadow    =
        "0 30px 80px rgba(0,0,0,0.45), 0 10px 30px rgba(0,0,0,0.35)";
      strip.style.backdropFilter = "blur(4px)";

      avatarRing.style.background =
        `conic-gradient(from -90deg, ${ACCENT}, ${hex6(INK)}, ${ACCENT})`;
      avatar.style.boxShadow = "0 6px 18px rgba(0,0,0,0.4)";

      nameEl.textContent   = CHANNEL;
      nameEl.style.color   = INK;
      verified.style.color = ACCENT;
      handleEl.textContent = HANDLE;
      handleEl.style.color = hex6(INK);
      handleEl.style.opacity = "0.66";

      // subscribe button — red, with a press ripple in a light tint
      subBtn.style.background  = BTN_COL;
      subBtn.style.boxShadow   = `0 10px 30px ${BTN_COL}4d`;
      lblSub.style.color  = "#ffffff";
      lblDone.style.color = "rgba(255,255,255,0.92)";
      pressRip.style.background = "rgba(255,255,255,0.55)";

      // bell button — neutral chip; bell icon inherits ink
      bellBtn.style.background = "rgba(255,255,255,0.10)";
      bellBtn.style.border     = "1px solid rgba(255,255,255,0.12)";
      bell.style.color = INK;
      rings.forEach(r => { r.style.border = `3px solid ${ACCENT}`; });

      // if bell smash is OFF, drop the whole bell zone from the layout
      if (!BELL_ON) bellZone.style.display = "none";

      /* ── particle PING: HAND-CODED constant table (no randomness) ────── */
      /* 12 dots, angles fanned 360°, alternating distance + size + delay */
      const PARTICLES = [
        { a:  -8, d: 96, s: 11, dl: 0.00 },
        { a:  26, d:124, s:  8, dl: 0.04 },
        { a:  58, d:150, s: 13, dl: 0.02 },
        { a:  92, d: 98, s:  9, dl: 0.06 },
        { a: 124, d:128, s: 12, dl: 0.01 },
        { a: 156, d:152, s:  8, dl: 0.05 },
        { a: 188, d: 96, s: 11, dl: 0.03 },
        { a: 214, d:130, s:  9, dl: 0.07 },
        { a: 248, d:150, s: 13, dl: 0.02 },
        { a: 282, d: 98, s:  8, dl: 0.05 },
        { a: 312, d:126, s: 12, dl: 0.00 },
        { a: 340, d:150, s: 10, dl: 0.04 }
      ];
      // built NOW at construction time, never inside a callback
      const pdots = PARTICLES.map(pt => {
        const el = document.createElement("div");
        el.className = "pdot";
        el.style.width  = pt.s + "px";
        el.style.height = pt.s + "px";
        el.style.background = ACCENT;
        pingWrap.appendChild(el);
        return el;
      });

      /* ── timing constants (the choreography above) ──────────────────── */
      const T_STRIP   = 0.30;   // strip slides up
      const T_AVATAR  = 0.70;   // avatar pop
      const T_NAME    = 0.95;   // name/handle reveal
      const BREATHE_S = 1.60;   // button breathe window start
      const T_PRESS   = 2.45;   // cursor dip / squash
      const PRESS_DUR = 0.33;
      const T_FLIP    = 2.70;   // label color-flip → Subscribed
      const FLIP_DUR  = 0.40;
      const T_BELL    = 3.10;   // bell pendulum start
      const BELL_DUR  = 1.15;
      const T_RING    = 3.20;   // ring waves + particle ping start
      const RING_DUR  = 1.10;
      const SETTLE    = 4.25;   // idle breathe / hold begins
      const DUR       = 7.0;

      /* ── INITIAL STATES — frame 0 must be the correct opening ────────── */
      // strip below + invisible
      gsap.set(strip,     { y: 150, opacity: 0 });
      gsap.set(avatar,    { scale: 0, transformOrigin: "50% 50%" });
      gsap.set(avatarRing,{ scale: 0.4, opacity: 0, rotation: -120,
                            transformOrigin: "50% 50%" });
      gsap.set([nameEl, handleEl], { opacity: 0, x: -26, filter: "blur(7px)" });
      gsap.set(verified,  { scale: 0, transformOrigin: "50% 50%" });
      // button at rest; "Subscribed" label hidden under SUBSCRIBE
      gsap.set(subBtn,    { scale: 1 });
      gsap.set(lblSub,    { opacity: 1, y: 0 });
      gsap.set(lblDone,   { opacity: 0, y: 16 });
      gsap.set(pressRip,  { scale: 0, opacity: 0 });
      // bell + rings + particles at rest/hidden
      gsap.set(bell,      { rotation: 0 });
      rings.forEach(r => gsap.set(r, { scale: 0.55, opacity: 0 }));
      pdots.forEach(el => gsap.set(el, { x: 0, y: 0, opacity: 0 }));
      gsap.set(pointer,   { opacity: 0 });

      /* ── easing helpers (pure) ──────────────────────────────────────── */
      const clamp01    = t => Math.max(0, Math.min(1, t));
      const outQuad    = t => 1 - (1 - t) * (1 - t);
      const outCubic   = t => 1 - Math.pow(1 - t, 3);

      /* ── PER-FRAME proxy renderer: breathe + cursor + pendulum + idle ─ */
      // press target measured once fonts are ready; re-read each frame until then
      let geo = null;
      function measure() {
        const r = subBtn.getBoundingClientRect();
        const rr = root.getBoundingClientRect();
        geo = {
          bx: (r.left - rr.left) + r.width / 2,   // button center, root coords
          by: (r.top  - rr.top)  + r.height / 2
        };
      }

      function renderProxy(t) {
        // ── button breathe (phase 4): 3 finite sine pulses, attention beat
        let breatheScale = 1;
        if (t >= BREATHE_S && t < T_PRESS) {
          const k = (t - BREATHE_S) / (T_PRESS - BREATHE_S);   // 0..1
          breatheScale = 1 + 0.045 * Math.sin(k * Math.PI * 2 * 3) * (1 - k);
        }

        // ── press squash (phase 5): quick down-up, anticipation then snap
        let squashX = 1, squashY = 1, dip = 0;
        if (t >= T_PRESS && t < T_PRESS + PRESS_DUR) {
          const k = (t - T_PRESS) / PRESS_DUR;                 // 0..1
          const press = Math.sin(clamp01(k) * Math.PI);        // 0→1→0
          squashY = 1 - 0.18 * press;
          squashX = 1 + 0.07 * press;
          dip = press;                                         // cursor dips with it
        }
        // combine breathe + squash on the button (single transform)
        gsap.set(subBtn, { scaleX: breatheScale * squashX,
                           scaleY: breatheScale * squashY });

        // ── cursor path (phase 5): glide in from lower-right, dip, lift away
        if (geo) {
          if (t < T_PRESS - 0.55) {
            gsap.set(pointer, { opacity: 0 });
          } else if (t < T_PRESS) {
            const kIn = clamp01((t - (T_PRESS - 0.55)) / 0.55);
            const e = outCubic(kIn);
            const cx = geo.bx + 220 * (1 - e);
            const cy = geo.by + 180 * (1 - e);
            gsap.set(pointer, { x: cx - 6, y: cy - 4,
                                opacity: clamp01(kIn / 0.3) });
          } else if (t < T_PRESS + PRESS_DUR + 0.5) {
            gsap.set(pointer, { x: geo.bx - 6, y: geo.by + dip * 9 - 4,
                                opacity: 1 });
          } else {
            // lift the cursor up-right and fade after the press
            const kOut = clamp01((t - (T_PRESS + PRESS_DUR + 0.5)) / 0.5);
            const e = outQuad(kOut);
            gsap.set(pointer, { x: geo.bx - 6 + 160 * e,
                                y: geo.by - 4 - 120 * e,
                                opacity: 1 - e });
          }
        }

        // ── bell pendulum (phase 7): decaying cosine — a real swing
        if (BELL_ON) {
          let rot = 0;
          if (t >= T_BELL && t <= T_BELL + BELL_DUR) {
            const k = (t - T_BELL) / BELL_DUR;                 // 0..1
            const decay = Math.pow(1 - k, 1.6);                // amplitude fades
            rot = 26 * decay * Math.cos(k * Math.PI * 2 * 3.2); // ~3 swings
          }
          // ── idle breathe (phase 9): bell gently alive after settle
          let idle = 0;
          if (t >= SETTLE) {
            const k = (t - SETTLE) / (DUR - SETTLE);
            idle = Math.sin(k * Math.PI * 2 * 2) * 2.2 * (0.6 + 0.4 * (1 - k));
          }
          gsap.set(bell, { rotation: rot + idle });
        }

        // ── idle strip breathe (phase 9) — subtle vertical float, loop-safe
        if (t >= SETTLE) {
          const k = (t - SETTLE) / (DUR - SETTLE);
          const float = Math.sin(k * Math.PI * 2 * 1.5) * 3.0;
          gsap.set(strip, { y: float });
        }
      }

      /* ── MASTER TIMELINE (paused; HyperFrames seeks it) ─────────────── */
      const tl = gsap.timeline({ paused: true });

      // proxy drives all per-frame motion across the whole clip
      const p = { t: 0 };
      tl.to(p, { t: DUR, duration: DUR, ease: "none",
                 onUpdate: () => {
                   if (!geo || document.fonts.status !== "loaded") measure();
                   renderProxy(p.t);
                 } }, 0);

      // PHASE 1 — strip slides up + fades in
      tl.fromTo(strip, { y: 150, opacity: 0 },
                       { y: 0, opacity: 1, duration: 0.85, ease: "back.out(1.5)",
                         immediateRender: false }, T_STRIP);

      // PHASE 2 — avatar pop + ring sweep
      tl.fromTo(avatar, { scale: 0 },
                        { scale: 1, duration: 0.65, ease: "back.out(2.4)",
                          immediateRender: false }, T_AVATAR);
      tl.fromTo(avatarRing, { scale: 0.4, opacity: 0, rotation: -120 },
                            { scale: 1, opacity: 1, rotation: 0,
                              duration: 0.8, ease: "power3.out",
                              immediateRender: false }, T_AVATAR);

      // PHASE 3 — name + handle blur-clear in, verified pops
      tl.fromTo(nameEl, { opacity: 0, x: -26, filter: "blur(7px)" },
                        { opacity: 1, x: 0, filter: "blur(0px)",
                          duration: 0.6, ease: "power3.out",
                          immediateRender: false }, T_NAME);
      tl.fromTo(handleEl, { opacity: 0, x: -26, filter: "blur(7px)" },
                          { opacity: 0.66, x: 0, filter: "blur(0px)",
                            duration: 0.6, ease: "power3.out",
                            immediateRender: false }, T_NAME + 0.08);
      tl.fromTo(verified, { scale: 0 },
                          { scale: 1, duration: 0.5, ease: "back.out(2.6)",
                            immediateRender: false }, T_NAME + 0.18);

      // PHASE 5 — press-ripple fires inside the button
      tl.fromTo(pressRip, { scale: 0, opacity: 0.6 },
                          { scale: 9, opacity: 0, duration: 0.5,
                            ease: "power2.out", immediateRender: false }, T_PRESS + 0.04);

      // PHASE 6 — label color-FLIP: SUBSCRIBE → Subscribed, bg red → grey
      tl.to(lblSub,  { opacity: 0, y: -16, duration: 0.22,
                       ease: "power2.in" }, T_FLIP);
      tl.fromTo(lblDone, { opacity: 0, y: 16 },
                         { opacity: 1, y: 0, duration: 0.3, ease: "power3.out",
                           immediateRender: false }, T_FLIP + 0.14);
      tl.to(subBtn,  { backgroundColor: SUB_COL, duration: FLIP_DUR,
                       ease: "power2.inOut" }, T_FLIP);
      tl.to(subBtn,  { boxShadow: `0 8px 22px ${SUB_COL}59`, duration: FLIP_DUR,
                       ease: "power2.inOut" }, T_FLIP);

      if (BELL_ON) {
        // PHASE 8 — three ring waves expand + fade (staggered)
        rings.forEach((r, i) => {
          tl.fromTo(r, { scale: 0.55, opacity: 0.65 },
                       { scale: 2.7, opacity: 0, duration: RING_DUR,
                         ease: "power2.out", immediateRender: false },
                    T_RING + i * 0.16);
        });
        // PHASE 8 — particle ping (each dot flies its hand-coded vector)
        PARTICLES.forEach((pt, i) => {
          const rad = pt.a * Math.PI / 180;
          tl.fromTo(pdots[i], { x: 0, y: 0, opacity: 1, scale: 1 },
            { x: Math.cos(rad) * pt.d, y: Math.sin(rad) * pt.d,
              opacity: 0, scale: 0.4, duration: 0.7, ease: "power2.out",
              immediateRender: false }, T_RING + 0.04 + pt.dl);
        });
      }

      // hold the final frame to data-duration (idle breathe runs via proxy)
      tl.set({}, {}, DUR);

      /* frame 0 styled immediately */
      measure();
      renderProxy(0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
