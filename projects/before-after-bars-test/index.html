<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"headline",           "type":"string","label":"Headline above the bars",                       "default":"We 3x&#x27;d their organic traffic"},
  {"id":"beforeValue",        "type":"string","label":"Before value (number)",                          "default":"4200"},
  {"id":"afterValue",         "type":"string","label":"After value (number)",                           "default":"13400"},
  {"id":"unit",               "type":"string","label":"Unit suffix on values (e.g. /mo, %, k)",          "default":"/mo"},
  {"id":"beforeLabel",        "type":"string","label":"Before bar label",                                "default":"BEFORE"},
  {"id":"afterLabel",         "type":"string","label":"After bar label",                                 "default":"AFTER"},
  {"id":"multiplierBadgeText","type":"string","label":"Multiplier badge text",                           "default":"3.2x"},
  {"id":"barColors",          "type":"string","label":"Bar colors  before~after  (tilde/pipe encoded)",  "default":"#3a3f4b~#22c55e"},
  {"id":"accent",             "type":"color", "label":"Accent (badge / speed lines)",                    "default":"#22c55e"},
  {"id":"bg",                 "type":"color", "label":"Background",                                       "default":"#0b0d12"},
  {"id":"ink",                "type":"color", "label":"Text color",                                      "default":"#f5f7fa"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      BEFORE-AFTER BARS — the results-reveal proof shot of direct-response /
      UGC / agency case-study reels ("we 3x'd their traffic"). A short BEFORE
      bar rises with its counting value; a deliberate beat of stillness; then
      the AFTER bar ROCKETS up past it with upward motion-blur speed lines as
      a multiplier badge ('3.2x') stamps in DIAGONALLY with a paper-slam shake
      of the whole stage. Ends on a loop-friendly hold that keeps breathing.

      Fonts (LOCAL): Anton — heavy condensed display for the giant counting
      values + the stamped multiplier badge (the proof numbers must SHOUT);
      Archivo 700/600/400 — headline, bar labels (clean, sober counterpoint so
      the numbers do the shouting).

      ── VARIABLES ───────────────────────────────────────────────────────────
        headline            line above the bars   (default "We 3x'd their organic traffic")
        beforeValue / afterValue   the two numbers that count up
        unit                suffix on BOTH values  ("/mo", "%", "k", "" …)
        beforeLabel / afterLabel   pill labels under each bar
        multiplierBadgeText the stamped badge      ("3.2x")
        barColors           "BEFORE~AFTER" hex pair, "~" (or "|") between the two colors
        accent              badge fill + speed-line color
        bg / ink            page background / text
      All text variables are robust to longer/shorter content: headline wraps
      + auto-fits, values auto-shrink to their column, label pills size to
      content, the badge sizes to its text — nothing is hard-clipped.

      ── PHASE TABLE (data-duration 6.2 — final frame HOLDS, breathing) ──────
        phase                 | start–end (s) | easing            | what moves
        opening state (t=0)   | static        | —                 | dark stage already visible: axis baseline drawn, both label pills resting, headline shown; both bars sit at 0 height, values hidden — an "empty chart waiting" frame, never a black void
        anticipation          | 0.05–0.45     | power3.out        | headline settles (y14→0, blur4→0); a faint pre-roll before the first bar grows
        BEFORE grows          | 0.42–1.62     | power2.out        | before bar scaleY 0→1; its counter ticks 0→beforeValue (Math.floor, same beat)
        beat of stillness     | 1.62–2.18     | sine.inOut breathe| held bar breathes ~1%; tension before the reveal
        AFTER rockets         | 2.18–3.30     | power4.out        | after bar scaleY 0→1 past the before bar; counter ticks 0→afterValue fast; 7 upward speed-lines streak + fade (hand-coded offset table)
        badge SLAM            | 3.30–3.78     | back.out(2.1)     | multiplier badge stamps diagonally: scale 2.2→1, rotate +18°→ -8° rest, opacity 0→1
        paper-slam shake      | 3.30–3.62     | hand-coded decay  | whole stage shakes x/y/rot on a constant damped-sine table, settling to 0
        badge glow pulse      | 3.78–4.34     | sine in/out       | badge shadow blooms once then relaxes; speed-lines fully gone
        loop hold (breathe)   | 4.34–6.20     | sine.inOut        | after bar + badge gently breathe so the held frame never reads frozen

      ── DETERMINISM CONTRACT ────────────────────────────────────────────────
      ONE paused master timeline (window.__timelines["main"] / __timeline).
      • Counters driven by proxies GSAP scrubs, quantized with Math.floor so the
        number text never reads ahead of the bar that's growing (each count
        tween starts/ends exactly with its bar's scaleY tween).
      • Bar HEIGHTS are tweened via scaleY on transform-origin:bottom elements
        (discrete GSAP tween); the counter proxies only write TEXT.
      • Speed lines: 7 nodes built at construction; their upward streak offsets
        come from a HAND-CODED constant table (no RNG). The paper-slam shake is
        a HAND-CODED damped-sine table sampled by a proxy onUpdate, then snapped
        back to 0,0,0.
      • ALL DOM built at construction time (no createElement inside tl.call).
        Every animated element gets its opening state via gsap.set before frame
        0; render() runs at boot so frame 0 is the correct anticipation state.
      • Hand-coded jitter only — NO Math.random, Date, rAF, setTimeout, CSS
        transitions/@keyframes, or infinite repeats (yoyo:true repeat:1 only).
        hex6() normalizes any color before appending alpha digits. The autofit
        pass runs each onUpdate until fonts load, so long values/headlines can't
        overflow their column.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Anton";   font-weight:400;
        src:url("assets/fonts/anton-400.ttf") format("truetype"); }
      @font-face { font-family:"Archivo"; font-weight:400;
        src:url("assets/fonts/archivo-400.ttf") format("truetype"); }
      @font-face { font-family:"Archivo"; font-weight:600;
        src:url("assets/fonts/archivo-600.ttf") format("truetype"); }
      @font-face { font-family:"Archivo"; font-weight:700;
        src:url("assets/fonts/archivo-700.ttf") format("truetype"); }

      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden;
              font-family:"Archivo",sans-serif; }

      /* stage: the paper-slam shake transform lives on this wrapper */
      .stage {
        position:absolute; left:50%; top:50%;
        width:1360px; height:760px;
        margin-left:-680px; margin-top:-380px;
        will-change:transform;
        display:flex; flex-direction:column; align-items:center;
        justify-content:center;
      }

      .headline {
        font-family:"Archivo",sans-serif; font-weight:700;
        font-size:58px; line-height:1.06; letter-spacing:-0.02em;
        text-align:center; max-width:1180px;
        margin:0 auto 56px;
        white-space:normal;
      }

      /* the chart: two columns sharing a baseline */
      .chart {
        position:relative;
        width:980px; height:600px;
        display:flex; align-items:flex-end; justify-content:center;
        gap:200px;
      }
      /* baseline drawn under both columns (scaleX from left) */
      .axis {
        position:absolute; left:0; right:0; bottom:0; height:4px;
        border-radius:2px; transform-origin:left center;
      }

      .col {
        position:relative;
        width:300px; height:100%;
        display:flex; flex-direction:column; align-items:center;
        justify-content:flex-end;
      }
      /* value sits ABOVE its bar; column is flex-end so value+bar stack up */
      .valWrap {
        position:relative; width:100%;
        height:120px;
        display:flex; align-items:flex-end; justify-content:center;
        margin-bottom:18px;
      }
      .val {
        font-family:"Anton",sans-serif; font-weight:400;
        font-size:96px; line-height:0.92; letter-spacing:0.01em;
        white-space:nowrap;
        transform-origin:center bottom;
      }
      .unit { font-size:0.42em; letter-spacing:0; opacity:0.78; }

      .bar {
        position:relative; width:100%; border-radius:18px 18px 0 0;
        transform-origin:center bottom;
      }
      .barBefore { height:150px; }
      .barAfter  { height:470px; }

      /* label pill under each bar, sized to content */
      .labelPill {
        position:absolute; left:50%; bottom:-58px;
        transform:translateX(-50%);
        font-family:"Archivo",sans-serif; font-weight:700;
        font-size:24px; letter-spacing:0.16em;
        padding:9px 22px; border-radius:9999px;
        white-space:nowrap;
      }

      /* upward motion-blur speed lines behind the AFTER bar */
      .speed {
        position:absolute; bottom:0; width:8px; border-radius:4px;
        transform-origin:bottom center;
        pointer-events:none;
      }

      /* the slammed multiplier badge, anchored over the after column top */
      .badge {
        position:absolute;
        font-family:"Anton",sans-serif; font-weight:400;
        font-size:124px; line-height:0.86; letter-spacing:0.005em;
        color:#0b0d12;
        padding:24px 38px 20px; border-radius:26px;
        white-space:nowrap;
        transform-origin:center center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.2" data-width="1920" data-height="1080">
      <div class="stage" id="stage">
        <div class="headline" id="headline"></div>
        <div class="chart" id="chart">
          <div class="axis" id="axis"></div>

          <!-- BEFORE column -->
          <div class="col" id="colBefore">
            <div class="valWrap">
              <div class="val" id="valBefore"><span id="numBefore">0</span><span class="unit" id="unitBefore"></span></div>
            </div>
            <div class="bar barBefore" id="barBefore"></div>
            <div class="labelPill" id="labelBefore"></div>
          </div>

          <!-- AFTER column -->
          <div class="col" id="colAfter">
            <div class="valWrap">
              <div class="val" id="valAfter"><span id="numAfter">0</span><span class="unit" id="unitAfter"></span></div>
            </div>
            <div class="bar barAfter" id="barAfter"></div>
            <div class="labelPill" id="labelAfter"></div>
            <!-- speed lines + badge live inside the after column so they track it -->
            <div id="speedWrap"></div>
            <div class="badge" id="badge"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize a CSS hex color to 6-digit form so 2-digit alpha can be
         appended safely (#abc → #aabbcc, #rrggbbaa → #rrggbb) */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}

      /* ── parse variables ─────────────────────────────────────────────── */
      const HEADLINE = String(V.headline);
      const BEFORE_V = Math.max(0, Math.round(parseFloat(String(V.beforeValue).replace(/[, ]/g,"")) || 0));
      const AFTER_V  = Math.max(0, Math.round(parseFloat(String(V.afterValue ).replace(/[, ]/g,"")) || 0));
      const UNIT     = String(V.unit);
      const L_BEFORE = String(V.beforeLabel);
      const L_AFTER  = String(V.afterLabel);
      const BADGE_TX = String(V.multiplierBadgeText);

      // barColors "before~after" (tolerate "|" too, and a single color)
      const bcRaw = String(V.barColors).split(/[~|]/).map(s => s.trim()).filter(Boolean);
      const C_BEFORE = hex6(bcRaw[0] || "#3a3f4b");
      const C_AFTER  = hex6(bcRaw[1] || String(V.accent));
      const ACCENT   = hex6(V.accent);
      const INK      = String(V.ink);

      /* thousands-separated display of a counter value */
      const fmt = n => Math.floor(n).toLocaleString("en-US");

      /* ── elements ───────────────────────────────────────────────────── */
      const root      = document.getElementById("root");
      const stage     = document.getElementById("stage");
      const headline  = document.getElementById("headline");
      const axis      = document.getElementById("axis");
      const barBefore = document.getElementById("barBefore");
      const barAfter  = document.getElementById("barAfter");
      const valBefore = document.getElementById("valBefore");
      const valAfter  = document.getElementById("valAfter");
      const numBefore = document.getElementById("numBefore");
      const numAfter  = document.getElementById("numAfter");
      const unitBefore= document.getElementById("unitBefore");
      const unitAfter = document.getElementById("unitAfter");
      const labelBefore = document.getElementById("labelBefore");
      const labelAfter  = document.getElementById("labelAfter");
      const speedWrap = document.getElementById("speedWrap");
      const badge     = document.getElementById("badge");

      /* ── static styling from variables ──────────────────────────────── */
      document.body.style.background = V.bg;
      root.style.background  = V.bg;
      headline.style.color   = INK;
      valBefore.style.color  = INK;
      valAfter.style.color   = C_AFTER;        // the winning number wears the win color
      axis.style.background  = hex6(INK) + "33";

      headline.textContent   = HEADLINE;
      unitBefore.textContent = UNIT;
      unitAfter.textContent  = UNIT;
      numBefore.textContent  = "0";
      numAfter.textContent   = "0";

      barBefore.style.background = C_BEFORE;
      barBefore.style.boxShadow  = "0 -2px 30px rgba(0,0,0,0.25)";
      barAfter.style.background  =
        `linear-gradient(180deg, ${C_AFTER} 0%, ${C_AFTER}cc 100%)`;
      barAfter.style.boxShadow   = `0 -2px 50px ${C_AFTER}55`;

      labelBefore.textContent = L_BEFORE;
      labelAfter.textContent  = L_AFTER;
      labelBefore.style.color = INK;
      labelBefore.style.background = hex6(INK) + "1a";
      labelAfter.style.color  = "#0b0d12";
      labelAfter.style.background = ACCENT;

      // badge
      badge.textContent = BADGE_TX;
      badge.style.background = ACCENT;

      /* ── bar geometry: data-driven heights sharing the baseline ──────── */
      const BAR_MAX   = 470;                 // tallest bar (after, at its peak)
      const BAR_MIN   = 110;                 // floor so a tiny "before" still reads
      // proportional heights; after is always the visual winner when it's larger
      const ratio = AFTER_V > 0 ? Math.min(1, BEFORE_V / AFTER_V) : 0.32;
      const H_AFTER  = BAR_MAX;
      const H_BEFORE = Math.max(BAR_MIN, Math.round(BAR_MAX * (AFTER_V >= BEFORE_V ? ratio : 1)));
      barBefore.style.height = H_BEFORE + "px";
      barAfter.style.height  = H_AFTER  + "px";

      /* ── speed lines: 7 nodes, HAND-CODED constant table (no RNG) ────── */
      // x is offset from the after-bar center; h = streak length; dl = stagger
      const SPEED = [
        { x:-120, h:360, w: 7, dl:0.00 },
        { x: -78, h:300, w: 6, dl:0.04 },
        { x: -40, h:420, w: 9, dl:0.02 },
        { x:   0, h:470, w:10, dl:0.06 },
        { x:  40, h:410, w: 9, dl:0.01 },
        { x:  78, h:300, w: 6, dl:0.05 },
        { x: 120, h:360, w: 7, dl:0.03 }
      ];
      const speedEls = SPEED.map(s => {
        const el = document.createElement("div");
        el.className = "speed";
        el.style.left   = `calc(50% + ${s.x}px)`;
        el.style.width  = s.w + "px";
        el.style.height = s.h + "px";
        el.style.background =
          `linear-gradient(180deg, ${ACCENT}00 0%, ${ACCENT}cc 70%, ${ACCENT} 100%)`;
        speedWrap.appendChild(el);
        return el;
      });

      /* ── paper-slam shake: HAND-CODED damped-sine sampled by a proxy ──── */
      const SHAKE_DUR = 0.32;
      function shakeAt(local) {                 // local in [0..SHAKE_DUR]
        if (local <= 0 || local >= SHAKE_DUR) return { x:0, y:0, r:0 };
        const k = local / SHAKE_DUR;            // 0→1
        const decay = Math.pow(1 - k, 2.2);     // fast settle to 0
        return {
          x: Math.sin(local * 92)  * 16 * decay,
          y: Math.sin(local * 118) * 11 * decay,
          r: Math.sin(local * 104) * 0.9  * decay
        };
      }

      /* ── timing constants (the phase table above) ───────────────────── */
      const BEF_START = 0.42, BEF_DUR = 1.20;          // before grows
      const AFT_START = 2.18, AFT_DUR = 1.12;          // after rockets
      const SLAM_AT   = 3.30, SLAM_DUR = 0.48;         // badge stamp
      const SHAKE_AT  = 3.30;                          // shake starts on impact
      const GLOW_AT   = 3.78;
      const HOLD_FROM = 4.34;
      const DUR       = 6.2;
      const BADGE_REST_ROT = -8;                       // degrees at rest

      /* ── initial states — frame 0 is the RESTING OPENING SCAFFOLD ─────
         The stage, axis baseline, both label pills and the headline are all
         visible at t=0 (an "empty chart waiting" frame, never a black void);
         only the bars, values, speed-lines and badge animate in as the proof
         beats. The headline does a subtle settle so the entrance still reads. */
      gsap.set(stage,    { x:0, y:0, rotation:0, opacity:1 });
      gsap.set(headline, { opacity:1, y:14, filter:"blur(4px)" });
      gsap.set(axis,     { scaleX:1 });
      gsap.set(barBefore,{ scaleY:0 });
      gsap.set(barAfter, { scaleY:0 });
      gsap.set(valBefore,{ scale:0.7, opacity:0 });
      gsap.set(valAfter, { scale:0.7, opacity:0 });
      gsap.set(labelBefore,{ opacity:0.55, y:0 });
      gsap.set(labelAfter, { opacity:0.55, y:0 });
      gsap.set(badge,    { opacity:0, scale:2.2, rotation:18,
                           xPercent:-50, yPercent:-50 });
      speedEls.forEach(el => gsap.set(el, { scaleY:0, opacity:0 }));

      /* ── autofit: shrink big type to its box; re-run until fonts load ── */
      function fitText(el, maxW, baseFs, minFs) {
        el.style.fontSize = baseFs + "px";
        const w = el.scrollWidth;
        if (w > maxW) {
          el.style.fontSize = Math.max(minFs, Math.floor(baseFs * (maxW / w))) + "px";
        }
      }
      function fitAll() {
        fitText(valBefore, 290, 96, 40);
        fitText(valAfter,  290, 96, 40);
        // headline wraps to two lines inside max-width:1200; only shrink if a
        // single long token still overflows after wrapping
        headline.style.fontSize = "60px";
        if (headline.scrollWidth > 1200) {
          headline.style.fontSize =
            Math.max(34, Math.floor(60 * (1200 / headline.scrollWidth))) + "px";
        }
        // badge sized to its column footprint (~280px)
        badge.style.fontSize = "112px";
        if (badge.scrollWidth > 280) {
          badge.style.fontSize =
            Math.max(56, Math.floor(112 * (280 / badge.scrollWidth))) + "px";
        }
        // rest position over the after bar's MIDDLE, biased right — sits on
        // the body of the bar, clear of both the headline above and the
        // floating value text, so nothing collides
        badge.style.left = "86%";
        badge.style.top  = "44%";
      }
      let fitted = false;
      function ensureFit() {
        if (fitted) return;
        fitAll();
        if (document.fonts && document.fonts.status === "loaded") fitted = true;
      }

      /* ── counter proxies (TEXT only — bars are tweened separately) ───── */
      const cb = { v: 0 }, ca = { v: 0 };
      const drawBeforeNum = () => { numBefore.textContent = fmt(cb.v); };
      const drawAfterNum  = () => { numAfter.textContent  = fmt(ca.v); };

      /* ── shake proxy ─────────────────────────────────────────────────── */
      const shk = { t: 0 };
      function drawShake() {
        const s = shakeAt(shk.t);
        gsap.set(stage, { x:s.x, y:s.y, rotation:s.r });
      }

      /* ── paused master timeline; HyperFrames seeks it ───────────────── */
      const tl = gsap.timeline({ paused:true, onUpdate:ensureFit });

      // PHASE 1 — anticipation: headline settles in over the resting scaffold
      tl.to(headline, { opacity:1, y:0, filter:"blur(0px)",
                        duration:0.40, ease:"power3.out" }, 0.05);

      // PHASE 2 — BEFORE grows + counts (count tween mirrors the bar tween)
      tl.to(valBefore, { scale:1, opacity:1, duration:0.40, ease:"back.out(1.6)" }, BEF_START - 0.06);
      tl.to(barBefore, { scaleY:1, duration:BEF_DUR, ease:"power2.out" }, BEF_START);
      tl.to(cb,        { v:BEFORE_V, duration:BEF_DUR, ease:"power2.out",
                         onUpdate:drawBeforeNum }, BEF_START);
      tl.to(labelBefore,{ opacity:1, duration:0.40, ease:"power2.out" }, BEF_START + 0.30);

      // PHASE 3 — beat of stillness: held before bar breathes (finite)
      tl.to(barBefore, { scaleY:1.012, duration:0.28, ease:"sine.inOut",
                         yoyo:true, repeat:1 }, 1.62);

      // PHASE 4 — AFTER rockets up past before + speed lines + fast count
      tl.to(valAfter,  { scale:1, opacity:1, duration:0.36, ease:"back.out(1.7)" }, AFT_START);
      tl.to(barAfter,  { scaleY:1, duration:AFT_DUR, ease:"power4.out" }, AFT_START);
      tl.to(ca,        { v:AFTER_V, duration:AFT_DUR, ease:"power4.out",
                         onUpdate:drawAfterNum }, AFT_START);
      tl.to(labelAfter,{ opacity:1, duration:0.40, ease:"power2.out" }, AFT_START + 0.34);
      // speed lines streak upward then fade (hand-coded stagger)
      SPEED.forEach((s, i) => {
        tl.fromTo(speedEls[i],
          { scaleY:0, opacity:0.0 },
          { scaleY:1, opacity:0.9, duration:0.34, ease:"power3.out", immediateRender:false },
          AFT_START + s.dl);
        tl.to(speedEls[i],
          { scaleY:1.15, opacity:0, duration:0.45, ease:"power2.in" },
          AFT_START + 0.40 + s.dl);
      });

      // PHASE 5 — badge SLAM (diagonal stamp) + paper-slam shake
      tl.fromTo(badge,
        { opacity:0, scale:2.2, rotation:18 },
        { opacity:1, scale:1, rotation:BADGE_REST_ROT,
          duration:SLAM_DUR, ease:"back.out(2.1)", immediateRender:false }, SLAM_AT);
      // shake proxy 0→SHAKE_DUR sampled into stage x/y/rot, then snap back to 0
      tl.fromTo(shk, { t:0 }, { t:SHAKE_DUR, duration:SHAKE_DUR, ease:"none",
                               onUpdate:drawShake }, SHAKE_AT);
      tl.set(stage, { x:0, y:0, rotation:0 }, SHAKE_AT + SHAKE_DUR);

      // PHASE 6 — badge glow pulse once (shadow bloom), speed lines gone
      tl.fromTo(badge,
        { boxShadow:`0 18px 50px ${ACCENT}66, 0 0 0px ${ACCENT}00` },
        { boxShadow:`0 26px 80px ${ACCENT}99, 0 0 60px ${ACCENT}55`,
          duration:0.26, ease:"sine.out", immediateRender:false }, GLOW_AT);
      tl.to(badge,
        { boxShadow:`0 18px 50px ${ACCENT}55, 0 0 24px ${ACCENT}33`,
          duration:0.30, ease:"sine.inOut" }, GLOW_AT + 0.26);

      // PHASE 7 — loop hold: after bar + badge breathe so it never freezes
      tl.to(barAfter, { scaleY:0.992, duration:0.95, ease:"sine.inOut",
                        yoyo:true, repeat:1 }, HOLD_FROM);
      tl.to(badge,    { scale:1.018, duration:0.95, ease:"sine.inOut",
                        yoyo:true, repeat:1 }, HOLD_FROM + 0.1);

      // pad the hold to the very end of data-duration
      tl.set({}, {}, DUR);

      ensureFit();   // frame 0 styled + first autofit immediately

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
