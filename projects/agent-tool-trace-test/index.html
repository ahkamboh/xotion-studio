<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"agentName",  "type":"string","label":"Agent name (header)",                "default":"Xotion Agent"},
  {"id":"toolCalls",  "type":"string","label":"Tool calls — rows pipe-separated \"|\"; per row 5 sub-fields by \"~\": name ~ args ~ duration(ms) ~ result-chip ~ depth(0=root,1=sub-call)", "default":"search_docs~query: \"export to slack\"~310~12 hits~0|fetch_page~url: \"/integrations/slack\"~180~4.2 KB~1|send_message~channel: \"#launch\", text: \"Shipping today :rocket:\"~240~delivered~0|update_status~state: \"done\"~90~ok~0"},
  {"id":"finalAnswerText","type":"string","label":"Final answer card text",          "default":"Posted the launch note to #launch and marked the task done."},
  {"id":"accentColor", "type":"color", "label":"Accent (checks / glow / final card)", "default":"#6d5efc"},
  {"id":"theme",       "type":"string","label":"Theme: dark / light",                 "default":"dark"},
  {"id":"monoFont",    "type":"string","label":"Mono font family (args / tool names)","default":"JetBrains Mono"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      AGENT TOOL-CALL TRACE — an inspector panel where an agent "thinks out loud":
      tool-call rows APPEND one at a time. Each row slides up from below, its tool
      name + monospace args fade in, a spinner spins while the call "runs", then the
      spinner SNAPS to a green check while a per-row duration tick counts up to its
      ms value and a result chip STAMPS in (scale-overshoot). Sub-calls (depth=1)
      indent under their parent with a connector rail. After the last row resolves,
      the final ANSWER CARD rises from below with an accent glow that blooms in.
      Loop-friendly hold to the end.

      The agent-framework-demo UI (Agents SDK / LangChain / Claude Code clips) that
      everyone screen-records — now a designable, recolorable, variable-driven preset.

      ── VARIABLES ──────────────────────────────────────────────────────────────
        agentName       header label beside the orb               ("Xotion Agent")
        toolCalls       the trace. ROWS separated by "|".
                        Each row = 5 sub-fields separated by "~":
                          1 name        tool name (mono)           e.g. search_docs
                          2 args        argument string (mono)     e.g. query: "x"
                          3 duration    integer milliseconds       e.g. 310
                          4 result      chip text (the stamp)      e.g. 12 hits
                          5 depth       0 = root, 1 = sub-call (indented under prev)
                        Any field may be empty (e.g. "~~~~0"). Long args/results
                        wrap & the panel/cards size to content — nothing clips.
        finalAnswerText answer card body (wraps to 3+ lines safely)
        accentColor     checks, duration ticks, glow, final-card accent rail
        theme           "dark" (default) or "light"
        monoFont        family used for tool names + args + ticks

      ── PHASE TABLE (data-duration 8.0s; FINAL frame holds to 8.0s) ─────────────
        data-duration is STATIC, but the row count N is variable, so the whole
        row sequence is uniformly time-scaled by PACE = min(1, fitStride/1.05).
        PACE=1 for short traces (the 4-row default below is unchanged); it shrinks
        only when there are enough rows that the full-pace sequence wouldn't fit —
        so EVERY N's last row resolves AND the final answer fully blooms before
        the loop hold. ROW i owns a (1.05*PACE)s window starting at 0.55+i*STRIDE:
          phase          rel-start    ease            what moves
          slide-in        +0.00        power3.out      row y28→0, opacity 0→1, args x-12→0
          spinner spins   +0.30*PACE   none (proxy)    8-tick ring rotates, head dot leads
          check snap      +0.78*PACE   back.out(3)     spinner→0, check circle scale 0→1
          duration tick   +0.78*PACE   none (proxy)    "0 ms"→"<dur> ms" counts up (floor)
          result stamp    +0.86*PACE   back.out(2.4)   chip scale 1.35→1, opacity→1
        After the last row's chip stamps (lastResolve):
          +0.10  answer card rises  power3.out   y40→0, opacity 0→1, scale .97→1
          +0.10  glow blooms        power2.out   card box-shadow alpha 0→peak (proxy)
          +0.55  "Final answer" eyebrow + caret settle
        camera: gentle push 1.035→1.0 across the whole clip (depth, never static).
        fit:   the panel is measured (offsetHeight) and scaled about its centre so
               any N fits inside 1080px — cached once document.fonts is loaded.
        idle:  the agent orb breathes (finite sine via proxy) the entire clip.

      ── DETERMINISM CONTRACT ────────────────────────────────────────────────────
        ONE paused master timeline (window.__timelines.main / window.__timeline).
        Per-frame values (spinner rotation, head-dot index, duration tick text,
        glow alpha, orb breath) are computed in render(t) from a single proxy
        {t} tween (ease:"none") — pure function of time, HyperFrames seeks any
        frame. Discrete moves (slide-in, check snap, chip stamp, card rise) are
        normal GSAP tweens on the SAME timeline. Duration ticks are quantized with
        Math.floor against the same progress that drives the visual, so the number
        never reads ahead. ALL DOM (every row, spinner tick, check, chip) is built
        at construction time from the parsed variable — the build LOOP runs at
        construction, never inside a callback. Every animated element gets its
        opening state via gsap.set before frame 0; render(0) runs at boot.
        No Math.random / Date / rAF / setTimeout / CSS transition|@keyframes /
        infinite repeats. The only network resource is the GSAP CDN; fonts local.

      ── TYPE ──────────────────────────────────────────────────────────────────
        UI / chrome  : Space Grotesk (geometric-technical sans — agent-console feel)
        code / args  : JetBrains Mono (tool names, args, duration ticks, chips)
        Both ship in assets/fonts/ (space-grotesk-{500,600,700}.ttf, jetbrains-500.ttf).
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Space Grotesk"; font-weight:500;
        src:url("assets/fonts/space-grotesk-500.ttf") format("truetype"); }
      @font-face { font-family:"Space Grotesk"; font-weight:600;
        src:url("assets/fonts/space-grotesk-600.ttf") format("truetype"); }
      @font-face { font-family:"Space Grotesk"; font-weight:700;
        src:url("assets/fonts/space-grotesk-700.ttf") format("truetype"); }
      @font-face { font-family:"JetBrains Mono"; font-weight:500;
        src:url("assets/fonts/jetbrains-500.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; }

      /* camera — one transform on this wrapper (gsap owns it) */
      .cam { position:absolute; left:50%; top:50%; will-change:transform; }

      /* the inspector panel — sizes to content (max-width, never hard width) */
      .panel {
        width:1180px; max-width:1180px;
        border-radius:28px;
        padding:46px 54px 50px;
        font-family:"Space Grotesk",sans-serif;
        position:relative;
      }

      /* header: orb + agent name + live "running" pill */
      .head { display:flex; align-items:center; gap:18px; margin-bottom:34px; }
      .orb {
        width:46px; height:46px; border-radius:14px;
        display:flex; align-items:center; justify-content:center;
        flex:0 0 auto; position:relative;
      }
      .orb svg { width:26px; height:26px; display:block; }
      .agentName { font-weight:700; font-size:30px; letter-spacing:-0.015em; }
      .statePill {
        margin-left:auto; display:flex; align-items:center; gap:10px;
        font-size:19px; font-weight:600; padding:8px 18px; border-radius:999px;
        white-space:nowrap;
      }
      .statePill .pulse { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }

      /* the rows list */
      .rows { display:flex; flex-direction:column; gap:18px; }

      /* a single tool-call row */
      .row {
        display:flex; align-items:flex-start; gap:20px;
        padding:22px 26px; border-radius:18px;
        position:relative;
      }
      .row.sub { margin-left:56px; }
      /* connector rail for sub-calls */
      .rail {
        position:absolute; left:-34px; top:-30px; width:34px; bottom:50%;
        border-left:2px solid; border-bottom:2px solid;
        border-bottom-left-radius:14px;
      }

      /* status glyph (spinner OR check) — a fixed 40px slot so width never jumps */
      .status { width:40px; height:40px; flex:0 0 auto; position:relative; margin-top:2px; }
      .spinner { position:absolute; inset:0; }
      .spinner .tick {
        position:absolute; left:50%; top:50%; width:4px; height:11px;
        border-radius:2px; transform-origin:50% 0;
      }
      .check {
        position:absolute; inset:0; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
      }
      .check svg { width:24px; height:24px; display:block; }

      /* the row body: tool name line + args line */
      .body { flex:1 1 auto; min-width:0; }
      .toolLine { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
      .toolName {
        font-family:"JetBrains Mono",monospace; font-weight:500; font-size:25px;
        letter-spacing:-0.01em;
      }
      .toolName .dot { opacity:0.5; }
      .durTick {
        font-family:"JetBrains Mono",monospace; font-weight:500; font-size:18px;
        font-variant-numeric:tabular-nums; white-space:nowrap;
      }
      .args {
        font-family:"JetBrains Mono",monospace; font-weight:500; font-size:20px;
        margin-top:8px; line-height:1.45;
        white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;
      }

      /* result chip — the stamp */
      .chip {
        flex:0 0 auto; align-self:center; margin-left:14px;
        font-family:"JetBrains Mono",monospace; font-weight:500; font-size:18px;
        padding:8px 16px; border-radius:10px; white-space:nowrap;
        display:flex; align-items:center; gap:8px;
      }
      .chip .ck { width:13px; height:13px; flex:0 0 auto; }

      /* final answer card */
      .answer {
        margin-top:30px; padding:30px 34px 32px;
        border-radius:20px; position:relative; overflow:hidden;
      }
      .answer .accentRail {
        position:absolute; left:0; top:0; bottom:0; width:6px;
      }
      .answer .eyebrow {
        display:flex; align-items:center; gap:11px;
        font-size:18px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
        margin-bottom:14px;
      }
      .answer .eyebrow .spark { width:18px; height:18px; display:block; }
      .answer .atext {
        font-size:31px; font-weight:600; line-height:1.42; letter-spacing:-0.01em;
        white-space:pre-wrap; word-break:break-word;
      }
      .answer .acaret {
        display:inline-block; width:3px; height:30px; margin-left:4px;
        transform:translateY(5px); border-radius:2px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.0" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <div class="panel" id="panel">
          <div class="head">
            <div class="orb" id="orb">
              <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 L12 7 M12 17 L12 21 M3 12 L7 12 M17 12 L21 12"></path>
                <circle cx="12" cy="12" r="4.2"></circle>
              </svg>
            </div>
            <div class="agentName" id="agentName"></div>
            <div class="statePill" id="statePill">
              <span class="pulse" id="statePulse"></span><span id="stateText">running</span>
            </div>
          </div>
          <div class="rows" id="rows"></div>
          <div class="answer" id="answer">
            <div class="accentRail" id="accentRail"></div>
            <div class="eyebrow" id="ansEyebrow">
              <svg class="spark" viewBox="0 0 24 24" fill="none" stroke-width="2.2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 L13.6 9.2 L20 11 L13.6 12.8 L12 19 L10.4 12.8 L4 11 L10.4 9.2 Z"></path>
              </svg>
              <span>Final answer</span>
            </div>
            <div class="atext" id="atext"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize a CSS hex to 6-digit so 2-digit alpha can be appended safely */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}

      const ACCENT = hex6(V.accentColor) || "#6d5efc";
      const DARK   = String(V.theme).trim().toLowerCase() !== "light";
      const MONO   = String(V.monoFont || "JetBrains Mono") + ", monospace";

      /* ── theme palette ──────────────────────────────────────────────────── */
      const PAL = DARK ? {
        bg:"#0c0d12", panel:"#15161e", panelEdge:"#262838",
        ink:"#f3f4fb", inkSoft:"#a7aac4", inkFaint:"#6f7290",
        row:"#1b1c27", rowEdge:"#2a2c3c",
        chipBg:"#1f2230", chipInk:"#c9cce6",
        spinnerDim:"#3a3d54",
        ansBg:"#171826", ansEdge:"#2c2e42",
        pillBg:"#231f3d", pillInk:"#b9b2ff"
      } : {
        bg:"#f4f5fa", panel:"#ffffff", panelEdge:"#e7e9f2",
        ink:"#15161f", inkSoft:"#54586e", inkFaint:"#9498ad",
        row:"#f7f8fc", rowEdge:"#e9ebf3",
        chipBg:"#eef0f7", chipInk:"#3c4055",
        spinnerDim:"#d4d7e4",
        ansBg:"#f6f5ff", ansEdge:"#e3e0f7",
        pillBg:"#efedff", pillInk:"#5b4fd6"
      };

      /* ── parse the toolCalls variable ───────────────────────────────────── */
      // rows split on "|", fields split on "~": name ~ args ~ durMs ~ result ~ depth
      const ROWS = String(V.toolCalls).split("|").map(s => s.trim()).filter(s => s.length).map(seg => {
        const f = seg.split("~");
        return {
          name:   (f[0] || "tool").trim(),
          args:   (f[1] || "").trim(),
          dur:    Math.max(0, parseInt(f[2], 10) || 0),
          result: (f[3] || "").trim(),
          depth:  (parseInt(f[4], 10) || 0) > 0 ? 1 : 0
        };
      });
      const N = ROWS.length || 1;

      /* ── timing (spec / phase table) ────────────────────────────────────── */
      // data-duration is STATIC (8.0s) but N is only known at runtime, so the
      // whole row sequence is time-scaled by PACE so that ANY plausible N still
      // finishes — every row resolves AND the final answer card fully blooms —
      // before the loop hold. PACE=1 for the default look; it shrinks only when
      // there are enough rows that the full-pace sequence wouldn't fit. The
      // scale is uniform across stride + every per-row phase offset, so the
      // beat ORDER (slide→spin→snap→tick→stamp, then answer) is preserved for
      // every N; nothing ever rises before the row above it has resolved.
      const DUR        = 8.0;
      const START      = 0.55;     // first row begins
      const BASE_STRIDE= 1.05;     // each row's window at full pace
      // tail the answer phase needs after the last row resolves (rise+glow+eyebrow)
      const TAIL       = 1.15;     // ANS rise/glow/eyebrow fully complete in this window
      const HOLD       = 0.70;     // loop-friendly hold at the end
      // full per-row resolution window (last chip stamps STAMP_AT+stamp after start)
      const ROW_WINDOW = 1.20;     // 0.86 stamp-at + 0.34 stamp-dur (at full pace)
      // Largest stride s such that the LAST row fully resolves and the answer
      // tail+hold still fit inside DUR. The last row's chip lands at
      //   lastResolve = START + (N-1)*s + ROW_WINDOW*(s/BASE_STRIDE)
      // and the answer phase + hold add a fixed TAIL+HOLD after it, so:
      //   START + s*[(N-1) + ROW_WINDOW/BASE_STRIDE] + TAIL + HOLD <= DUR
      const denom      = (N - 1) + ROW_WINDOW / BASE_STRIDE;
      const fitStride  = (DUR - START - TAIL - HOLD) / Math.max(denom, 1e-6);
      // Windows may overlap when compressed; uniform PACE keeps ordering valid.
      const PACE       = Math.min(1, fitStride / BASE_STRIDE);
      const ROW_STRIDE = BASE_STRIDE * PACE;
      const SLIDE_DUR  = 0.40 * PACE;
      const SPIN_AT    = 0.30 * PACE; // rel: spinner starts spinning
      const SNAP_AT    = 0.78 * PACE; // rel: spinner -> check
      const TICK_DUR   = 0.34 * PACE; // duration counter count-up
      const STAMP_AT   = 0.86 * PACE; // rel: result chip stamps
      const STAMP_DUR  = 0.34 * PACE;
      // discrete per-row tween durations/offsets — ALSO scaled by PACE so the
      // whole row block is a uniform time-scaling: lastResolve below then matches
      // the actual chip-stamp end exactly for every N (answer never pre-empts it).
      const ARGS_OFF   = 0.08 * PACE;
      const ARGS_DUR   = 0.42 * PACE;
      const SNAP_DUR   = 0.18 * PACE;
      const CHECK_DUR  = 0.40 * PACE;
      const lastRowStart = START + (N - 1) * ROW_STRIDE;
      const lastResolve  = lastRowStart + STAMP_AT + STAMP_DUR; // last chip done
      const ANS_AT     = lastResolve + 0.10;    // answer rises right after
      const GLOW_DUR   = 0.85 * PACE;

      /* ── number of spinner ticks ────────────────────────────────────────── */
      const SPIN_TICKS = 8;

      /* ── elements ───────────────────────────────────────────────────────── */
      const root   = document.getElementById("root");
      const cam    = document.getElementById("cam");
      const panel  = document.getElementById("panel");
      const orb    = document.getElementById("orb");
      const rowsEl = document.getElementById("rows");
      const answer = document.getElementById("answer");
      const atext  = document.getElementById("atext");
      const accentRail = document.getElementById("accentRail");
      const ansEyebrow = document.getElementById("ansEyebrow");
      const statePill  = document.getElementById("statePill");
      const statePulse = document.getElementById("statePulse");
      const stateText  = document.getElementById("stateText");

      /* ── static styling from theme/variables ────────────────────────────── */
      document.body.style.background = PAL.bg;
      root.style.background = PAL.bg;
      panel.style.background = PAL.panel;
      panel.style.border = "1px solid " + PAL.panelEdge;
      panel.style.boxShadow = DARK
        ? "0 40px 120px rgba(0,0,0,0.55), 0 0 0 1px " + hex6(PAL.panelEdge)
        : "0 40px 110px rgba(40,44,70,0.16)";

      orb.style.background = "linear-gradient(135deg, " + ACCENT + ", " + ACCENT + "cc)";
      orb.style.boxShadow  = "0 8px 26px " + ACCENT + "66";
      document.getElementById("agentName").textContent = String(V.agentName);
      document.getElementById("agentName").style.color = PAL.ink;

      statePill.style.background = PAL.pillBg;
      statePill.style.color = PAL.pillInk;
      statePulse.style.background = ACCENT;

      /* answer card */
      answer.style.background = PAL.ansBg;
      answer.style.border = "1px solid " + PAL.ansEdge;
      accentRail.style.background = "linear-gradient(180deg, " + ACCENT + ", " + ACCENT + "99)";
      ansEyebrow.style.color = ACCENT;
      ansEyebrow.querySelector(".spark").style.stroke = ACCENT;
      atext.textContent = String(V.finalAnswerText);
      atext.style.color = PAL.ink;
      atext.style.fontFamily = '"Space Grotesk",sans-serif';
      // accent caret at end of the answer text
      const caret = document.createElement("span");
      caret.className = "acaret";
      caret.style.background = ACCENT;
      atext.appendChild(caret);

      /* ── BUILD ROWS — this loop runs at CONSTRUCTION TIME (never in a cb) ─── */
      const rowObjs = ROWS.map((r, i) => {
        const row = document.createElement("div");
        row.className = "row" + (r.depth ? " sub" : "");
        row.style.background = PAL.row;
        row.style.border = "1px solid " + PAL.rowEdge;

        // sub-call connector rail
        if (r.depth) {
          const rail = document.createElement("div");
          rail.className = "rail";
          rail.style.borderColor = PAL.inkFaint;
          rail.style.opacity = "0.55";
          row.appendChild(rail);
        }

        // status slot: spinner + check stacked
        const status = document.createElement("div");
        status.className = "status";

        const spinner = document.createElement("div");
        spinner.className = "spinner";
        const spinTicks = [];
        for (let k = 0; k < SPIN_TICKS; k++) {
          const tk = document.createElement("div");
          tk.className = "tick";
          tk.style.background = ACCENT;
          // arrange around a 40px ring: rotate then push outward
          tk.style.transform = "translate(-50%,-2px) rotate(" + (k * 360 / SPIN_TICKS) + "deg) translateY(-14px)";
          tk.style.transformOrigin = "50% 2px";
          spinner.appendChild(tk);
          spinTicks.push(tk);
        }

        const check = document.createElement("div");
        check.className = "check";
        check.style.background = ACCENT;
        check.style.boxShadow = "0 4px 14px " + ACCENT + "59";
        check.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" ' +
          'stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"></path></svg>';
        const checkPath = check.querySelector("path");

        status.appendChild(spinner);
        status.appendChild(check);

        // body: tool name + duration tick, then args
        const body = document.createElement("div");
        body.className = "body";

        const toolLine = document.createElement("div");
        toolLine.className = "toolLine";
        const toolName = document.createElement("span");
        toolName.className = "toolName";
        toolName.style.color = PAL.ink;
        toolName.style.fontFamily = MONO;
        // render "name()" with dimmed parens for the call feel
        toolName.innerHTML = '<span>' + escapeHtml(r.name) +
          '</span><span class="dot">()</span>';
        const durTick = document.createElement("span");
        durTick.className = "durTick";
        durTick.style.color = ACCENT;
        durTick.style.fontFamily = MONO;
        durTick.textContent = "0 ms";
        toolLine.appendChild(toolName);
        toolLine.appendChild(durTick);

        const args = document.createElement("div");
        args.className = "args";
        args.style.color = PAL.inkSoft;
        args.style.fontFamily = MONO;
        args.textContent = r.args || " ";   // keep height even if empty

        body.appendChild(toolLine);
        if (r.args) body.appendChild(args);

        // result chip
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.style.background = PAL.chipBg;
        chip.style.color = PAL.chipInk;
        chip.style.fontFamily = MONO;
        chip.style.border = "1px solid " + PAL.rowEdge;
        chip.innerHTML =
          '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="' + ACCENT + '" ' +
          'stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M5 12.5 L10 17.5 L19 7"></path></svg>' +
          '<span>' + escapeHtml(r.result || "done") + '</span>';

        row.appendChild(status);
        row.appendChild(body);
        if (r.result || true) row.appendChild(chip);
        rowsEl.appendChild(row);

        return { row, spinner, spinTicks, check, checkPath, durTick, args, chip,
                 start: START + i * ROW_STRIDE, dur: r.dur };
      });

      function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

      /* ── INITIAL STATES — frame 0 correct before any tween ──────────────── */
      gsap.set(cam, { xPercent:-50, yPercent:-50, scale:1.035 });
      gsap.set(answer, { opacity:0, y:40, scale:0.97 });
      gsap.set(ansEyebrow, { opacity:0 });
      rowObjs.forEach(o => {
        gsap.set(o.row, { opacity:0, y:28 });
        gsap.set(o.args, { opacity:0, x:-12 });
        gsap.set(o.spinner, { opacity:1, scale:1 });
        gsap.set(o.check,   { opacity:0, scale:0 });
        gsap.set(o.chip,    { opacity:0, scale:1.35 });
      });

      /* ── SCALE-TO-FIT — any N must fit inside the 1080px frame ───────────────
           The panel grows downward as rows are added; with a long trace it would
           clip top+bottom. We measure the full panel height (all rows + answer
           card are in the DOM at construction, so layout height is stable across
           time — opacity/transform don't reflow) and scale the panel about its
           own centre so it + breathing room always fits 1080. Measured LAZILY in
           the first render(); only CACHED once document.fonts.status==="loaded"
           (re-measured every frame until then, so font metrics can't bake in a
           stale height). The camera push lives on .cam (a separate transform),
           so the two never fight. */
      const VH = 1080;
      const FIT_MARGIN = 120;                 // min top+bottom breathing room (px)
      const MAX_FIT = 1;                       // never scale UP past natural size
      panel.style.transformOrigin = "center center";
      let fitScale = 1, fitLocked = false, fitLastH = -1;
      function applyFit() {
        if (fitLocked) return;
        // offsetHeight is the border-box LAYOUT height — independent of our own
        // scale AND of the .cam camera-push transform, so the measurement (and
        // thus fitScale) is a stable, deterministic function of content only.
        // Reading it forces a synchronous reflow, so it's never stale.
        const h = panel.offsetHeight;
        if (h > 0) {
          const avail = VH - FIT_MARGIN;
          fitScale = Math.min(MAX_FIT, avail / h);
          panel.style.transform = "scale(" + fitScale.toFixed(5) + ")";
          // Determinism across the renderer's parallel workers: each worker is a
          // fresh browser, so the cached value must be identical everywhere. We
          // only LOCK once (a) fonts have finished loading AND (b) we've seen the
          // SAME measured height on two consecutive calls — i.e. layout + font
          // metrics have fully settled. Until then we re-measure every frame, so
          // no worker can bake in a transient (pre-font / mid-reflow) height.
          const fontsDone = !document.fonts || document.fonts.status === "loaded";
          if (fontsDone && h === fitLastH) fitLocked = true;
          fitLastH = h;
        }
      }

      /* ── per-frame render(t): spinners, head-dot, duration ticks, glow, ──
           orb breath. Pure function of time. ──────────────────────────────── */
      function render(t) {
        applyFit();   // lazy measure + scale-to-fit (cached once fonts loaded)
        // 1. agent orb breath (finite sine, never static)
        const breath = 1 + 0.05 * Math.sin(t * 1.6);
        orb.style.transform = "scale(" + breath.toFixed(4) + ")";
        statePulse.style.opacity = (0.45 + 0.45 * (Math.sin(t * 4.2) + 1) / 2).toFixed(3);

        // 2. per-row spinner + duration tick
        for (let i = 0; i < rowObjs.length; i++) {
          const o = rowObjs[i];
          const rel = t - o.start;
          // spinner spins between SPIN_AT and SNAP_AT
          if (rel >= SPIN_AT && rel < SNAP_AT) {
            const spinT = rel - SPIN_AT;
            const head = Math.floor(spinT / 0.06) % SPIN_TICKS;  // moving head dot
            for (let k = 0; k < SPIN_TICKS; k++) {
              // trailing comet: brightest at head, fading back
              let d = (head - k + SPIN_TICKS) % SPIN_TICKS;
              const op = 0.18 + 0.82 * Math.max(0, 1 - d / 4);
              o.spinTicks[k].style.opacity = op.toFixed(3);
            }
          }
          // duration tick counts up over TICK_DUR after the snap
          const tickRel = rel - SNAP_AT;
          if (tickRel <= 0) {
            o.durTick.textContent = "0 ms";
          } else {
            const k = Math.min(1, tickRel / TICK_DUR);
            const eased = 1 - Math.pow(1 - k, 3);         // outCubic
            const val = Math.floor(eased * o.dur);         // floor: never reads ahead
            o.durTick.textContent = val + " ms";
          }
        }

        // 3. final-answer glow bloom (proxy-driven box-shadow alpha)
        const gRel = t - (ANS_AT + 0.10);
        let g = gRel <= 0 ? 0 : Math.min(1, gRel / GLOW_DUR);
        g = 1 - Math.pow(1 - g, 2);                        // outQuad
        const a1 = Math.round(g * 0x4d).toString(16).padStart(2, "0");
        const a2 = Math.round(g * 0x2e).toString(16).padStart(2, "0");
        answer.style.boxShadow = "0 0 0 1px " + ACCENT +
          Math.round(g * 0x55).toString(16).padStart(2,"0") +
          ", 0 20px 60px " + ACCENT + a1 + ", 0 8px 22px " + ACCENT + a2;

        // 4. answer caret blink once the card is in
        caret.style.opacity = t >= ANS_AT + 0.45
          ? ((Math.sin(t * 4.5) + 1) / 2).toFixed(3) : "0";

        // 5. state pill flips running -> done when the last row resolves
        const allDone = t >= lastRowStart + SNAP_AT + TICK_DUR;
        if (allDone && stateText.textContent !== "done") {
          stateText.textContent = "done";
          statePill.style.background = ACCENT + "26";
          statePill.style.color = ACCENT;
          statePulse.style.background = ACCENT;
        } else if (!allDone && stateText.textContent !== "running") {
          stateText.textContent = "running";
          statePill.style.background = PAL.pillBg;
          statePill.style.color = PAL.pillInk;
          statePulse.style.background = ACCENT;
        }
      }

      /* ── paused master timeline; HyperFrames seeks it ───────────────────── */
      const tl = gsap.timeline({ paused:true });

      // proxy drives all per-frame computed values
      const p = { t:0 };
      tl.to(p, { t:DUR, duration:DUR, ease:"none", onUpdate:() => render(p.t) }, 0);

      // gentle camera push for depth across the whole clip
      tl.fromTo(cam, { scale:1.035 }, { scale:1.0, duration:DUR, ease:"none" }, 0);

      // discrete per-row moves
      rowObjs.forEach(o => {
        // slide-in
        tl.to(o.row,  { opacity:1, y:0, duration:SLIDE_DUR, ease:"power3.out" }, o.start);
        tl.to(o.args, { opacity:1, x:0, duration:ARGS_DUR, ease:"power2.out" }, o.start + ARGS_OFF);
        // spinner -> check snap
        tl.to(o.spinner, { opacity:0, scale:0.4, duration:SNAP_DUR, ease:"power2.in",
                           immediateRender:false }, o.start + SNAP_AT);
        tl.fromTo(o.check, { scale:0, opacity:1 },
                           { scale:1, opacity:1, duration:CHECK_DUR, ease:"back.out(3)",
                             immediateRender:false }, o.start + SNAP_AT);
        // result chip stamp
        tl.fromTo(o.chip, { scale:1.35, opacity:0 },
                          { scale:1, opacity:1, duration:STAMP_DUR, ease:"back.out(2.4)",
                            immediateRender:false }, o.start + STAMP_AT);
      });

      // final answer card rises + eyebrow settles
      tl.fromTo(answer, { opacity:0, y:40, scale:0.97 },
                        { opacity:1, y:0, scale:1, duration:0.6, ease:"power3.out",
                          immediateRender:false }, ANS_AT);
      tl.fromTo(ansEyebrow, { opacity:0 }, { opacity:1, duration:0.4, ease:"power2.out",
                            immediateRender:false }, ANS_AT + 0.30);

      // hold the final frame to the end of data-duration
      tl.set({}, {}, DUR);

      render(0);  // frame 0 styled immediately

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
