<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"promptString", "type":"string","label":"Shell prompt prefix (before the typed command)", "default":"~/xotion $"},
  {"id":"commandText",  "type":"string","label":"Command that types out char-by-char",            "default":"npx xotion deploy --agent inbox-triage"},
  {"id":"outputLines",  "type":"string","label":"Output lines — pipe-separated; prefix each with a TYPE then : — spin:Connecting to Xotion Cloud | bar:Bundling agent runtime | ok:Compiled 14 tools | text:plain dim line | warn:heads-up line", "default":"spin:Connecting to Xotion Cloud|bar:Bundling agent runtime|ok:Compiled 14 tools, 0 errors|ok:Wired MCP · email · Slack|spin:Pushing to edge runtime|ok:Health check passed"},
  {"id":"successLine",  "type":"string","label":"Final success banner line",                       "default":"Deployed. Your agent is live at inbox-triage.xotion.app"},
  {"id":"typingSpeed",  "type":"string","label":"Seconds per typed character",                     "default":"0.045"},
  {"id":"bg",           "type":"color", "label":"Theme — page backdrop",                            "default":"#0b0f17"},
  {"id":"windowBg",     "type":"color", "label":"Theme — terminal window fill",                     "default":"#0d1117"},
  {"id":"ink",          "type":"color", "label":"Theme — primary mono text",                        "default":"#e6edf3"},
  {"id":"dim",          "type":"color", "label":"Theme — dim / secondary text",                     "default":"#8b949e"},
  {"id":"prompt",       "type":"color", "label":"Theme — prompt prefix color",                      "default":"#7ee787"},
  {"id":"accent",       "type":"color", "label":"Theme — spinner / progress accent",                "default":"#58a6ff"},
  {"id":"ok",           "type":"color", "label":"Theme — success green (checks + banner)",          "default":"#3fb950"},
  {"id":"warn",         "type":"color", "label":"Theme — warning amber",                            "default":"#d29922"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      TERMINAL COMMAND STREAM — a macOS terminal window boots in, a shell command
      types out character-by-character behind a blinking block cursor, then the
      output streams in line-by-line: a Braille spinner cycles a PRECOMPUTED frame
      table, an ASCII progress bar fills cell-by-cell, green ✓ checks land with a
      tick, finishing on a bold success banner and a final blinking cursor that
      holds (loop-friendly). The default-launch-video aesthetic for any CLI / SDK /
      AI-agent tool — Xotion-flavored defaults ("npx xotion deploy …").

      ── CHOREOGRAPHY (data-duration is DERIVED = ceil(BANNER_END+1.0s hold), so it
         scales with commandText/outputLines/successLine; default = 7.1s) ──────────

      ── DERIVED DURATION IS BAKED AT BUILD TIME (compile-time read, not runtime) ──
      HyperFrames reads #root's data-duration from the RAW HTML STRING at compile
      time (parseHTML → rootEl.getAttribute), BEFORE any inline JS runs. A runtime
      root.setAttribute("data-duration", …) is therefore a NO-OP for the renderer's
      frame count — the clip would truncate any content longer than the literal
      value. So the derived length MUST live in the LITERAL data-duration attribute.
        • The literal data-duration below (7.1) is computed from the DEFAULT
          variables by the SAME formula the runtime uses (computeChoreography()),
          so the default render is correct with zero build step.
        • bake-duration.mjs (ships beside this template) recomputes that literal from the ACTUAL
          variables (defaults, or a --variables / --variables-file JSON) and
          rewrites the attribute in place. Run it before rendering whenever you
          override commandText / outputLines / successLine / typingSpeed so the
          clip scales with content. (This is the "build step injects it" path.)
        • At runtime the script reads the baked literal (root.dataset.duration),
          recomputes the choreography, and pins the master timeline to the baked
          value — and warns if the bake is stale, so a too-short clip can never
          silently truncate the success banner.
      phase | start–end (s) | easing            | what moves
      ------+---------------+-------------------+---------------------------------------
       1 boot | 0.00–0.55   | back.out(1.6)     | window scales 0.94→1 + fades up;
              |             | + power2.out      | three traffic-light dots stagger in
       2 type | 0.55–T2     | none (proxy)      | command types 1 char / typingSpeed s
              |             |                   | behind a blinking block caret; the
              |             |                   | prompt prefix is shown from frame 0
       3 enter| T2–T2+0.18  | power2.out        | typed line locks; caret hops to the
              |             |                   | first output row's left edge
       4 stream| T2+0.18 →  | per-row power3.out| each output row reveals on a stagger
              |   STREAM_END | (y8→0, fade, blur)| (~0.34s apart). Live rows animate
              |             | + none (proxy)    | their glyph every frame: spin rows
              |             |                   | cycle the 10-frame Braille table +
              |             |                   | go ✓ green when done; bar rows fill
              |             |                   | an ASCII [###···] bar cell-by-cell
              |             |                   | with a quantized NN% (floor, never
              |             |                   | ahead of the cells); ok rows land a
              |             |                   | green ✓; text/warn rows just reveal
       5 banner| SB → SB+0.5| back.out(2.2)     | success banner row scales 0.9→1 +
              |             |                   | fades up, bold green, left rule glows
       6 hold | SB+0.5–DUR  | none (caret only) | block caret blinks under the banner;
              |             |                   | scene otherwise still → seamless loop

      T2 = 0.55 + typingSpeed × commandText.length .  Every "live" row owns a time
      window [revealStart, revealStart+rowWork]; its spinner/bar is a pure function
      of (t − revealStart), so the renderer can seek any frame exactly.

      ── VARIABLE ENCODING ───────────────────────────────────────────────────────
      outputLines is a PIPE-separated ("|") list. Each item is "TYPE:text" where
      TYPE ∈ {spin, bar, ok, text, warn} (no prefix ⇒ "text"):
        spin:<label>  → Braille spinner while working, then a green ✓ + label
        bar:<label>   → ASCII progress bar [#####······] NN%  → ✓ <label> when full
        ok:<label>    → a green ✓ <label> that simply lands (already-done step)
        text:<label>  → a dim plain line (e.g. a path, a note)
        warn:<label>  → an amber ! <label>
      Any count/length of lines works — the window auto-sizes to its content and
      the whole stack is vertically centered; nothing clips. successLine is the
      bold banner; leave it empty to end on the last output row instead.

      ── DETERMINISM CONTRACT ─────────────────────────────────────────────────────
      ONE paused master timeline (window.__timelines["main"] + window.__timeline).
      ALL DOM (window chrome + every output row, built from outputLines) is created
      at CONSTRUCTION time — never inside a callback. Per-frame values (typing,
      spinner glyph, bar cells, percent) come from a single proxy {t} tween's
      onUpdate writing textContent on pre-rendered <span>s; discrete reveals are
      normal finite GSAP tweens on the same timeline. Percent text is floor()ed
      from the SAME progress value that fills the cells, so it never reads ahead.
      Spinner frames are a hand-coded constant table — NO Math.random, NO Date, NO
      rAF, NO setTimeout, NO CSS transition/@keyframes, NO infinite repeats.
      render(0) runs at boot so frame 0 is the correct opening state (window up,
      prompt shown, command empty, caret at the prompt). Fonts are LOCAL.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"JetBrains Mono"; font-weight:500;
        src:url("assets/fonts/jetbrains-500.ttf") format("truetype"); }
      @font-face { font-family:"DM Sans"; font-weight:500;
        src:url("assets/fonts/dm-sans-500.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden;
        display:flex; align-items:center; justify-content:center; }

      /* the macOS terminal window — sized to its content, centered by #root flex.
         width grows with content (max-content) up to a hard max-width; the body
         wraps long lines so a long commandText / outputLines / successLine can
         never clip under overflow:hidden. min-width keeps short content from
         collapsing to a sliver. */
      .win {
        position:relative;
        width:max-content;
        min-width:980px; max-width:1640px;
        border-radius:18px;
        overflow:hidden;
        will-change: transform, opacity;
      }
      .titlebar {
        height:54px; display:flex; align-items:center; gap:11px;
        padding:0 22px;
        position:relative;
      }
      .dot { width:15px; height:15px; border-radius:50%; flex:0 0 auto; }
      .title {
        position:absolute; left:0; right:0; text-align:center;
        font-family:"DM Sans",sans-serif; font-weight:500;
        font-size:18px; letter-spacing:0.2px;
        pointer-events:none;
      }
      .body {
        padding:34px 40px 40px 40px;
        font-family:"JetBrains Mono",monospace; font-weight:500;
        font-size:30px; line-height:1.62;
        /* pre-wrap (not pre) so spacing is preserved BUT long lines wrap inside
           the window instead of running off the right edge; break-word handles a
           single very long token (URL, long --flag=value) */
        white-space:pre-wrap; tab-size:4;
        overflow-wrap:anywhere; word-break:break-word;
      }
      .cmdrow { white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
      .prefix { /* prompt color set inline */ }
      .cmd    { /* ink */ }
      /* the typing caret: a solid block that blinks */
      .caret  {
        display:inline-block; width:0.62em; height:1.06em;
        vertical-align:-0.16em; margin-left:1px;
      }
      .rows { margin-top:6px; }
      .row  { white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word;
              will-change: transform, opacity; }
      .glyph { display:inline-block; }      /* spinner / ✓ / ! / bullet */
      .barwrap { white-space:pre; }         /* the ASCII bar stays on one line */
      .lbl  { /* row label, ink */ }
      .pct  { font-variant-numeric: tabular-nums; }

      /* success banner */
      .banner {
        margin-top:30px; padding:18px 26px;
        border-radius:12px;
        display:flex; align-items:center; gap:18px;
        font-family:"JetBrains Mono",monospace; font-weight:500;
        font-size:30px; line-height:1.3;
        will-change: transform, opacity;
        white-space:normal; word-break:break-word;
      }
      .banner .rule { width:6px; align-self:stretch; border-radius:3px; flex:0 0 auto; }
      .banner .btxt { flex:1 1 auto; }
      /* final caret under the banner */
      .endcaret {
        display:inline-block; width:0.62em; height:1.06em;
        vertical-align:-0.16em; margin-top:14px;
      }
    </style>
  </head>
  <body>
    <!-- data-duration is BAKED (build-time): the value below is the derived
         choreography length for the DEFAULT variables. bake-duration.mjs (ships beside this template)
         rewrites it from the actual variables before render so the clip scales
         with content. HyperFrames reads this literal at COMPILE time. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.1" data-width="1920" data-height="1080">
      <div class="win" id="win">
        <div class="titlebar" id="titlebar">
          <span class="dot" id="d1"></span>
          <span class="dot" id="d2"></span>
          <span class="dot" id="d3"></span>
          <span class="title" id="title">xotion — zsh — 96×28</span>
        </div>
        <div class="body" id="bodyEl">
          <div class="cmdrow"><span class="prefix" id="prefix"></span> <span class="cmd" id="cmd"></span><span class="caret" id="caret"></span></div>
          <div class="rows" id="rows"></div>
          <div class="banner" id="banner"><span class="rule" id="brule"></span><span class="btxt" id="btxt"></span></div>
          <span class="endcaret" id="endcaret"></span>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize a CSS hex color to 6-digit form so 2-digit alpha can be appended */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}

      /* ── parameters ─────────────────────────────────────────────────── */
      const PROMPT   = String(V.promptString);
      const COMMAND  = String(V.commandText);
      const SUCCESS  = String(V.successLine || "").trim();
      const SPEED    = parseFloat(V.typingSpeed) || 0.045;

      const C_BG     = V.bg, C_WIN = V.windowBg, C_INK = V.ink, C_DIM = V.dim;
      const C_PROMPT = V.prompt, C_ACCENT = V.accent, C_OK = V.ok, C_WARN = V.warn;
      const OK6 = hex6(C_OK), ACC6 = hex6(C_ACCENT), INK6 = hex6(C_INK);

      /* ── spinner: hand-coded Braille frame table (no RNG) ───────────── */
      const SPIN = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
      const SPIN_PERIOD = 0.085;                 // seconds per spinner frame
      const BAR_CELLS = 26;                      // width of the ASCII progress bar

      /* ── SHARED CHOREOGRAPHY MATH ───────────────────────────────────────
         The SINGLE definition of the timeline length. This in-page script and the
         bake-duration.mjs build step run an IDENTICAL implementation of this pure
         function, so the baked literal data-duration and the runtime timeline are
         provably the same function of the variables. It is exposed on
         window.computeTerminalChoreography so a headless check can diff the two. */
      const TYPES = new Set(["spin","bar","ok","text","warn"]);
      function computeChoreography(p){
        const COMMAND = String(p.commandText);
        const SUCCESS = String(p.successLine || "").trim();
        const SPEED   = parseFloat(p.typingSpeed) || 0.045;
        const ROWS = String(p.outputLines).split("|").map(s => s.trim()).filter(Boolean).map(item => {
          const ci = item.indexOf(":");
          let type = "text", text = item;
          if (ci > 0) {
            const t = item.slice(0, ci).trim().toLowerCase();
            if (TYPES.has(t)) { type = t; text = item.slice(ci + 1).trim(); }
          }
          return { type, text };
        });
        const BOOT_END   = 0.55;
        const TYPE_START = BOOT_END;
        const TYPE_DUR   = COMMAND.length * SPEED;
        const T2         = TYPE_START + TYPE_DUR;          // command finished typing
        const ENTER      = T2 + 0.18;                      // caret hops to output
        const ROW_STAGGER= 0.34;                           // gap between row reveals
        const ROW_REVEAL = 0.42;                           // a row's entrance duration
        const rowWork = type => (type === "spin" || type === "bar") ? 1.05 : 0.0;
        let cursor = ENTER + 0.12;
        ROWS.forEach(r => {
          r.revealStart = cursor;
          r.work = rowWork(r.type);
          r.workEnd = r.revealStart + r.work;
          cursor += ROW_STAGGER + (r.work > 0 ? 0.18 : 0); // working rows get more breathing room
        });
        const STREAM_END = ROWS.length ? Math.max(...ROWS.map(r => r.workEnd)) : ENTER;
        const SB         = STREAM_END + 0.22;              // success banner start
        const HAS_BANNER = SUCCESS.length > 0;
        const BANNER_END = HAS_BANNER ? SB + 0.5 : STREAM_END;
        // DUR is DERIVED from the choreography end (BANNER_END) + a loop-friendly
        // HOLD, clamped to a sane 4–18s window and rounded UP to a whole 0.1s.
        const HOLD       = 1.0;                            // blinking-cursor tail
        const DUR        = Math.min(18, Math.max(4, Math.ceil((BANNER_END + HOLD) * 10) / 10));
        return { ROWS, BOOT_END, TYPE_START, TYPE_DUR, T2, ENTER, ROW_STAGGER,
                 ROW_REVEAL, STREAM_END, SB, HAS_BANNER, BANNER_END, HOLD, DUR };
      }
      // expose for the build step / debugging (pure, deterministic — no side effects)
      window.computeTerminalChoreography = computeChoreography;

      const CH = computeChoreography(V);
      const ROWS = CH.ROWS;
      const TYPE_START = CH.TYPE_START, T2 = CH.T2, ENTER = CH.ENTER;
      const ROW_REVEAL = CH.ROW_REVEAL, STREAM_END = CH.STREAM_END, SB = CH.SB;
      const HAS_BANNER = CH.HAS_BANNER;
      const DERIVED_DUR = CH.DUR;          // what the choreography NEEDS

      /* ── the AUTHORITATIVE duration is the BAKED literal data-duration ──
         HyperFrames already read this literal at compile time to set the frame
         count, so the timeline MUST run exactly this long — never the runtime
         DERIVED_DUR (which the renderer never saw). They are equal when the bake
         is fresh (default, or after running the bake-duration.mjs build step). If a stale bake
         leaves the literal SHORTER than the choreography needs, we warn loudly so
         the truncation is caught, and still pin the timeline to the rendered
         length so seeking stays a pure function of time. */
      const rootEl0   = document.getElementById("root");
      const BAKED_DUR = parseFloat(rootEl0.getAttribute("data-duration")) || DERIVED_DUR;
      const DUR       = BAKED_DUR;
      if (Math.abs(BAKED_DUR - DERIVED_DUR) > 0.05) {
        console.warn("[terminal-stream] STALE BAKE: data-duration=" + BAKED_DUR +
          "s but choreography needs " + DERIVED_DUR + "s. Re-run bake-duration.mjs " +
          "with the active variables before rendering, or the success banner/hold may truncate.");
      }

      /* ── elements ───────────────────────────────────────────────────── */
      const root     = document.getElementById("root");
      const win      = document.getElementById("win");
      const titlebar = document.getElementById("titlebar");
      const title    = document.getElementById("title");
      const prefixEl = document.getElementById("prefix");
      const cmdEl    = document.getElementById("cmd");
      const caretEl  = document.getElementById("caret");
      const rowsEl   = document.getElementById("rows");
      const banner   = document.getElementById("banner");
      const bruleEl  = document.getElementById("brule");
      const btxtEl   = document.getElementById("btxt");
      const endcaret = document.getElementById("endcaret");
      const dots     = [document.getElementById("d1"), document.getElementById("d2"), document.getElementById("d3")];

      /* NOTE: we do NOT setAttribute("data-duration", …) here. HyperFrames reads
         that attribute at COMPILE time (before any script runs), so a runtime
         write is a no-op for the rendered frame count and would only desync the
         timeline from the clip. The literal is the single source of truth and is
         kept fresh by the bake-duration.mjs build step (ships beside this template). */

      /* ── static styling from theme variables ────────────────────────── */
      document.body.style.background = C_BG;
      root.style.background          = C_BG;
      win.style.background           = C_WIN;
      win.style.border               = `1px solid ${hex6(C_INK)}1f`;
      win.style.boxShadow            = `0 40px 120px ${hex6(C_BG)}d9, 0 12px 40px #00000066, inset 0 1px 0 ${hex6(C_INK)}14`;
      titlebar.style.background      = `${hex6(C_INK)}0a`;
      titlebar.style.borderBottom    = `1px solid ${hex6(C_INK)}14`;
      title.style.color              = C_DIM;
      dots[0].style.background = "#ff5f56";
      dots[1].style.background = "#ffbd2e";
      dots[2].style.background = "#27c93f";

      prefixEl.textContent  = PROMPT;
      prefixEl.style.color  = C_PROMPT;
      cmdEl.style.color     = C_INK;
      caretEl.style.background  = C_INK;
      endcaret.style.background = C_OK;

      /* ── build every output row at CONSTRUCTION time ────────────────── */
      // each row: glyph span + label span (+ for bars: a bar span and a pct span)
      ROWS.forEach(r => {
        const row = document.createElement("div");
        row.className = "row";

        const glyph = document.createElement("span");
        glyph.className = "glyph";

        const lbl = document.createElement("span");
        lbl.className = "lbl";
        lbl.textContent = r.text;
        lbl.style.color = (r.type === "text") ? C_DIM : C_INK;

        row.appendChild(glyph);
        row.appendChild(document.createTextNode(" "));
        row.appendChild(lbl);

        if (r.type === "bar") {
          // bar sits AFTER the label, in its own monospace block
          const sp = document.createElement("span");
          sp.textContent = "  ";
          const bar = document.createElement("span");
          bar.className = "barwrap";
          bar.style.color = C_ACCENT;
          const pct = document.createElement("span");
          pct.className = "pct";
          pct.style.color = C_DIM;
          pct.textContent = "  0%";
          row.appendChild(sp);
          row.appendChild(bar);
          row.appendChild(document.createTextNode(" "));
          row.appendChild(pct);
          r.barEl = bar; r.pctEl = pct;
        }

        rowsEl.appendChild(row);
        r.el = row; r.glyphEl = glyph; r.lblEl = lbl;
      });

      /* ── success banner static styling ──────────────────────────────── */
      if (HAS_BANNER) {
        banner.style.background = `${OK6}1a`;
        banner.style.border     = `1px solid ${OK6}40`;
        bruleEl.style.background = C_OK;
        btxtEl.style.color  = C_OK;
        btxtEl.textContent  = SUCCESS;
      } else {
        banner.style.display = "none";
      }

      /* ── initial states — frame 0 is the correct opening state ──────── */
      // window starts faintly visible (not pure black) so frame 0 reads as an
      // intentional "materializing" beat rather than a dead/unstyled frame.
      gsap.set(win, { scale: 0.965, opacity: 0.22, transformOrigin: "50% 52%" });
      dots.forEach(d => gsap.set(d, { scale: 0, transformOrigin: "50% 50%" }));
      gsap.set(banner,  { opacity: 0, scale: 0.9, y: 10, transformOrigin: "0% 50%" });
      ROWS.forEach(r => gsap.set(r.el, { opacity: 0, y: 8 }));
      gsap.set(endcaret, { opacity: 0 });
      cmdEl.textContent = "";

      /* ── the proxy-driven per-frame render: typing + spinners + bars ── */
      const clamp01 = x => Math.max(0, Math.min(1, x));
      function renderFrame(t) {
        // 1. command typing (block caret blinks while typing, parks at end-of-type→enter)
        const shown = Math.min(COMMAND.length, Math.max(0, Math.floor((t - TYPE_START) / SPEED)));
        cmdEl.textContent = COMMAND.slice(0, shown);

        // caret: visible through typing + the brief enter beat, then it hops away
        if (t < ENTER) {
          // blink ~1.8Hz; solid while a char just landed feels natural enough as a sine
          caretEl.style.opacity = (t < TYPE_START) ? 1 : ((Math.sin((t - TYPE_START) * Math.PI * 3.6) + 1) / 2) * 0.85 + 0.15;
        } else {
          caretEl.style.opacity = 0;
        }

        // 2. live rows: spinners cycle the frame table; bars fill cell-by-cell
        for (const r of ROWS) {
          if (r.type === "spin") {
            const local = t - r.revealStart;
            if (local < 0) { /* not revealed yet — keep first frame */ r.glyphEl.textContent = SPIN[0]; r.glyphEl.style.color = C_ACCENT; }
            else if (t < r.workEnd) {
              const f = Math.floor(local / SPIN_PERIOD) % SPIN.length;
              r.glyphEl.textContent = SPIN[f];
              r.glyphEl.style.color = C_ACCENT;
            } else {
              r.glyphEl.textContent = "✓";
              r.glyphEl.style.color = C_OK;
            }
          } else if (r.type === "bar") {
            const local = t - r.revealStart;
            // fill across the work window with an ease so it feels like real progress
            let prog = clamp01(local / r.work);
            prog = prog < 0 ? 0 : (1 - Math.pow(1 - prog, 2.2)); // ease-out
            const done = t >= r.workEnd;
            const filled = done ? BAR_CELLS : Math.floor(prog * BAR_CELLS);
            r.barEl.textContent = "[" + "█".repeat(filled) + "·".repeat(BAR_CELLS - filled) + "]";
            // percent floored from the SAME fraction the cells use → never reads ahead
            const pctVal = done ? 100 : Math.floor((filled / BAR_CELLS) * 100);
            r.pctEl.textContent = (pctVal < 10 ? "  " : pctVal < 100 ? " " : "") + pctVal + "%";
            if (done) {
              r.glyphEl.textContent = "✓"; r.glyphEl.style.color = C_OK;
              r.barEl.style.color = C_OK; r.pctEl.style.color = C_OK;
            } else {
              r.glyphEl.textContent = SPIN[Math.floor(local / SPIN_PERIOD) % SPIN.length];
              r.glyphEl.style.color = C_ACCENT;
              r.barEl.style.color = C_ACCENT; r.pctEl.style.color = C_DIM;
            }
          } else if (r.type === "ok") {
            r.glyphEl.textContent = "✓"; r.glyphEl.style.color = C_OK;
          } else if (r.type === "warn") {
            r.glyphEl.textContent = "!"; r.glyphEl.style.color = C_WARN;
          } else { /* text */
            r.glyphEl.textContent = " "; r.glyphEl.style.color = C_DIM;
          }
        }

        // 3. final caret blink — only after the banner (or last row) has landed
        const liveTail = HAS_BANNER ? (SB + 0.5) : STREAM_END;
        if (t >= liveTail) {
          endcaret.style.opacity = ((Math.sin((t - liveTail) * Math.PI * 2.0) + 1) / 2) * 0.85 + 0.15;
        } else {
          endcaret.style.opacity = 0;
        }
      }

      /* ── paused master timeline; HyperFrames seeks it ───────────────── */
      const tl = gsap.timeline({ paused: true });

      // PHASE 1 — window boots in, traffic lights stagger
      tl.to(win, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 0);
      dots.forEach((d, i) =>
        tl.to(d, { scale: 1, duration: 0.32, ease: "back.out(2.2)" }, 0.18 + i * 0.07));

      // PHASES 2–4 — ONE proxy tween drives typing + spinners + bars + carets
      const p = { t: 0 };
      tl.to(p, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderFrame(p.t) }, 0);

      // PHASE 4 reveals — each output row enters on its stagger (discrete tweens)
      ROWS.forEach(r => {
        tl.fromTo(r.el,
          { opacity: 0, y: 8, filter: "blur(3px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: ROW_REVEAL, ease: "power3.out",
            immediateRender: false },
          r.revealStart);
      });

      // PHASE 5 — success banner pops in
      if (HAS_BANNER) {
        tl.fromTo(banner,
          { opacity: 0, scale: 0.9, y: 10 },
          { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.2)",
            immediateRender: false },
          SB);
      }

      // hold the final frame to the end of data-duration
      tl.set({}, {}, DUR);

      renderFrame(0); // frame 0 styled immediately (window up, prompt shown, command empty)

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
