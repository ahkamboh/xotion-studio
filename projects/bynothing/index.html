<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="assets/song.js"></script>
<style>
@font-face{font-family:'Corm';src:url('assets/fonts/cormorant-garamond-600.ttf');font-display:block}
@font-face{font-family:'Play';src:url('assets/fonts/playfair-display-900.ttf');font-display:block}
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-500.ttf');font-weight:500;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Corm',serif;color:#f6f1e7}
.fill{position:absolute;inset:0;width:1920px;height:1080px}
#bgv{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;z-index:0;will-change:transform}
/* muted film grade + readability scrim */
#grade{z-index:1;background:rgba(30,26,20,.18);mix-blend-mode:multiply}
#warm{z-index:1;background:radial-gradient(120% 120% at 50% 40%, rgba(60,48,30,.10), rgba(20,16,10,.30) 75%, rgba(10,8,5,.55) 100%);mix-blend-mode:soft-light}
#scrim{z-index:2;background:linear-gradient(180deg, rgba(8,6,4,.35) 0%, rgba(8,6,4,.06) 30%, rgba(8,6,4,.20) 60%, rgba(6,4,2,.72) 100%)}
#grain{z-index:6;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:500px}
#vig{z-index:5;box-shadow:inset 0 0 320px 80px rgba(0,0,0,.5)}
/* wordmark */
#mark{position:absolute;top:60px;left:0;right:0;text-align:center;z-index:7;font-family:'Corm';font-style:italic;font-size:40px;letter-spacing:3px;color:#f3ecdd;opacity:.85;text-shadow:0 2px 12px rgba(0,0,0,.6)}
/* title card (intro) */
#titleWrap{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;z-index:8}
#title{font-family:'Corm';font-size:120px;font-weight:600;letter-spacing:2px;color:#fbf6ec;text-shadow:0 4px 28px rgba(0,0,0,.6)}
#sub{margin-top:10px;font-family:'Mont';font-weight:500;font-size:24px;letter-spacing:10px;color:#e9dcc4;text-transform:uppercase;opacity:.8}
/* lyrics */
#lyric{position:absolute;left:140px;right:140px;bottom:200px;text-align:center;z-index:8;
  font-family:'Corm';font-size:62px;line-height:1.3;color:#fbf6ec;text-shadow:0 3px 20px rgba(0,0,0,.85),0 1px 3px rgba(0,0,0,.6)}
#fade{z-index:30;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="204" data-width="1920" data-height="1080">
  <video id="bgv" class="clip" data-start="0" data-duration="204" muted playsinline src="assets/bg.mp4"></video>
  <div id="grade" class="fill"></div>
  <div id="warm" class="fill"></div>
  <div id="scrim" class="fill"></div>
  <div id="mark">byNothing</div>
  <div id="titleWrap"><div id="title">Paper Boats</div><div id="sub">byNothing · Official Audio</div></div>
  <div id="lyric"></div>
  <div id="vig" class="fill"></div>
  <div id="grain" class="fill"></div>
  <div id="fade" class="fill"></div>
</div>
<script>
const root=document.querySelector('[data-composition-id="main"]');
const Q=s=>root.querySelector(s);
const DUR=window.__DUR||180;
if(window.__TITLE) Q('#title').textContent=window.__TITLE;
const RAW=window.__LINES||[];
// Support both {text,t} objects (timestamp mode) and legacy [string] arrays
const LINES=RAW.map(l=>typeof l==='object'&&!Array.isArray(l)?l:{text:Array.isArray(l)?l.join(' '):l,t:null});
const HAS_TS=LINES.length>0&&LINES[0].t!==null;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const lerp=(a,b,t)=>a+(b-a)*t;const ease=t=>1-Math.pow(1-t,3);
const OUTRO=3.0;
// fallback equal distribution (used only if no timestamps)
const INTRO_FB=4.5, span_fb=Math.max(1,DUR-INTRO_FB-OUTRO), per_fb=span_fb/Math.max(1,LINES.length);
let cur=-2;
function getText(i){ return (i>=0&&i<LINES.length)?LINES[i].text:''; }
function setLine(i){ Q('#lyric').innerHTML=getText(i); }
// Find current line index from timestamp
function findIdx(t){
  if(!HAS_TS){
    if(t<INTRO_FB) return -1;
    return clamp(Math.floor((t-INTRO_FB)/per_fb),0,LINES.length-1);
  }
  let idx=-1;
  for(let i=LINES.length-1;i>=0;i--){ if(t>=LINES[i].t){idx=i;break;} }
  return idx;
}
// Duration of current line slot (for fade in/out)
function slotDur(idx){
  if(!HAS_TS) return per_fb;
  if(idx<0||idx>=LINES.length) return 4;
  const next=idx+1<LINES.length?LINES[idx+1].t:(DUR-OUTRO);
  return Math.max(1,next-LINES[idx].t);
}
function render(t){
  const prog=clamp(t/DUR,0,1);
  Q('#bgv').style.transform=`scale(${(1.0+prog*0.06).toFixed(4)})`;
  Q('#grain').style.backgroundPosition=`${(Math.sin(t*7)*40)|0}px ${(Math.cos(t*6)*40)|0}px`;
  // intro title card
  const INTRO=HAS_TS?Math.max(0,(LINES[0]?.t||0)-0.5):INTRO_FB;
  const tin=ease(clamp((t-0.4)/1.6,0,1));
  const tout=1-ease(clamp((t-(INTRO-1.2))/1.2,0,1));
  Q('#titleWrap').style.opacity=(tin*Math.max(0,tout)).toFixed(3);
  Q('#mark').style.opacity=(ease(clamp((t-0.2)/1.5,0,1))*0.85).toFixed(3);
  // lyrics
  const idx=findIdx(t);
  if(idx<0){ if(cur!==-1){setLine(-1);cur=-1;} Q('#lyric').style.opacity=0; return; }
  if(idx!==cur){ setLine(idx); cur=idx; }
  const lineStart=HAS_TS?LINES[idx].t:INTRO_FB+idx*per_fb;
  const dur=slotDur(idx);
  const within=(t-lineStart)/dur;
  const fin=ease(clamp(within/0.15,0,1)); const fout=1-ease(clamp((within-0.82)/0.18,0,1));
  Q('#lyric').style.opacity=(Math.min(fin,fout)*0.97).toFixed(3);
  Q('#lyric').style.transform=`translateY(${lerp(14,0,fin).toFixed(1)}px)`;
  let fade=0; if(t<0.6)fade=1-t/0.6; else if(t>DUR-1.2)fade=clamp((t-(DUR-1.2))/1.2,0,1);
  Q('#fade').style.opacity=fade.toFixed(3);
}
const tl=gsap.timeline({paused:true});window.__timelines={main:tl};
const CLK={t:0};tl.to(CLK,{t:DUR,duration:DUR,ease:'none',onUpdate:()=>render(CLK.t)},0);tl.pause(0);render(0);
</script>
</body>
</html>
