<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="assets/song.js"></script>
<style>
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-700.ttf');font-weight:700;font-display:block}
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-800.ttf');font-weight:800;font-display:block}
@font-face{font-family:'Anton';src:url('assets/fonts/anton-400.ttf');font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Mont',sans-serif;color:#fff;--accent:#f6d27a}
.fill{position:absolute;inset:0;width:1080px;height:1920px}
/* FULL-BLEED bg */
#bg{position:absolute;inset:-8%;width:116%;height:116%;background-image:url('assets/cover.jpg');background-size:cover;background-position:center;filter:brightness(.62) saturate(1.12) contrast(1.05);will-change:transform}
#tint{background:linear-gradient(180deg,rgba(6,4,2,.5) 0%,rgba(6,4,2,.15) 28%,rgba(6,4,2,.25) 55%,rgba(4,2,1,.85) 100%)}
#vig{box-shadow:inset 0 0 360px 80px rgba(0,0,0,.6)}
#grain{opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:420px}
/* top tag */
#tag{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:'Mont';font-weight:800;font-size:40px;letter-spacing:16px;color:#fff;opacity:.92;text-shadow:0 3px 14px rgba(0,0,0,.7)}
#tag span{color:var(--accent)}
/* KARAOKE captions — big, centered */
#cap{position:absolute;left:70px;right:70px;top:50%;transform:translateY(-50%);text-align:center}
#cap .w{display:inline-block;font-family:'Anton';font-size:104px;line-height:1.06;letter-spacing:1px;color:#fff;margin:0 14px;
  text-shadow:0 5px 4px rgba(0,0,0,.85),0 2px 22px rgba(0,0,0,.7);transition:none}
#cap .w.on{color:var(--accent);text-shadow:0 5px 4px rgba(0,0,0,.85),0 0 36px color-mix(in srgb,var(--accent) 70%,transparent)}
/* CTA bottom */
#cta{position:absolute;left:0;right:0;bottom:150px;text-align:center}
#cta .h{font-family:'Mont';font-weight:800;font-size:38px;letter-spacing:5px;color:#fff;opacity:.92;text-shadow:0 2px 12px rgba(0,0,0,.8)}
#cta .s{margin-top:14px;font-family:'Mont';font-weight:700;font-size:30px;letter-spacing:3px;color:var(--accent);opacity:.95}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920">
  <div id="bg" class="fill"></div>
  <div id="tint" class="fill"></div>
  <div id="vig" class="fill"></div>
  <div id="tag">TERE BINA <span>·</span> KAMBOJH</div>
  <div id="cap"></div>
  <div id="cta"><div class="h">▶ FULL SONG ON THE CHANNEL</div><div class="s">@kambojh_official</div></div>
  <div id="grain" class="fill"></div>
</div>
<script>
const root=document.querySelector('[data-composition-id="main"]');
const Q=s=>root.querySelector(s);
const DUR=window.__DUR||18;
if(window.__ACCENT)root.style.setProperty('--accent',window.__ACCENT);
const LINES=window.__LINES||[];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const lerp=(a,b,t)=>a+(b-a)*t;const ease=t=>1-Math.pow(1-t,3);
// timeline: lines evenly across DUR after 0.8s intro, 0.6s tail
const INTRO=0.8, TAIL=1.0, span=DUR-INTRO-TAIL;
const per=span/LINES.length;
const cap=Q('#cap');
function setLine(idx){
  cap.innerHTML="";
  if(idx<0||idx>=LINES.length)return;
  LINES[idx].forEach(w=>{const s=document.createElement('span');s.className='w';s.textContent=w;cap.appendChild(s);});
}
let cur=-1;
function render(t){
  const prog=clamp(t/DUR,0,1);
  Q('#bg').style.transform=`scale(${(1.0+prog*0.12).toFixed(4)}) translateY(${(-prog*2).toFixed(2)}%)`;
  Q('#grain').style.backgroundPosition=`${(Math.sin(t*7)*40)|0}px ${(Math.cos(t*6)*40)|0}px`;
  Q('#tag').style.opacity=(ease(clamp((t-0.2)/1,0,1))*0.92).toFixed(3);
  Q('#cta').style.opacity=(ease(clamp((t-1.2)/1.2,0,1))).toFixed(3);
  const lt=t-INTRO;
  let idx=Math.floor(lt/per);
  idx=clamp(idx,0,LINES.length-1);
  if(t<INTRO){ if(cur!==-1){setLine(-1);cur=-1;} return; }
  if(idx!==cur){ setLine(idx); cur=idx; }
  // word highlight within the line
  const words=cap.querySelectorAll('.w');
  const within=clamp((lt-idx*per)/per,0,1);
  const active=Math.min(words.length-1, Math.floor(within*words.length));
  const lineIn=ease(clamp((lt-idx*per)/0.35,0,1));
  cap.style.opacity=lineIn.toFixed(3);
  cap.style.transform=`translateY(${lerp(-46,-50,1)}%) translateY(${lerp(18,0,lineIn)}px)`;
  words.forEach((w,i)=>{ if(i<=active){w.classList.add('on');} else {w.classList.remove('on');}
    w.style.transform=(i===active)?`scale(1.12)`:`scale(1)`; });
}
const tl=gsap.timeline({paused:true});window.__timelines={main:tl};
const CLK={t:0};tl.to(CLK,{t:DUR,duration:DUR,ease:'none',onUpdate:()=>render(CLK.t)},0);tl.pause(0);render(0);
</script>
</body>
</html>
