<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hello — Greeting Bumper</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face{font-family:"Bric";src:url("assets/fonts/bricolage-grotesque-800.ttf") format("truetype");font-weight:800;font-display:block;}
      @font-face{font-family:"Bric";src:url("assets/fonts/bricolage-grotesque-600.ttf") format("truetype");font-weight:600;font-display:block;}
      @font-face{font-family:"Archivo";src:url("assets/fonts/archivo-700.ttf") format("truetype");font-weight:700;font-display:block;}
      @font-face{font-family:"Space";src:url("assets/fonts/space-grotesk-500.ttf") format("truetype");font-weight:500;font-display:block;}
      @font-face{font-family:"Mono";src:url("assets/fonts/jetbrains-500.ttf") format("truetype");font-weight:500;font-display:block;}
      @font-face{font-family:"Serif";src:url("assets/fonts/instrument-serif-400-italic.ttf") format("truetype");font-style:italic;font-weight:400;font-display:block;}

      :root{
        --bg:#16120d;        /* warm near-black */
        --bg2:#1f1810;
        --ink:#f6efe4;       /* warm paper */
        --muted:#a8997f;
        --accent:#f0a830;    /* warm amber */
        --accent2:#e8632c;   /* ember */
        --mono:"Mono",monospace;
      }
      *{box-sizing:border-box;margin:0;padding:0;}
      html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:"Space",sans-serif;}

      #stage{position:absolute;inset:0;overflow:hidden;}
      .bgwash{position:absolute;inset:0;background:
        radial-gradient(60% 50% at 28% 38%, rgba(240,168,48,.16), transparent 70%),
        radial-gradient(55% 60% at 82% 78%, rgba(232,99,44,.12), transparent 72%),
        linear-gradient(160deg,var(--bg),var(--bg2));}
      .grid{position:absolute;inset:0;opacity:.05;
        background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);
        background-size:96px 96px;}

      #frame{position:absolute;inset:64px;border:2px solid rgba(246,239,228,.12);border-radius:18px;}
      .corner{position:absolute;width:34px;height:34px;border:3px solid var(--accent);}
      .corner.tl{top:54px;left:54px;border-right:none;border-bottom:none;}
      .corner.tr{top:54px;right:54px;border-left:none;border-bottom:none;}
      .corner.bl{bottom:54px;left:54px;border-right:none;border-top:none;}
      .corner.br{bottom:54px;right:54px;border-left:none;border-top:none;}

      #content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 168px;}

      .eyebrow{display:flex;align-items:center;gap:18px;font-family:var(--mono);font-weight:500;
        letter-spacing:.34em;text-transform:uppercase;font-size:26px;color:var(--accent);margin-bottom:34px;}
      .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 22px var(--accent);}

      .hero{position:relative;display:flex;align-items:baseline;gap:30px;font-family:"Bric";font-weight:800;
        color:var(--ink);font-size:268px;line-height:.92;letter-spacing:-.02em;}
      .hero .ch{display:inline-block;will-change:transform,opacity,filter;}
      .wave{font-size:200px;display:inline-block;transform-origin:75% 80%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));}

      .sub{font-family:"Serif";font-style:italic;color:var(--muted);font-size:78px;margin-top:18px;line-height:1.05;}
      .sub b{color:var(--ink);font-style:italic;font-weight:400;}

      .line2{position:relative;font-family:"Bric";font-weight:800;color:var(--ink);font-size:124px;
        line-height:.98;letter-spacing:-.02em;margin-top:6px;}
      .line2 .w{display:inline-block;will-change:transform,opacity,filter;}
      .line2 .acc{color:var(--accent);}
      .uline{position:absolute;left:0;bottom:-14px;height:12px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;}

      .chip{position:absolute;right:140px;bottom:122px;display:flex;align-items:center;gap:16px;
        font-family:var(--mono);font-weight:500;font-size:30px;letter-spacing:.04em;color:var(--bg);
        background:var(--ink);padding:18px 28px;border-radius:999px;
        box-shadow:8px 8px 0 var(--accent2);}
      .chip .av{width:38px;height:38px;border-radius:50%;background:
        radial-gradient(circle at 35% 30%,var(--accent),var(--accent2));}

      .ticker{position:absolute;left:140px;bottom:128px;font-family:var(--mono);font-size:24px;
        letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="stage">
        <div class="bgwash"></div>
        <div class="grid"></div>
        <div id="frame"></div>
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>

        <div id="content">
          <div class="eyebrow"><span class="dot"></span><span>XOTION&nbsp;STUDIO</span><span>·</span><span>WELCOME</span></div>

          <div class="hero" id="hero">
            <span class="ch">H</span><span class="ch">e</span><span class="ch">l</span><span class="ch">l</span><span class="ch">o</span><span class="ch" style="color:var(--accent)">.</span>
            <span class="wave" id="wave">👋</span>
          </div>

          <div class="sub" id="sub">so glad you're <b>here</b>.</div>

          <div class="line2" id="line2">
            <span class="w">Let's</span> <span class="w">make</span> <span class="w">something</span> <span class="w acc">good.</span>
            <span class="uline" id="uline"></span>
          </div>
        </div>

        <div class="ticker" id="ticker">● NOW&nbsp;PLAYING</div>
        <div class="chip" id="chip"><span class="av"></span><span>@xotion.studio</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      const Q = s => '[data-composition-id="main"] ' + s;

      // initial states
      gsap.set(Q(".eyebrow"), {opacity:0, x:-40});
      gsap.set(Q(".hero .ch"), {opacity:0, yPercent:120, filter:"blur(14px)"});
      gsap.set(Q("#wave"), {opacity:0, scale:0.4, rotation:-40, transformOrigin:"75% 80%"});
      gsap.set(Q("#sub"), {opacity:0, y:30});
      gsap.set(Q("#line2 .w"), {opacity:0, yPercent:110, filter:"blur(10px)"});
      gsap.set(Q("#uline"), {width:0});
      gsap.set(Q("#chip"), {opacity:0, y:40, scale:0.8});
      gsap.set(Q("#ticker"), {opacity:0, x:-30});
      gsap.set(Q(".corner"), {opacity:0, scale:0.4});
      gsap.set(Q("#frame"), {opacity:0});

      // ── BEAT 1: frame + eyebrow settle (0–0.9s)
      tl.to(Q("#frame"), {opacity:1, duration:0.6, ease:"power2.out"}, 0.1);
      tl.to(Q(".corner"), {opacity:1, scale:1, duration:0.5, ease:"back.out(2)", stagger:0.07}, 0.2);
      tl.to(Q(".eyebrow"), {opacity:1, x:0, duration:0.6, ease:"power3.out"}, 0.35);
      tl.to(Q("#ticker"), {opacity:1, x:0, duration:0.6, ease:"power3.out"}, 0.5);

      // ── BEAT 2: HELLO letters cascade + wave (0.7–1.8s)
      tl.to(Q(".hero .ch"), {opacity:1, yPercent:0, filter:"blur(0px)", duration:0.62,
        ease:"power3.out", stagger:0.075}, 0.7);
      tl.to(Q("#wave"), {opacity:1, scale:1, rotation:0, duration:0.5, ease:"back.out(2.4)"}, 1.15);
      // hand waving
      tl.to(Q("#wave"), {rotation:18, duration:0.22, ease:"sine.inOut", yoyo:true, repeat:5}, 1.55);

      // ── BEAT 3: serif subtitle (1.9s)
      tl.to(Q("#sub"), {opacity:1, y:0, duration:0.7, ease:"power3.out"}, 1.95);

      // ── BEAT 4: hand-off — first block lifts away slightly, line2 reveals (3.1s)
      tl.to([Q(".hero"), Q("#sub")], {y:-26, opacity:0.0, duration:0.6, ease:"power2.inOut"}, 3.2);
      tl.set([Q(".hero"), Q("#sub")], {display:"none"}, 3.85);
      tl.to(Q("#line2 .w"), {opacity:1, yPercent:0, filter:"blur(0px)", duration:0.6,
        ease:"power3.out", stagger:0.11}, 3.7);
      tl.to(Q("#uline"), {width:"560px", duration:0.7, ease:"power3.inOut"}, 4.5);

      // ── BEAT 5: sign-off chip (5.3s)
      tl.to(Q("#chip"), {opacity:1, y:0, scale:1, duration:0.6, ease:"back.out(1.8)"}, 5.35);

      // ── continuous, never-static life on the stage
      tl.to(Q("#content"), {x:10, duration:4, ease:"sine.inOut", yoyo:true, repeat:1}, 0);
      tl.to(Q(".bgwash"), {scale:1.06, duration:8, ease:"sine.inOut"}, 0);
      tl.to(Q(".dot"), {opacity:0.35, duration:0.7, ease:"sine.inOut", yoyo:true, repeat:9}, 0.4);
      tl.to(Q("#ticker"), {opacity:0.5, duration:0.6, ease:"sine.inOut", yoyo:true, repeat:9}, 1);
      // gentle settle / breathe near the end so the last second isn't frozen
      tl.to(Q("#line2"), {scale:1.012, duration:1.4, ease:"sine.inOut", yoyo:true, repeat:1}, 5.0);
    </script>
  </body>
</html>
