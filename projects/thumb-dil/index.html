<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dil Bemaar Hai — Thumbnail B</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-800.ttf');font-weight:800;font-display:block}
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-900.ttf');font-weight:900;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
#root{position:relative;width:1280px;height:720px;overflow:hidden;font-family:'Mont',sans-serif}
.fill{position:absolute;inset:0;width:1280px;height:720px}
#bg{background-image:url('assets/footage.jpg');background-size:cover;background-position:center;filter:saturate(1.15) contrast(1.08)}
#scrim{background:radial-gradient(120% 120% at 50% 45%, rgba(8,2,2,.5) 0%, rgba(6,1,1,.78) 60%, rgba(2,0,0,.95) 100%)}
#grain{opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:400px}
#vig{box-shadow:inset 0 0 260px 60px rgba(0,0,0,.78)}
#tw{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
.kb{font:800 32px Mont;letter-spacing:18px;color:#e9c98a;text-transform:uppercase;margin-bottom:6px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.title{font:900 148px/0.9 Mont;text-transform:uppercase;letter-spacing:1px;
  background:linear-gradient(180deg,#fff7e2 0%,#f6d98a 46%,#c89244 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 rgba(50,16,4,.6)) drop-shadow(0 0 34px rgba(255,150,60,.5)) drop-shadow(0 12px 30px rgba(0,0,0,.75))}
.tag{display:inline-flex;align-items:center;gap:10px;margin-top:20px;background:#291C0B;border:2px solid rgba(247,233,154,.45);border-radius:44px;padding:11px 30px;
  font:800 30px Mont;letter-spacing:3px;text-transform:uppercase;color:#f7e99a;box-shadow:0 12px 34px rgba(0,0,0,.65)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720">
  <div id="bg" class="fill"></div>
  <div id="scrim" class="fill"></div>
  <div id="grain" class="fill"></div>
  <div id="vig" class="fill"></div>
  <div id="tw">
    <div class="kb">KAMBOJH</div>
    <div class="title">Dil Bemaar<br>Hai</div>
    <div class="tag">New Urdu Sad Song 2026 💔</div>
  </div>
</div>
<script>
const tl=gsap.timeline({paused:true}); window.__timelines={main:tl};
tl.to({},{duration:1}); tl.pause(0);
</script>
</body>
</html>
