<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="assets/song.js"></script>
<style>
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-600.ttf');font-weight:600;font-display:block}
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-700.ttf');font-weight:700;font-display:block}
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-800.ttf');font-weight:800;font-display:block}
@font-face{font-family:'Cormorant';src:url('assets/fonts/cormorant-garamond-600.ttf');font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Mont',sans-serif;color:#fff;--accent:#f0c87b}
.fill{position:absolute;inset:0;width:1080px;height:1920px}
#bg{background-image:url('assets/cover.jpg');background-size:cover;background-position:center;filter:blur(48px) brightness(.5) saturate(1.1);transform:scale(1.2)}
#tint{background:linear-gradient(180deg,rgba(8,5,2,.55) 0%,rgba(8,5,2,.2) 30%,rgba(6,4,2,.55) 70%,rgba(4,2,1,.9) 100%)}
#card{position:absolute;left:80px;top:300px;width:920px;height:518px;border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.12)}
#cardimg{position:absolute;inset:-6%;width:112%;height:112%;background-image:url('assets/cover.jpg');background-size:cover;background-position:center;will-change:transform}
#title{position:absolute;left:0;right:0;top:880px;text-align:center;font-family:'Cormorant';font-style:italic;font-size:96px;color:#fff;opacity:0;text-shadow:0 4px 20px rgba(0,0,0,.6)}
#artist{position:absolute;left:0;right:0;top:1000px;text-align:center;font-family:'Mont';font-weight:700;font-size:34px;letter-spacing:14px;color:var(--accent);opacity:0}
#lyrics{position:absolute;left:70px;right:70px;top:1180px;text-align:center}
.ly{font-family:'Mont';font-weight:700;font-size:54px;line-height:1.35;color:#fff;opacity:0;text-shadow:0 3px 16px rgba(0,0,0,.8);margin:6px 0;will-change:transform,opacity}
#cta{position:absolute;left:0;right:0;bottom:140px;text-align:center;opacity:0}
#cta .b{display:inline-block;background:var(--accent);color:#1a1208;font-family:'Mont';font-weight:800;font-size:38px;letter-spacing:1px;padding:20px 46px;border-radius:50px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#cta .h{margin-top:24px;font-family:'Mont';font-weight:700;font-size:34px;letter-spacing:6px;color:#fff;opacity:.9}
#grain{opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:400px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="27" data-width="1080" data-height="1920">
  <div id="bg" class="fill"></div>
  <div id="tint" class="fill"></div>
  <div id="card"><div id="cardimg"></div></div>
  <div id="title">Tere Bina</div>
  <div id="artist">KAMBOJH</div>
  <div id="lyrics"></div>
  <div id="cta"><span class="b">▶ Full song on the channel</span><div class="h">@kambojh_official</div></div>
  <div id="grain" class="fill"></div>
</div>
<script>
const root=document.querySelector('[data-composition-id="main"]');
const Q=s=>root.querySelector(s);
const DUR=window.__DUR||27;
if(window.__TITLE)Q('#title').textContent=window.__TITLE;
if(window.__ACCENT)root.style.setProperty('--accent',window.__ACCENT);
const LY=window.__LYRIC||[];
const lyWrap=Q('#lyrics');const lines=[];
LY.forEach(t=>{const d=document.createElement('div');d.className='ly';d.textContent=t;lyWrap.appendChild(d);lines.push(d);});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const lerp=(a,b,t)=>a+(b-a)*t;const ease=t=>1-Math.pow(1-t,3);
function render(t){
  const prog=clamp(t/DUR,0,1);
  Q('#cardimg').style.transform=`scale(${(1+prog*0.12).toFixed(4)})`;
  const ti=ease(clamp((t-0.3)/1.2,0,1));Q('#title').style.opacity=ti.toFixed(3);Q('#title').style.transform=`translateY(${lerp(20,0,ti)}px)`;
  Q('#artist').style.opacity=(ease(clamp((t-0.8)/1,0,1))*0.95).toFixed(3);
  lines.forEach((el,i)=>{const t0=2.2+i*1.4;const a=ease(clamp((t-t0)/0.9,0,1));el.style.opacity=a.toFixed(3);el.style.transform=`translateY(${lerp(26,0,a)}px) scale(${lerp(.96,1,a).toFixed(3)})`;});
  const c=ease(clamp((t-7)/1.2,0,1));Q('#cta').style.opacity=c.toFixed(3);
  Q('#cta').style.transform=`scale(${(1+Math.sin(t*2.2)*0.02*c).toFixed(3)})`;
  Q('#grain').style.backgroundPosition=`${(Math.sin(t*7)*40)|0}px ${(Math.cos(t*6)*40)|0}px`;
}
const tl=gsap.timeline({paused:true});window.__timelines={main:tl};
const CLK={t:0};tl.to(CLK,{t:DUR,duration:DUR,ease:'none',onUpdate:()=>render(CLK.t)},0);tl.pause(0);render(0);
</script>
</body>
</html>
