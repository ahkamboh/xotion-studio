<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      SCENE A — "THE ASK"  (dark AI chat, data-duration 6.0)

      A premium ChatGPT/Linear-vibe dark UI. A chat composer pill rises in at the
      lower third, the input TYPES a prompt char-by-char (blinking caret), the SEND
      button lights to accent, presses (squash+pop), the prompt FLIES UP as a right-
      aligned user bubble, the composer clears to a placeholder, then an ASSISTANT
      reply STREAMS in token-by-token below-left (avatar + "Xotion" label + block
      caret) and a tiny pulsing "editing" status appears. Calm, real, confident.

      DETERMINISM CONTRACT
      • ONE paused GSAP timeline registered as window.__timelines["main"] + window.__timeline.
      • All DOM pre-rendered; gsap.set sets initial states; a single proxy {t} tween
        drives a per-frame render(t) (typing, caret blink, send color, streaming,
        status dot pulse). render(0) runs at boot so frame 0 seeks clean.
      • No Math.random / Date.now / network / rAF. No infinite repeats.
      • Every selector scoped to [data-composition-id="main"].

      TIMELINE
      0.00–0.60  composer pill fades/rises in (lower third)
      0.90–3.00  input types the prompt; SEND turns accent the instant text appears
      3.15       send squashes + pops (back.out)
      3.30       prompt flies up as a right-aligned user bubble; composer clears to placeholder
      3.70–5.70  assistant reply streams in chunked, with a blinking block caret
      5.70–6.00  tiny pulsing "editing" status appears under the reply; hold
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Inter"; font-weight:400; src:url("assets/fonts/inter-400.ttf") format("truetype"); }
      @font-face { font-family:"Inter"; font-weight:500; src:url("assets/fonts/inter-500.ttf") format("truetype"); }
      @font-face { font-family:"Inter"; font-weight:600; src:url("assets/fonts/inter-600.ttf") format("truetype"); }
      @font-face { font-family:"Inter"; font-weight:700; src:url("assets/fonts/inter-700.ttf") format("truetype"); }
      @font-face { font-family:"JBMono"; font-weight:500; src:url("assets/fonts/jetbrains-500.ttf") format("truetype"); }

      :root{
        --bg:#0c0d10; --bg2:#101216; --panel:#16181d; --panel2:#1b1e24;
        --border:#262a31; --border2:#30343c; --text:#f2f3f5; --sub:#9aa1ab; --faint:#6b7178;
        --accent:#e0451f; --accent2:#ff6a3d; --accentglow:rgba(224,69,31,.35);
        --green:#34c759; --rail:#23262d;
      }
      *{ margin:0; padding:0; box-sizing:border-box; }
      html,body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
      #root{ position:relative; width:1920px; height:1080px; overflow:hidden;
        font-family:"Inter",sans-serif; color:var(--text);
        background:
          radial-gradient(1200px 680px at 50% -8%, var(--accentglow), rgba(224,69,31,0) 60%),
          radial-gradient(900px 600px at 50% 0%, rgba(255,106,61,.10), rgba(0,0,0,0) 55%),
          var(--bg);
      }
      /* subtle 1px dotted grid */
      .grid{ position:absolute; inset:0; pointer-events:none;
        background-image:radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
        background-size:34px 34px; background-position:0 0; }
      .vign{ position:absolute; inset:0; pointer-events:none;
        background:radial-gradient(1400px 1000px at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }

      /* centered conversation column */
      .col{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
        width:1200px; display:flex; flex-direction:column; align-items:stretch; }

      /* conversation area sits above the composer */
      .convo{ display:flex; flex-direction:column; gap:34px; min-height:430px;
        justify-content:flex-end; padding-bottom:54px; }

      /* user bubble — right aligned */
      .userbubble{ align-self:flex-end; max-width:840px; padding:24px 34px;
        background:var(--panel2); border:1px solid var(--border); border-radius:28px 28px 10px 28px;
        font-size:32px; font-weight:500; line-height:1.34; color:var(--text);
        box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0; }

      /* assistant reply — left aligned */
      .reply{ align-self:flex-start; max-width:980px; display:flex; gap:20px; opacity:0; }
      .avatar{ width:56px; height:56px; border-radius:16px; flex:0 0 auto; position:relative;
        display:flex; align-items:center; justify-content:center;
        background:linear-gradient(150deg, var(--accent2), var(--accent));
        box-shadow:0 10px 30px var(--accentglow); }
      .avatar svg{ width:32px; height:32px; display:block; }
      .replybody{ display:flex; flex-direction:column; gap:12px; padding-top:4px; }
      .who{ font-size:25px; font-weight:600; color:var(--text); letter-spacing:-0.01em;
        display:flex; align-items:center; gap:10px; }
      .who .mod{ font-family:"JBMono",monospace; font-weight:500; font-size:17px; color:var(--faint);
        background:var(--panel); border:1px solid var(--border); border-radius:9999px; padding:4px 12px; }
      .streamtext{ font-size:30px; font-weight:500; line-height:1.46; color:var(--text);
        letter-spacing:-0.005em; }
      .bcaret{ display:inline-block; width:13px; height:30px; transform:translateY(4px);
        background:var(--accent); border-radius:2px; margin-left:4px; opacity:0; }

      /* editing status under reply */
      .status{ display:flex; align-items:center; gap:14px; margin-top:6px; opacity:0; }
      .sdot{ width:13px; height:13px; border-radius:50%; background:var(--accent);
        box-shadow:0 0 14px var(--accentglow); }
      .stext{ font-family:"JBMono",monospace; font-size:21px; font-weight:500; color:var(--sub);
        letter-spacing:0.01em; }

      /* composer pill */
      .composer{ display:flex; align-items:center; gap:20px; padding:18px 18px 18px 22px;
        background:var(--panel); border:1.5px solid var(--border); border-radius:9999px;
        box-shadow:0 30px 80px rgba(0,0,0,.5); opacity:0; }
      .agentchip{ display:flex; align-items:center; gap:12px; flex:0 0 auto;
        padding:14px 22px; border-radius:9999px; background:var(--panel2);
        border:1px solid var(--border2); font-size:25px; font-weight:600; color:var(--text); }
      .agentchip svg{ width:24px; height:24px; display:block; color:var(--accent2); }
      .input{ flex:1 1 auto; font-size:34px; font-weight:500; white-space:nowrap;
        overflow:hidden; min-width:0; color:var(--text); display:flex; align-items:center; }
      .ph{ color:var(--faint); }
      .txt{ }
      .caret{ display:inline-block; width:3px; height:38px; background:var(--accent);
        margin-left:3px; transform:translateY(5px); border-radius:2px; opacity:0; }
      .send{ width:64px; height:64px; border-radius:50%; flex:0 0 auto;
        display:flex; align-items:center; justify-content:center; background:var(--rail); }
      .send svg{ width:30px; height:30px; display:block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="vign"></div>

      <div class="col" id="col">

        <div class="convo" id="convo">
          <!-- user bubble (filled at send) -->
          <div class="userbubble" id="userbubble"></div>

          <!-- assistant reply -->
          <div class="reply" id="reply">
            <div class="avatar">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L13.7 9.1 L21 11 L13.7 12.9 L12 20 L10.3 12.9 L3 11 L10.3 9.1 Z" fill="#fff"/></svg>
            </div>
            <div class="replybody">
              <div class="who">Xotion <span class="mod">4K</span></div>
              <div class="streamtext" id="streamtext"><span class="rtxt" id="rtxt"></span><span class="bcaret" id="bcaret"></span></div>
              <div class="status" id="status"><span class="sdot" id="sdot"></span><span class="stext">editing your video</span></div>
            </div>
          </div>
        </div>

        <div class="composer" id="composer">
          <div class="agentchip">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L13.3 8.7 L19 10 L13.3 11.3 L12 17 L10.7 11.3 L5 10 L10.7 8.7 Z" fill="currentColor"/></svg>
            <span>Agent</span>
          </div>
          <div class="input" id="input"><span class="ph" id="ph">Ask the agent to edit...</span><span class="txt" id="txt"></span><span class="caret" id="caret"></span></div>
          <div class="send" id="send">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 V5"/><path d="M6 11 l6-6 6 6"/></svg>
          </div>
        </div>

      </div>
    </div>

    <script>
      const Q = s => document.querySelector('[data-composition-id="main"] ' + s);
      const root = document.querySelector('[data-composition-id="main"]');

      const composer = Q('#composer'), input = Q('#input'), ph = Q('#ph'), txt = Q('#txt'),
            caret = Q('#caret'), send = Q('#send'),
            userbubble = Q('#userbubble'), reply = Q('#reply'),
            rtxt = Q('#rtxt'), bcaret = Q('#bcaret'),
            status = Q('#status'), sdot = Q('#sdot');

      const accent = '#e0451f';   // --accent
      const rail   = '#23262d';   // --rail

      const PROMPT = "Edit my launch video — cut it tight, add captions + music";
      const REPLY  = "On it — cutting the dead air, adding captions, color-grading, and dropping in music. Rendering in 4K...";
      const NP = PROMPT.length, NR = REPLY.length;

      /* ── timeline knots ──────────────────────────────────────────────── */
      const COMP_IN_S = 0.0,  COMP_IN_D = 0.6;
      const TYPE_S = 0.9,  TYPE_E = 3.0;          // typing window
      const TYPE_PC = (TYPE_E - TYPE_S) / NP;     // seconds per char
      const SEND_AT = 3.15;
      const BUBBLE_AT = 3.30;
      const STREAM_S = 3.70, STREAM_E = 5.70;     // streaming window
      const STATUS_AT = 5.70;
      const TOTAL = 6.0;

      /* Chunked streaming: REPLY revealed in ~6 bursts (chars per knot).
         Fixed knot table — deterministic, reads as live token generation.
         Each entry: [fractionOfWindow, fractionOfChars]. Interp between knots. */
      const KNOTS = [
        [0.00, 0.00],
        [0.10, 0.14],  // first burst
        [0.24, 0.20],  // small pause then a flurry
        [0.42, 0.46],
        [0.58, 0.58],  // beat
        [0.78, 0.84],
        [0.92, 0.96],
        [1.00, 1.00],
      ];
      function streamFrac(p){ // p in [0,1] of the stream window → fraction of chars revealed
        if (p <= 0) return 0; if (p >= 1) return 1;
        for (let i=1;i<KNOTS.length;i++){
          const [t0,c0] = KNOTS[i-1], [t1,c1] = KNOTS[i];
          if (p <= t1){ const k=(p-t0)/(t1-t0); return c0 + (c1-c0)*k; }
        }
        return 1;
      }

      const clamp01 = t => Math.max(0, Math.min(1, t));

      /* per-frame driver: typing, caret blink, send color, streaming, status pulse */
      function render(t){
        /* composer input: typing then clear-to-placeholder after send */
        if (t < BUBBLE_AT){
          const shown = t < TYPE_S ? 0 : Math.min(NP, Math.floor((t - TYPE_S)/TYPE_PC) + 1);
          const realShown = t < TYPE_S ? 0 : shown;
          txt.textContent = PROMPT.slice(0, realShown);
          ph.style.display = realShown > 0 ? 'none' : 'inline';
          // input caret: solid while typing, blink before/after within composer life
          const typing = t >= TYPE_S && t < TYPE_E;
          if (t < TYPE_S){
            caret.style.opacity = (Math.floor(t*1.7)%2===0) ? 0.9 : 0.0; // idle blink pre-type
          } else if (typing){
            caret.style.opacity = 0.95; // steady caret as it types
          } else {
            caret.style.opacity = (Math.floor(t*1.7)%2===0) ? 0.9 : 0.0; // blink after type, before send
          }
          // send color: grey until any text, then accent
          send.style.background = realShown > 0 ? accent : rail;
        } else {
          txt.textContent = '';
          ph.style.display = 'inline';
          caret.style.opacity = 0;
          send.style.background = rail;
        }

        /* assistant streaming */
        if (t < STREAM_S){
          rtxt.textContent = '';
          bcaret.style.opacity = 0;
        } else {
          const p = clamp01((t - STREAM_S)/(STREAM_E - STREAM_S));
          const n = Math.round(streamFrac(p) * NR);
          rtxt.textContent = REPLY.slice(0, n);
          // block caret: blinks; solid-ish while actively streaming, calm blink at end
          const streaming = p < 1;
          const blink = (Math.floor(t*2.2)%2===0) ? 1 : 0.15;
          bcaret.style.opacity = streaming ? Math.max(0.55, blink) : blink;
        }

        /* status dot pulse (after it appears) */
        if (t >= STATUS_AT){
          const ph2 = (Math.sin((t - STATUS_AT)*Math.PI*2.6)+1)/2; // 0..1
          sdot.style.opacity = (0.45 + 0.55*ph2).toFixed(3);
          const sc = (0.85 + 0.30*ph2).toFixed(3);
          sdot.style.transform = `scale(${sc})`;
        } else {
          sdot.style.opacity = 1;
          sdot.style.transform = 'scale(1)';
        }
      }

      /* ── master timeline (paused; HyperFrames seeks it) ──────────────── */
      const tl = gsap.timeline({ paused:true });

      // initial states
      gsap.set(composer, { y:70, opacity:0 });
      gsap.set(userbubble, { y:46, opacity:0, scale:0.94, transformOrigin:"100% 100%" });
      gsap.set(reply, { y:30, opacity:0 });
      gsap.set(status, { y:10, opacity:0 });
      gsap.set(send, { scale:1 });
      gsap.set(sdot, { transformOrigin:"50% 50%" });

      // composer rises in
      tl.to(composer, { y:0, opacity:1, duration:COMP_IN_D, ease:"expo.out" }, COMP_IN_S);

      // send press (squash + pop)
      tl.to(send, { scale:0.80, duration:0.12, ease:"power2.in" }, SEND_AT)
        .to(send, { scale:1, duration:0.30, ease:"back.out(2.6)" }, SEND_AT+0.12);

      // prompt flies up as a user bubble; fill text just before the move
      tl.add(()=>{ userbubble.textContent = PROMPT; }, BUBBLE_AT-0.01);
      tl.to(userbubble, { y:0, opacity:1, scale:1, duration:0.55, ease:"back.out(1.7)" }, BUBBLE_AT);

      // assistant reply container appears just before streaming
      tl.to(reply, { y:0, opacity:1, duration:0.5, ease:"expo.out" }, STREAM_S-0.15);

      // editing status fades in
      tl.to(status, { y:0, opacity:1, duration:0.35, ease:"back.out(2)" }, STATUS_AT);

      // proxy tween drives render() across the whole clip
      const p = { t:0 };
      tl.to(p, { t:TOTAL, duration:TOTAL, ease:"none", onUpdate:()=>render(p.t) }, 0);
      // pad to data-duration so the final frame holds
      tl.set({}, {}, TOTAL);

      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
