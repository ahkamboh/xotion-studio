<!DOCTYPE html>
<html lang="en">
<!--
  yt-caption — source video + karaoke active-word captions, nothing else.
  Video rides a media track (<video class="clip"> + separate <audio>), the
  paused master timeline exists only to host mountCaptions(tl).
-->
<head>
<meta charset="UTF-8" />
<meta name="hf-duration" content="62.8" />
<meta name="hf-fps" content="30" />
<meta name="hf-width" content="1920" />
<meta name="hf-height" content="660" />
<style>
  @font-face { font-family:"Roboto Flex"; font-weight:100 1000; font-style:normal;
    src:url("assets/fonts/roboto-flex-variable.ttf") format("truetype-variations"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:660px; overflow:hidden; background:#000; }
  #main { position:relative; width:1920px; height:660px; background:#000; overflow:hidden; }
  .clip { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
</style>
</head>
<body>
  <div id="main" data-composition-id="main" data-start="0" data-duration="62.8" data-width="1920" data-height="660">
    <video class="clip" src="assets/source.mp4" muted playsinline data-start="0"></video>
    <audio src="assets/source.mp4" data-track-index="0" data-start="0"></audio>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="captions-pressure.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.set({}, {}, 62.8); // pad to full duration
    window.mountPressureCaptions(tl, { size: 62, minWeight: 300, maxWeight: 900 });
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    window.__timeline = tl;
  </script>
</body>
</html>
