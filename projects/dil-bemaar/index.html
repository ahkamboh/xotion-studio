<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dil Bemaar Hai — KAMBOJH (Xotion)</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-600.ttf');font-weight:600;font-display:block}
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-700.ttf');font-weight:700;font-display:block}
@font-face{font-family:'Mont';src:url('assets/fonts/montserrat-800.ttf');font-weight:800;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Mont',sans-serif}
.fill{position:absolute;inset:0;width:1920px;height:1080px}
#stage{transform-origin:center center}
#bgv{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;z-index:0}
#bg{z-index:1;background:radial-gradient(120% 95% at 50% 44%, rgba(40,8,5,.12) 0%, rgba(18,3,3,.42) 58%, rgba(0,0,0,.82) 100%)}
#introBlack{z-index:3;background:#000}
#core{position:absolute;left:50%;top:46%;width:1500px;height:1500px;transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,150,60,.5) 0%, rgba(232,83,26,.26) 26%, rgba(150,30,10,0) 62%);
  filter:blur(8px);z-index:2;will-change:transform,opacity;opacity:0}
.haze{position:absolute;border-radius:50%;filter:blur(60px);mix-blend-mode:screen;opacity:.4;z-index:2}
#haze1{left:30%;top:55%;width:900px;height:700px;background:radial-gradient(circle,rgba(255,110,40,.3),transparent 70%)}
#haze2{left:68%;top:38%;width:820px;height:680px;background:radial-gradient(circle,rgba(220,60,30,.28),transparent 70%)}
#grain{z-index:7;opacity:.05;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:440px 440px}
#vignette{z-index:6;box-shadow:inset 0 0 420px 90px rgba(0,0,0,.82);pointer-events:none}
#flash{z-index:20;background:radial-gradient(circle at 50% 45%, #ffe7c0, #ff9a3c);opacity:0;pointer-events:none}
#filmburn{z-index:19;mix-blend-mode:screen;opacity:0;pointer-events:none;overflow:hidden}
.burn{position:absolute;border-radius:50%;filter:blur(52px)}
#burnA{left:-25%;top:-15%;width:95%;height:130%;background:radial-gradient(circle,rgba(255,120,30,.95),rgba(255,60,10,.4) 45%,transparent 70%)}
#burnB{right:-20%;bottom:-25%;width:85%;height:120%;background:radial-gradient(circle,rgba(255,185,75,.9),rgba(255,90,20,.35) 45%,transparent 72%)}
#burnC{left:28%;top:-35%;width:44%;height:170%;background:linear-gradient(90deg,transparent,rgba(255,242,205,.9),transparent);filter:blur(34px)}
/* title — simple uppercase */
#titleWrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;z-index:5}
.eyebrow{font-family:'Mont';font-weight:600;font-size:26px;letter-spacing:12px;color:#e9c98a;opacity:0;text-transform:uppercase}
#title{font-family:'Mont';font-weight:800;font-size:126px;line-height:1.04;margin:16px 0 8px;text-transform:uppercase;letter-spacing:4px;
  background:linear-gradient(180deg,#fff7e2 0%,#f6d98a 46%,#c89244 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(255,170,70,.4)) drop-shadow(0 6px 28px rgba(0,0,0,.5));will-change:transform,filter}
#divider{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 16px;opacity:0}
#divider .ln{height:2px;width:90px;background:linear-gradient(90deg,transparent,#caa15e)}
#divider .ln.r{background:linear-gradient(90deg,#caa15e,transparent)}
#divider .dot{width:7px;height:7px;border-radius:50%;background:#e9c98a;box-shadow:0 0 10px rgba(233,201,138,.8)}
#artist{font-family:'Mont';font-weight:700;font-size:40px;letter-spacing:18px;text-transform:uppercase;
  background:linear-gradient(180deg,#f4e4b6,#bd8b3e);-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;padding-left:18px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="188.5" data-width="1920" data-height="1080">
  <div id="stage" class="fill">
    <video id="bgv" class="clip" data-start="0" data-duration="188.43" muted playsinline src="assets/bgloop.mp4"></video>
    <div id="bg" class="fill"></div>
    <div id="core"></div>
    <div id="haze1" class="haze"></div>
    <div id="haze2" class="haze"></div>
  </div>
  <div id="titleWrap">
    <div class="eyebrow" id="eyebrow">Official Audio</div>
    <div id="title">Dil Bemaar Hai</div>
    <div id="divider"><span class="ln"></span><span class="dot"></span><span class="ln r"></span></div>
    <div id="artist">KAMBOJH</div>
  </div>
  <div id="grain" class="fill"></div>
  <div id="vignette" class="fill"></div>
  <div id="flash" class="fill"></div>
</div>

<script src="assets/beats.js"></script>
<script>
const root=document.querySelector('[data-composition-id="main"]');
const Q=s=>root.querySelector(s);
const DUR=+root.dataset.duration, W=1920, H=1080;
const INTRO=(window.__INTRO!==undefined)?window.__INTRO:0;
const ENV=window.__ENV||[], ENVHZ=window.__ENVHZ||30, BEATS=window.__BEATS||[];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-Math.pow(1-t,3);
const pulse=(t,t0,d)=> t>=t0 ? Math.exp(-(t-t0)/d) : 0;
function envAt(st){ if(st<0)return 0; const i=st*ENVHZ, a=Math.floor(i); if(a>=ENV.length-1)return ENV[ENV.length-1]||0; return lerp(ENV[a]||0,ENV[a+1]||0,i-a); }
// most-recent-beat decaying punch
let bi=0;
function beatPulse(t){ // assumes t increases; find latest beat <= t
  while(bi<BEATS.length-1 && BEATS[bi+1]<=t) bi++;
  while(bi>0 && BEATS[bi]>t) bi--;
  const b=BEATS[bi]; if(b===undefined||b>t)return 0;
  return Math.exp(-(t-b)/0.11);
}

function render(t){
  const songT=t-INTRO;
  const env=envAt(songT);
  const bp=t>=INTRO?beatPulse(t):0;
  // slow push-in across the song
  Q('#stage').style.transform=`scale(${(1+clamp(songT,0,DUR)/DUR*0.07).toFixed(4)})`;
  // subtle amber beat flash on hits
  Q('#flash').style.opacity=(bp*0.10).toFixed(3);
  // core glow: off in intro, then breathes with envelope + punches on beats
  Q('#core').style.opacity=(t<INTRO?0:(0.24+env*0.4+bp*0.28)).toFixed(3);
  Q('#core').style.transform=`translate(-50%,-50%) scale(${(1+env*0.4+bp*0.22).toFixed(3)})`;
  // haze drift
  Q('#haze1').style.transform=`translate(${Math.sin(t*0.18)*60}px,${Math.cos(t*0.13)*40}px)`;
  Q('#haze2').style.transform=`translate(${Math.cos(t*0.15)*70}px,${Math.sin(t*0.11)*46}px)`;
  Q('#grain').style.backgroundPosition=`${(Math.sin(t*7)*40)|0}px ${(Math.cos(t*6)*40)|0}px`;
  // ---- title: smooth fade+rise in as the song begins, then beat punch ----
  const titleOp=ease(clamp((t-0.4)/2.6,0,1));   // smooth reveal right from the start
  const beatScale=1+env*0.015+bp*0.05;
  Q('#title').style.opacity=titleOp.toFixed(3);
  Q('#title').style.transform=`translateY(${lerp(34,0,titleOp).toFixed(1)}px) scale(${beatScale.toFixed(4)})`;
  Q('#title').style.filter=`drop-shadow(0 0 ${(20+env*30+bp*40).toFixed(0)}px rgba(255,180,90,${(0.32+env*0.35+bp*0.4).toFixed(2)})) drop-shadow(0 6px 28px rgba(0,0,0,.5))`;
  const eIn=ease(clamp((t-0.2)/1.4,0,1)); Q('#eyebrow').style.opacity=(eIn*0.85).toFixed(3);
  Q('#eyebrow').style.transform=`translateY(${lerp(16,0,eIn)}px)`;
  const dIn=ease(clamp((t-1.4)/0.9,0,1)); Q('#divider').style.opacity=dIn.toFixed(3);
  Q('#divider').style.transform=`scaleX(${(0.6+0.4*dIn).toFixed(3)})`;
  const aIn=ease(clamp((t-1.7)/1.0,0,1)); Q('#artist').style.opacity=(aIn*0.95).toFixed(3);
  Q('#artist').style.transform=`translateY(${lerp(18,0,aIn)}px)`;
}

const tl=gsap.timeline({paused:true});
window.__timelines=window.__timelines||{}; window.__timelines["main"]=tl;
const CLK={t:0};
tl.to(CLK,{t:DUR,duration:DUR,ease:'none',onUpdate:()=>render(CLK.t)},0);
tl.pause(0); render(0);
</script>
</body>
</html>
