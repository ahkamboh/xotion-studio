<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Corm';src:url('../bynothing/assets/fonts/cormorant-garamond-600.ttf');font-display:block}
@font-face{font-family:'Mont';src:url('../bynothing/assets/fonts/montserrat-500.ttf');font-weight:500;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
#root{position:relative;width:1280px;height:720px;overflow:hidden}
.fill{position:absolute;inset:0;width:1280px;height:720px}
#bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#grade{z-index:1;background:rgba(22,18,12,.22);mix-blend-mode:multiply}
#warm{z-index:1;background:radial-gradient(120% 120% at 50% 40%,rgba(60,48,30,.14),rgba(20,16,10,.36) 75%,rgba(10,8,5,.60) 100%);mix-blend-mode:soft-light}
#scrim{z-index:2;background:linear-gradient(180deg,rgba(6,4,2,.50) 0%,rgba(6,4,2,.10) 35%,rgba(6,4,2,.28) 65%,rgba(4,2,0,.82) 100%)}
#grain{z-index:6;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:440px}
#vig{z-index:5;box-shadow:inset 0 0 260px 70px rgba(0,0,0,.6)}
#mark{position:absolute;top:44px;left:0;right:0;text-align:center;z-index:7;font-family:'Corm';font-style:italic;font-size:28px;letter-spacing:3px;color:#f3ecdd;opacity:.82;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#titleWrap{position:absolute;left:80px;right:80px;top:50%;transform:translateY(-50%);text-align:center;z-index:8}
#title{font-family:'Corm';font-size:104px;font-weight:600;letter-spacing:2px;color:#fbf6ec;text-shadow:0 4px 28px rgba(0,0,0,.75),0 1px 4px rgba(0,0,0,.5);line-height:1.1}
#divider{margin:20px auto 0;width:72px;height:1px;background:rgba(243,236,221,.40)}
#sub{margin-top:14px;font-family:'Mont';font-weight:500;font-size:16px;letter-spacing:9px;color:#e9dcc4;text-transform:uppercase;opacity:.70}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720">
  <img id="bgimg" src="assets/autumn.jpg">
  <div id="grade" class="fill"></div>
  <div id="warm" class="fill"></div>
  <div id="scrim" class="fill"></div>
  <div id="mark">byNothing</div>
  <div id="titleWrap">
    <div id="title">Soft Goodbye</div>
    <div id="divider"></div>
    <div id="sub">byNothing · Official Audio</div>
  </div>
  <div id="vig" class="fill"></div>
  <div id="grain" class="fill"></div>
</div>
<script>
const tl=gsap.timeline({paused:true});window.__timelines={main:tl};
tl.to({},{duration:1},0);tl.pause(0);
</script>
</body>
</html>
