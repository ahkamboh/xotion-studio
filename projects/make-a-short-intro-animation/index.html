<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:'Anton'; src:url('assets/fonts/anton-400.ttf') format('truetype'); font-weight:400; font-display:block; }
      @font-face { font-family:'Archivo'; src:url('assets/fonts/archivo-900.ttf') format('truetype'); font-weight:900; font-display:block; }
      @font-face { font-family:'Archivo'; src:url('assets/fonts/archivo-600.ttf') format('truetype'); font-weight:600; font-display:block; }
      @font-face { font-family:'Instrument'; src:url('assets/fonts/instrument-serif-400-italic.ttf') format('truetype'); font-weight:400; font-style:italic; font-display:block; }

      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1920px; height:1080px; overflow:hidden; background:#0b0c0f; }

      :root{
        --bg:#0b0c0f;
        --ink:#f4f1ea;
        --muted:#8b8f99;
        --accent:#e8b23a;
      }

      #root{ position:relative; width:1920px; height:1080px;
        background:radial-gradient(1200px 700px at 50% 42%, #181b22 0%, #0b0c0f 62%);
        overflow:hidden; font-family:'Archivo',sans-serif; }

      .grid{ position:absolute; inset:0;
        background-image:radial-gradient(rgba(255,255,255,.05) 1.1px, transparent 1.2px);
        background-size:42px 42px; opacity:0; }

      .glow{ position:absolute; left:50%; top:42%; width:1100px; height:1100px;
        transform:translate(-50%,-50%); border-radius:50%;
        background:radial-gradient(circle, rgba(232,178,58,.16) 0%, rgba(232,178,58,0) 60%);
        opacity:0; }

      .vig{ position:absolute; inset:0; pointer-events:none;
        background:radial-gradient(140% 110% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }

      .stage{ position:absolute; inset:0; display:flex; flex-direction:column;
        align-items:center; justify-content:center; }

      .eyebrow{ display:flex; align-items:center; gap:18px; margin-bottom:30px; opacity:0; }
      .eyebrow .ln{ width:54px; height:2px; background:var(--accent); transform-origin:left center; }
      .eyebrow .ln.r{ transform-origin:right center; }
      .eyebrow span{ font-family:'Archivo'; font-weight:600; font-size:24px; letter-spacing:.62em;
        text-transform:uppercase; color:var(--muted); padding-left:.62em; }

      .markwrap{ position:relative; overflow:hidden; padding:0 8px; }
      .mark{ font-family:'Anton'; font-weight:400; font-size:230px; line-height:.92;
        letter-spacing:.01em; color:var(--ink); white-space:nowrap; display:flex; }
      .mark .ch{ display:inline-block; transform:translateY(118%); }
      .mark .ch.ac{ color:var(--accent); }

      .wipe{ position:absolute; inset:0; background:var(--accent); transform:scaleY(1); transform-origin:bottom; }

      .underline{ width:0; height:5px; background:var(--accent); margin-top:34px; border-radius:3px;
        box-shadow:0 0 24px rgba(232,178,58,.55); }

      .tag{ font-family:'Instrument'; font-style:italic; font-size:46px; color:var(--muted);
        margin-top:34px; letter-spacing:.02em; opacity:0; }
      .tag b{ color:var(--ink); font-style:italic; font-weight:400; }

      .tick{ position:absolute; width:46px; height:46px; border:2px solid rgba(244,241,234,.18); opacity:0; }
      .tick.tl{ left:90px; top:80px; border-right:0; border-bottom:0; }
      .tick.tr{ right:90px; top:80px; border-left:0; border-bottom:0; }
      .tick.bl{ left:90px; bottom:80px; border-right:0; border-top:0; }
      .tick.br{ right:90px; bottom:80px; border-left:0; border-top:0; }

      .estd{ position:absolute; bottom:78px; left:50%; transform:translateX(-50%);
        font-family:'Archivo'; font-weight:600; font-size:18px; letter-spacing:.42em;
        text-transform:uppercase; color:var(--muted); opacity:0; padding-left:.42em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5"
         data-width="1920" data-height="1080">

      <div class="grid"></div>
      <div class="glow"></div>

      <div class="tick tl"></div><div class="tick tr"></div>
      <div class="tick bl"></div><div class="tick br"></div>

      <div class="stage">
        <div class="eyebrow">
          <i class="ln"></i>
          <span>Xotion</span>
          <i class="ln r"></i>
        </div>

        <div class="markwrap">
          <div class="mark" id="mark"></div>
          <div class="wipe"></div>
        </div>

        <div class="underline"></div>

        <div class="tag">Where <b>ideas</b> start moving.</div>
      </div>

      <div class="estd">Studio · Est. 2026</div>

      <div class="vig"></div>
    </div>

    <script>
      const Q = s => '[data-composition-id="main"] ' + s;

      // Build wordmark letters into the DOM up-front (never create-then-animate inside tl.call)
      (function(){
        const word = "STUDIO";
        const accentIdx = 0; // 'S' tinted accent
        const mark = document.querySelector(Q('#mark'));
        [...word].forEach((c,i)=>{
          const el = document.createElement('span');
          el.className = 'ch' + (i===accentIdx ? ' ac' : '');
          el.textContent = c;
          mark.appendChild(el);
        });
      })();

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults:{ ease:'power3.out' } });

      // 0.0 — texture + frame settle
      tl.to(Q('.grid'), { opacity:1, duration:1.0 }, 0.0)
        .to(Q('.glow'), { opacity:1, duration:1.4 }, 0.0)
        .to(Q('.tick'), { opacity:1, duration:0.7, stagger:0.08 }, 0.15);

      // 0.5 — eyebrow + accent lines draw
      tl.fromTo(Q('.eyebrow .ln'), { scaleX:0 }, { scaleX:1, duration:0.6, ease:'power2.out' }, 0.5)
        .to(Q('.eyebrow'), { opacity:1, duration:0.5 }, 0.55);

      // 1.0 — wordmark: accent wipe bar lifts, letters cascade up behind it
      tl.to(Q('.mark .ch'), { y:'0%', duration:0.7, ease:'power4.out', stagger:0.06 }, 1.0)
        .to(Q('.wipe'), { scaleY:0, duration:0.55, ease:'power3.inOut' }, 1.05);

      // 2.25 — underline stretches, tagline + estd fade up
      tl.to(Q('.underline'), { width:560, duration:0.8, ease:'power3.inOut' }, 2.25)
        .fromTo(Q('.tag'), { opacity:0, y:18 }, { opacity:1, y:0, duration:0.7 }, 2.45)
        .to(Q('.estd'), { opacity:1, duration:0.7 }, 2.6);

      // 3.4 — breathing hold (never fully static)
      tl.to(Q('.glow'), { scale:1.06, duration:1.4, ease:'sine.inOut', transformOrigin:'50% 50%' }, 3.4)
        .to(Q('.mark'), { y:-6, duration:1.4, ease:'sine.inOut' }, 3.4)
        .to(Q('.eyebrow'), { y:-3, duration:1.4, ease:'sine.inOut' }, 3.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
