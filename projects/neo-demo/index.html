<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1080,height=1920"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="richness.js"></script>
<style>
 @font-face{font-family:"Archivo Black";src:url("assets/fonts/archivo-black-400.ttf") format("truetype");}
 @font-face{font-family:"Space";font-weight:700;src:url("assets/fonts/space-grotesk-700.ttf") format("truetype");}
 @font-face{font-family:"Mono";src:url("assets/fonts/jetbrains-500.ttf") format("truetype");}
 *{margin:0;padding:0;box-sizing:border-box;} html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Space",sans-serif;--mono:"Mono";}
 #root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#111;}
 .scene{position:absolute;inset:0;overflow:hidden;visibility:hidden;}
 .wrap{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px;padding:120px 70px;text-align:center;}
 .h1{font-family:"Archivo Black",sans-serif;line-height:.94;letter-spacing:-.02em;color:#111;text-transform:uppercase;font-size:150px;text-shadow:7px 7px 0 #fff,14px 14px 0 #0a0a0a;}
 .h1.w{color:#F4F1E8;text-shadow:7px 7px 0 #e0451f,14px 14px 0 #0a0a0a;}
 .tag{font-family:"Mono",monospace;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:18px 30px;border:6px solid #111;box-shadow:10px 10px 0 #111;background:#fff;color:#111;display:inline-block;}
 .card{padding:36px 50px;background:#F4F1E8;border:8px solid #111;box-shadow:14px 14px 0 #111;}
 .strike{position:absolute;height:14px;background:#e0451f;border:4px solid #111;left:-6%;right:-6%;top:50%;transform-origin:left center;}
 .bar{height:24px;background:#e0451f;border:6px solid #111;box-shadow:8px 8px 0 #111;}
 .furn{position:absolute;font-family:"Mono",monospace;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:30px;z-index:30;}
 .furn.tl{top:60px;left:64px;} .furn.tr{top:60px;right:64px;opacity:.7;}
 .bignum{position:absolute;font-family:"Archivo Black";font-size:820px;line-height:.66;z-index:1;bottom:-150px;right:-30px;letter-spacing:-.05em;}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="23.4" data-width="1080" data-height="1920"></div>
<script>
 var root=document.getElementById("root");
 var BG=["#F4F1E8","#FFD23F","#e0451f","#4DD9FF","#B8F84A","#FFD23F","#4DD9FF","#0a0a0a"];
 var DARK=[false,false,true,false,false,false,false,true];
 var EB=["▶ Xotion","▶ The idea","▶ The old way","▶ The new way","▶ It does it all","▶ The team","▶ Everything","▶ Xotion"];
 var STK=[["NEW!","#B8F84A",12],["FAST","#FF5DA2",-9],["UGH.","#FFD23F",10],["TYPE IT","#B8F84A",-8],["AUTO","#FF5DA2",9],["QA'D","#B8F84A",-10],["3-IN-1","#FFD23F",8],["GO →","#e0451f",-7]];
 var SC=[{s:0.0,e:1.52,k:'intro'},{s:1.52,e:4.0,k:'head2'},{s:4.0,e:8.06,k:'old'},{s:8.06,e:9.92,k:'prompt'},
  {s:9.92,e:13.46,k:'tags'},{s:13.46,e:16.96,k:'team'},{s:16.96,e:20.67,k:'three'},{s:20.67,e:23.4,k:'outro'}];
 window.__timelines=window.__timelines||{}; var tl=gsap.timeline({paused:true}); Rich.css();
 SC.forEach(function(c){
   var i=SC.indexOf(c), dark=DARK[i], ink=dark?"#F4F1E8":"#0a0a0a";
   var el=document.createElement("div");el.className="scene";el.style.background=BG[i];root.appendChild(el);
   tl.set(el,{visibility:"visible"},c.s);tl.set(el,{visibility:"hidden"},c.e);
   // texture + big faded number (richness)
   Rich.texture(el,"dots", dark?"rgba(244,240,230,.9)":"rgba(10,10,10,.9)");
   Rich.texture(el,"grain");
   var bn=document.createElement("div");bn.className="bignum";bn.textContent=String(i).padStart(2,'0');
   bn.style.color=dark?"rgba(244,240,230,.06)":"rgba(10,10,10,.06)";el.appendChild(bn);
   // furniture: eyebrow + counter
   var eb=document.createElement("div");eb.className="furn tl";eb.textContent=EB[i];eb.style.color=ink;el.appendChild(eb);
   var ct=document.createElement("div");ct.className="furn tr";ct.textContent=String(i+1).padStart(2,'0')+" / 08";ct.style.color=ink;el.appendChild(ct);
   Rich.enter(eb,tl,c.s+.04,'rise');Rich.enter(ct,tl,c.s+.1,'rise');
   // content wrap
   var wrap=document.createElement("div");wrap.className="wrap";el.appendChild(wrap);
   // sticker
   var sk=Rich.sticker(STK[i][0],STK[i][1],STK[i][2]);sk.style.position="absolute";sk.style.zIndex="40";
   sk.style.left=(i%2?"700px":"80px");sk.style.top=(i%3?"360px":"1380px");sk.style.fontSize="40px";el.appendChild(sk);
   Rich.stamp(sk,tl,c.s+.5,STK[i][2]);
   Rich.idle(wrap,tl,c.s,c.e);   // NEVER STATIC

   if(c.k==='intro'){
     wrap.innerHTML='<div class="card r-shadow2" style="--rs1:#FFD23F;padding:60px 80px"><img src="assets/xotion-logo-transparent.png" style="width:760px;display:block"></div><div class="tag" style="background:#FFD23F">prompt-native video editor</div>';
     Rich.cascade(wrap.children,tl,c.s+.08,{stagger:.16});
   } else if(c.k==='head2'){
     wrap.innerHTML='<div class="h1">DESCRIBE<br>THE EDIT.</div><div class="card" style="background:#e0451f;padding:24px 44px"><div class="h1 w" style="font-size:118px;text-shadow:6px 6px 0 #0a0a0a">GET THE VIDEO.</div></div>';
     Rich.cascade(wrap.children,tl,c.s+.08,{stagger:.18,from:{x:-90,opacity:0,scale:.9}});
   } else if(c.k==='old'){
     wrap.innerHTML='<div class="h1 w" style="font-size:120px">EDITING WAS<br>SLOW.</div><div style="display:flex;flex-direction:column;gap:30px;width:780px">'
       +['TIMELINES','KEYFRAMES','FEES'].map(function(n){return '<div class="card oo" style="position:relative"><div class="h1" style="font-size:70px;text-shadow:none">'+n+'</div><div class="strike st"></div></div>';}).join('')+'</div>';
     Rich.enter(wrap.children[0],tl,c.s+.08,'drop');
     el.querySelectorAll(".oo").forEach(function(cd,j){Rich.enter(cd,tl,c.s+.42+j*.16,'slam');});
     el.querySelectorAll(".st").forEach(function(e,j){gsap.set(e,{scaleX:0});tl.to(e,{scaleX:1,duration:.2,ease:"power3.in"},c.s+.66+j*.16);});
   } else if(c.k==='prompt'){
     wrap.innerHTML='<div class="h1" style="font-size:120px">NOW? YOU<br>JUST PROMPT.</div><div class="card r-shadow2" style="--rs1:#4DD9FF;background:#fff;width:860px;text-align:left;padding:46px"><span style="font-family:Mono;font-size:44px;color:#e0451f">&gt;</span><span style="font-family:Mono;font-size:44px;color:#111">&nbsp;make a 30s explainer,<br>&nbsp;&nbsp;&nbsp;female voice</span></div>';
     Rich.cascade(wrap.children,tl,c.s+.08,{stagger:.22});
   } else if(c.k==='tags'){
     var cols=["#FFD23F","#4DD9FF","#FF5DA2","#fff","#B8F84A"];
     wrap.innerHTML='<div class="h1" style="font-size:128px">IT DOES<br>THE REST.</div><div class="trow" style="display:flex;flex-wrap:wrap;gap:26px;justify-content:center;max-width:920px">'
       +['SCRIPT','VOICE','FOOTAGE','MOTION','CAPTIONS'].map(function(t,j){return '<div class="tag tg" style="background:'+cols[j%cols.length]+';font-size:44px;padding:24px 40px">'+t+'</div>';}).join('')+'</div>';
     Rich.enter(wrap.children[0],tl,c.s+.08,'drop');
     Rich.cascade(el.querySelectorAll(".tg"),tl,c.s+.38,{stagger:.14,from:{scale:.4,opacity:0}});
   } else if(c.k==='team'){
     wrap.innerHTML='<div class="h1" style="font-size:118px">A TEAM OF<br>AGENTS.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;width:840px">'
       +['SCRIPTWRITER','ART-DIRECTOR','MOTION','EDITOR','CAPTIONER','QA'].map(function(n){return '<div class="tag ag" style="font-size:30px;background:#fff">'+n+'</div>';}).join('')
       +'</div><div class="tag" id="stamp" style="background:#e0451f;color:#fff;font-size:60px;border-width:8px;box-shadow:14px 14px 0 #111;transform:rotate(-7deg)">QA PASS ✓</div>';
     Rich.enter(wrap.children[0],tl,c.s+.08,'drop');
     Rich.cascade(el.querySelectorAll(".ag"),tl,c.s+.3,{stagger:.09,from:{scale:.5,opacity:0}});
     Rich.stamp(el.querySelector("#stamp"),tl,c.s+1.1,-7);
   } else if(c.k==='three'){
     wrap.innerHTML='<div style="display:flex;flex-direction:column;gap:34px;width:880px">'
       +'<div class="card t3" style="background:#FFD23F"><div class="h1" style="font-size:92px;text-shadow:none">MOTION</div></div>'
       +'<div class="card t3" style="background:#FF5DA2"><div class="h1 w" style="font-size:92px;text-shadow:none">VIDEO</div></div>'
       +'<div class="card t3" style="background:#0a0a0a"><div class="h1 w" style="font-size:92px;text-shadow:none">IMAGE</div></div></div>'
       +'<div class="tag" style="background:#e0451f;color:#fff;font-size:40px">ONE PROMPT.</div>';
     el.querySelectorAll(".t3").forEach(function(b,j){Rich.enter(b,tl,c.s+.1+j*.2,'slam');});
     Rich.enter(wrap.lastChild,tl,c.s+.85,'pop');
   } else if(c.k==='outro'){
     wrap.innerHTML='<img src="assets/xotion-logo-white.png" style="width:840px;display:block"><div class="h1 w" style="font-size:108px;text-shadow:6px 6px 0 #e0451f">CURSOR FOR<br>EDITORS.</div><div class="bar" style="width:400px"></div>';
     Rich.enter(wrap.children[0],tl,c.s+.06,'slam');Rich.enter(wrap.children[1],tl,c.s+.3,'rise');
     var ob=wrap.children[2];gsap.set(ob,{scaleX:0,transformOrigin:"left center"});tl.to(ob,{scaleX:1,duration:.4,ease:"power3.out"},c.s+.6);
   }
 });
 window.__timelines["main"]=tl;
</script></body></html>
