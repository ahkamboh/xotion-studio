<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1080,height=1920"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
 @font-face{font-family:"Archivo Black";src:url("assets/fonts/archivo-black-400.ttf") format("truetype");}
 @font-face{font-family:"Space";font-weight:700;src:url("assets/fonts/space-grotesk-700.ttf") format("truetype");}
 @font-face{font-family:"Space";font-weight:500;src:url("assets/fonts/space-grotesk-500.ttf") format("truetype");}
 @font-face{font-family:"Mono";src:url("assets/fonts/jetbrains-500.ttf") format("truetype");}
 *{margin:0;padding:0;box-sizing:border-box;}
 html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Space",sans-serif;}
 #root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#111;}
 .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
   gap:48px;padding:90px 70px;text-align:center;visibility:hidden;}
 .nb{border:8px solid #111;box-shadow:18px 18px 0 #111;}
 .h1{font-family:"Archivo Black",sans-serif;font-size:150px;line-height:.94;letter-spacing:-.02em;color:#111;text-transform:uppercase;}
 .h1.w{color:#F4F1E8;}
 .tag{font-family:"Mono",monospace;font-weight:700;font-size:34px;letter-spacing:.04em;text-transform:uppercase;
   padding:18px 30px;border:6px solid #111;box-shadow:10px 10px 0 #111;background:#fff;color:#111;display:inline-block;}
 .card{padding:40px 50px;background:#F4F1E8;border:8px solid #111;box-shadow:16px 16px 0 #111;}
 .stamp{font-family:"Archivo Black",sans-serif;font-size:96px;color:#fff;background:#e0451f;border:8px solid #111;
   box-shadow:14px 14px 0 #111;padding:24px 44px;transform:rotate(-7deg);text-transform:uppercase;}
 .strike{position:absolute;height:14px;background:#e0451f;border:4px solid #111;left:-6%;right:-6%;top:50%;transform-origin:left center;}
 .logo{display:block;}
 .bar{height:24px;background:#e0451f;border:6px solid #111;box-shadow:8px 8px 0 #111;}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="23.4" data-width="1080" data-height="1920"></div>
<script>
 var root=document.getElementById("root");
 var BG=["#F4F1E8","#FFD23F","#e0451f","#4DD9FF","#B8F84A","#FFD23F","#4DD9FF","#111111"];
 var SC=[
  {s:0.0,  e:1.52, k:'intro'},
  {s:1.52, e:4.0,  k:'head2',a:"DESCRIBE",b:"THE EDIT.",c:"GET THE VIDEO."},
  {s:4.0,  e:8.06, k:'old'},
  {s:8.06, e:9.92, k:'prompt'},
  {s:9.92, e:13.46,k:'tags',head:"IT DOES THE REST.",tags:["SCRIPT","VOICE","FOOTAGE","MOTION","CAPTIONS"]},
  {s:13.46,e:16.96,k:'team'},
  {s:16.96,e:20.67,k:'three'},
  {s:20.67,e:23.4, k:'outro'}
 ];
 window.__timelines=window.__timelines||{};
 var tl=gsap.timeline({paused:true});
 function slam(el,t,d){d=d||.3; gsap.set(el,{scale:.5,opacity:0,rotation:gsap.utils.random(-4,4,1,el)}); 
   // deterministic rotation: use index-based instead of random
 }
 function pop(el,t,from){from=from||{scale:.55,opacity:0}; gsap.set(el,from); tl.to(el,{scale:1,opacity:1,rotation:0,y:0,x:0,duration:.32,ease:"back.out(2.6)"},t);}
 SC.forEach(function(c){
   var el=document.createElement("div");el.className="scene";el.style.background=BG[SC.indexOf(c)];root.appendChild(el);
   tl.set(el,{visibility:"visible"},c.s); tl.set(el,{visibility:"hidden"},c.e);

   if(c.k==='intro'){
     el.innerHTML='<div class="card" id="i-card" style="padding:70px 70px"><img class="logo" src="assets/xotion-logo-transparent.png" style="width:760px"></div>'
       +'<div class="tag" id="i-tag" style="background:#FFD23F">prompt-native video editor</div>';
     pop(el.querySelector("#i-card"),c.s+.04); pop(el.querySelector("#i-tag"),c.s+.22,{y:40,opacity:0});
   } else if(c.k==='head2'){
     el.innerHTML='<div class="h1" id="a">'+c.a+'</div><div class="h1" id="b">'+c.b+'</div>'
       +'<div class="card" id="cc" style="background:#e0451f;padding:26px 40px"><div class="h1 w" style="font-size:118px">'+c.c+'</div></div>';
     pop(el.querySelector("#a"),c.s+.05,{x:-80,opacity:0}); pop(el.querySelector("#b"),c.s+.18,{x:80,opacity:0});
     pop(el.querySelector("#cc"),c.s+.45,{scale:.5,opacity:0});
   } else if(c.k==='old'){
     el.innerHTML='<div class="h1 w" id="oh" style="font-size:120px">EDITING WAS<br>SLOW.</div>'
       +'<div style="display:flex;flex-direction:column;gap:34px;width:760px">'
       +'<div class="card oo" style="position:relative"><div class="h1" style="font-size:76px">TIMELINES</div><div class="strike" id="s0"></div></div>'
       +'<div class="card oo" style="position:relative"><div class="h1" style="font-size:76px">KEYFRAMES</div><div class="strike" id="s1"></div></div>'
       +'<div class="card oo" style="position:relative"><div class="h1" style="font-size:76px">FEES</div><div class="strike" id="s2"></div></div></div>';
     pop(el.querySelector("#oh"),c.s+.05,{y:-50,opacity:0});
     var cards=el.querySelectorAll(".oo");
     cards.forEach(function(cd,i){pop(cd,c.s+.4+i*.18,{x:-60,opacity:0});});
     ["#s0","#s1","#s2"].forEach(function(s,i){var e=el.querySelector(s);gsap.set(e,{scaleX:0});tl.to(e,{scaleX:1,duration:.2,ease:"power3.in"},c.s+.62+i*.18);});
   } else if(c.k==='prompt'){
     el.innerHTML='<div class="h1" id="ph">NOW? YOU<br>JUST PROMPT.</div>'
       +'<div class="card" id="pb" style="background:#fff;width:840px;text-align:left;padding:46px"><span style="font-family:Mono;font-size:44px;color:#e0451f">&gt;</span>'
       +'<span style="font-family:Mono;font-size:44px;color:#111">&nbsp;make a 30s explainer,<br>&nbsp;&nbsp;&nbsp;female voice</span><span id="cur" style="display:inline-block;width:22px;height:48px;background:#111;margin-left:6px;vertical-align:-6px"></span></div>';
     pop(el.querySelector("#ph"),c.s+.05,{y:-40,opacity:0}); pop(el.querySelector("#pb"),c.s+.3,{scale:.6,opacity:0});
     var cur=el.querySelector("#cur");for(var b=0;b<6;b++){tl.set(cur,{opacity:b%2?0:1},c.s+.6+b*.22);}
   } else if(c.k==='tags'){
     var th='<div class="h1" id="th">'+c.head+'</div><div style="display:flex;flex-wrap:wrap;gap:26px;justify-content:center;max-width:920px">';
     var cols=["#FFD23F","#4DD9FF","#FF5DA2","#fff","#B8F84A"];
     c.tags.forEach(function(tg,i){th+='<div class="tag tg" style="background:'+cols[i%cols.length]+';font-size:42px;padding:24px 38px">'+tg+'</div>';});
     el.innerHTML=th+'</div>';
     pop(el.querySelector("#th"),c.s+.05,{y:-40,opacity:0});
     el.querySelectorAll(".tg").forEach(function(tg,i){pop(tg,c.s+.35+i*.16,{scale:.4,opacity:0});});
   } else if(c.k==='team'){
     el.innerHTML='<div class="h1" id="ah" style="font-size:118px">A TEAM OF<br>AGENTS.</div>'
       +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;width:820px">'
       +['SCRIPTWRITER','ART-DIRECTOR','MOTION','EDITOR','CAPTIONER','QA'].map(function(n){return '<div class="tag ag" style="font-size:30px;background:#fff">'+n+'</div>';}).join('')
       +'</div><div class="stamp" id="stamp">QA&nbsp;PASS&nbsp;✓</div>';
     pop(el.querySelector("#ah"),c.s+.05,{y:-40,opacity:0});
     el.querySelectorAll(".ag").forEach(function(a,i){pop(a,c.s+.3+i*.09,{scale:.5,opacity:0});});
     var st=el.querySelector("#stamp");gsap.set(st,{scale:2.2,opacity:0,rotation:-7});tl.to(st,{scale:1,opacity:1,duration:.3,ease:"back.out(3)"},c.s+1.1);
   } else if(c.k==='three'){
     el.innerHTML='<div style="display:flex;flex-direction:column;gap:40px;width:860px">'
       +'<div class="card t3" style="background:#FFD23F"><div class="h1" style="font-size:96px">MOTION</div></div>'
       +'<div class="card t3" style="background:#FF5DA2"><div class="h1 w" style="font-size:96px">VIDEO</div></div>'
       +'<div class="card t3" style="background:#111"><div class="h1 w" style="font-size:96px">IMAGE</div></div></div>'
       +'<div class="tag" id="op" style="background:#e0451f;color:#fff;font-size:38px">ONE PROMPT.</div>';
     el.querySelectorAll(".t3").forEach(function(b,i){pop(b,c.s+.1+i*.22,{x:i%2?120:-120,opacity:0});});
     pop(el.querySelector("#op"),c.s+.9,{scale:.5,opacity:0});
   } else if(c.k==='outro'){
     el.innerHTML='<img class="logo" id="ol" src="assets/xotion-logo-white.png" style="width:820px">'
       +'<div class="h1 w" id="oc" style="font-size:104px">CURSOR FOR<br>EDITORS.</div><div class="bar" id="ob" style="width:380px"></div>';
     pop(el.querySelector("#ol"),c.s+.05,{scale:.6,opacity:0});
     pop(el.querySelector("#oc"),c.s+.3,{y:40,opacity:0});
     var ob=el.querySelector("#ob");gsap.set(ob,{scaleX:0,transformOrigin:"left center"});tl.to(ob,{scaleX:1,duration:.4,ease:"power3.out"},c.s+.55);
   }
 });
 window.__timelines["main"]=tl;
</script>
</body>
</html>
