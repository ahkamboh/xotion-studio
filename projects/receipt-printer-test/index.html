<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"storeName",     "type":"string","label":"Store / header name (dot-matrix)",                 "default":"XOTION STUDIO"},
  {"id":"lineItems",     "type":"string","label":"Items — pipe-separated rows, each \"label~value\"", "default":"Agent runs~1,204|Docs automated~318|Slack threads~52|Emails drafted~96|Hours reclaimed~41"},
  {"id":"totalLabel",    "type":"string","label":"Total row label",                                  "default":"TOTAL SAVED"},
  {"id":"totalValue",    "type":"string","label":"Total row value (number only)",                    "default":"1,240"},
  {"id":"stampText",     "type":"string","label":"Stamp text (slams on TOTAL)",                       "default":"YOU SAVED"},
  {"id":"footerText",    "type":"string","label":"Footer line (under the tear)",                      "default":"THANK YOU — POWERED BY XOTION"},
  {"id":"currencySymbol","type":"string","label":"Currency symbol",                                   "default":"$"},
  {"id":"paperTint",     "type":"color", "label":"Receipt paper tint",                                "default":"#fbf7ee"},
  {"id":"ink",           "type":"color", "label":"Receipt ink",                                       "default":"#181410"},
  {"id":"accent",        "type":"color", "label":"Stamp / total accent",                              "default":"#d6263b"},
  {"id":"bg",            "type":"color", "label":"Background (counter)",                               "default":"#1c1916"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      RECEIPT PRINTER RECAP — a POS thermal print head chatters left-to-right
      (HAND-CODED seeded jitter, never RNG) as a paper receipt feeds DOWN line
      by line out of the printer slot. The store name dot-matrix-prints first,
      then each line item reveals with a dotted-leader value, the virtual camera
      DOLLIES DOWN to follow the growing paper, a bold TOTAL row lands and a
      diagonal rubber STAMP slams onto it ("YOU SAVED $1,240" with an ink-thud
      overshoot + settle), the paper TEARS along a perforation (zig-zag edge)
      and the torn strip CURLS away while a footer line sits under the tear.

      USE CASES — Wrapped-style recaps, pricing breakdowns, per-order e-com
      batches. Receiptify proved the format goes viral as STATIC images; this
      animates the printing so it works as a video / Reel.

      ── VARIABLE ENCODING ─────────────────────────────────────────────────
        lineItems  pipe-separated rows; each row is  label~value
                   e.g. "Agent runs~1,204|Docs automated~318"
                   value is printed verbatim (string) right-aligned after a
                   dotted leader, so it can be a number, "$12.00", "x3", etc.
        totalValue number/string only — currencySymbol is prepended in the
                   TOTAL row and in the stamp.
      Any field may be longer/shorter than the default: the paper width is
      fixed but every text guard is overflow-safe — item labels AND the TOTAL
      label ellipsize (flex:0 1 + min-width:0 + text-overflow), the TOTAL value
      caps at 48% and wraps, the stamp caps at the paper column and wraps, and
      the footer wraps onto multiple lines; nothing runs off the paper edge. The
      camera dolly distance is computed from the ACTUAL built paper height
      so a 2-item or a 9-item receipt both stay framed. IMAGE-type vars: none —
      the receipt + printer are 100% CSS/SVG, zero asset files needed.

      ── CHOREOGRAPHY (data-duration 7.0s — final frame HOLDS to 7.0s) ──────
      phase | start–end (s) | easing            | what moves
      ------|---------------|-------------------|---------------------------------
      0 open      0.00       (set)               printer body + empty slot, no paper. Frame 0 = idle machine.
      1 spool-up  0.00–0.45  outCubic            print head slides in to the left start of its sweep.
      2 header    0.45–1.05  none (proxy)        head chatters across (seeded jitter table); store-name dot-matrix prints char-by-char on row 0; paper feeds down to header rule.
      3 items     1.05–3.45  none (proxy)+iOcubic per item: head sweeps the row, label types in, dotted leader extends, value snaps on; paper feeds a row each time; camera DOLLIES DOWN tracking the live print row.
      4 total     3.45–4.20  power3.out/back.out total rule draws; TOTAL row lands bold (back.out overshoot settle); head parks at center.
      5 stamp     4.20–4.95  back.out(2.6)       rubber stamp drops from above, rotated -8°, THUDS onto the total (overshoot scale then settle), camera kick (decaying sine shake).
      6 tear      4.95–5.70  power2.inOut        perforation zig-zag fades in; the torn strip CURLS away (rotateX); footer line rises under the tear.
      7 hold      5.70–7.00  (set)               composed final frame holds (loop-friendly: stamped receipt + footer, head parked at center).

      ── DETERMINISM CONTRACT ──────────────────────────────────────────────
      ONE paused master timeline (window.__timelines["main"] + __timeline).
      • Per-frame motion (print-head jitter chatter, char-by-char typing,
        dotted-leader growth, value reveal, camera dolly) → ONE proxy {t}
        tween (ease:"none") whose onUpdate calls render(t). Discrete beats
        (total overshoot, stamp thud, camera kick, tear/curl, footer) →
        normal GSAP tweens on the SAME paused timeline.
      • Print-head "seeded jitter" = a HAND-CODED constant table (JITTER[]),
        sampled by a time-derived index — NO Math.random, NO Date, NO rAF,
        NO setTimeout, NO CSS transition/@keyframes, NO infinite repeats.
      • Typed text uses Math.floor on the same progress that drives the head,
        so the head never prints ahead of the visible characters.
      • ALL DOM (rows, leader dots, stamp, perforation teeth) built at
        construction time; the lineItems loop runs at construction. NOTHING is
        created inside onUpdate/.call — only textContent swaps inside onUpdate.
      • Every animated element initialized via gsap.set before frame 0;
        render(0) runs at boot so frame 0 is the correct idle machine.
      • hex6() normalizes colors before appending 2-digit alpha.
      • Geometry (row tops / paper height) measured lazily inside the first
        render and re-measured until document.fonts.status === "loaded".
      Only network resource: the GSAP CDN. Fonts are LOCAL @font-face:
        silkscreen-700  → dot-matrix store-name header + slot label (POS look)
        jetbrains-500   → monospace receipt body (items, leaders, values)
        archivo-800     → heavy TOTAL row + stamp display
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Silkscreen"; font-weight:700;
        src:url("assets/fonts/silkscreen-700.ttf") format("truetype"); }
      @font-face { font-family:"JetBrains"; font-weight:500;
        src:url("assets/fonts/jetbrains-500.ttf") format("truetype"); }
      @font-face { font-family:"Archivo"; font-weight:800;
        src:url("assets/fonts/archivo-800.ttf") format("truetype"); }

      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; }

      /* stage holds the printer (fixed) + the camera-dollied paper; we also
         shake this whole node on stamp impact */
      .stage { position:absolute; left:50%; top:50%;
               transform:translate(-50%,-50%); width:1920px; height:1080px; }

      /* ── the POS printer body (fixed near the top) ───────────────────── */
      .printer {
        position:absolute; left:50%; top:96px; transform:translateX(-50%);
        width:760px; height:188px; z-index:40;
        border-radius:26px 26px 16px 16px;
        background:linear-gradient(180deg,#3a342d 0%,#2a2520 62%,#211d18 100%);
        box-shadow:0 28px 70px rgba(0,0,0,.55),
                   inset 0 2px 0 rgba(255,255,255,.07),
                   inset 0 -10px 30px rgba(0,0,0,.5);
      }
      .printerTopLip {
        position:absolute; left:24px; right:24px; top:18px; height:44px;
        border-radius:14px;
        background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.18));
      }
      .slotLabel {
        position:absolute; left:0; right:0; top:30px; text-align:center;
        font-family:"Silkscreen"; font-size:18px; letter-spacing:2px;
        color:rgba(255,255,255,.42);
      }
      .ledGreen, .ledAmber { position:absolute; top:34px; width:13px; height:13px;
        border-radius:50%; }
      .ledGreen { left:46px;  background:#5fe08a; box-shadow:0 0 12px #5fe08a; }
      .ledAmber { left:70px;  background:#f0b24a; box-shadow:0 0 12px #f0b24a; }
      .slot {
        position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
        width:560px; height:30px; border-radius:7px;
        background:linear-gradient(180deg,#0c0a08,#191512);
        box-shadow:inset 0 5px 12px rgba(0,0,0,.85),
                   inset 0 -2px 0 rgba(255,255,255,.05);
      }
      .head {
        position:absolute; left:50%; bottom:10px; width:78px; height:18px;
        border-radius:5px; z-index:42; margin-left:-39px;
        background:linear-gradient(180deg,#7f7468,#4a4239);
        box-shadow:0 4px 10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18);
      }

      /* ── paperWindow: fixed clip mask, only shows paper BELOW the slot ─── */
      .paperWindow {
        position:absolute; left:0; right:0; z-index:20;
        top:262px;                 /* SLOT_Y — set precisely from JS too */
        height:818px;              /* 1080 - 262 */
        overflow:hidden;
        perspective:1400px;        /* gives the tear-curl a real 3D fold */
      }
      /* ── camera: dollies DOWN to follow the feeding paper (within window) ─ */
      .cam { position:absolute; left:50%; top:0; will-change:transform; z-index:20; }

      /* ── the receipt paper ───────────────────────────────────────────── */
      .paper {
        position:relative; width:560px; margin:0 auto;
        font-family:"JetBrains"; transform-origin:top center;
        filter:drop-shadow(0 22px 40px rgba(0,0,0,.42));
      }
      .paperBody {
        position:relative; width:560px;
        padding:30px 40px 40px;
        border-radius:3px 3px 0 0;
        transform-origin:top center;
      }
      .paperBody::before {
        content:""; position:absolute; inset:0; border-radius:3px 3px 0 0;
        background:repeating-linear-gradient(180deg,
          rgba(0,0,0,0) 0px, rgba(0,0,0,0) 25px,
          rgba(0,0,0,.015) 25px, rgba(0,0,0,.015) 26px);
        pointer-events:none;
      }
      .pHeader {
        font-family:"Silkscreen"; text-align:center; letter-spacing:1px;
        font-size:40px; line-height:1.18; margin-bottom:6px; word-break:break-word;
      }
      .pSub {
        font-family:"JetBrains"; text-align:center; font-size:17px;
        letter-spacing:2px; opacity:.62; margin-bottom:20px;
      }
      .ruleDot { width:100%; height:3px; margin:14px 0 16px;
        background-image:radial-gradient(currentColor 1.3px, transparent 1.4px);
        background-size:13px 3px; background-repeat:repeat-x;
        background-position:left center; }
      .row { position:relative; display:flex; align-items:baseline;
             font-size:30px; line-height:1.5; min-height:45px; }
      .rLabel { flex:0 1 auto; white-space:nowrap; overflow:hidden;
                text-overflow:ellipsis; max-width:60%; }
      .rLeader { flex:1 1 auto; margin:0 10px; align-self:flex-end;
                 height:1.05em; border-bottom:3px dotted currentColor;
                 transform-origin:left center; opacity:.5; }
      .rValue { flex:0 0 auto; font-variant-numeric:tabular-nums;
                white-space:nowrap; }
      .totalRule { width:100%; height:4px; margin:22px 0 14px;
        transform-origin:left center; }
      .totalRow { position:relative; display:flex; align-items:baseline;
        justify-content:space-between; gap:16px; font-family:"Archivo"; font-weight:800;
        font-size:44px; letter-spacing:-0.02em; }
      /* tLabel flex-SHRINKS and ellipsizes so a long totalLabel ("GRAND TOTAL
         RECLAIMED THIS YEAR") can never run off the paper into the counter;
         min-width:0 lets a flex child shrink below its content width. The gap
         above guarantees label/value never touch even at the default, and the
         default "TOTAL SAVED" still fits unellipsized. */
      .tLabel { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
                white-space:nowrap; }
      /* tValue keeps its natural width (never shrinks), so a normal value like
         "$1,240" prints whole; only a pathologically long currency string wraps
         (capped at 60% so it can never push the label off the paper). */
      .tValue { flex:0 0 auto; max-width:60%; font-variant-numeric:tabular-nums;
                overflow-wrap:break-word; text-align:right; }
      /* reserved whitespace BELOW the total row — the stamp slams HERE so it
         never overlaps the printed TOTAL value. Height tracks the stamp size. */
      .stampZone { position:relative; width:100%; height:128px; margin-top:14px; }
      .stamp {
        position:absolute; left:50%; top:50%; z-index:60;
        transform:translate(-50%,-50%);
        font-family:"Archivo"; font-weight:800;
        text-align:center; padding:14px 30px;
        border:6px solid currentColor; border-radius:12px;
        letter-spacing:0.02em; line-height:1.05;
        /* never wider than the paper content column → a long stampText or a big
           currency value wraps inside the stamp rather than overflowing the
           paper edge into the counter. break-word (not anywhere) only breaks a
           token that genuinely can't fit, so a normal value like "$1,240" stays
           whole on one line. */
        max-width:100%; white-space:normal; overflow-wrap:break-word;
        text-transform:uppercase;
      }
      .stamp .sBig { display:block; font-size:54px; overflow-wrap:break-word; }
      .stamp .sSmall { display:block; font-size:22px; letter-spacing:6px;
        margin-bottom:4px; overflow-wrap:break-word; }
      .perf { position:relative; width:560px; height:54px; margin:0 auto;
        overflow:visible; z-index:30; transform-origin:top center; }
      .footer {
        position:relative; margin:14px auto 0;
        width:560px; text-align:center; font-family:"JetBrains";
        font-size:18px; letter-spacing:2px; z-index:25;
        /* wrap a long footerText onto multiple lines instead of running it off
           the 560px paper width (no nowrap → overflow guard); break-word only
           splits a token too long to fit, so normal words stay intact. */
        white-space:normal; overflow-wrap:break-word;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.0" data-width="1920" data-height="1080">
      <div class="stage" id="stage">

        <!-- paperWindow: a FIXED clipping mask covering only the area BELOW the
             slot mouth. The camera-dollied paper lives inside it, so any part of
             the paper scrolled above the slot is clipped (never appears above the
             printer). cam.y is measured relative to this window's top. -->
        <div class="paperWindow" id="paperWindow">
        <div class="cam" id="cam">
          <div class="paper" id="paper">
            <div class="paperBody" id="paperBody">
              <div class="pHeader" id="pHeader"></div>
              <div class="pSub" id="pSub">RECAP · NO. 0042</div>
              <div class="ruleDot" id="ruleTop"></div>
              <div id="rows"><!-- item rows injected at construction --></div>
              <div class="totalRule" id="totalRule"></div>
              <div class="totalRow" id="totalRow">
                <span class="tLabel" id="tLabel"></span>
                <span class="tValue" id="tValue"></span>
              </div>
              <!-- reserved whitespace gap; the stamp slams into the CENTER of
                   this zone, well clear of the printed TOTAL value above it.
                   Lives inside paperBody so it tracks the camera. -->
              <div class="stampZone" id="stampZone">
                <div class="stamp" id="stamp">
                  <span class="sSmall" id="stampSmall"></span>
                  <span class="sBig"   id="stampBig"></span>
                </div>
              </div>
            </div>
            <!-- perforation tear edge + curling strip. The teeth sit at the top;
                 a short paper APRON hangs below them and CURLS (rotateX) at the
                 tear. A vertical shadow gradient on the apron sells the 3D fold. -->
            <svg class="perf" id="perf" viewBox="0 0 560 54" preserveAspectRatio="none">
              <defs>
                <linearGradient id="curlShade" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"  id="curlStop0" stop-color="#000" stop-opacity="0"></stop>
                  <stop offset="100%" id="curlStop1" stop-color="#000" stop-opacity="0.34"></stop>
                </linearGradient>
              </defs>
              <polygon id="perfApron" points=""></polygon>
              <rect id="perfShade" x="0" y="4" width="560" height="50" fill="url(#curlShade)"></rect>
              <polygon id="perfTeeth" points=""></polygon>
            </svg>
            <div class="footer" id="footer"></div>
          </div>
        </div>
        </div><!-- /paperWindow -->

        <!-- the printer body sits ON TOP, hiding where paper emerges -->
        <div class="printer" id="printer">
          <div class="printerTopLip"></div>
          <div class="ledGreen"></div><div class="ledAmber"></div>
          <div class="slotLabel">XOTION&nbsp;&nbsp;POS</div>
          <div class="slot" id="slot"></div>
          <div class="head" id="head"></div>
        </div>

      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize hex so 2-digit alpha can be appended (#abc→#aabbcc, #rrggbbaa→#rrggbb) */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}

      const INK    = hex6(V.ink);
      const ACCENT = hex6(V.accent);
      const PAPER  = V.paperTint;
      const CUR    = String(V.currencySymbol || "$");
      const clamp01 = t => Math.max(0, Math.min(1, t));

      /* ── parse line items: "label~value|label~value" ─────────────────── */
      const ITEMS = String(V.lineItems).split("|").map(s => s.trim()).filter(Boolean).map(s => {
        const i = s.indexOf("~");
        return i < 0 ? { label: s, value: "" }
                     : { label: s.slice(0, i).trim(), value: s.slice(i + 1).trim() };
      });
      const N = ITEMS.length;

      /* ── elements ───────────────────────────────────────────────────── */
      const root   = document.getElementById("root");
      const stage  = document.getElementById("stage");
      const cam    = document.getElementById("cam");
      const paper  = document.getElementById("paper");
      const pBody  = document.getElementById("paperBody");
      const pHeader= document.getElementById("pHeader");
      const pSub   = document.getElementById("pSub");
      const ruleTop= document.getElementById("ruleTop");
      const rowsEl = document.getElementById("rows");
      const totalRule = document.getElementById("totalRule");
      const totalRow  = document.getElementById("totalRow");
      const tLabel = document.getElementById("tLabel");
      const tValue = document.getElementById("tValue");
      const stamp  = document.getElementById("stamp");
      const stampSmall = document.getElementById("stampSmall");
      const stampBig   = document.getElementById("stampBig");
      const perf   = document.getElementById("perf");
      const perfTeeth = document.getElementById("perfTeeth");
      const perfApron = document.getElementById("perfApron");
      const footer = document.getElementById("footer");
      const head   = document.getElementById("head");

      /* ── static styling from variables ──────────────────────────────── */
      document.body.style.background = V.bg;
      root.style.background = V.bg;
      root.style.backgroundImage =
        `radial-gradient(1200px 700px at 50% 34%, ${hex6(V.bg)}00 0%, rgba(0,0,0,.32) 100%)`;

      pBody.style.background = PAPER;
      pBody.style.color = INK;
      pHeader.style.color = INK;
      pSub.style.color = INK;
      ruleTop.style.color = INK;
      totalRule.style.background = INK;
      totalRow.style.color = INK;
      // footer sits on the DARK counter (below the torn paper), so it uses a
      // light, legible color — NOT dark ink-on-dark (which read as invisible).
      footer.style.color = "rgba(255,255,255,.82)";
      footer.style.textShadow = "0 1px 6px rgba(0,0,0,.7)";
      head.style.boxShadow =
        `0 4px 10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18), 0 9px 14px ${ACCENT}55`;

      pHeader.textContent = "";
      pSub.textContent    = "RECAP · NO. 0042";
      tLabel.textContent  = String(V.totalLabel);
      tValue.textContent  = CUR + String(V.totalValue);
      footer.textContent  = String(V.footerText);
      stampSmall.textContent = String(V.stampText);
      stampBig.textContent   = CUR + String(V.totalValue);
      stamp.style.color = ACCENT;
      stamp.style.background = `${ACCENT}12`;

      const HEADER = String(V.storeName);

      /* ── build item rows at CONSTRUCTION time ────────────────────────── */
      const rowEls = ITEMS.map(it => {
        const row = document.createElement("div");
        row.className = "row";
        row.style.color = INK;
        const lab = document.createElement("span");
        lab.className = "rLabel";
        const lead = document.createElement("span");
        lead.className = "rLeader";
        const val = document.createElement("span");
        val.className = "rValue";
        row.appendChild(lab); row.appendChild(lead); row.appendChild(val);
        rowsEl.appendChild(row);
        return { row, lab, lead, val, item: it };
      });

      /* ── perforation tear: a zig-zag TORN top edge + a paper APRON below it
         that curls away (rotateX). The apron is the visible folded surface; a
         darker zig-zag line traces the torn edge for definition. ─────────── */
      (function buildPerf(){
        const W = 560, teeth = 28, step = W / teeth, top = 4, bot = 22, BOTTOM = 54;
        // apron: top edge = zig-zag (torn), bottom edge = flat → the curling strip
        let apron = `0,${top} `;
        for (let i = 0; i < teeth; i++) {
          const x0 = i * step, xm = x0 + step / 2;
          apron += `${xm.toFixed(1)},${bot} ${(x0+step).toFixed(1)},${top} `;
        }
        apron += `${W},${BOTTOM} 0,${BOTTOM}`;
        perfApron.setAttribute("points", apron);
        perfApron.setAttribute("fill", PAPER);
        // torn-edge line: just the zig-zag, slightly inked so the tear reads
        let edge = `0,${top} `;
        for (let i = 0; i < teeth; i++) {
          const x0 = i * step, xm = x0 + step / 2;
          edge += `${xm.toFixed(1)},${bot} ${(x0+step).toFixed(1)},${top} `;
        }
        edge += `${W},${top+5} 0,${top+5}`;
        perfTeeth.setAttribute("points", edge);
        perfTeeth.setAttribute("fill", INK);
        perfTeeth.setAttribute("opacity", "0.16");
      })();

      /* ── layout geometry (stage coords; stage is 1920×1080, origin top-left) ─
         The paper lives inside .paperWindow, a FIXED clip mask whose top is at
         the slot mouth (SLOT_Y). cam.y is therefore measured RELATIVE TO THE
         WINDOW TOP: window-y 0 == stage-y SLOT_Y. Anything scrolled to a
         negative window-y is clipped (above the slot) so the paper can never
         appear above the printer. The receipt FITS on screen for typical N, so
         the camera does a gentle FEED-DOWN, not an aggressive scroll. */
      const PRINTER_TOP    = 96;
      const PRINTER_BOTTOM = PRINTER_TOP + 188;      // 284
      const SLOT_Y         = PRINTER_BOTTOM - 22;    // ≈262 — window top
      // resting cam.y IN WINDOW COORDS: paper top sits ~30px below the slot so a
      // short leading margin shows, then the printed header/lines fill below it.
      const CAM_REST = 30;
      // place the window precisely (CSS has a static fallback)
      document.getElementById("paperWindow").style.top    = SLOT_Y + "px";
      document.getElementById("paperWindow").style.height = (1080 - SLOT_Y) + "px";

      /* head travel range (relative to slot center == stage center x) */
      const HEAD_LEFT  = -250;
      const HEAD_RIGHT =  250;

      /* ── HAND-CODED seeded jitter table (the "chatter"). 24 px constants,
         sampled by a time-derived index. NO RNG — fixed irregular pattern. ─ */
      const JITTER = [
        0.0, 1.4, -0.8, 2.1, -1.6, 0.6, 1.9, -2.2,
        0.9, -1.1, 1.7, -0.4, 2.3, -1.9, 0.3, 1.2,
        -2.0, 0.8, -1.3, 1.6, -0.6, 2.0, -1.5, 0.5
      ];
      function jitterAt(t) {
        const i = Math.floor(t * 60) % JITTER.length;        // 60 samples/sec
        const j = (Math.floor(t * 60) + 7) % JITTER.length;
        return { y: JITTER[i] * 0.9, x: JITTER[j] * 0.6 };
      }

      /* ── timing constants (the phase table) ──────────────────────────── */
      const T_HEADER_S = 0.45, T_HEADER_E = 1.05;
      const T_ITEMS_S  = 1.05, T_ITEMS_E  = 3.45;
      const ITEM_DUR   = (T_ITEMS_E - T_ITEMS_S) / Math.max(1, N);
      const T_TOTAL    = 3.45;
      const T_STAMP    = 4.20;
      const T_TEAR     = 4.95;
      const DUR        = 7.0;

      /* ── fit-to-frame budget ──────────────────────────────────────────────
         The window is WIN_H tall. We reserve a small LEAD margin below the slot
         (so a leading strip of paper shows) and a SAFE margin above the bottom
         edge (to absorb the end-of-take tear dolly + camera-kick shake). The
         FULL receipt — header + all rows + total + the stamp zone + perforation
         + footer — must fit inside what's left. For a tall (e.g. 9-item) receipt
         we DON'T scroll the climax off-screen; we uniformly SCALE the paper down
         (transform-origin: top center) so the whole thing — TOTAL, stamp, tear,
         footer — stays framed. A 2-item receipt renders at scale 1; a 9-item one
         shrinks just enough to fit. */
      const WIN_H = 1080 - SLOT_Y;                 // window height ≈818
      const LEAD  = 30;                            // lead strip below the slot
      const SAFE  = 48;                            // bottom safety (tear dolly + shake)
      const AVAIL = WIN_H - LEAD - SAFE;           // vertical budget for the paper ≈740

      /* geometry measured lazily; re-measured until fonts load.
         IMPORTANT: paperFullH is the NATURAL (unscaled) height — we reset the
         paper scale to 1 before measuring so the fit-scale never feeds back on
         itself, then re-apply fitScale. */
      let measured = false, rowTops = [], headerBottom = 0, paperFullH = 0, fitScale = 1;
      function measure() {
        gsap.set(paper, { scale: 1 });             // measure at natural size
        const bodyTop = pBody.getBoundingClientRect().top;
        rowTops = rowEls.map(r => r.row.getBoundingClientRect().top - bodyTop);
        headerBottom = ruleTop.getBoundingClientRect().bottom - bodyTop;
        paperFullH = paper.getBoundingClientRect().height;
        fitScale = paperFullH > 0 ? Math.min(1, AVAIL / paperFullH) : 1;
        gsap.set(paper, { scale: fitScale, transformOrigin: "top center" });
      }

      /* ── the single render(t): chatter + typing + leaders + camera ───── */
      function render(t) {
        if (!measured) { measure(); if (document.fonts.status === "loaded") measured = true; }

        /* --- print HEAD position + chatter --- */
        let headProg = 0, headOn = false;
        if (t < T_HEADER_S) {
          const k = clamp01(t / T_HEADER_S);
          const e = 1 - Math.pow(1 - k, 3);                 // outCubic spool-up
          gsap.set(head, { x: HEAD_RIGHT + (HEAD_LEFT - HEAD_RIGHT) * e, y: 0 });
        } else if (t < T_HEADER_E) {
          headOn = true;
          headProg = clamp01((t - T_HEADER_S) / (T_HEADER_E - T_HEADER_S));
        } else if (t >= T_ITEMS_S && t < T_ITEMS_E) {
          headOn = true;
          const local = (t - T_ITEMS_S) / ITEM_DUR;
          headProg = clamp01(local - Math.floor(local));    // resets each row
        }
        if (headOn) {
          const j = jitterAt(t);
          gsap.set(head, { x: HEAD_LEFT + (HEAD_RIGHT - HEAD_LEFT) * headProg + j.x, y: j.y });
        } else if (t >= T_HEADER_E && t < T_ITEMS_S) {
          gsap.set(head, { x: HEAD_LEFT, y: 0 });
        } else if (t >= T_ITEMS_E) {
          const k = clamp01((t - T_ITEMS_E) / 0.4);
          gsap.set(head, { x: HEAD_LEFT + (0 - HEAD_LEFT) * (1 - Math.pow(1 - k, 3)), y: 0 });
        }

        /* --- HEADER typing (dot-matrix store name) --- */
        if (t < T_HEADER_S) {
          pHeader.textContent = "";
        } else if (t < T_HEADER_E) {
          const shown = Math.floor(headProg * HEADER.length + 0.0001);
          pHeader.textContent = HEADER.slice(0, Math.min(HEADER.length, shown));
        } else {
          pHeader.textContent = HEADER;
        }

        /* --- ITEM rows: type label, grow leader, snap value --- */
        for (let k = 0; k < N; k++) {
          const r = rowEls[k];
          const rowStart = T_ITEMS_S + k * ITEM_DUR;
          const p = clamp01((t - rowStart) / ITEM_DUR);
          if (t < rowStart) {
            r.row.style.opacity = "0";
            r.lab.textContent = "";
            r.val.style.opacity = "0";
            gsap.set(r.lead, { scaleX: 0 });
            continue;
          }
          r.row.style.opacity = "1";
          const lp = clamp01(p / 0.55);                     // label types over first 55%
          const nshown = Math.floor(lp * r.item.label.length + 0.0001);
          r.lab.textContent = r.item.label.slice(0, Math.min(r.item.label.length, nshown));
          const ldp = clamp01((p - 0.45) / 0.45);           // leader grows 45%→90%
          gsap.set(r.lead, { scaleX: 1 - Math.pow(1 - ldp, 2) });   // outQuad
          if (p >= 0.9) { r.val.textContent = r.item.value; r.val.style.opacity = "1"; }
          else          { r.val.style.opacity = "0"; }
        }

        /* --- CAMERA: feed the SCALED paper DOWN out of the slot, then dolly ---
           The paper is fit-scaled (see measure()) so the WHOLE receipt — header,
           every row, TOTAL, stamp, perforation, footer — fits inside the window.
           So instead of scrolling the climax behind/below the frame, the paper
           feeds in to a framed REST position (top at LEAD) and DOLLIES DOWN
           gently as content prints (parallax that reads as the paper advancing).
           Content reveals line-by-line in place (row opacity), never clipped.
           camY is window-relative: window-y 0 == slot mouth.
              rest:  paper top at  LEAD;  paper bottom = LEAD + scaledH ≤ WIN_H-SAFE
           guaranteeing the footer/tear always clear the bottom of the frame for
           ANY item count (a 2-item OR a 9-item receipt both stay framed). */
        const scaledH = paperFullH * fitScale;                // on-screen paper height
        const restTop = LEAD;                                 // framed rest position
        const dollyRoom = Math.max(0, (WIN_H - SAFE) - (restTop + scaledH)); // spare slack
        const dolly = Math.min(28, dollyRoom);                // gentle feed-down ≤ slack
        const hiddenY = restTop - (scaledH + 60);             // fully above window → hidden
        // overall print progress 0..1 (header start → items end)
        const printP = clamp01((t - T_HEADER_S) / (T_ITEMS_E - T_HEADER_S));
        let camY;
        if (t < T_HEADER_S) {                                 // spool-up: nose paper in
          const k = 1 - Math.pow(1 - clamp01(t / T_HEADER_S), 3);   // outCubic
          camY = hiddenY + ((restTop - dolly) - hiddenY) * k; // arrives slightly high
        } else {
          // ease from the spool-in landing down to rest as printing completes,
          // then a touch further (within dollyRoom) as the total/tear reveal
          const e = printP < 0.5 ? 4*printP*printP*printP
                                 : 1 - Math.pow(-2*printP + 2, 3) / 2;   // inOutCubic
          camY = (restTop - dolly) + dolly * e;               // → restTop by items end
          if (t >= T_TEAR) {                                  // tear settle dolly-down
            const k = clamp01((t - T_TEAR) / 0.6);
            // never let the paper bottom cross the safety line
            const tearMax = Math.max(0, (WIN_H - SAFE) - (restTop + scaledH));
            camY += Math.min(22, tearMax) * (1 - Math.pow(1 - k, 3));
          }
        }
        cam.style.transform = `translate(-50%, ${camY.toFixed(1)}px)`;
      }

      /* ── INITIAL states (frame 0 = idle machine, no paper showing) ───── */
      gsap.set(paper, { y: 0 });
      rowEls.forEach(r => { r.row.style.opacity = "0"; r.val.style.opacity = "0";
        gsap.set(r.lead, { scaleX: 0 }); });
      gsap.set(totalRule, { scaleX: 0, transformOrigin: "left center" });
      gsap.set(totalRow,  { opacity: 0, y: 16 });
      gsap.set(stamp,     { opacity: 0, scale: 1.6, rotation: -8, y: -160,
                            xPercent: -50, yPercent: -50, transformOrigin: "center center" });
      gsap.set(perf,      { opacity: 0 });
      gsap.set(footer,    { opacity: 0, y: 14 });
      // paper starts fully retracted behind the printer; render(0) refines once measured
      cam.style.transform = `translate(-50%, ${(CAM_REST - 760)}px)`;
      gsap.set(head, { x: HEAD_RIGHT, y: 0 });                        // head off to the right

      /* camera kick on stamp impact — deterministic decaying sine */
      const shakeProxy = { s: 0 };
      function applyShake() {
        const s = shakeProxy.s;
        const dx = Math.sin(s * Math.PI * 6) * 5 * (1 - s);
        const dy = Math.cos(s * Math.PI * 5) * 4 * (1 - s);
        stage.style.transform =
          `translate(calc(-50% + ${dx.toFixed(2)}px), calc(-50% + ${dy.toFixed(2)}px))`;
      }

      /* ── PAUSED master timeline ──────────────────────────────────────── */
      const tl = gsap.timeline({ paused: true });

      const p = { t: 0 };
      tl.to(p, { t: DUR, duration: DUR, ease: "none",
                 onUpdate: () => render(p.t) }, 0);

      /* total rule draws + total row lands (overshoot settle) */
      tl.to(totalRule, { scaleX: 1, duration: 0.45, ease: "power3.out" }, T_TOTAL);
      tl.fromTo(totalRow, { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2.2)",
          immediateRender: false }, T_TOTAL + 0.12);

      /* stamp drops, rotated -8°, THUDS (overshoot then settle).
         xPercent/yPercent kept on every keyframe so the CSS centering holds. */
      tl.fromTo(stamp,
        { opacity: 0, scale: 1.6, rotation: -8, y: -160, xPercent: -50, yPercent: -50 },
        { opacity: 1, scale: 1.0, rotation: -8, y: 0, xPercent: -50, yPercent: -50,
          duration: 0.5, ease: "back.out(2.6)", immediateRender: false }, T_STAMP);
      tl.to(stamp, { scale: 1.07, duration: 0.10, ease: "power2.out",
                     overwrite: "auto" }, T_STAMP + 0.42);
      tl.to(stamp, { scale: 1.0,  duration: 0.22, ease: "power2.inOut",
                     overwrite: "auto" }, T_STAMP + 0.54);
      tl.fromTo(shakeProxy, { s: 0.001 },
        { s: 1, duration: 0.55, ease: "none", onUpdate: applyShake,
          immediateRender: false }, T_STAMP + 0.40);

      /* perforation fades in, torn strip CURLS away (steeper fold so the curl
         is clearly perceptible), footer rises */
      tl.to(perf, { opacity: 1, duration: 0.18, ease: "power1.out" }, T_TEAR);
      tl.fromTo(perf,
        { rotateX: 0, transformOrigin: "top center" },
        { rotateX: 70, duration: 0.6, ease: "power2.inOut", immediateRender: false }, T_TEAR + 0.05);
      tl.fromTo(footer, { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out",
          immediateRender: false }, T_TEAR + 0.30);

      tl.set({}, {}, DUR);    // hold composed frame to data-duration

      render(0);              // frame 0 = correct idle machine before any tween runs
      applyShake();           // stage centered at rest

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
