<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"logoSvg",     "type":"string","label":"Logo SVG markup (inline <svg>…</svg>; empty = designed default X mark)", "default":""},
  {"id":"tagline",     "type":"string","label":"Tagline (cascades in below the mark)", "default":"The editor for AI agents"},
  {"id":"kicker",      "type":"string","label":"Small kicker above the mark (empty = hidden)", "default":"XOTION"},
  {"id":"bgColor",     "type":"color", "label":"Background", "default":"#0b0b12"},
  {"id":"strokeColor", "type":"color", "label":"Logo stroke (draw) color", "default":"#7c5cff"},
  {"id":"fillColor",   "type":"color", "label":"Logo fill color (fades in as strokes finish)", "default":"#ffffff"},
  {"id":"shineColor",  "type":"color", "label":"Diagonal shine sweep color", "default":"#b9a6ff"},
  {"id":"inkColor",    "type":"color", "label":"Tagline / kicker text color", "default":"#e8e6f5"},
  {"id":"drawDuration","type":"string","label":"Stroke-draw duration (s)", "default":"1.3"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      LOGO STING REVEAL — the universal corporate logo sting.
      An SVG logo DRAWS its strokes in via dash-offset; the fill fades up as the
      strokes complete; the finished mark SQUASH-POPS to its final scale; a single
      diagonal SHINE sweeps across it once; then the tagline LETTER-CASCADES in
      below. A kicker line above and a soft accent glow frame the mark. Ends on a
      gentle loop-friendly breathing hold so it can play on repeat.

      IMAGE-type variable `logoSvg`: paste raw inline <svg>…</svg> (any paths).
      EVERY path inside is auto-prepared for the draw-then-fill effect — its own
      geometry length becomes the dash, fills are held at 0 then faded up. If
      logoSvg is empty (the DEFAULT), a designed Xotion "X" monogram mark is used,
      so the default render needs ZERO asset files.

      CHOREOGRAPHY — phase table (data-duration 6.0; motion ends ≈4.9s then holds):
      ┌─────────────────────────┬───────────────┬──────────────────┬────────────────────────────────────────────┐
      │ phase                   │ start–end (s) │ easing           │ what moves                                   │
      ├─────────────────────────┼───────────────┼──────────────────┼────────────────────────────────────────────┤
      │ 0 anticipation          │ 0.00–0.30     │ —                │ frame 0: dark stage, faint glow, mark at 0%  │
      │                         │               │                  │ stroke, fill hidden, kicker/tagline hidden   │
      │ 1 strokes draw          │ 0.30–0.30+D   │ none (linear)    │ proxy: every path dashoffset → 0 (D=drawDur) │
      │   glow swells           │ 0.30–1.80     │ sine.out         │ accent glow behind mark fades + scales up    │
      │   kicker rises          │ 0.45–1.05     │ power3.out       │ kicker letter-spaces open, y18→0, blur→0     │
      │ 2 fills fade            │ (draw end     │ power1.inOut     │ proxy: path fill-opacity 0→1 (trails strokes)│
      │                  …→+0.45│  −0.35 → end) │                  │                                              │
      │ 3 squash-pop            │ draw+0.10     │ custom squash    │ mark scaleY dips then over-pops to 1, tiny y │
      │                  ~1.85s │  …+0.55       │  (hand-tuned)    │ bounce; x widens as y dips (volume feel)     │
      │ 4 shine sweep (once)    │ pop+0.55      │ power2.inOut     │ diagonal highlight bar wipes L→R across mark │
      │                  ~2.45s │  …+0.55       │                  │ one time, clipped to the mark box            │
      │ 5 tagline cascade       │ shine+0.50    │ back.out(1.7)    │ each tagline char: y22→0, opacity, blur4→0,  │
      │                  ~2.95s │  per-char stag │  (stagger 0.035) │ rot-2→0 — left-to-right cascade              │
      │ 6 breathing hold (loop) │ ~4.9–6.0      │ sine.inOut       │ mark + glow gently scale 1→1.012→1 (1 finite │
      │                         │               │                  │ cycle) so the held frame never reads frozen  │
      └─────────────────────────┴───────────────┴──────────────────┴────────────────────────────────────────────┘

      Determinism contract: ONE paused master timeline. Per-frame values (stroke
      dashoffset, fill-opacity, shine wipe position, squash-pop) are driven by
      PROXY tweens whose onUpdate writes the styles. Discrete beats (kicker,
      tagline chars, breathing) are normal finite GSAP tweens on the same
      timeline. All DOM (paths, tagline char spans) is built at CONSTRUCTION time;
      tagline chars are pre-split into spans, never created in a callback. Every
      animated element gets its initial state via gsap.set before frame 0. Path
      dash-lengths come from getTotalLength() — pure SVG geometry, independent of
      font loading. No Math.random / Date / rAF / setTimeout / CSS transition /
      @keyframes / infinite repeat.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Syne"; font-weight:800;
        src:url("assets/fonts/syne-800.ttf") format("truetype"); }
      @font-face { font-family:"Syne"; font-weight:700;
        src:url("assets/fonts/syne-700.ttf") format("truetype"); }
      @font-face { font-family:"SpaceG"; font-weight:500;
        src:url("assets/fonts/space-grotesk-500.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; }
      /* centered stack: kicker · mark · tagline */
      .stack {
        position:absolute; left:50%; top:50%;
        transform:translate(-50%,-50%);
        display:flex; flex-direction:column; align-items:center;
        text-align:center;
      }
      .kicker {
        font-family:"SpaceG",sans-serif; font-weight:500;
        font-size:30px; text-transform:uppercase;
        margin-bottom:46px;
      }
      /* mark wrapper — the squash-pop + breathing transform live here */
      .markWrap {
        position:relative;
        width:340px; height:340px;
        display:flex; align-items:center; justify-content:center;
        will-change: transform;
      }
      .markWrap svg { display:block; width:100%; height:100%; overflow:visible; }
      /* soft accent glow behind the mark */
      .glow {
        position:absolute; left:50%; top:50%;
        width:480px; height:480px; border-radius:50%;
        transform:translate(-50%,-50%);
        pointer-events:none;
      }
      /* diagonal shine: a wide bright bar, rotated, wiped across via translateX.
         clipped to the mark box so it only lights the logo. */
      .shineClip {
        position:absolute; inset:0; overflow:hidden; pointer-events:none;
        border-radius:24px;
      }
      .shineBar {
        position:absolute; top:-40%; left:0;
        width:90px; height:180%;
        transform:rotate(18deg) translateX(-260px);
        filter:blur(10px);
        opacity:0;
      }
      .tagline {
        margin-top:56px;
        font-family:"Syne",sans-serif; font-weight:700;
        font-size:46px; letter-spacing:0.01em;
        line-height:1.15;
        max-width:1200px;            /* long taglines wrap, never clip */
      }
      .tagline .ch { display:inline-block; white-space:pre; will-change:transform; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.0" data-width="1920" data-height="1080">
      <div class="stack" id="stack">
        <div class="kicker" id="kicker"></div>
        <div class="markWrap" id="markWrap">
          <div class="glow" id="glow"></div>
          <div id="markHost"></div>
          <div class="shineClip">
            <div class="shineBar" id="shineBar"></div>
          </div>
        </div>
        <div class="tagline" id="tagline"></div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize a CSS hex color to 6-digit form so 2-digit alpha can be
         appended safely (#abc → #aabbcc, #rrggbbaa → #rrggbb) */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}

      const STROKE = hex6(V.strokeColor);
      const FILL   = hex6(V.fillColor);
      const SHINE  = hex6(V.shineColor);
      const ACCENT = STROKE;                 // glow uses the stroke accent

      const TAGLINE = String(V.tagline);
      const KICKER  = String(V.kicker);
      const DRAW    = Math.max(0.4, parseFloat(V.drawDuration) || 1.3);

      /* ── elements ───────────────────────────────────────────────────── */
      const root     = document.getElementById("root");
      const kicker   = document.getElementById("kicker");
      const markWrap = document.getElementById("markWrap");
      const glow     = document.getElementById("glow");
      const markHost = document.getElementById("markHost");
      const shineBar = document.getElementById("shineBar");
      const tagline  = document.getElementById("tagline");

      /* ── static styles from variables ───────────────────────────────── */
      document.body.style.background = V.bgColor;
      root.style.background = V.bgColor;
      kicker.style.color    = V.inkColor;
      tagline.style.color   = V.inkColor;
      glow.style.background  =
        `radial-gradient(circle, ${ACCENT}59 0%, ${ACCENT}26 38%, ${ACCENT}00 70%)`;
      shineBar.style.background =
        `linear-gradient(90deg, ${SHINE}00 0%, ${SHINE}cc 50%, ${SHINE}00 100%)`;

      /* ── the logo mark ──────────────────────────────────────────────── */
      /* DEFAULT (no logoSvg): designed Xotion "X" monogram — a rounded square
         badge with an X built from two diagonal strokes, drawable + fillable.
         Coordinates are in a 340×340 viewBox. */
      const DEFAULT_MARK = `
        <svg viewBox="0 0 340 340" fill="none">
          <rect class="lg-shape" x="34" y="34" width="272" height="272" rx="60"
                stroke-width="10"></rect>
          <path class="lg-shape" d="M112 112 L228 228" stroke-width="22"
                stroke-linecap="round"></path>
          <path class="lg-shape" d="M228 112 L112 228" stroke-width="22"
                stroke-linecap="round"></path>
        </svg>`;

      const userSvg = String(V.logoSvg).trim();
      markHost.innerHTML = userSvg ? userSvg : DEFAULT_MARK;

      const svgEl = markHost.querySelector("svg");
      if (svgEl) {
        svgEl.style.width = "100%";
        svgEl.style.height = "100%";
        svgEl.style.overflow = "visible";
      }

      /* collect every drawable shape inside the mark. For a user SVG we take all
         common shape elements; for the default we tagged them .lg-shape. */
      const SHAPE_SEL = "path,rect,circle,ellipse,polygon,polyline,line";
      const shapes = svgEl ? Array.from(svgEl.querySelectorAll(SHAPE_SEL)) : [];

      /* prepare each shape for draw-then-fill. Cache the fill target so a user
         logo keeps its own fills; default mark uses FILL/STROKE vars. */
      const shapeInfo = shapes.map(el => {
        let len = 0;
        try { len = el.getTotalLength(); } catch (e) { len = 0; }
        if (!len || !isFinite(len)) len = 1;
        const usesDefault = !userSvg;
        const strokeCol = usesDefault ? STROKE
                          : (el.getAttribute("stroke") || STROKE);
        const authorFill = el.getAttribute("fill");
        const isXPath = el.tagName.toLowerCase() === "path"; // default X strokes
        let fillTarget;
        if (usesDefault) {
          // the badge rect stays outline-only; the X paths fill solid
          fillTarget = isXPath ? FILL : "none";
        } else {
          fillTarget = (authorFill && authorFill !== "none") ? authorFill : FILL;
        }
        el.setAttribute("stroke", strokeCol);
        el.style.fill = "none";                 // start unfilled
        el.style.strokeDasharray  = len;
        el.style.strokeDashoffset = len;        // start fully un-drawn
        return { el, len, fillTarget };
      });

      /* ── kicker (small caps, letter-spaces open as it rises) ─────────── */
      kicker.textContent = KICKER;
      kicker.style.display = KICKER.trim() ? "block" : "none";

      /* ── tagline: pre-split into char spans at CONSTRUCTION time ─────── */
      const taglineChars = [];
      for (const c of TAGLINE) {
        const span = document.createElement("span");
        span.className = "ch";
        span.textContent = c === " " ? " " : c;
        tagline.appendChild(span);
        taglineChars.push(span);
      }

      /* ── timing constants (spec) ────────────────────────────────────── */
      const T_DRAW_START = 0.30;
      const T_DRAW_END   = T_DRAW_START + DRAW;          // strokes done
      const T_POP        = T_DRAW_END + 0.10;            // squash-pop
      const T_SHINE      = T_POP + 0.55;                 // shine after pop settles
      const T_TAG        = T_SHINE + 0.50;               // tagline cascade
      const T_TAG_END    = T_TAG + 0.035 * Math.max(1, taglineChars.length) + 0.6;
      const DUR          = 6.0;

      /* ── initial states — frame 0 is correct before any tween runs ──── */
      /* markWrap's transform is owned solely by drawMark() (raw string), so it
         is NOT handed to GSAP — only its origin is set here. */
      markWrap.style.transformOrigin = "50% 50%";
      gsap.set(glow,     { opacity: 0.10, scale: 0.6 });
      gsap.set(kicker,   { opacity: 0, y: 18, letterSpacing: "0.05em",
                           filter: "blur(5px)" });
      gsap.set(shineBar, { opacity: 0, x: -260 });
      gsap.set(taglineChars, { opacity: 0, y: 22, rotation: -2,
                               filter: "blur(4px)" });

      /* ── per-frame proxies: stroke draw + fill fade ─────────────────── */
      const drawP = { v: 0 };   // 0 → 1 stroke progress
      function drawStrokes() {
        const k = drawP.v;
        shapeInfo.forEach(s => {
          s.el.style.strokeDashoffset = (s.len * (1 - k)).toFixed(2);
        });
      }
      const fillP = { v: 0 };   // 0 → 1 fill opacity
      function drawFills() {
        const o = fillP.v;
        shapeInfo.forEach(s => {
          if (s.fillTarget !== "none") {
            s.el.style.fill = s.fillTarget;
            s.el.style.fillOpacity = o.toFixed(3);
          }
        });
      }
      drawStrokes();
      drawFills();

      /* ── custom squash-pop ease: dip narrow then over-pop, settle ───── */
      function squashY(t) {
        // t in [0,1]; scaleY multiplier. dip to 0.82 by ~0.3, overshoot to 1.06
        // by ~0.7, settle to 1.0. hand-tuned, deterministic.
        if (t < 0.30) return 1 - 0.18 * (t / 0.30);
        if (t < 0.70) {
          const u = (t - 0.30) / 0.40;
          return 0.82 + 0.24 * (1 - Math.pow(1 - u, 2)); // → 1.06
        }
        const u = (t - 0.70) / 0.30;
        return 1.06 - 0.06 * (1 - Math.pow(1 - u, 2));    // → 1.0
      }
      function squashX(t) {
        // x widens when y dips (volume-preserve feel), inverse-ish
        if (t < 0.30) return 1 + 0.10 * (t / 0.30);
        if (t < 0.70) {
          const u = (t - 0.30) / 0.40;
          return 1.10 - 0.13 * (1 - Math.pow(1 - u, 2));  // → 0.97
        }
        const u = (t - 0.70) / 0.30;
        return 0.97 + 0.03 * (1 - Math.pow(1 - u, 2));     // → 1.0
      }
      /* markWrap.style.transform has exactly ONE writer (drawMark) so the
         squash-pop and the loop-breathing never fight over the inline style.
         popP.t drives the squash-pop ease; breathP.v is the gentle hold breath. */
      const popP   = { t: 1 };   // 1 = settled (frame 0 shows the un-popped mark via opacity? no — scale starts at 1)
      const breathP = { v: 0 };  // 0 → small breathe amount → 0
      function drawMark() {
        const t  = popP.t;
        const br = 1 + breathP.v;   // breathing multiplier (≈1.000–1.012)
        markWrap.style.transform =
          `scaleX(${(squashX(t) * br).toFixed(4)}) ` +
          `scaleY(${(squashY(t) * br).toFixed(4)}) ` +
          `translateY(${(Math.sin(t * Math.PI) * -8).toFixed(2)}px)`;
      }
      drawMark();   // frame 0: mark at settled scale 1 (un-popped), no breath

      /* ── paused master timeline; HyperFrames seeks it ───────────────── */
      const tl = gsap.timeline({ paused: true });

      // PHASE 1 — strokes draw (linear proxy so dash advances evenly)
      tl.to(drawP, { v: 1, duration: DRAW, ease: "none",
                     onUpdate: drawStrokes }, T_DRAW_START);

      // glow swells in behind the mark as it draws
      tl.to(glow, { opacity: 0.85, scale: 1, duration: 1.5, ease: "sine.out" },
            T_DRAW_START);

      // kicker rises + opens
      tl.to(kicker, { opacity: 1, y: 0, letterSpacing: "0.34em",
                      filter: "blur(0px)", duration: 0.6, ease: "power3.out" },
            T_DRAW_START + 0.15);

      // PHASE 2 — fills fade up, trailing the end of the stroke draw
      tl.fromTo(fillP, { v: 0 }, { v: 1, duration: 0.80, ease: "power1.inOut",
                     immediateRender: false, onUpdate: drawFills },
            T_DRAW_END - 0.35);

      // PHASE 3 — squash-pop (proxy driving the hand-tuned ease)
      tl.fromTo(popP, { t: 0 }, { t: 1, duration: 0.55, ease: "none",
                     immediateRender: false, onUpdate: drawMark },
            T_POP);

      // PHASE 4 — diagonal shine sweep (once) across the mark
      tl.set(shineBar, { opacity: 1 }, T_SHINE);
      tl.fromTo(shineBar, { x: -260 }, { x: 430, duration: 0.55,
                     ease: "power2.inOut", immediateRender: false }, T_SHINE);
      tl.to(shineBar, { opacity: 0, duration: 0.12, ease: "power1.in" },
            T_SHINE + 0.50);

      // PHASE 5 — tagline letter cascade
      tl.to(taglineChars, { opacity: 1, y: 0, rotation: 0, filter: "blur(0px)",
                     duration: 0.55, ease: "back.out(1.7)",
                     stagger: 0.035 }, T_TAG);

      // PHASE 6 — breathing hold (ONE finite cycle, loop-friendly). The mark
      // breathes via breathP→drawMark (sole transform writer); the glow breathes
      // via its own GSAP scale (GSAP already owns the glow transform).
      tl.to(breathP, { v: 0.012, duration: 0.55, ease: "sine.inOut",
                     onUpdate: drawMark }, T_TAG_END + 0.10);
      tl.to(breathP, { v: 0.0, duration: 0.55, ease: "sine.inOut",
                     onUpdate: drawMark }, T_TAG_END + 0.65);
      tl.to(glow, { scale: 1.012, duration: 0.55, ease: "sine.inOut" },
            T_TAG_END + 0.10);
      tl.to(glow, { scale: 1.0, duration: 0.55, ease: "sine.inOut" },
            T_TAG_END + 0.65);

      // hold the final frame to the end of data-duration
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
