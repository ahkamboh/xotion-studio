<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAMBOJH — Channel Logo</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:'Play';src:url('assets/fonts/playfair-display-900.ttf');font-display:block}
@font-face{font-family:'Oswald';src:url('assets/fonts/oswald-500.ttf');font-weight:500;font-display:block}
@font-face{font-family:'Oswald';src:url('assets/fonts/oswald-600.ttf');font-weight:600;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:800px;height:800px;overflow:hidden;background:#000}
#root{position:relative;width:800px;height:800px;overflow:hidden;font-family:'Oswald',sans-serif}
.fill{position:absolute;inset:0;width:800px;height:800px}
#bg{background:radial-gradient(120% 120% at 50% 38%, #4a0f08 0%, #2a0805 36%, #140404 66%, #070202 100%)}
#grain{opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:360px}
#vig{box-shadow:inset 0 0 160px 30px rgba(0,0,0,.7)}
#emblem{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gold{background:linear-gradient(180deg,#fff3cf 0%,#f4d98a 42%,#c89244 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#mono{font-family:'Play';font-size:300px;line-height:.8;letter-spacing:-6px;
  filter:drop-shadow(0 0 30px rgba(255,170,70,.4)) drop-shadow(0 8px 24px rgba(0,0,0,.6));margin-top:-18px}
#word{font-family:'Oswald';font-weight:600;font-size:74px;letter-spacing:20px;padding-left:20px;margin-top:8px}
#sub{display:flex;align-items:center;gap:16px;margin-top:14px;font-family:'Oswald';font-weight:500;font-size:24px;letter-spacing:8px;color:#c9a35a}
#sub .ln{width:46px;height:1px;background:linear-gradient(90deg,transparent,#9c885a)}
#sub .ln.r{background:linear-gradient(90deg,#9c885a,transparent)}
#sub .dia{width:7px;height:7px;background:#e9c98a;transform:rotate(45deg);box-shadow:0 0 8px rgba(233,201,138,.7)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="800" data-height="800">
  <div id="bg" class="fill"></div>
  <div id="grain" class="fill"></div>
  <div id="vig" class="fill"></div>
  <!-- gold rings -->
  <svg class="fill" viewBox="0 0 800 800">
    <circle cx="400" cy="400" r="372" fill="none" stroke="#caa15e" stroke-width="3"/>
    <circle cx="400" cy="400" r="356" fill="none" stroke="#8a743f" stroke-width="1"/>
    <!-- top + bottom arc text -->
    <defs>
      <path id="topArc" d="M150 400 a250 250 0 0 1 500 0" fill="none"/>
      <path id="botArc" d="M170 400 a230 230 0 0 0 460 0" fill="none"/>
    </defs>
    <text font-family="Oswald" font-weight="600" font-size="26" letter-spacing="11" fill="#d8cfba"><textPath href="#topArc" startOffset="20%">OFFICIAL · MUSIC</textPath></text>
    <text font-family="Oswald" font-weight="500" font-size="22" letter-spacing="9" fill="#bfae84"><textPath href="#botArc" startOffset="27%">EST · MMXXVI</textPath></text>
  </svg>
  <!-- emblem stack -->
  <div id="emblem">
    <div id="mono" class="gold">K</div>
    <div id="word" class="gold">KAMBOJH</div>
    <div id="sub"><span class="ln"></span><span class="dia"></span>RECORDS<span class="dia"></span><span class="ln r"></span></div>
  </div>
</div>
<script>const tl=gsap.timeline({paused:true});window.__timelines={main:tl};tl.to({},{duration:1});tl.pause(0);</script>
</body>
</html>
