<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"sentenceText",  "type":"string","label":"Sentence (full line of copy)",                         "default":"Ship the agent, not the boilerplate."},
  {"id":"highlightWords","type":"string","label":"Words to highlight (pipe-separated, must appear in sentence)","default":"agent|boilerplate"},
  {"id":"markerColor",   "type":"color", "label":"Marker / highlighter ink",                              "default":"#ffd60a"},
  {"id":"strokeStyle",   "type":"string","label":"Stroke style: marker | underline | scribble",           "default":"marker"},
  {"id":"sweepSpeed",    "type":"string","label":"Seconds per marker sweep (0.4 fast .. 0.9 slow)",        "default":"0.62"},
  {"id":"textColor",     "type":"color", "label":"Sentence text color",                                    "default":"#0b0b0c"},
  {"id":"popColor",      "type":"color", "label":"Highlighted-word color (sits ON the marker)",            "default":"#0b0b0c"},
  {"id":"annotation",    "type":"string","label":"Handwritten margin note (empty = hide)",                 "default":"the editor for AI agents"},
  {"id":"bg",            "type":"color", "label":"Background",                                              "default":"#fbfaf7"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      HIGHLIGHTER SWIPE — a hand-drawn marker stroke sweeps behind each keyword,
      then the highlighted word dials its weight UP to pop off the ink.

      A short line of copy sits centered. The sentence is split into words; the
      ones named in `highlightWords` each get a rough-edged SVG marker stroke
      sitting BEHIND them (mix-blend-mode:multiply, so it reads like real
      translucent highlighter over the letters). Each marker is REVEALED left→
      right by animating stroke-dashoffset, and overshoots ~6px past the word
      then settles back — the hand-drawn "end wobble". The instant a marker
      lands, its word animates font-weight 700→800 (+ a tiny scale punch and a
      shift to `popColor`) so the keyword pops off the stroke. Markers fire in
      reading order, one after another. Then an optional handwritten margin note
      (Caveat) scribbles in below, and the whole composition breathes on a slow
      sine into a loop-friendly hold.

      THREE STROKE STYLES (variable `strokeStyle`):
        marker     — fat translucent felt-tip band behind the word (default)
        underline  — a single rough marker line under the word
        scribble   — a back-and-forth double pass under the word

      ENCODING / VARIABLES
        sentenceText   — the full line. Any length: it wraps freely (as many lines
                         as needed), the block is width-capped (max 1500px) and
                         centered. A VERTICAL AUTOFIT pass measures the laid-out
                         stage height (sentence + note) and scales the whole stage
                         down to fit a 1000px budget of the 1080 frame, so a long
                         multi-line block (or a long annotation) never clips top
                         or bottom — see the "VERTICAL AUTOFIT" block in the script.
        highlightWords — PIPE-separated list ("agent|boilerplate"). Matching is
                         case-insensitive and ignores trailing punctuation, so
                         "boilerplate." in the sentence still matches "boilerplate".
                         Words not found are silently skipped (robust to typos).
        markerColor    — highlighter ink (hex). Used at ~0.62 alpha for marker
                         band, full for underline/scribble.
        strokeStyle    — marker | underline | scribble (see above).
        sweepSpeed     — seconds for ONE marker to draw (0.4 snappy .. 0.9 lazy).
                         Auto-shortened if many keywords would otherwise run the
                         choreography past the clip (so every sweep + the note fit).
        textColor      — base sentence color.
        popColor       — color a word becomes once highlighted (defaults same as
                         textColor → the pop is weight+scale only, very clean).
        annotation     — handwritten note under the line; empty string hides it.
        bg             — page background (a warm off-white reads like paper).

      PHASE TABLE (data-duration 7.5 — final frame HOLDS, loop-friendly)
        The per-sweep duration is auto-COMPRESSED if the keyword count × sweepSpeed
        would push the last sweep + note past the clip; with the default 2 keywords
        nothing compresses. Every phase (incl. the last marker + the note) always
        finishes by DUR-HOLD so no spec phase is ever cut off.
        phase                 | start–end (s) | easing             | what moves
        0  open               | 0.00          | —                  | full sentence in base weight, NO markers (svg hidden), cam 1.04
        1  settle-in          | 0.00–0.60     | power3.out         | sentence rises (y18→0, blur4→0); cam eases 1.04→1.0 over whole clip
        2  marker sweep #1    | 0.70 .. +S    | power2.inOut + wob | keyword-1 marker draws L→R (dashoffset), end overshoots ~6px & settles
        3  word pop #1        | (sweep end-.15)| power2.out        | word-1 weight 700→800, scale 1→1.06→1, color→popColor
        4  marker sweep #2    | after #1      | power2.inOut + wob | keyword-2 marker draws
        5  word pop #2        | …             | power2.out         | word-2 pops
        6  marker sweep #3..N | after prev    | power2.inOut + wob | each remaining keyword in reading order
        7  word pop #3..N     | …             | power2.out         | each remaining keyword pops
        8  handwritten note   | +0.18 after   | power3.out         | Caveat margin note fades up + squiggle draws below the line
        9  breathing hold     | …–6.50        | sine (proxy)       | whole stage breathes scale 1→1.008→1 — loop-friendly settle

      DETERMINISM CONTRACT
        ONE paused master timeline (window.__timelines.main / window.__timeline).
        Per-frame work (marker dashoffset reveal + end wobble + slow breathing)
        is driven by a SINGLE proxy {t} tween's onUpdate → renderMarkers(t), so
        the renderer can seek any frame exactly. Discrete word-pops are normal
        GSAP tweens on the same paused timeline. ALL DOM (every word span + every
        marker svg + the note) is built at CONSTRUCTION time from the variables;
        nothing is created inside a callback. Word/marker geometry is measured
        LAZILY in the first onUpdate and only CACHED once document.fonts is
        loaded (re-measured each frame until then) so the marker always matches
        the real glyph box regardless of font-load timing. No Math.random, no
        Date, no rAF, no setTimeout, no CSS transition/keyframes, no infinite
        repeats — the only "wobble" is a hand-coded sine, fully reproducible.
        Frame 0 is the correct opening state (renderMarkers(0) + gsap.set run at
        boot). IMAGE-type variables: none — the marker, note and paper texture
        are all drawn in CSS/SVG, so the default render needs zero asset files.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Bricolage"; font-weight:400;
        src:url("assets/fonts/bricolage-grotesque-400.ttf") format("truetype"); }
      @font-face { font-family:"Bricolage"; font-weight:700;
        src:url("assets/fonts/bricolage-grotesque-700.ttf") format("truetype"); }
      @font-face { font-family:"Bricolage"; font-weight:800;
        src:url("assets/fonts/bricolage-grotesque-800.ttf") format("truetype"); }
      @font-face { font-family:"Caveat"; font-weight:700;
        src:url("assets/fonts/caveat-700.ttf") format("truetype"); }

      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; }

      /* faint paper grain so the bg never reads as a flat AI fill */
      #root::before {
        content:""; position:absolute; inset:0; pointer-events:none; opacity:0.5;
        background-image:
          radial-gradient(circle at 18% 24%, rgba(0,0,0,0.035) 0 1px, transparent 1.4px),
          radial-gradient(circle at 62% 71%, rgba(0,0,0,0.03) 0 1px, transparent 1.4px),
          radial-gradient(circle at 84% 38%, rgba(0,0,0,0.028) 0 1px, transparent 1.4px);
        background-size: 7px 7px, 11px 11px, 9px 9px;
      }

      /* camera: one transform on this wrapper (gsap owns it) */
      .cam { position:absolute; left:50%; top:50%; will-change:transform; }

      .stage {
        position:relative;
        width:1500px;            /* width-capped block; sentence wraps inside */
        text-align:center;
        font-family:"Bricolage", sans-serif;
        will-change:transform;
      }

      .sentence {
        font-weight:700;
        font-size:118px;
        line-height:1.34;        /* generous so the marker band never touches the next line */
        letter-spacing:-0.018em;
        max-width:1500px;
      }

      /* each word is its own positioning context so its marker can sit behind it */
      .word {
        position:relative;
        display:inline-block;
        white-space:nowrap;
        padding:0 2px;           /* tiny breathing room between words */
      }
      .word .glyph { position:relative; z-index:2; display:inline-block; }

      /* the marker svg lives BEHIND the glyph and multiplies onto it like real ink */
      .word .mark {
        position:absolute;
        left:50%; top:50%;
        transform:translate(-50%,-50%);
        z-index:1;
        pointer-events:none;
        mix-blend-mode:multiply;
        overflow:visible;
      }
      .word .mark path { fill:none; stroke-linecap:round; stroke-linejoin:round; }

      /* handwritten margin note */
      .note {
        margin-top:44px;
        font-family:"Caveat", cursive;
        font-weight:700;
        font-size:60px;
        letter-spacing:0.01em;
        display:inline-block;
        position:relative;
      }
      .note .squiggle { position:absolute; left:-30px; bottom:-20px; width:calc(100% + 60px); height:30px; overflow:visible; }
      .note .squiggle path { fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.5" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <div class="stage" id="stage">
          <div class="sentence autofitBig" id="sentence"></div>
          <div class="note" id="note"><span class="noteText" id="noteText"></span></div>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize a CSS hex color to 6-digit form so 2-digit alpha can be
         appended safely (#abc → #aabbcc, #rrggbbaa → #rrggbb) */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}

      const SVGNS = "http://www.w3.org/2000/svg";

      /* ── parameters ─────────────────────────────────────────────────── */
      const SENTENCE = String(V.sentenceText || "").trim() || "Ship the agent, not the boilerplate.";
      const MARKER   = hex6(V.markerColor || "#ffd60a");
      const TEXTCOL  = V.textColor || "#0b0b0c";
      const POPCOL   = V.popColor  || TEXTCOL;
      const BG       = V.bg || "#fbfaf7";
      const STYLE    = (String(V.strokeStyle || "marker").toLowerCase().trim());
      const S        = Math.max(0.30, Math.min(1.2, parseFloat(V.sweepSpeed) || 0.62)); // seconds / sweep
      const NOTE     = String(V.annotation || "").trim();

      /* highlight set — case-insensitive, punctuation-stripped */
      const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
      const HL = new Set(
        String(V.highlightWords || "")
          .split("|").map(s => norm(s)).filter(Boolean)
      );

      /* ── elements ───────────────────────────────────────────────────── */
      const root     = document.getElementById("root");
      const cam      = document.getElementById("cam");
      const stage    = document.getElementById("stage");
      const sentence = document.getElementById("sentence");
      const noteEl    = document.getElementById("note");
      const noteText  = document.getElementById("noteText");

      document.body.style.background = root.style.background = BG;
      sentence.style.color = TEXTCOL;
      noteEl.style.color = MARKER;   /* the note ink matches the marker */

      /* ── BUILD all DOM at construction time ─────────────────────────── */
      /* split the sentence into words; each becomes a .word span. Highlighted
         words get a backing marker svg (path geometry sized after measurement). */
      const words = SENTENCE.split(/(\s+)/); // keep whitespace tokens for spacing
      const markEntries = [];                // {wordEl, glyph, svg, path, order}
      let order = 0;
      words.forEach(tok => {
        if (/^\s+$/.test(tok) || tok === "") {
          if (/^\s+$/.test(tok)) sentence.appendChild(document.createTextNode(" "));
          return;
        }
        const wordEl = document.createElement("span");
        wordEl.className = "word";
        const glyph = document.createElement("span");
        glyph.className = "glyph";
        glyph.textContent = tok;
        glyph.style.fontWeight = "700";
        const isHL = HL.has(norm(tok));
        if (isHL) {
          const svg = document.createElementNS(SVGNS, "svg");
          svg.setAttribute("class", "mark");
          const path = document.createElementNS(SVGNS, "path");
          svg.appendChild(path);
          wordEl.appendChild(svg);           // behind (z-index:1)
          markEntries.push({ wordEl, glyph, svg, path, order: order++, measured:false, len:1 });
        }
        wordEl.appendChild(glyph);
        sentence.appendChild(wordEl);
      });

      /* handwritten note (built now; revealed later). Empty → hidden entirely. */
      let noteSquigglePath = null;
      if (NOTE) {
        noteText.textContent = NOTE;
        const sq = document.createElementNS(SVGNS, "svg");
        sq.setAttribute("class", "squiggle");
        sq.setAttribute("preserveAspectRatio", "none");
        noteSquigglePath = document.createElementNS(SVGNS, "path");
        noteSquigglePath.setAttribute("stroke", MARKER);
        noteSquigglePath.setAttribute("stroke-width", "5");
        noteSquigglePath.setAttribute("fill", "none");
        noteSquigglePath.setAttribute("stroke-linecap", "round");
        sq.appendChild(noteSquigglePath);
        noteEl.appendChild(sq);
      } else {
        noteEl.style.display = "none";
      }

      /* ── marker path geometry (depends on word box; built per style) ──── */
      /* Returns an SVG path string for a rough marker behind a box of size
         w×h, plus the svg viewBox dims. Hand-coded "rough" jitter via a small
         constant table (NOT random) so edges look felt-tip, not vector-clean. */
      const JIT = [0.0, 1.6, -1.1, 0.8, -1.7, 1.2, -0.6, 1.9, -1.3, 0.5]; // px wobble table

      function buildMarkerPath(style, w, h) {
        const padX = 16;                       // marker overshoots the glyph box
        const W = w + padX * 2;
        if (style === "underline") {
          const H = Math.max(26, h * 0.34);
          const y = H * 0.55;
          let d = `M ${4} ${(y + JIT[0]).toFixed(1)}`;
          const seg = 5;
          for (let i = 1; i <= seg; i++) {
            const x = 4 + (W - 8) * (i / seg);
            d += ` L ${x.toFixed(1)} ${(y + JIT[i % JIT.length]).toFixed(1)}`;
          }
          return { d, W, H, sw: Math.max(10, h * 0.12), alpha: 1.0, cap:"round" };
        }
        if (style === "scribble") {
          // a back-and-forth DOUBLE pass UNDER the word: the svg is anchored at the
          // word's vertical center (translate(-50%,-50%)), so to sit the scribble
          // below the glyphs the path must live in the LOWER band of a box tall
          // enough to span the full glyph height plus an underline gap. Both passes
          // therefore sit at y > h (below the baseline region), never through it.
          const gap = Math.max(8, h * 0.10);        // clearance below the glyph box
          const band = Math.max(14, h * 0.16);      // vertical span of the two passes
          const H = h + gap + band + 8;             // tall box; center matches the word
          const yLow = h + gap + band;              // forward pass (lowest line)
          const yHigh = h + gap;                    // back pass (upper of the two, still under glyphs)
          const seg = 6;
          let d = `M ${4} ${(yLow + JIT[0]).toFixed(1)}`;
          for (let i = 1; i <= seg; i++) {          // forward pass low
            const x = 4 + (W - 8) * (i / seg);
            d += ` L ${x.toFixed(1)} ${(yLow + JIT[i % JIT.length]).toFixed(1)}`;
          }
          for (let i = 1; i <= seg; i++) {          // back pass higher (double-scribble), still below glyphs
            const x = (W - 4) - (W - 8) * (i / seg);
            d += ` L ${x.toFixed(1)} ${(yHigh + JIT[(i + 3) % JIT.length]).toFixed(1)}`;
          }
          return { d, W, H, sw: Math.max(8, h * 0.085), alpha: 0.92, cap:"round" };
        }
        // default: marker — a fat felt-tip band centered behind the word
        const H = Math.max(h * 0.80, 60);
        const y = H * 0.52;
        const seg = 5;
        let d = `M ${10} ${(y + JIT[0]).toFixed(1)}`;
        for (let i = 1; i <= seg; i++) {
          const x = 10 + (W - 20) * (i / seg);
          d += ` L ${x.toFixed(1)} ${(y + JIT[i % JIT.length]).toFixed(1)}`;
        }
        return { d, W, H, sw: H * 0.86, alpha: 0.62, cap:"round" };
      }

      /* measure a word's glyph box and (re)build its marker svg/path to fit.
         Returns true once measurement is trustworthy (non-zero box). */
      function measureMark(e) {
        // offsetWidth/Height are the laid-out (pre-transform) glyph box — the
        // marker svg lives inside the same scaled stage, so building it against
        // the UNSCALED box keeps it aligned no matter the vertical-autofit scale
        // (getBoundingClientRect would shrink with fitScale and mis-size the band)
        const w = e.glyph.offsetWidth, h = e.glyph.offsetHeight;
        if (!w || !h) return false;
        const geo = buildMarkerPath(STYLE, w, h);
        e.svg.setAttribute("viewBox", `0 0 ${geo.W} ${geo.H}`);
        e.svg.setAttribute("width", geo.W);
        e.svg.setAttribute("height", geo.H);
        e.path.setAttribute("d", geo.d);
        e.path.setAttribute("stroke", MARKER);
        e.path.setAttribute("stroke-width", geo.sw);
        e.path.setAttribute("stroke-linecap", geo.cap);
        // opacity is driven PER-FRAME in renderMarkers (0 before the sweep starts,
        // geo.alpha once drawing begins) — a fat round-capped stroke would otherwise
        // paint its start-cap as a visible dot at t=0 even when fully dash-offset.
        e.svg.style.opacity = 0;
        const len = e.path.getTotalLength() || 1;
        e.path.style.strokeDasharray = len;
        e.len = len;
        e.geo = geo;
        return true;
      }

      /* ── timing (spec) ──────────────────────────────────────────────── */
      /* DUR is FIXED (matches data-duration). The choreography is sized to FIT it:
         with an arbitrary-length highlightWords list and a slow sweepSpeed the
         natural end can run past DUR, which would drop the last keyword's marker
         and the whole annotation phase. So we compute the per-sweep duration S
         that makes the LAST visual change (note fade-out, or last sweep if no
         note) land at DUR - HOLD, leaving a loop-friendly breathing hold. When the
         natural timing already fits, S is left exactly as the user asked. */
      const DUR         = 7.5;           // == data-duration on #root
      const HOLD        = 0.45;          // min hold after the last visual change (breathing/loop)
      const SETTLE_DUR  = 0.60;
      const FIRST_SWEEP = 0.70;          // first marker begins
      const GAP_FACTOR  = 0.42;          // GAP = S * GAP_FACTOR (overlap between sweeps)
      const POP_LEAD    = 0.15;          // word pops as the marker is finishing
      const POP_DUR     = 0.34;
      const NOTE_DUR    = 0.70;
      const N           = markEntries.length;

      // sweepFactor: lastSweepEnd = FIRST_SWEEP + S*(N + (N-1)*GAP_FACTOR)
      const SWEEP_FACTOR = N ? (N + (N - 1) * GAP_FACTOR) : 0;
      const NOTE_TAIL    = NOTE ? (0.18 + NOTE_DUR) : 0;     // note fade after last sweep
      const BUDGET       = DUR - HOLD;
      const naturalEnd   = FIRST_SWEEP + S * SWEEP_FACTOR + NOTE_TAIL;
      // compress the sweep duration only if the natural choreography overruns DUR
      const SW = (naturalEnd > BUDGET && SWEEP_FACTOR > 0)
        ? Math.max(0.04, (BUDGET - FIRST_SWEEP - NOTE_TAIL) / SWEEP_FACTOR)
        : S;
      const GAP          = SW * GAP_FACTOR;

      const sweepStart   = i => FIRST_SWEEP + i * (SW + GAP);
      const lastSweepEnd = N ? sweepStart(N - 1) + SW : FIRST_SWEEP;
      const NOTE_AT      = lastSweepEnd + 0.18;
      const BREATHE_START = (NOTE ? NOTE_AT + NOTE_DUR : lastSweepEnd) + 0.10;

      /* end-of-stroke wobble: a damped sine that overshoots ~6px then settles,
         applied as a tiny X offset on the marker svg as it finishes drawing.
         Pure function of local progress k. */
      function wobble(k) {
        if (k <= 1.0) return 0;
        const o = k - 1.0;                          // overshoot tail
        return 6 * Math.sin(o * Math.PI * 3) * Math.exp(-o * 6);
      }

      /* ── VERTICAL AUTOFIT ──────────────────────────────────────────────
         sentenceText / annotation are arbitrary-length — a long block (many
         wrapped lines + a 2-line note) is taller than the 1080 frame and would
         CLIP at the top/bottom (the block is centered by the cam, so it grows
         off BOTH edges). So we measure the stage's UNSCALED layout height
         (offsetHeight — transform-independent) against a vertical budget and,
         if it overruns, compute a single scale factor that shrinks the whole
         stage to fit. The factor multiplies into the stage transform (alongside
         the breathing) so the block always fits inside the frame regardless of
         copy length. Re-measured every frame until fonts load (a font swap
         changes wrapping → height), then CACHED — same discipline as markers. */
      const FIT_BUDGET = 1000;     // px of the 1080 frame the content may occupy (40px top+bottom safe)
      let fitScale = 1;            // <=1; shrinks long blocks to fit vertically
      let fitCached = false;

      function measureFit() {
        // offsetHeight is the laid-out (pre-transform) box height of the stage,
        // so it is unaffected by the scale we apply in the stage transform.
        const h = stage.offsetHeight;
        if (!h) return false;      // not laid out yet
        fitScale = h > FIT_BUDGET ? Math.max(0.2, FIT_BUDGET / h) : 1;
        return true;
      }
      measureFit();                // frame-0 fit before any render

      /* ── the single proxy render: marker reveal + wobble + breathing ──── */
      const p = { t: 0 };

      function renderMarkers(t) {
        const fontsReady = document.fonts && document.fonts.status === "loaded";
        // recompute the vertical-fit scale until fonts settle (wrapping/height
        // can shift when the real face loads), then cache it
        if (!fitCached) {
          const ok = measureFit();
          if (ok && fontsReady) fitCached = true;
        }
        for (const e of markEntries) {
          if (!e.measured) {                        // measure lazily; cache once fonts loaded
            const ok = measureMark(e);
            if (ok && fontsReady) e.measured = true;
            if (!ok) continue;
          }
          const t0 = sweepStart(e.order);
          const local = (t - t0) / SW;
          const reveal = Math.max(0, Math.min(1, local));
          // marker is INVISIBLE until its sweep begins — kills the round-cap dot at t=0
          // (phase 0 requires the full sentence in base weight with NO markers shown)
          e.svg.style.opacity = reveal > 0 ? (e.geo ? e.geo.alpha : 0.62) : 0;
          // power2.inOut draw — felt-tip accelerates then eases
          const k = reveal < 0.5 ? 2 * reveal * reveal : 1 - Math.pow(-2 * reveal + 2, 2) / 2;
          e.path.style.strokeDashoffset = (e.len * (1 - k)).toFixed(2);
          const wob = wobble(local);                // hand-drawn end wobble
          e.svg.style.transform = `translate(calc(-50% + ${wob.toFixed(2)}px), -50%)`;
        }

        // slow breathing of the whole stage during the hold (sine, finite)
        let breeze = 1;
        if (t >= BREATHE_START) {
          breeze = 1 + 0.008 * Math.sin((t - BREATHE_START) * Math.PI * 0.9);
        }
        // fold the vertical-autofit factor in with the breathing — one transform
        // owner per element. fitScale<=1 keeps a long block inside the 1080 frame.
        stage.style.transform = `scale(${(breeze * fitScale).toFixed(4)})`;
      }

      /* ── initial states — frame 0 correct before any tween runs ──────── */
      gsap.set(cam, { xPercent: -50, yPercent: -50, scale: 1.04 });
      // sentence is PRESENT at frame 0 (autoAlpha 1) — it only lifts + de-blurs,
      // so the opening frame is never blank (a blank poster/loop frame reads as broken)
      gsap.set(sentence, { y: 18, autoAlpha: 1, filter: "blur(6px)" });
      markEntries.forEach(e => {                     // every marker starts hidden
        measureMark(e);
        e.path.style.strokeDashoffset = e.len;
      });
      if (NOTE) gsap.set(noteEl, { autoAlpha: 0, y: 14 });

      /* ── master timeline (paused; HyperFrames seeks it) ─────────────── */
      const tl = gsap.timeline({ paused: true });

      // camera ease across the whole clip
      tl.fromTo(cam, { scale: 1.04 }, { scale: 1.0, duration: DUR, ease: "none" }, 0);

      // PHASE 1 — sentence settles in (lift + de-blur; already visible at t=0)
      tl.to(sentence, { y: 0, filter: "blur(0px)",
                        duration: SETTLE_DUR, ease: "power3.out" }, 0);

      // per-frame marker proxy spans the WHOLE clip (so seeking any frame is exact)
      tl.to(p, { t: DUR, duration: DUR, ease: "none",
                 onUpdate: () => renderMarkers(p.t) }, 0);

      // PHASES 2..7 — each highlighted word POPS as its marker lands (discrete tweens)
      markEntries.forEach(e => {
        const popAt = sweepStart(e.order) + SW - POP_LEAD;
        tl.to(e.glyph, { fontWeight: 800, color: POPCOL,
                         duration: POP_DUR, ease: "power2.out" }, popAt);
        tl.fromTo(e.glyph, { scale: 1 }, { scale: 1.06, duration: POP_DUR * 0.5,
                         ease: "power2.out", immediateRender: false }, popAt);
        tl.to(e.glyph, { scale: 1, duration: POP_DUR * 0.5, ease: "power2.inOut" },
                         popAt + POP_DUR * 0.5);
      });

      // PHASE 8 — handwritten margin note fades up
      if (NOTE) {
        tl.to(noteEl, { autoAlpha: 1, y: 0, duration: NOTE_DUR * 0.6,
                        ease: "power3.out" }, NOTE_AT);
      }

      // hold the final frame to the end of data-duration
      tl.set({}, {}, DUR);

      /* once fonts settle, re-measure every marker AND lay out the note squiggle
         so geometry matches the real glyph boxes, then refresh the current frame */
      function finalizeGeometry() {
        markEntries.forEach(e => { measureMark(e); e.measured = true; });
        if (NOTE && noteSquigglePath) {
          // offsetWidth is the laid-out (pre-transform) text width — safe even
          // when the stage is already scaled by the vertical-autofit factor
          const w = Math.max(60, noteText.offsetWidth);
          const W = w + 60, H = 30;
          let d = `M 2 ${(20 + JIT[0]).toFixed(1)}`;
          const seg = 7;
          for (let i = 1; i <= seg; i++) {
            const x = 2 + (W - 4) * (i / seg);
            const y = 18 + (i % 2 === 0 ? -4 : 5) + JIT[i % JIT.length] * 0.6;
            d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
          }
          const sq = noteSquigglePath.parentNode;
          sq.setAttribute("viewBox", `0 0 ${W} ${H}`);
          noteSquigglePath.setAttribute("d", d);
          const slen = noteSquigglePath.getTotalLength() || 1;
          noteSquigglePath.style.strokeDasharray = slen;
          tl.fromTo(noteSquigglePath, { strokeDashoffset: slen },
                    { strokeDashoffset: 0, duration: 0.5, ease: "power2.out",
                      immediateRender: false }, NOTE_AT + NOTE_DUR * 0.35);
        }
        // lock the vertical-autofit scale to the real-font layout height
        measureFit();
        fitCached = true;
        renderMarkers(p.t);
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(finalizeGeometry);
      } else {
        finalizeGeometry();
      }

      renderMarkers(0);   // frame 0 styled immediately

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
