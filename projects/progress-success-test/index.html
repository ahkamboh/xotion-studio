<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"label",     "type":"string","label":"Progress label",  "default":"Rendering launch-video.mp4"},
  {"id":"doneLabel", "type":"string","label":"Done label",      "default":"Ready — 4K · 24s"},
  {"id":"accent",    "type":"color", "label":"Accent",          "default":"#22c55e"},
  {"id":"barBg",     "type":"color", "label":"Bar track",       "default":"#e5e7eb"},
  {"id":"bg",        "type":"color", "label":"Background",      "default":"#ffffff"},
  {"id":"ink",       "type":"color", "label":"Text color",      "default":"#0a0a0a"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      PROGRESS → SUCCESS — a loading bar fills with realistic hesitation, then
      morphs into a success check with a deterministic confetti burst.
      Centered 760px column: label (left) + live percent (right, tabular-nums)
      over an 18px rounded track. The fill is driven by ONE proxy {v} so the
      percent text and the bar scaleX can never drift apart; the text shows
      Math.floor(v) so it never reads ahead of the fill (final tween ends at
      exactly v=100, so the done state still prints "100%").

      Slot-driven via data-composition-variables:
        label      — progress row text        (default "Rendering launch-video.mp4")
        doneLabel  — success line under check (default "Ready — 4K · 24s")
        accent     — fill / circle / confetti (default #22c55e)
        barBg      — track background         (default #e5e7eb)
        bg / ink   — page background / text

      TIMING (data-duration 5.0 — the final frame HOLDS to 5.0s):
        0.00–0.25  anticipation beat: full layout visible at 0%, nothing moves
        0.25→0.80  0→35%   power2.out   (fast optimistic start)
        0.80→1.70  35→62%  power1.inOut (settling down)
        1.70→2.15  HOLD at 62%          (the realistic stall)
        2.15→2.85  62→100% power3.in    (rush to the finish)
        2.85       MORPH: bar+label+percent scale/fade out
        2.90       accent circle pops in (scale 0→1, back.out(1.8))
        3.00       12-dot confetti burst (hand-coded vector table)
        3.15       checkmark draws (dashoffset→0, 0.35s)
        3.30       doneLabel rises in (y18→0, blur 4→0)
        0.00→5.00  camera push 1.05→1.0 across the whole clip

      Determinism contract: ONE paused master timeline; progress is chained
      proxy tweens whose onUpdate writes BOTH fill scaleX and percent text;
      confetti vectors come from a HAND-CODED table (angles 0..330 step 30,
      dists alternating 95/130/150, fixed sizes + 0–0.08s delays) — no
      Math.random, no Date, no rAF, no CSS transitions/keyframes, no infinite
      repeats. All DOM (including the 12 dots) is built at construction time;
      every animated element gets its initial state via gsap.set before frame 0.
      The checkmark dash length comes from getTotalLength() at construction
      (pure SVG geometry — independent of font loading).
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Inter"; font-weight:500;
        src:url("assets/fonts/inter-500.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; }
      /* the camera: one transform on this wrapper (gsap owns it) */
      .cam {
        position:absolute; left:50%; top:50%;
        will-change: transform;
      }
      .stage {
        position:relative; width:760px;
        font-family:"Inter",sans-serif; font-weight:500;
      }
      .labelRow {
        display:flex; align-items:baseline; justify-content:space-between;
        height:40px; margin-bottom:24px;
        font-size:32px; letter-spacing:-0.01em; white-space:nowrap;
      }
      .pct { font-variant-numeric: tabular-nums; opacity:0.72; }
      .track {
        position:relative; width:760px; height:18px;
        border-radius:9px; overflow:hidden;
      }
      .fill {
        position:absolute; inset:0;
        border-radius:9px;
        transform-origin:left center;
      }
      /* success group — pre-built, hidden; centered on the track's midline */
      .circle {
        position:absolute; left:50%; top:73px;
        width:90px; height:90px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
      }
      .circle svg { display:block; width:52px; height:52px; }
      .done {
        position:absolute; left:50%; top:150px;
        transform:translateX(-50%);
        font-size:30px; letter-spacing:-0.01em; white-space:nowrap;
        text-align:center;
      }
      .burst { position:absolute; left:50%; top:73px; width:0; height:0; }
      .dot   { position:absolute; left:0; top:0; border-radius:50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.0" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <div class="stage">
          <div id="barGroup">
            <div class="labelRow">
              <span id="label"></span><span class="pct" id="pct">0%</span>
            </div>
            <div class="track" id="track"><div class="fill" id="fill"></div></div>
          </div>
          <div class="burst" id="burst"></div>
          <div class="circle" id="circle">
            <svg viewBox="0 0 90 90" fill="none" stroke="#ffffff" stroke-width="7"
                 stroke-linecap="round" stroke-linejoin="round">
              <path id="check" d="M26 47 L40 61 L65 33"></path>
            </svg>
          </div>
          <div class="done" id="done"></div>
        </div>
      </div>
    </div>

    <script>
      const V = window.__hyperframes.getVariables();

      /* normalize a CSS hex color to 6-digit form so 2-digit alpha can be
         appended safely (#abc → #aabbcc, #rrggbbaa → #rrggbb) */
      function hex6(c){c=String(c).trim();if(/^#[0-9a-fA-F]{3}$/.test(c))return "#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];if(/^#[0-9a-fA-F]{8}$/.test(c))return c.slice(0,7);return c;}
      const ACCENT = hex6(V.accent);   // alpha digits get appended to this one

      /* ── elements ───────────────────────────────────────────────────── */
      const root     = document.getElementById("root");
      const cam      = document.getElementById("cam");
      const barGroup = document.getElementById("barGroup");
      const label    = document.getElementById("label");
      const pct      = document.getElementById("pct");
      const track    = document.getElementById("track");
      const fill     = document.getElementById("fill");
      const circle   = document.getElementById("circle");
      const check    = document.getElementById("check");
      const done     = document.getElementById("done");
      const burst    = document.getElementById("burst");

      /* ── static styles from variables ───────────────────────────────── */
      document.body.style.background = V.bg;
      root.style.background  = V.bg;
      label.textContent      = String(V.label);
      done.textContent       = String(V.doneLabel);
      label.style.color      = V.ink;
      pct.style.color        = V.ink;
      done.style.color       = V.ink;
      track.style.background = V.barBg;
      fill.style.background  = V.accent;
      circle.style.background = V.accent;
      circle.style.boxShadow  = `0 18px 60px ${ACCENT}59, 0 6px 18px ${ACCENT}40`;

      /* ── confetti: HAND-CODED deterministic table (no randomness) ───── */
      /* angles 0..330 step 30 · dist alternating 95/130/150 · sizes 8–14 */
      const CONFETTI = [
        { a:   0, d:  95, s: 10, dl: 0.00 },
        { a:  30, d: 130, s:  8, dl: 0.03 },
        { a:  60, d: 150, s: 13, dl: 0.06 },
        { a:  90, d:  95, s:  9, dl: 0.02 },
        { a: 120, d: 130, s: 14, dl: 0.05 },
        { a: 150, d: 150, s: 11, dl: 0.08 },
        { a: 180, d:  95, s:  8, dl: 0.01 },
        { a: 210, d: 130, s: 12, dl: 0.04 },
        { a: 240, d: 150, s: 10, dl: 0.07 },
        { a: 270, d:  95, s: 14, dl: 0.03 },
        { a: 300, d: 130, s:  9, dl: 0.06 },
        { a: 330, d: 150, s: 12, dl: 0.00 }
      ];
      /* dots built NOW, at construction time — never inside a callback */
      const dots = CONFETTI.map(c => {
        const el = document.createElement("div");
        el.className = "dot";
        el.style.width  = c.s + "px";
        el.style.height = c.s + "px";
        el.style.background = V.accent;
        burst.appendChild(el);
        return el;
      });

      /* ── timing constants (spec) ────────────────────────────────────── */
      const T0      = 0.25;        // anticipation beat before the fill moves
      const T_MORPH = T0 + 2.60;   // 0.55 + 0.9 + 0.45(hold) + 0.7 → 2.85s
      const DUR     = 5.0;

      /* ── initial states — frame 0 is correct before any tween runs ──── */
      gsap.set(cam,    { xPercent: -50, yPercent: -50, scale: 1.05 });
      gsap.set(circle, { xPercent: -50, yPercent: -50, scale: 0 });
      gsap.set(done,   { opacity: 0, y: 18, filter: "blur(4px)" });
      dots.forEach(el => gsap.set(el, { x: 0, y: 0, opacity: 0,
                                        xPercent: -50, yPercent: -50 }));
      const checkLen = check.getTotalLength();   // pure SVG geometry
      gsap.set(check, { strokeDasharray: checkLen, strokeDashoffset: checkLen });
      fill.style.transform = "scaleX(0)";
      pct.textContent = "0%";

      /* ── single source of truth: fill + percent from one proxy ─────── */
      const prog = { v: 0 };
      function drawProgress() {
        fill.style.transform = `scaleX(${(prog.v / 100).toFixed(4)})`;
        pct.textContent = Math.floor(prog.v) + "%";  // floor: text never leads the fill
      }

      /* ── paused master timeline; HyperFrames seeks it ───────────────── */
      const tl = gsap.timeline({ paused: true });

      // camera push across the whole clip
      tl.fromTo(cam, { scale: 1.05 }, { scale: 1.0, duration: DUR, ease: "none" }, 0);

      // progress with realistic hesitation (chained on the master timeline)
      tl.to(prog, { v:  35, duration: 0.55, ease: "power2.out",
                    onUpdate: drawProgress }, T0);
      tl.to(prog, { v:  62, duration: 0.90, ease: "power1.inOut",
                    onUpdate: drawProgress }, T0 + 0.55);
      /* 0.45s HOLD at 62% — the realistic stall (nothing scheduled) */
      tl.to(prog, { v: 100, duration: 0.70, ease: "power3.in",
                    onUpdate: drawProgress }, T0 + 1.90);

      // MORPH — bar, label and percent give way to the success check
      tl.to(barGroup, { opacity: 0, scale: 0.94, duration: 0.32,
                        ease: "power2.in" }, T_MORPH);
      tl.fromTo(circle, { scale: 0 },
                        { scale: 1, duration: 0.5, ease: "back.out(1.8)",
                          immediateRender: false }, T_MORPH + 0.05);
      tl.fromTo(check,  { strokeDashoffset: checkLen },
                        { strokeDashoffset: 0, duration: 0.35,
                          ease: "power2.out", immediateRender: false },
                        T_MORPH + 0.30);
      tl.fromTo(done,   { opacity: 0, y: 18, filter: "blur(4px)" },
                        { opacity: 1, y: 0, filter: "blur(0px)",
                          duration: 0.55, ease: "power3.out",
                          immediateRender: false }, T_MORPH + 0.45);

      // confetti burst — each dot flies its hand-coded vector while fading
      CONFETTI.forEach((c, i) => {
        const rad = c.a * Math.PI / 180;
        tl.fromTo(dots[i],
          { x: 0, y: 0, opacity: 1 },
          { x: Math.cos(rad) * c.d, y: Math.sin(rad) * c.d, opacity: 0,
            duration: 0.7, ease: "power2.out", immediateRender: false },
          T_MORPH + 0.15 + c.dl);
      });

      // hold the final frame to the end of data-duration
      tl.set({}, {}, DUR);

      drawProgress(); // frame 0 styled immediately

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      window.__timeline = tl;
    </script>
  </body>
</html>
