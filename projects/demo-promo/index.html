<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* DEMO: narrated promo · Tech Gradient style · voice + ducked music · scenes timed to VO */
      @font-face { font-family:"Sora"; font-weight:700; src:url("assets/fonts/sora-700.ttf") format("truetype"); }
      @font-face { font-family:"Inter"; font-weight:500; src:url("assets/fonts/inter-500.ttf") format("truetype"); }
      @font-face { font-family:"Inter"; font-weight:600; src:url("assets/fonts/inter-600.ttf") format("truetype"); }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#0b0820; font-family:"Inter",sans-serif; }
      :root { --bg:#0b0820; --fg:#f2f0ff; --muted:rgba(242,240,255,.6); --accent:#7b5cff; --accent2:#3fa9ff; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden;
              background:radial-gradient(120% 120% at 70% 10%, #1a1240 0%, #0b0820 55%); }

      .orb { position:absolute; border-radius:50%; filter:blur(150px); }
      .orb-1 { width:820px;height:820px;top:-200px;right:-180px; background:radial-gradient(circle,rgba(123,92,255,.6),transparent 70%); }
      .orb-2 { width:680px;height:680px;bottom:-200px;left:-160px; background:radial-gradient(circle,rgba(63,169,255,.5),transparent 70%); }
      .grid { position:absolute; inset:0; opacity:.5;
              background-image:linear-gradient(rgba(242,240,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(242,240,255,.04) 1px,transparent 1px);
              background-size:120px 120px; }

      .scene { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; text-align:center; padding:0 200px; visibility:hidden; }
      .eyebrow { font-family:"Inter",sans-serif; font-weight:600; font-size:26px; letter-spacing:.42em; text-transform:uppercase;
                 background:linear-gradient(135deg,var(--accent2),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .big { font-family:"Sora",sans-serif; font-weight:700; font-size:150px; line-height:.98; letter-spacing:-.03em; color:var(--fg); }
      .big em { font-style:normal; background:linear-gradient(135deg,var(--accent2),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .line { font-family:"Inter",sans-serif; font-weight:500; font-size:42px; line-height:1.3; color:var(--muted); max-width:1300px; }
      .line .w { display:inline-block; }

      /* glass chips for the 'style/voice/motion' scene */
      .chips { display:flex; gap:24px; }
      .chip { padding:22px 40px; border-radius:20px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
              backdrop-filter:blur(20px); font-family:"Sora",sans-serif; font-weight:700; font-size:46px; color:var(--fg); }
      .chip em { font-style:normal; background:linear-gradient(135deg,var(--accent2),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }

      .progress { position:absolute; bottom:0; left:0; height:4px; width:100%; background:rgba(242,240,255,.08); }
      .progress .fill { height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); transform-origin:left center; transform:scaleX(0); box-shadow:0 0 16px rgba(123,92,255,.6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.5" data-width="1920" data-height="1080">
      <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="grid"></div>

      <audio id="vo" data-start="0" data-duration="7.5" data-track-index="0" src="assets/master.wav" data-volume="1"></audio>

      <!-- s0: "This is xotion studio" -->
      <div class="scene s0"><div class="eyebrow">Creative engine</div><div class="big">xotion <em>studio</em></div></div>
      <!-- s1: "Give it any prompt" -->
      <div class="scene s1"><div class="big">Give it <em>any prompt</em></div></div>
      <!-- s2: "It picks the style, voice and motion" -->
      <div class="scene s2"><div class="eyebrow">It decides</div>
        <div class="chips"><div class="chip"><em>Style</em></div><div class="chip"><em>Voice</em></div><div class="chip"><em>Motion</em></div></div></div>
      <!-- s3: "Then renders your video, ready to post" -->
      <div class="scene s3"><div class="big">Then <em>renders</em><br/>your video</div><div class="line">Ready to post.</div></div>

      <div class="progress"><div class="fill"></div></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const Q = s => '[data-composition-id="main"] ' + s;
      const TOTAL = 7.5;
      const tl = gsap.timeline({ paused: true });

      // ambient (finite repeats)
      tl.to(Q(".orb-1"),{scale:1.12,duration:3.7,yoyo:true,repeat:1,ease:"sine.inOut"},0);
      tl.to(Q(".orb-2"),{scale:1.1,duration:3.7,yoyo:true,repeat:1,ease:"sine.inOut"},0);
      tl.fromTo(Q(".progress .fill"),{scaleX:0},{scaleX:1,duration:TOTAL,ease:"none"},0);

      // scenes timed to VO word boundaries
      const scenes = [
        [".s0", 0.0,  1.38],
        [".s1", 1.38, 2.38],
        [".s2", 2.38, 4.70],
        [".s3", 4.70, 7.5 ],
      ];
      scenes.forEach(([sel,start,end])=>{
        const s = Q(sel);
        const line = document.querySelector(s+" .line");
        if (line && !line.dataset.split){ line.dataset.split=1;
          line.innerHTML = line.textContent.split(" ").map(w=>'<span class="w">'+w+'</span>').join(" "); }
        tl.set(s,{visibility:"visible"},start);
        if (document.querySelector(s+" .eyebrow"))
          tl.from(s+" .eyebrow",{y:-16,opacity:0,duration:.45,ease:"expo.out"},start);
        tl.from(s+" .big",{y:40,opacity:0,filter:"blur(8px)",duration:.6,ease:"power3.out"},start+.08);
        if (document.querySelector(s+" .chip"))
          tl.from(s+" .chip",{y:30,opacity:0,scale:.9,duration:.5,stagger:.12,ease:"back.out(1.6)"},start+.3);
        if (line)
          tl.from(s+" .line .w",{y:16,opacity:0,duration:.4,stagger:.05,ease:"power3.out"},start+.5);
        tl.to(s,{autoAlpha:0,duration:.35,ease:"power2.in"},end-.35);
        tl.set(s,{visibility:"hidden"},end);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
